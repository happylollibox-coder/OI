  - name: "DE_PEAK_WINDOW_OVERRIDE"
    description: "v27.50 (Ori 2026-08-12) — ORI'S RULE as DATA: the judged-window length W per season occurrence type, with the evidence that bought it. The rule: in peak the engine defaults to a 3-DAY window; a 7-day override is granted ONLY where the SAME occurrence type in a prior year was MEASURED to produce better decisions at 7 than at 3. Burden of proof is on the SLOWER window — no / thin / ambiguous / CONFLICTING evidence all resolve to 3. Off-peak is always 7 and is not overridable here. One active row per occurrence_type (= V_SEASON_CONTEXT.context_label minus the _<year>); superseded measurements stay with is_active=FALSE so the audit trail survives. Columns beyond w_days exist to answer 'why is this occurrence on this window?': evidence_verdict, evidence_occurrences, evidence_n, evidence_metric, specs_granted_7/specs_total, measured_on/by, remeasure_after, comment. Seeded 2026-08-12 from the 3-vs-7 study (17 closed prior peak occurrences, 34,688 SP decisions, 524 occurrence-days, $234,461 in-window spend; as-seen reconstruction via V_ADS_SETTLE_CURVE accrual, engine cut tree simulated at both windows, scored on settled forward-7d GP-ROAS, dollar metric = skill over a matched random-cut policy, Holm + keyword-clustered bootstrap). VERDICTS: XMAS_PEAK/EASTER/XMAS_EARLY -> 7 (proven, granted in 9/10, 10/10, 8/10 specifications); BTS/VDAY/MDAY/GRAD/FDAY/PRIME -> 3; HALLOWEEN/BF/CM inert (absorbed into XMAS by precedence). RECORDED CONFOUND: every 7-grant traces to the fixed clk_w>=13 cut gate (4.3 clicks/day at 3d vs 1.9 at 7d) — on a matched population or a window-scaled gate ZERO types grant 7, so if the click gate is ever scaled to the window every row must be re-measured. Ori-editable without a deploy; re-measure yearly by inserting a new row, never editing in place. Spec: architecture/PEAK_WINDOW_RULE.md"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE/DE_PEAK_WINDOW_OVERRIDE.sql"]

  - name: "DE_LAUNCH_INVESTMENT"
    description: "v27.56 (Ori 2026-08-13, launch-exemption build) — the SANCTIONED launch investment per family, with its dated stop gate. WHY: the launch exemption tells the coach it may not loss-cut a family that is SUPPOSED to lose money while the right bid is found; an exemption with no ceiling and no end date is a blank cheque, so the licence is written down here and V_LAUNCH_EXEMPTION reads it. daily_investment is the sanctioned $/day for the WHOLE FAMILY (all its campaigns summed), NOT a per-campaign budget — V_LAUNCH_EXEMPTION compares it against the family's real trailing-7d daily spend and publishes envelope_state (WITHIN_ENVELOPE / OVER_ENVELOPE / NO_SANCTION); an over-envelope family is Ori's budget decision, never a coach ROAS cut. stop_date is a HARD gate: the exemption ends at the EARLIER of it and the 183-day family-age boundary, so a family re-enters normal coaching by itself with no code change. One logical row per family; re-sanctioning = INSERT a row with a later updated_at (latest wins via QUALIFY ROW_NUMBER), so the history survives. Absence of a row is meaningful and safe (exemption rests on family age alone, envelope_state = 'NO_SANCTION'). Seeded 2026-08-13 with the two sanctions on record: Bunny $30/day through 2026-10-31, LolliBall $55/day through 2026-11-30. Ori-editable without a deploy. Spec: architecture/LAUNCH_EXEMPTION.md"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_LAUNCH_INVESTMENT.sql", "scripts/bigquery/tables/DE_LAUNCH_INVESTMENT_seed.sql"]

  - name: "DE_PEAK_OVERRIDES"
    description: "Manual peak-relevance overrides — force a family into BLITZ for a holiday V_PEAK_RELEVANCE can't measure (launched into the only completed occurrence → no clean baseline). UNIONed into V_ADS_COACH.family_holiday_relevance on force_relevant=TRUE. Judgment override; remove once the family has a clean prior-year baseline (auto-qualifies)."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE/DE_PEAK_OVERRIDES.sql"]

  - name: "DE_PEAK_RELEVANCE_OVERRIDE"
    description: "Manual override of V_PEAK_RELEVANCE.is_relevant_peak per (family, holiday). Injects/overrides at the CANONICAL relevance layer so it flows to BOTH the OFF/PEAK season split (V_WEEKLY_CELL_NET → plan seasonal net columns) AND the coach (family_season + BLITZ). Fixes peaks the 90-day maturity gate drops (LolliME/Bottle Christmas). Preferred over DE_PEAK_OVERRIDES (which only reaches the coach)."
