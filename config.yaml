  - name: "SP_SNAPSHOT_KEYWORD_STATE"
    description: "The keyword state machine (engine-finalization Task 2.1, 2026-08-16): CREATE OR REPLACE TABLE FACT_KEYWORD_STATE — one row per (campaign, keyword) with state (DEAD | PENDING_SETTLE | REVIVED_SETTLING | PARKED | PACED_WINNER | WINNER | LOSER_BLEED | TRIAL, first-match ladder), owner_engine (FACT_PANEL_OWNERSHIP ladder + REVERDICT-above-LIFT keyword overlay), next_check_date (invariant: never NULL except DEAD), state_since (best-effort v1), settled record, season context and view-authored reasons. PURE ASSEMBLY of other snapshots' verdicts (guard, reverdict, panel ownership, today's T_ENGINE_PREFLIGHT, change log) — if a state looks wrong the fix belongs in the source object. Orchestrator Task 20.8, after the preflight. First run 2026-08-16: 877 keywords — 529 PARKED / 117 TRIAL / 92 WINNER / 46 DEAD / 45 LOSER_BLEED / 30 REVIVED_SETTLING / 11 PENDING_SETTLE / 7 PACED_WINNER; both invariants 0. v1 gaps (SOP): SEASONAL_HOLD not yet a state (gate unsnapshotted); the 360-degree signal panel is the task's second half. Spec: architecture/KEYWORD_STATE.md."
