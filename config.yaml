  - name: "V_OOB_KEYWORD"
    description: "Keyword layer of the Out-of-budget phase. v27.45 (2026-08-08) ONE BID OWNER: population = EVERY V_OOB_BUDGET_PHASE campaign (phase membership = V_CAMPAIGN_CAP_STATE.is_oob_owned; the pct_dark>10 filter is GONE — it had left 12 budget-view campaigns outside the bid engine). V_KEYWORD_LIFT emits DEFER_OOB for these campaigns; no campaign in both engines' emitting sets. DEFENSE campaigns' keywords appear but never instruct (bid_action DEFENSE, no bid — budget ladder is the remedy). APPLIED-BID DOCTRINE adopted from LIFT v27.4 (outermost wrapper, mirrors PHASE's budget hold): last applied INCREASE_BID/REDUCE_BID within 48h, applied today (LA) or value not yet in config (|delta|>0.005) -> bid_action APPLIED_HOLD, no suggestion (kills recut-from-stale-base + cut-flips-to-raise). v27.23 activation gate reads (pct_dark>0 OR days_capped_7d>=2). is_defense + days_capped_7d exposed. (v2.1; v27.10: EASE/FIT_CPC/TRIM_BID judge on 7d clicks + 7d realized CPC for working-tier campaigns (low tier short-window; DARK_BRAKE always yesterday); v27.8: dark>10 + campaign yesterday blended <1.2x = no budget raise coming -> DARK_BRAKE every unprofitable-yesterday click incl. converting seats and in-flight probes; exempt 90d-proven / paid-yesterday / no-click). One row per (dark>10% campaign, target) — SP keywords/auto clauses/product targets AND SB keywords/product targets (SB signals from sb reports, est net ROAS via cost ratio; bids from live sb_keyword/sb_product_target mirrors). target_cpc column: (1) same 28d last year (364-day offset, ≥10 LY clicks) else (2) coacher band cpc_target (product × season × match, conclusive ALL/ALL avg) else NULL; auto/PT skip LY. Bid suggestion from the launch controller's constants applied to every OOB campaign regardless of engine. CONVERTING (net ROAS ≥1.0 either window) is EXEMPT from the click band (Ori 2026-07-30): hold-while-capping unless the campaign is strong, else ROAS ladder (+30%/+15%, cap $2). NOT converting → click band on last-day clicks: <4 PROBE +5% (cap $1.50) · 4–5 HOLD · ≥6 SLOW −5% (floor $0.20). 1-day cooldown via FACT_PPC_CHANGE_LOG. Bid cuts don't cut spend (budget caps it) — they stretch the same budget across the day: dark ↓, utilization stays ~100%. Cube: OobKeyword. Spec: architecture/OOB_BUDGET_PHASE.md §v2. SEAT MODEL (Ori 2026-08-01): slots = max(1, round((budget - winner_premium)/4)) — $4/day per keyword trial, v17 cost-aware: winners' bid premium above $1 (x4 clicks) comes off the budget first (a $1.56 winner takes a $6.24 seat); seats ranked converters-by-90d-net-ROAS then mid-tests-by-clicks then anchored candidates; tested losers never seated; beyond-seat rows PARK_WAIT $0.25 in a queue; freed seats ACTIVATE the next candidate at max($1, min(1.5x target CPC, $1.50)) paced max(1, floor(0.20*budget/4))/day; per-seat affordable = budget/slots/4 replaces the all-targets affordable; proven-90d seated keywords hold untouched. Population now the FULL target list (zero-click queue members included). v8 (2026-08-02): seasonal_now mirror — LY same-28d-window ad order (account-wide text, auto/PT excluded) exempts a keyword from the tested-loser permanent park and jumps it in seat_rank after the converting key; ly CTE widened (HAVING clicks>=10 OR orders>=1, ly_cpc quality-gated at >=10 clicks). While a campaign caps, THIS view owns its keyword bids — the launch views emit DEFER_OOB (single owner, never disagree). v14: in-flight Portfolio probes COMPETE FOR SEATS — seated probe holds untouched; beyond-seat probe PARK_WAIT $0.25 (probe pauses, resumes on a freed seat); mid-probe never permanent-parks; slots/seat_rank exposed via cube for the seat-status badges. v16: role column (PROBE/RETIRED/QUEUED/CANDIDATE/FUNDER/TRIAL). v27.42 (2026-08-08) SEASON-CONTEXT GATES: outp wrapper reads V_KEYWORD_CONTEXT_GATE (keyword rows only — join carries NOT is_auto AND NOT is_pt): BLOCK_CUT (current occurrence settled >=15c at >=1.0x) vetoes DARK_BRAKE/PARK/PARK_WAIT/TRIM_BID/EASE/FIT_CPC to HOLD; ENTRY_BLOCK STOP (prior same-family mature LOSS + half allowance spent without payback) vetoes ACTIVATE to HOLD (PROBING never interferes — the re-probe is the point); PARK_CONTEXT advisory-only via new context_gate/context_gate_reason columns. Precedence + calibration: SEASON_CONTEXT_LEDGER.md §5-6. v27.46 (2026-08-09) guard batch: A4 DARK_BRAKE magnitude scaled by the keyword's 90d record (roas90 exposed as output column): >=1.0x -> minimum ease 5% / 0.6-1.0x -> max(5%,15% x dark) / <0.6 or no data -> max(5%,30% x dark); triggers, floors and the BLOCK_CUT veto unchanged (dark is never a hold — 5% minimum stands). A3 seasonal_now precedence: ENTRY_BLOCK PROBING/STOP rows that are not converting publish seasonal_now=FALSE (in-window conversion outranks prior-season memory; inner seat ordering still reads the raw flag — SOP §5.7 known limit). DETERMINISM FIX: SB prod cost_ratio now from the campaign's DOMINANT mapped ASIN (most all-history ad spend; cost+price coherently paired) — old ANY_VALUE pair flipped roas90 across the tier boundary between pulls. Spec: OOB_BUDGET_PHASE.md §v27.46 guard batch. v27.52 (2026-08-12, Ori approved): FIX 1 — the settle veto reads the guard's bounded `settle_amnesty` instead of `season_win_prior` at all three ladders (settle_amnesty + catastrophic published for audit). FIX 3 — ACTIVATE_REVIVE is no longer exempt from the v27.48 record entry cap: it now composes the same lifetime conv CPC x1.2 / LY conv CPC x0.8 caps as the generic ACTIVATE at every ladder (allowance clamp, no-real-move HOLD, standalone cap, reasons). It stays exempt from the record-LOSER HOLD — the reverdict owns the decision to revive, the cap only prices it. Measured deploy day: 0 of 281 rows changed — no OOB row's cap binds today (the 3 ACTIVATE_REVIVE bids $1.00/$0.40/$0.40 sit under caps of $1.62/$0.67/$0.57, the single ACTIVATE has no lifetime record, and the single SETTLE_HOLD was held for want of corroboration -- 7 settled clicks -- not by the amnesty). Two pulls byte-identical. v27.53 (2026-08-12, Ori approved) — ITEM 2 (settle deferral must expire), ITEM 7 (WAKE_STEP), ITEM 8f (MANUAL_HOLD below the dark brakes). The tested-loser PARK veto now also releases on the guard's settle_deferral_expired, and its reason publishes the real hard bound (2 x settle_days of clicking) instead of a settle_due that a daily-clicking keyword never reaches. NEW WAKE_STEP: 4 of the 5 keywords still stuck on the $1.00 wake on-ramp sit in OOB-owned campaigns, so LIFT could only ever label them DEFER_OOB — the step-down has to live here too. man_hold now excludes DARK_BRAKE (dark is never a hold). Measured 2026-08-12 on 281 rows: PARK 0 -> 1 (one SETTLE_HOLD released), SETTLE_HOLD 1 -> 0, WAKE_STEP 0 -> 4, DARK_BRAKE 27 -> 27 (8f binds nothing today — preventive), rows carrying a bid 40 -> 45. ### v27.97 (Ori 2026-08-21, explanation audit) — TEXT ONLY, one reason string; no predicate, no step, no floor and no row membership changed (dry run 174,017,613 bytes before and after, identical). THE FALL-THROUGH DARK_BRAKE REASON NOW QUOTES THE SIGNAL THAT ACTUALLY FIRED. That branch (clk1 >= 4 clicks AND bid above floor) is reached by rows whose CAMPAIGN is OOB-owned, and ownership is the DUAL signal (out-of-budget event OR spend >= budget) held on the 7-day hysteresis — so the anchor-day pct_dark reads 0.0 on a campaign capped all week (fact_oi_spend_over_budget_is_dark). The old string opened 'campaign 0% dark — brake all bids', offering a ZERO as the trigger for a brake, then dumped the rule's formula raw ('0.6-1.0x max(5%,15%xdark)') in place of evidence, so the term that set the rate was invisible: BOX-SBS/BROAD (Hunter, By Age) published two rows quoting the SAME '0% dark' and braking 5% ('8 year old girl birthday gift', 5 clicks) and 15% ('girls gifts age 8-10', 57 clicks). NOW TRIGGER — EVIDENCE => MOVE: cap evidence (days_capped_7d of 7, darkness named only when pct_dark > 0), this bid's own clicks and sales yesterday, then the step toward the row's REAL bid_floor, closing with the term that BOUND the rate in plain words (zero-sale evidence floor / darkness / the 5% minimum) so two different rates can never quote one fact. SECOND LIE FIXED IN THE SAME PASS: both dark-brake strings hard-coded 'floor $0.20' while the arithmetic floors at b.bid_floor — $0.25 on SB video/brand and $0.10 on SB collection/store; 6 of the 13 live DARK_BRAKE rows were being told a wrong floor. bid_reason_short is untouched (it already read 'Nc X.XXx yday · 90d Y.YY => brake N% to $Z'). ### v27.98 (Ori 2026-08-21) THE LAST-DAY VETO STOPS ERASING WHAT IT HELD - three ADDITIVE columns published inside the veto wrapper, NULL on every row it did not touch: held_action (the action the engine intended), held_bid (the bid it intended) and hold_source (LAST_DAY_VETO_RAISE | LAST_DAY_VETO_CUT). Nothing above them changes - the published action still reads HOLD and suggested_bid is still NULL - so panels, cube and the bulksheet builders behave exactly as before. They exist because SP_SNAPSHOT_ENGINE_PROPOSALS admits a bid row on action NOT IN (HOLD, ...) AND suggested_bid IS NOT NULL and the veto breaks BOTH conjuncts, so a vetoed row vanished from FACT_ENGINE_PROPOSALS with its reason. held_bid is deliberately not suggested_bid: a value in suggested_bid is an instruction, and a held row must be unable to become one by any path. hold_source names the ARM because the two are not equally strong - a filling day already at/above the cut bar can only rise as attribution accrues, while a 0.00x filling day is ambiguous - and it is what distinguishes a veto hold from a collision / claim / holdout exclusion downstream. Spec: architecture/DAILY_BRIEF.md. v27.113 (2026-08-22, family seat register R-f): publishes the engine park price bid_park (the same constant the PARK / PARK_WAIT actions bid to) so T_OOB_SEAT_ECONOMICS and the register read it, never a literal; no behavior change."
    source_files: ["scripts/bigquery/views/V_OOB_KEYWORD.sql"]
    dependencies:
      - V_OOB_BUDGET_PHASE
      - FACT_AMAZON_ADS
      - T_PRICE_COST_TIER
      - V_TARGET_DAILY
      - DIM_AD_GROUP
      - V_PPC_CHANGE_LOG_APPLIED
      - V_KEYWORD_CONTEXT_GATE

  - name: "V_OOB_SEARCH_TERM"
    description: "Search-term layer of the Out-of-budget phase (v2.2, SP+SB, TWO windows — Ori: big general words need 3-month data, small words 28d). v27.100 GRAIN: one row per (campaign, target, AD GROUP, term) — an Amazon negative lands on the AD GROUP and kills the term for every ASIN and keyword in it, so evidence sliced finer than the ad group must never emit one. The per-slice triggers below still FIRE the candidate; five ad-group-grain guards can only WITHDRAW it: the block dies if the ad group has any order on the term in the judging window, or is net-positive on it over 28d, 90d, or LIFETIME, or sells it organically net of ads (roll-up as guard, not trigger — a trigger at ad-group grain would over-block; read the view header for the mechanism). block_* columns publish the acting-grain evidence the reason quotes. NEGATE: big word (≥30 clicks/90d ACCOUNT-WIDE — slice grain fragments big words) → 0 orders anywhere in 90d AND campaign ≥90d old AND ≥25 clicks in this campaign (a young campaign hasn't given a big word its own trial); small word → ≥10 clicks · 0 orders · 28d at the slice; plus term ≠ keyword (MANUAL + SB), AUTO skips the term test, PT excluded. Winners: v15 (2026-08-02) is_winner = slice 90d net ROAS >= 1.1 (same bar as the keyword WINNER class; SP real GROSS_PROFIT, SB est. via campaign cost ratio; net_roas_90d exposed) — an order alone no longer qualifies; negate bars still key on 0 orders, so ordered-but-under-bar terms are neither winner nor negate. Cube: OobSearchTerm. Spec: architecture/OOB_BUDGET_PHASE.md §v2. GENERALIZED 2026-08-01: population = dark campaigns (engine='OOB') UNION healthy working campaigns from V_KEYWORD_LIFT (engine='LIFT') — the negates layer in the Portfolio 80/20 panel; each panel filters its engine. Defense campaigns EXCLUDED (never negate brand terms in defense). v27.14: is_negate permanently retired for (campaign,term) with a logged NEGATE_TERM in FACT_PPC_CHANGE_LOG (frozen Fivetran negatives made applied negates invisible -> duplicate Creates, report 31); v18: ad_group_ids column (STRING_AGG of ad groups the term ran in) — SB Negative Keyword Create requires Ad Group Id; panels queue one negate per ad group. v22: is_add_candidate — winning term (>=1.1x/90d) in a research (hunter|discovery|research) campaign with no enabled keyword of its own (DIM_KEYWORD+sb_keyword anti-join; ASINs excluded) -> '+broad' ADD_KEYWORD suggestion, $1 entry."
    source_files: ["scripts/bigquery/views/V_OOB_SEARCH_TERM.sql"]
    dependencies:
      - V_OOB_BUDGET_PHASE
      - FACT_AMAZON_ADS

  - name: "V_PAUSED_CAMPAIGN_HISTORY"
    description: "Historic performance of PAUSED campaigns for the Weekly Run v12 sections (Ori 2026-08-02). One row per (paused campaign, target text) from FACT history + a campaign rollup row (target_text NULL). Display-only, no actions. Windows: m1=28d, m3=91d, y1=365d, season_*=the campaign's relevant season, most recent occurrence that already started (name token -> DIM_US_HOLIDAYS holiday; window pre_season_start..COALESCE(cooldown_end, holiday_date)) — the 'Seasonal Paused' section shows ONLY this window; 'Other' shows m1/m3/y1. Net ROAS estimated via mapped-ASIN cost ratio (same as SB launch views). is_seasonal/is_defense name regexes shared with V_KEYWORD_LIFT. Cube: PausedHistory (15-min TTL live view). Spec: architecture/OOB_BUDGET_PHASE.md §v12."
