  - name: "T_LOW_STOCK_CAMPAIGN"
    description: "v27.77 (2026-08-17) — THIS TABLE EXISTS FOR EXACTLY ONE REASON: to keep V_PANEL_OWNERSHIP under BigQuery's query-planning ceiling. It is a PURE PASS-THROUGH SLICE of V_LOW_STOCK_ADS — SELECT * WHERE row_kind='CAMPAIGN' AND campaign_id IS NOT NULL, no aggregation, no projection, no rename, no transformation of any kind (14 rows @ 2026-08-17, tens of rows by construction: only campaigns inside an at-risk family get a CAMPAIGN row). ALL the ownership logic stays in V_PANEL_OWNERSHIP — the ls_camp per-campaign roll-up, the two low-stock claim arms and the ladder are untouched — so this materialization changes NO semantics and the view remains the single readable definition of who owns a campaign. WHY IT WAS NEEDED: V_PANEL_OWNERSHIP INLINED V_LOW_STOCK_ADS, a view whose own header records that it sits AT the planning ceiling; v27.73 (redirect mode — rmode/hero CTEs + 5 published columns) and v27.74 (complete-day windows) each enlarged it on 2026-08-17 until even ONE expansion stopped planning. The 10:50 IDT FACT_PANEL_OWNERSHIP build was the last good one; the 16:24 run failed with 'Resources exceeded ... Not enough resources for query planning - too many subqueries or query is too complex', and from then on a bare SELECT COUNT(*) FROM V_PANEL_OWNERSHIP failed deterministically on dry run. Left unfixed the 07:50 UTC orchestrator pass fails and ownership goes stale — and because every consumer LEFT JOINs FACT_PANEL_OWNERSHIP, a stale or missing row reads as 'no claim', which silently breaks the single-home ladder, DEFER_* routing and panel membership. House pattern for planner blowups (fact_oi_cube_table_planner_blowup): never inline a ceiling view — read a T_ materialized earlier in the SAME procedure. Splitting the plan in two was the whole remedy; only this ONE source needed materializing (V_CAMPAIGN_CAP_STATE, V_CAMPAIGN_FAMILY_MAP, V_DIM_CAMPAIGN_CURRENT, V_LAUNCH_EXEMPTION and V_LAUNCH_POPULATION are still read live and plan fine). NOT DURABLE STATE — it is SP_SNAPSHOT_PANEL_OWNERSHIP's own scratch, rebuilt as step 1 of every run immediately before FACT_PANEL_OWNERSHIP; a stale step 1 would make step 2 re-publish yesterday's stock verdicts, so the two steps must never be split across calls. Nothing else should read this table: consumers read FACT_PANEL_OWNERSHIP for ownership and V_LOW_STOCK_ADS itself for the low-stock panel. Spec: architecture/PANEL_OWNERSHIP.md."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_PANEL_OWNERSHIP.sql"]
    dependencies:
      - V_LOW_STOCK_ADS

  - name: "T_CAMPAIGN_PRODUCT_SCOPE"
    type: "table"
    description: "v27.80 (2026-08-17, Task 4.10) — the materialization of V_CAMPAIGN_PRODUCT_SCOPE: one row per campaign that served an impression in the last 30 complete days of the advertised-product report, carrying n_own_asins and sole_asin. 74 rows @ 2026-08-17 (67 dedicated, 7 shared doorways). WHY IT IS A TABLE: V_LOW_STOCK_ADS joins it to compute serves_only_binding — is this campaign dedicated to the variation that is running dry? — and that view has NO measured query-planning headroom. It stopped planning outright on 2026-08-17 (v27.73 + v27.74 pushed it over) and the whole v27.77 T_LOW_STOCK_CAMPAIGN repair exists because of it, so inlining one more VIEW was never an option. House pattern for planner blowups: never inline into a ceiling view — read a T_ built earlier in the same pass (fact_oi_cube_table_planner_blowup). A MATERIALIZATION, NEVER A TRANSFORMATION: SELECT * FROM V_CAMPAIGN_PRODUCT_SCOPE, zero logic moved out of the view. BUILT AS ORCHESTRATOR TASK 20.5d3, immediately after the T_PRICE_COST_TIER hoist and BEFORE anything reads V_LOW_STOCK_ADS — Task 20.5g SP_SNAPSHOT_PANEL_OWNERSHIP (whose step 1 slices the low-stock engine) and the later SP_SNAPSHOT_ENGINE_PROPOSALS. Verified in the deployed routine by statement position. THE JOIN IS NOT OPTIONAL: a missing table breaks V_LOW_STOCK_ADS outright, so this task must never be removed while that view names it. Safe where it sits: the source view reads only V_SRC_AmazonAds_advertised_product (straight through to Fivetran) and DIM_PRODUCT. Idempotent, fully derived, rebuilt daily. SP only — SB/video campaigns have no row and consumers read that as UNKNOWN, never as dedicated. Spec: architecture/LOW_STOCK_CRITERIA.md (v27.80)."
    source_files: ["scripts/bigquery/procedures/SP_ORCHESTRATE_DAILY_REFRESH.sql"]
    dependencies:
      - V_CAMPAIGN_PRODUCT_SCOPE

  - name: "T_COACH_CAMPAIGN_BUDGET"
    type: "table"
    description: "v27.84 (registered 2026-08-20) — the daily materialization of V_COACH_CAMPAIGN_BUDGET: one row per campaign carrying the coach's daily-budget instruction and the reasons behind it (parent_name, campaign_id, campaign_name, campaign_type, budget_action, budget_action_note, current_budget, recommended_budget, util_pct, effective_roas, is_new_campaign, coach_mode, launch_exempt, launch_exempt_until, budget_action_suppressed, budget_suppressed_to, launch_down_rec_blocked, is_change). 78 rows / 10,603 bytes @ 2026-08-20, one row per campaign_id, no duplicates. REGISTERED LATE AND THAT WAS THE DEFECT: the table has been built by SP_REFRESH_CUBE_TABLES step 5b since before the two-book work, and on 2026-08-20 V_TWO_BOOK_BRIEF named it as a dependency while config.yaml described no such object — the registry named something it did not describe. WHY ANYTHING READS THE TABLE INSTEAD OF THE VIEW: V_COACH_CAMPAIGN_BUDGET dry-runs at 283,900,961 bytes and takes ~47s just to PLAN and ~113s to run, so inlining it into a consumer that is already near BigQuery's planning ceiling is the V_PANEL_OWNERSHIP mistake (fact_oi_cube_table_planner_blowup). The T_ carries every column the view does — it is a pure CREATE OR REPLACE TABLE ... SELECT * pass-through, no projection and no logic — so a consumer loses nothing by reading it. IT IS A DAILY SNAPSHOT, NOT LIVE: anything that must see an intra-day coach decision has to read the view and pay for it. Read by V_TWO_BOOK_BRIEF (the held-cut counts and the dollars those cuts cover) and V_WEEKLY_RUN_CAMPAIGN; written by SP_REFRESH_CUBE_TABLES step 5b, which must run BEFORE step 5c T_WEEKLY_RUN_CAMPAIGN because that build depends on it. Idempotent and fully derived."
    source_files: ["scripts/bigquery/procedures/SP_REFRESH_CUBE_TABLES.sql"]
    dependencies:
      - V_COACH_CAMPAIGN_BUDGET

  - name: "T_FAMILY_BAR"
    type: "table"
    description: "v27.84 (two-book P&L, 2026-08-19, Task 5) - the materialization of V_FAMILY_BAR, EXPLODED TO CAMPAIGN GRAIN: one row per ENABLED campaign that V_CAMPAIGN_FAMILY_MAP resolves to a real family, carrying that family's keyword_bar, halo_factor, book, bar_exempt and the P&L reads behind them. ROW AND FAMILY COUNTS ARE NOT WRITTEN HERE (Standing Rule 0) - they move with the campaign population; count them with SELECT COUNT(*) AS n_rows, COUNT(DISTINCT family) AS families, COUNTIF(keyword_bar IS NULL) AS null_bars, COUNT(*) - COUNT(DISTINCT campaign_id) AS dup_campaigns FROM `onyga-482313.OI.T_FAMILY_BAR`, which should return zero null bars and zero duplicates. WHY IT IS A TABLE: the bid engines V_KEYWORD_LIFT and V_OOB_KEYWORD are each AT BigQuery's planning ceiling, and inlining one more view into them is precisely the move that stopped V_PANEL_OWNERSHIP planning outright on 2026-08-17 (a bare SELECT COUNT(*) failed with 'Resources exceeded ... too many subqueries'). House pattern for planner blowups: never inline a ceiling view - read a T_ built earlier in the same pass (fact_oi_cube_table_planner_blowup). WIRED TO A BID SINCE v27.100 (2026-08-21, Task 8) - INTO ONE ENGINE, NOT TWO. V_KEYWORD_LIFT LEFT JOINs this TABLE on CAST(campaign_id AS STRING) and its CUT_TO_BREAKEVEN arm now compares the window net ROAS against COALESCE(keyword_bar, 1.0) instead of a flat 1.0, with bar_exempt families skipped outright. V_OOB_KEYWORD WAS DELIBERATELY NOT WIRED, and that is a decision rather than an omission: it carries no flat breakeven arm at all - its downward levers are the dark brake and the seat trim, which judge on budget darkness and on capacity, and Task 8's own non-goal forbids stopping those on an Invest family. Its 1.0s are a ONE-DAY 'did it pay yesterday' protection and a NINETY-DAY 'is it proven' test; neither is the settled window this table measures, and lowering a protection gate is not the same act as lowering a cut bar. V_CAMPAIGN_MONEY_PLACEMENT stays a REPORTING consumer - it joins the bars to say where the advertising money sits and changes no bid. Do not take any of this from this sentence: re-verify it with the two-line INFORMATION_SCHEMA.VIEWS / .ROUTINES query published in the SP_SNAPSHOT_FAMILY_BAR.sql header, which should now return SP_SNAPSHOT_FAMILY_BAR (which writes the table), SP_ORCHESTRATE_DAILY_REFRESH (which calls it), the reporting view V_CAMPAIGN_MONEY_PLACEMENT and the bid engine V_KEYWORD_LIFT. V_OOB_KEYWORD or V_ADS_COACH appearing in that output means a second engine was wired and this clause is out of date. An engine must LEFT JOIN this TABLE and never V_FAMILY_BAR. WHY CAMPAIGN GRAIN AND NOT FAMILY GRAIN: NEITHER engine publishes a family or parent_name column - both publish campaign_id (STRING, matching this table's campaign_id). Resolving family inside those views would mean joining V_CAMPAIGN_FAMILY_MAP INSIDE a planner-ceiling view, the same fatal move; so the explosion from family rows to campaign rows happens HERE, once, inside the procedure, and each engine does a single LEFT JOIN on a key it already carries. THE 'Unknown' BUCKET IS DELIBERATELY ABSENT: V_CAMPAIGN_FAMILY_MAP emits a literal 'Unknown' catch-all for campaigns it cannot attribute, 'Unknown' is not a family and has no row in V_FAMILY_PNL, so those campaigns get no row here and no bar. That is the intended behaviour, not a coverage gap - a campaign with no measured halo must never be handed one, and the engines' COALESCE(keyword_bar, 1.0) leaves every unmapped campaign at EXACTLY today's behaviour. The join neither drops nor duplicates by construction: both sides are unique on their join key (the map QUALIFYs to one row per campaign_id; the bar is one row per family), so the fan-out is one-to-many by family and never many-to-many, and the only campaigns without a bar are exactly the 'Unknown' rows. Assert that property rather than a count: SELECT COUNTIF(m.parent_name != 'Unknown' AND t.campaign_id IS NULL) AS mapped_but_missing FROM `onyga-482313.OI.V_CAMPAIGN_FAMILY_MAP` m LEFT JOIN `onyga-482313.OI.T_FAMILY_BAR` t ON CAST(m.campaign_id AS STRING) = t.campaign_id. Built by SP_SNAPSHOT_FAMILY_BAR as orchestrator task 20.5g-1, immediately BEFORE Task 20.5g SP_SNAPSHOT_PANEL_OWNERSHIP and well before the Task 21 SP_REFRESH_CUBE_TABLES engine T_ builds, so the engines compile against the bars of the run they are part of. Fully derived and idempotent (CREATE OR REPLACE TABLE). Spec: docs/superpowers/specs/2026-08-19-two-book-pnl-design.md 4."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_FAMILY_BAR.sql"]
    dependencies:
      - V_FAMILY_BAR
      - V_CAMPAIGN_FAMILY_MAP

  - name: "T_OOB_SEAT_ECONOMICS"
    description: "Seat economics of the budget engine, materialised once per pass from V_OOB_KEYWORD (family seat register Task 2, 2026-08-22). V_OOB_KEYWORD is a planner-ceiling view measured in MINUTES, so the register must never inline it: this table carries, per keyword the engine prices, its campaign slots, seat_rank, seat_cpc (the seat price), role (WINNER / TRIAL / PROBE / QUEUED / RETIRED / ...), bid_floor, current_bid, bid_action, suggested_bid, the engine park price bid_park (published by V_OOB_KEYWORD since 2026-08-22 — ruling R-f, read by the register for the stalled-probe park proposal, never a literal), plus built_on. Built by SP_REFRESH_CUBE_TABLES step 0b right after T_LIFT_PROBES, with the same freshness contract (the register reads the previous pass's table until the step runs). Read by V_FAMILY_SEAT_REGISTER only — the stalled-probe seat price and the OPEN_SEAT probe queue. Spec: architecture/FAMILY_SEAT_REGISTER.md."
    source_files: ["scripts/bigquery/procedures/SP_REFRESH_CUBE_TABLES.sql"]
    dependencies:
      - V_OOB_KEYWORD

  - name: "T_FAMILY_SEAT_REGISTER"
    description: "The family seat register materialised once per pass, so every morning surface reads ONE image of it (family seat register Task 4). V_FAMILY_SEAT_REGISTER is a live view over the keyword-state snapshot, the seat ledger, the ads facts and the change log, and a full read of it is measured in tens of seconds; it is also a once-per-pass object by construction, because FACT_KEYWORD_STATE holds exactly one snapshot. Three consumers read this table rather than the view — the SEATS section of V_DAILY_BRIEF, the SEATS section of V_RUN_SUMMARY and the SeatRegister cube — so they cannot quote different numbers at the same reader on the same morning, and so the cube can key its cache on the orchestration stamp like every other T_. Row-for-row identical to the view; sort_key (the register's total ordering) is unique and is the cube primary key. Built by SP_REFRESH_CUBE_TABLES step 0c, after step 0b T_OOB_SEAT_ECONOMICS (which the register reads) and therefore after orchestrator step 20.8b, which writes the seat ledger in the same pass. FRESHNESS CONTRACT: the surfaces read the previous pass image until this step runs, so a book built or marked uploaded between passes moves the live register — whose day-one horizon reads the pending change log — before it moves the surfaces; every SEATS line therefore prints the ads window it was measured on and the keyword snapshot it came from, and a hand refresh means rebuilding this one table and stamping LOG_PIPELINE_RUNS (tools/trigger_refresh.py does both for every T_). No engine reads it; nothing is judged or moved here. Acceptance: scripts/bigquery/tests/SEAT_SURFACE_acceptance.sql and scripts/bigquery/tests/check_seat_surface_labels.py. Spec: architecture/FAMILY_SEAT_REGISTER.md. v27.124 (2026-08-23): carries the register's new sheet_row column (a SeatRegister cube dimension, sheetRow); V_DAILY_BRIEF's SEATS action and SEAT_SURFACE C11 count it from this image. v27.125 (2026-08-23): sheet_row's closed set gains ENGINE_PRICES and TOO_THIN_TO_PRICE (B38); V_DAILY_BRIEF names such rows 'not on any sheet' and never counts them as rows for the next book (C13)."
    source_files: ["scripts/bigquery/procedures/SP_REFRESH_CUBE_TABLES.sql"]
    dependencies:
      - V_FAMILY_SEAT_REGISTER

  - name: "DE_FAMILY_SEAT_LEDGER"
    description: "Seat numbers for the family seat register (Task 1, 2026-08-22; rulings R-a / R-b and the ledger memory added the same day) — the only state the register keeps. One row per OCCUPANCY (family, campaign_id, keyword_id, opened_on) of a keyword inside the 20% allowance of a WORKING family (V_BOOK_ASSIGNMENT book = HARVEST; launch families never appear). Occupants per the spec: REPRICE (repair), FLOOR_PROBATION (probation), LOSER (failed), REVIVED_SETTLING / PENDING_SETTLE (settling), and a TRIAL keyword in one of three probe positions — probe at an entry bid (on the engine probe list T_LIFT_PROBES, spend or no spend: ruling R-a), probe at the park bid (the ladder at_floor, WITH spend in the basis window: ruling R-a), stalled probe (ruling R-b: not engine-listed, not at the floor, whose latest applied bid change is an INCREASE_BID that still stands — live bid at or above the logged new_bid and above the old_bid, never lowered since; at-or-above because the $1.00 activation floor can lift a bid past the logged raise — that raise older than the engine probe window with fewer than the verdict clicks since — a seat with a standing proposal, re-price to the seat price or park, never 'waiting for results'; the applied change log is the authority for the raise date); and, since 2026-08-22 (ruling R-h), a PARKED keyword with spend in the basis window and a re-verdict appointment (next_check_date) on or after the snapshot date ('parked — awaiting re-verdict' — the ladder is re-testing it, not leaking); brand-defense keywords are never seated (defense is never judged on profit; brand phrases matched as whole phrases). seat_no is assigned on admission as the LOWEST number not held by an open row of the family and is kept for as long as the keyword stays seated, whatever its kind becomes. MEMORY: FACT_KEYWORD_STATE is replaced on every run and holds ONE snapshot; a keyword still on it carries prior_state, but a keyword that VANISHED has no row at all, so last_observed_kind / last_observed_state are refreshed on every run while the row is open and are the only record of what a vanished keyword last read (the KILLED-vs-PAUSED case). When the keyword leaves the occupant set the row is closed on the snapshot date with closed_reason KILLED (gone from the snapshot after a LOSER/DEAD last observed state, or DEAD now) | PAUSED (gone otherwise) | PARK_LAPSED (reads PARKED but is no longer a parked seat: no spend, or its appointment passed) | LEFT_FAMILY (campaign maps to another family, or the family left the HARVEST book) | DEFENSE_EXEMPT (now brand defense) | TO_GOOD_SIDE (WINNER / PACED_WINNER / AT_BAR) | TO_WAITING (still TRIAL, in no probe position) | STATE_CHANGED (any other state, named in plain words in closed_reason_text — never a silent catch-all), the same reason as one plain sentence in closed_reason_text, and the number is free for the next admission. WHY A TABLE: a seat number means nothing if it changes every morning; everything else the register shows is re-derived from today's snapshot. Written by SP_MAINTAIN_FAMILY_SEATS (orchestrator 20.8b); read by V_FAMILY_SEAT_REGISTER only; no engine reads it. ids STRING end to end. Spec: architecture/FAMILY_SEAT_REGISTER.md."
    source_files: ["scripts/bigquery/tables/DE_FAMILY_SEAT_LEDGER.sql"]

