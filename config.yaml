  - name: "DE_PEAK_WINDOW_OVERRIDE"
    description: "v27.50 (Ori 2026-08-12) — ORI'S RULE as DATA: the judged-window length W per season occurrence type, with the evidence that bought it. The rule: in peak the engine defaults to a 3-DAY window; a 7-day override is granted ONLY where the SAME occurrence type in a prior year was MEASURED to produce better decisions at 7 than at 3. Burden of proof is on the SLOWER window — no / thin / ambiguous / CONFLICTING evidence all resolve to 3. Off-peak is always 7 and is not overridable here. One active row per occurrence_type (= V_SEASON_CONTEXT.context_label minus the _<year>); superseded measurements stay with is_active=FALSE so the audit trail survives. Columns beyond w_days exist to answer 'why is this occurrence on this window?': evidence_verdict, evidence_occurrences, evidence_n, evidence_metric, specs_granted_7/specs_total, measured_on/by, remeasure_after, comment. Seeded 2026-08-12 from the 3-vs-7 study (17 closed prior peak occurrences, 34,688 SP decisions, 524 occurrence-days, $234,461 in-window spend; as-seen reconstruction via V_ADS_SETTLE_CURVE accrual, engine cut tree simulated at both windows, scored on settled forward-7d GP-ROAS, dollar metric = skill over a matched random-cut policy, Holm + keyword-clustered bootstrap). VERDICTS: XMAS_PEAK/EASTER/XMAS_EARLY -> 7 (proven, granted in 9/10, 10/10, 8/10 specifications); BTS/VDAY/MDAY/GRAD/FDAY/PRIME -> 3; HALLOWEEN/BF/CM inert (absorbed into XMAS by precedence). RECORDED CONFOUND: every 7-grant traces to the fixed clk_w>=13 cut gate (4.3 clicks/day at 3d vs 1.9 at 7d) — on a matched population or a window-scaled gate ZERO types grant 7, so if the click gate is ever scaled to the window every row must be re-measured. Ori-editable without a deploy; re-measure yearly by inserting a new row, never editing in place. Spec: architecture/PEAK_WINDOW_RULE.md"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE/DE_PEAK_WINDOW_OVERRIDE.sql"]

  - name: "DE_PLAN_CONFIG"
    description: "v27.132 (2026-08-23) — the next-week money plan's declared settings, one active row per calendar state (OFF_PEAK | BOOST | PEAK): window_days (complete days ending at the ads watermark minus one, P-10), allowance_share (the share of the GOOD side's window spend handed to the not-good side — 0.20 off-peak and in PEAK, 0.50 in BOOST, Ori 2026-08-23, a learning question the scorecard and the backtest answer per state), live_plan (B = rule B judges the window; A = the ladder judges the side, P-9), ramp_steps (windows over which the allowance closes the gap to today's not-good spend — P-8 is one third per window, so 3; 'ramp thirds' and ramp_steps are the same setting), min_orders (the window order floor of P-3, read on OBSERVED orders and never inflated by the P-14a settle correction, because a count cannot be fractionally corrected), and a description column written for a person. SP_BUILD_NEXT_WEEK_PLAN and V_PLAN_WINDOW_JUDGMENT read the latest is_active row for FN_PLAN_CALENDAR_STATE(CURRENT_DATE New York) — never a literal. Ori changes a setting WITHOUT A DEPLOY: retire whatever is active for the state (is_active = FALSE WHERE calendar_state = X AND is_active) and then insert his own active row, in that order, which makes the recipe idempotent. THE DEPLOY GUARANTEE, EXACTLY (v27.132): re-running the DDL can never change the SETTINGS of any state, HOWEVER they were changed (a new active row, or an UPDATE in place), and can never re-activate a state that was retired; all it can do is refresh the description of a seed row whose settings still equal the declared seed to the value. It is enforced by comparing VALUES, not updated_by — v27.130 re-inserted the seed active with a fresh CURRENT_TIMESTAMP() and out-ranked a hand row, and v27.131's updated_by guard still reverted an in-place UPDATE of a seeded row and still re-activated a deliberately retired one; both were replayed on TMP_ copies before the repair. Acceptance C09 goes red when an ACTIVE plan_seed row's settings stop matching the DDL, so an in-place edit is visible rather than silent; the supported recipe is still retire-then-insert. window_days has an OLDER house authority in V_PEAK_WINDOW_RULE over DE_PEAK_WINDOW_OVERRIDE (Ori's 3-vs-7 evidence rule, with re-measure clocks); P-11 (one engine) makes this table the plan's authority and acceptance C08 goes red rather than letting the two drift apart in silence. Acceptance: scripts/bigquery/tests/PLAN_CONFIG_acceptance.sql. Spec: docs/superpowers/specs/2026-08-23-next-week-money-plan-design.md P-13. SOP: architecture/NEXT_WEEK_MONEY.md"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE/DE_PLAN_CONFIG.sql"]

  - name: "FACT_PLAN_NEXT_WEEK"
    description: "v27.133 (2026-08-23) — the next-week money plan, one row per (as_of, plan, campaign, keyword) for the HARVEST families. Two plans every night: 'B' live (the window decides the side and the amount) and 'A' shadow (the ladder decides the side) — spec P-9. Carries the window record raw and settle-corrected, the arm that decided the side (settle_arm / decided_by, P-14), the pot / allowance / ramp step, the seat number and cost, the planned price and move, the implied campaign budget and the sentence a person reads. Partitioned by as_of, clustered by plan/family/campaign; append-only, the builder rewrites only today's partition. Created empty by Task 1 because V_PLAN_WINDOW_JUDGMENT reads this table for BOTH the P-14b guard's memory and P-5's one-window grace limit. THE side AND verdict COLUMNS ARE LOAD-BEARING FOR DOCTRINE, NOT ONLY FOR THE SCORECARD: side is the guard's 'was good' once a keyword has a row (the ladder is only the bootstrap for a keyword the plan has never seen), and verdict = 'GRACE' is what marks P-5's one quiet window as spent — grace is refused until the keyword earns a GOOD window back. A builder that collapses GRACE into GOOD silently restores a permanent exemption. Until it is written the table is empty, grace_limit_armed is FALSE on every judgement row and the plan says so in words. v27.137 adds planned_spend_delta_per_day (planned minus current spend per day): a seat costs its spend AT THE REPAIRED PRICE (P-6) and the repaired price can be ABOVE today's bid, so the plan can add money to a family's not-good side while staying inside its allowance - this column is that direction on the row, per keyword, instead of a fact that has to be inferred from prose. Written by SP_BUILD_NEXT_WEEK_PLAN. SOP architecture/NEXT_WEEK_MONEY.md §2."
    type: "fact"
    source_files: ["scripts/bigquery/tables/FACT_PLAN_NEXT_WEEK.sql", "scripts/bigquery/migrations/2026-08-25_plan_seat_click_target.sql"]

  - name: "DE_LAUNCH_INVESTMENT"
    description: "v27.56 (Ori 2026-08-13, launch-exemption build) - the SANCTIONED launch investment per family, with its dated stop gate. WHY: the launch exemption tells the coach it may not loss-cut a family that is SUPPOSED to lose money while the right bid is found; an exemption with no ceiling and no end date is a blank cheque, so the licence is written down here and V_LAUNCH_EXEMPTION reads it. daily_investment is the sanctioned $/day for the WHOLE FAMILY (all its campaigns summed), NOT a per-campaign budget - V_LAUNCH_EXEMPTION compares it against the family's real trailing-7d daily spend and publishes envelope_state (WITHIN_ENVELOPE / OVER_ENVELOPE / NO_SANCTION); an over-envelope family is Ori's budget decision, never a coach ROAS cut. stop_date is a HARD gate: the exemption ends at the EARLIER of it and the 183-day family-age boundary, so a family re-enters normal coaching by itself with no code change. One logical row per family; re-sanctioning = INSERT a row with a later updated_at (latest wins via QUALIFY ROW_NUMBER), so the history survives. Absence of a row is meaningful and safe (exemption rests on family age alone, envelope_state = 'NO_SANCTION'). THE SANCTIONS ON RECORD ARE DECLARED CONSTANTS, not measurements, which is why they may be written down at all: Bunny $30/day through 2026-10-31 and LolliBall $55/day through 2026-11-30, both sanctioned 2026-08-13. Even so, THIS FILE IS NOT THE SOURCE - read the live row before you write one back, and never restore a sanctioned value from a number typed into a document. v27.84 (two-book P&L, 2026-08-19) EXTENDED this table rather than declaring a second one, because two tables about the same licence would be two sources of truth about the same thing - the exact defect the two-book design exists to fix. TWO COLUMNS ADDED, ADDITIVE ONLY (nothing renamed, dropped or retyped, because V_LAUNCH_EXEMPTION reads this table live): (1) monthly_loss_ceiling FLOAT64 - dollars of NET PROFIT loss allowed per CALENDAR MONTH, where net profit is the V_FAMILY_PNL definition sales - all-in COGS (incl. Amazon referral + FBA pick/pack) - ad_cost. Backfilled from what Ori already sanctioned, nothing invented: ROUND(daily_investment * 30.44, 0) - the sanctioned SPEND rate monthised, on the reasoning that you cannot lose materially more than you spend, so the sanctioned spend IS the natural loss bound. IT IS A LOOSE BOUND BY CONSTRUCTION AND NOT A SUBSTITUTE FOR envelope_state: a launch family with real sales loses far less than it spends, so a family can sit a long way inside this ceiling while running well over its sanctioned daily rate. That is why the spend rate binds and the ceiling is only a catastrophe backstop - and it is a property of how the ceiling was derived, not a reading of a particular day. Check the two side by side with SELECT family, daily_investment, spend_per_day, spend_rate_ratio, ceiling_used_pct FROM `onyga-482313.OI.V_INVEST_STATUS` rather than quoting a figure from here. (2) takeover_target_organic_units INT64 - organic units/month that mean the family HAS TAKEN OVER and the investment can stop. LEFT NULL DELIBERATELY on both rows: a take-over target is a business judgement, not arithmetic, and is the one field Ori must still supply. NULL means no target on record and no take-over test can be run for that family. The DDL file now carries an ALTER TABLE ... ADD COLUMN IF NOT EXISTS + IS NULL-guarded backfill after the CREATE, because CREATE TABLE IF NOT EXISTS is a SILENT NO-OP against a table that already exists - re-running the file now converges instead of reporting success while changing nothing. Ori-editable without a deploy. Spec: architecture/LAUNCH_EXEMPTION.md"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_LAUNCH_INVESTMENT.sql", "scripts/bigquery/tables/DE_LAUNCH_INVESTMENT_seed.sql"]

