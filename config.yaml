  # ── Budget waterfall + daily optimizer (spec: docs/superpowers/specs/2026-07-05-weekly-run-budget-waterfall.md) ──
  - name: "V_CAMPAIGN_MONEY_PLACEMENT"
    type: "view"
    source_files: ["scripts/bigquery/views/V_CAMPAIGN_MONEY_PLACEMENT.sql"]
    description: "v27.99 (2026-08-21) - THE TOP-DOWN ANSWER TO 'IS THE ADVERTISING MONEY IN THE RIGHT PLACE?' (Ori 2026-08-21). Campaign grain plus a roll-up: row_kind ACCOUNT (one row), BUCKET (eight rows) and CAMPAIGN (one per campaign that holds budget today or spent inside the window). EVERY ROW CARRIES TWO DOLLAR FIGURES, NEVER ONE - budget_per_day (committed TODAY) and spend_window (delivered over the window) - because in this account committed budget and delivered spend diverge in both directions at once and Ori asked for both. THE GOVERNING RULE: a campaign is judged on ads-attributed gross profit per ad dollar against ITS OWN FAMILY'S measured bar from T_FAMILY_BAR, NEVER against a flat 1.0. Organic sales are measurable at family grain and are not attributable to a campaign, so the measurement stays honest at campaign grain and the BAR is what moves. THIS VIEW IS T_FAMILY_BAR'S FIRST CONSUMER and it is a REPORTING read - it changes no bid, and the T_FAMILY_BAR / SP_SNAPSHOT_FAMILY_BAR / V_FAMILY_BAR clauses were corrected in the same commit to say so. Reads the TABLE, never V_FAMILY_BAR, which is at the planner ceiling. THE EIGHT BUCKETS, plain-English in the published `bucket` column and coded in `bucket_code`: PROFITABLE / MARGINAL / UNPROFITABLE are the three judged outcomes; LAUNCH is the INVEST book, judged on sanction adherence and organic trajectory and NEVER on profit; TOO_SMALL is below the volume floor, a WITHHOLDING and not a loss; UNJUDGEABLE has nothing to judge it against - either no family and therefore no bar, or a family but no readable return, and the bucket sentence says which mix it is holding; NOT_SERVING is state ENABLED here while it cannot serve - serving_status says Amazon already ended it, or serving_status is not recorded at all, and the sentence no longer tells a reader Amazon ended a campaign when nothing on record says so - holding budget it can never deliver; STOPPED spent inside the window and holds no budget today. THE LAST FOUR EXIST SO MONEY CANNOT VANISH - the founding complaint behind this design was a total that lied by omission, and the universe of BUDGET and the universe of SPEND are not the same set. DECLARED CONSTANTS, all in the k CTE with their reasons: window_days = 90 (matches the settled window the bars themselves are measured on), watermark_lag_days = 1 (day-1 ads is ~88-90% loaded), volume_floor_clicks = 226 with floor_expected_orders = 9 (DERIVED: the clicks that produce nine expected orders at the account's own conversion rate; the relative movement of the return there is dispersion_factor over three, which is well over half and NOT the 'about a third' that the textbook Poisson figure alone suggests - the too-small sentence now COMPUTES that figure from the two constants rather than asserting it), and TWO SEPARATE BAND CONSTANTS because they answer different questions: band_sigmas = 1.0 is the POLICY (how many standard errors wide 'too close to call' is - one, not two, which is a formal test and answers the question with a shrug) and dispersion_factor = 1.75 is the MEASUREMENT (how many TEXTBOOK Poisson standard errors one REAL standard error of a campaign's return is worth in this account). v27.98 fused the two into band_sigmas = 1.0 and therefore ran a band about the measured dispersion too NARROW, convicting campaigns on gaps the measure makes on its own. THE SPLIT-HALF QUERY THAT SETS dispersion_factor IS PUBLISHED IN THE FILE HEADER AND IS THE AUTHORITY - the v27.98 version of it did not reproduce the claim made above it (it compared a measured gap averaged over every row against a Poisson prediction that silently skipped the zero-order halves, so the two columns described different populations) and it has been replaced: one declared scope, three inflation estimators - mean, median and root-mean-square - computed over the same rows, bucketed by window orders. Read the INFLATION columns, not the gap columns. DO NOT QUOTE THE LOWEST BUCKET: below about ten orders the statistic censors itself, because with both returns positive the relative gap is bounded above by 2 while the prediction has no ceiling, so that bucket reads as though the measure were calmer than the model. That is an artifact of the ruler, and v27.98's header read it as evidence the model tracked. The header also carries the query that prices 1.0 / 1.5 / 1.75 / 2.0 / 2.5 on the live view. The band is PER CAMPAIGN, not a flat percentage, so it narrows on its own as volume accumulates and needs no tuning. AND IT DOES NOT COLLAPSE AT ZERO ORDERS: it is written as what one order is worth times the square root of the order count over the spend, which is algebraically identical to 'the return over the square root of orders' wherever orders are positive (asserted, check A14) and falls back to what an order is worth ACROSS THE ACCOUNT where they are not. v27.98 multiplied by a return of exactly zero there and published a band of exactly 0.0 - a claim of certainty about a campaign nobody has information about. ABS() on the scale, because a negative gross profit per order would otherwise invert the whole test. THE BAR COLUMN IS PUBLISHED AS family_bar, NOT keyword_bar. T_FAMILY_BAR names it keyword_bar, which is right in the table because the engine applies it to keywords; on a campaign row of this view there is no keyword in sight and the old name invited a reader to think a keyword-level number was on screen. Renamed once, at the join. shortfall_window is likewise published ONLY on a campaign the evidence has condemned - computed across all three judged buckets it published a NEGATIVE shortfall on the account's BEST campaigns, a surplus wearing the wrong name. AND NOTHING REACHES A VERDICT BY FALLING OFF THE END OF THE CASE: a campaign whose return cannot be read at all used to land in 'too close to call' and be published with a confident sentence about evidence that did not exist; it is now caught by name. LAUNCH SUPPRESSION IS TOTAL AND ASSERTED: on a LAUNCH row the bar, the return, the band, the shortfall, the verdict AND the gross profit itself are all NULL - gross profit over spend IS the verdict one division away, and a suppression a reader can undo is not a suppression. MONEY IS NUMERIC, NOT FLOAT, AND THAT IS CORRECTNESS: a FLOAT64 sum is not associative, two uncached runs differed in the last bits, and a derived figure landing on a rounding boundary made a published sentence read 8.18 on one run and 8.19 on the next. Both were observed here before the cast existed. BUDGET IS READ AS OF TODAY AND NEVER APPLIED BACKWARDS - daily_budget moves roughly weekly per campaign, so there is deliberately no utilisation percentage in any sentence, AND NO SENTENCE MAY MAKE THAT CLAIM IN WORDS EITHER (the too-small line used to say most of that budget was 'sitting unused rather than being lost', which is the banned ratio said in English). The window length is likewise never spelled out in a literal - every sentence that states it reads window_words, derived from window_days, so shortening the window can never leave a sentence saying 'ninety days'. DO NOT PIN THE BUCKET TOTALS HERE (Standing Rule 0) - they move every night with the bars, the window and the budgets. Read them: SELECT sort_key, bucket, n_campaigns, budget_per_day, pct_of_account_budget, spend_window, pct_of_account_spend, sentence FROM `onyga-482313.OI.V_CAMPAIGN_MONEY_PLACEMENT` WHERE row_kind IN ('ACCOUNT','BUCKET') ORDER BY sort_key. SUPERSEDES V_COVERAGE_CAMPAIGN_PROFIT7D, which is NOT wired to anything (/api/daily-workflow reads FN_COVERAGE_CAMPAIGN_PROFIT, a table function; the 'still wired' clause in that view's entry was checked on 2026-08-21 and corrected) and must not be built on. THE FLAT-BAR COMPARISON IN THE HEADER IS NOW POPULATION-MATCHED: the v27.98 version counted every spending campaign on the flat side - launches, the too-small, the unattached, the stopped - against only the JUDGED campaigns on the barred side, and published that ratio as the damage a flat bar does. It was several times the truth. Same rows, same band, one bar swapped; the finding survives the correction and the multiple is a query rather than an assertion. ACCURACY: FACT_AMAZON_ADS runs about a percent apart from the per-channel Amazon reports, so a bucket total is good to roughly a percent and no threshold should ever be set tight enough for that to matter. ACCEPTANCE: scripts/bigquery/tests/V_CAMPAIGN_MONEY_PLACEMENT_acceptance.sql, fourteen checks against the deployed view, including budget and spend each reconciling from buckets to account to the cent, every enabled campaign in exactly one bucket, no profitability figure anywhere on a launch row, no negative shortfall, no verdict on a return nobody can read, no judged campaign carrying a band of zero, and the zero-order band rewrite proved algebraically neutral on every campaign that made a sale."
    dependencies:
      - FACT_AMAZON_ADS
      - V_DIM_CAMPAIGN_CURRENT
      - T_FAMILY_BAR

  - name: "V_CAMPAIGN_FAMILY_MAP"
    description: "Single family attribution for every ENABLED campaign, and the coverage guarantee for the budget waterfall — no enabled campaign falls out. Four arms, each filling only what the arm above left empty: the DE_CAMPAIGN_FAMILY override a human wrote; else the dominant advertised ASIN over the learning window; else the campaign-name prefix, LEARNED not listed; else 'Unknown', which stays a real value because a whole-store campaign genuinely has no single family and V_BOOK_ASSIGNMENT deliberately refuses it. The name arm exists because Sponsored Brands video carries no advertised ASIN, so those campaigns used to have no family, therefore no bar, therefore no place in the per-family judgement while still spending. HOW IT LEARNS: take the leading unbroken run of letters of a campaign's name as its prefix; let every campaign that spent inside the learning window teach, in any state, using whatever family the two arms above already gave it; a prefix stamps a family only when its teachers are unanimous AND at least a declared minimum of them stand behind it (both constants are declared in the view's k CTE with their reason). A contested or thin prefix teaches nothing and its campaigns keep the sentinel, so the arm can withhold a right family but not invent a wrong one. It cannot learn a prefix that is a channel, a colour or a programme label, it cannot produce the virtual whole-store family, and a brand-new family teaches nothing on day one — all of those still need an override. Publishes resolution_source, saying in plain words which arm answered, so a family can be audited without re-deriving it. Run the vote query in the view header to see what the rule learned on any day; no measurement from it is pinned here. Parsing a name is a deliberate, confined exception to V_DIM_CAMPAIGN_FAMILY's standing instruction against name parsing, and it carries that instruction's cost: rename a campaign's leading word and its family moves on the next refresh."
    type: "view"
    source_files: ["scripts/bigquery/views/V_CAMPAIGN_FAMILY_MAP.sql"]
  - name: "V_FAMILY_NET_PROFIT_7D"
    description: "Family split weight = daily-avg net profit over the last 7 FULL-DATA days (anchored on the organic watermark). Product families use real business net profit (incl organic); Store/Unknown fall back to ads net profit."
