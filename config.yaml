  - name: "DE_FAMILY_INTENT_OVERRIDE"
    description: "Per-(family x intent theme) manual relevance override — beats the automatic fit+profit gates in V_INTENT_KEYWORDS. force_relevant FALSE = never suggest this intent for this family, TRUE = always suggest (even with no data). Exists because DE_INTENT_THEMES.is_active is GLOBAL and can't say 'school is wrong for LolliME but fine for Lollibox'. Absent row = let the gates decide. SOP: architecture/INTENT_CAMPAIGN_MODEL.md"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_FAMILY_INTENT_OVERRIDE.sql"]

  - name: "DE_INTENT_THEMES"
    description: "Registry of intent THEMES (birthday, easter, beauty, journal…) — the grouping unit for intent-grouped campaigns (family x match-type x intent). GENERIC vs TIME_BASED; match rule = AND over match_occasion/match_holiday/match_product_type/match_age_group/match_keyword_regex against FACT_RESEARCH_RANKED; TIME_BASED links holiday_name -> DIM_US_HOLIDAYS for start/pause dates. NOT the same as the BRAND/PRODUCT/GENERIC keyword intent class (V_KEYWORD_INTENT_CLASS). ALSO carries match_ads_regex and match_ads_age_regex (added 2026-07-24): patterns matched against LOWER(FACT_AMAZON_ADS.search_term) so a theme can be recognised from the words a shopper typed rather than from research attributes. Consumed only by V_ADS_SEARCH_TERM_INTENT; V_INTENT_KEYWORDS ignores it. Editing priority here changes routing there. Deliberate values: back-to-school 25 not 10 (its bare \bschool\b arm is greedy); asin/auto-target 1, brand 2, competitor 3, budget/budget-gift 4 (price intent is the strongest CVR predictor in the account — 1.47% vs 3.99%, 0.90 GP-ROAS vs 1.33 — so it resolves ahead of every topical theme); age-8-14-* demoted to 6 (occasion compounds) and 40 (bare gift) so the named Kid/Tween/Teen bands win; kid/tween/teen-gift 39 so they beat plain gift at 40. match_ads_age_regex is the THIRD independent condition — it is what makes tween-birthday-gift specificity 3 and lets it beat birthday-gift on merit rather than a tie-break. Without an ads-side age pattern the 24 age compounds could never match at all, because match_age_group is a FACT_RESEARCH_RANKED attribute that does not exist on the ads side. SOP: architecture/INTENT_CAMPAIGN_MODEL.md + docs/superpowers/specs/2026-07-24-intent-coverage-phase0-design.md"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_INTENT_THEMES.sql"]

  - name: "DE_SEARCH_TERM_INTENT"
    description: "Supervised search-term -> intent theme mapping. Physical and editable, because a view has nowhere to put a human decision and any rule edit silently rewrites history. THE CONTRACT: suggested_* belongs to the automation and SP_REFRESH_SEARCH_TERM_INTENT overwrites it freely; verified_* belongs to the reviewer and the SP NEVER overwrites it. When the automation changes its mind about an already-verified row, the SP defers to neither side — it flips verification_status to RECHECK and leaves both values for a human to settle (drift detected by comparing suggested_intent_key to suggestion_at_verification). verification_status: PENDING (never reviewed, falls back to the suggestion) | VERIFIED | CORRECTED (reviewer chose differently) | REJECTED (no valid intent — verified_intent_key IS NULL ON PURPOSE, distinct from PENDING where NULL just means nobody looked) | RECHECK. REJECTED rows are deliberately not re-flagged on drift: 'this term has no intent' is a statement about the term, not the rule. Read via V_INTENT_RESOLVED, review via V_INTENT_REVIEW_QUEUE. 337,061 rows at creation 2026-07-24."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_SEARCH_TERM_INTENT.sql"]

  - name: "SP_REFRESH_SEARCH_TERM_INTENT"
    description: "Keeps DE_SEARCH_TERM_INTENT in step with the ads term universe and the current DE_INTENT_THEMES rules WITHOUT destroying a human verdict. MERGEs new terms in as PENDING, refreshes suggestions and 365d impact counters on existing rows, then flips any VERIFIED/CORRECTED row whose suggestion no longer matches suggestion_at_verification to RECHECK (IS DISTINCT FROM, so a NULL on either side counts as a change). Idempotent, safe to schedule. Verified 2026-07-24 by deactivating a theme: 9 of 26 verified rows flipped to RECHECK, V_INTENT_RESOLVED kept serving the human answer with is_stale=TRUE, and the other 17 were untouched."
    type: "procedure"
    source_files: ["scripts/bigquery/procedures/SP_REFRESH_SEARCH_TERM_INTENT.sql"]

