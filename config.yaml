  - name: "V_OOB_BUDGET_PHASE"
    description: "Out-of-budget technical phase for the Weekly Run page (below Coach logic). v27.45 (2026-08-08): MEMBERSHIP = V_CAMPAIGN_CAP_STATE.is_oob_owned (per-day dual-signal 7d grid + hysteresis) — the v27.15 anchor-day-only test is GONE (it hid 25 chronically-capped campaigns whose anchor day came in light, incl. Brand Defense, and admitted 1-day blips); pct_dark/over_budget stay the measured anchor-day ladder inputs; days_capped_7d + is_oob_owned exposed as output columns (cube adoption pending — dashboard routing is a follow-up); WATCH gated on days_capped_7d <= 1 (chronic campaigns run the ladder even on a light anchor day; reason opener restated 'Capped N of last 7 days (anchor day light)'); DEFENSE GATE: both budget-CUT branches carry NOT is_defense — never cut a defense budget on ROAS (raises/holds still apply). One row per ENABLED campaign (SP+SB, launch AND working) that the cap state marks OOB-owned. Goal (Ori 2026-07-30): campaigns should never be out of budget but use almost all their budget. pct_dark from the unified V_SRC_AmazonAds_campaign_history event log (never raw per-channel fivetran, never DIM_CAMPAIGN — SCD2 samples 3×/day and drops reverting flips). v27.10 ASYMMETRIC WINDOWS (working tier): chronic 7d+8-28d both<0.6x -> CUT first (no raise into chronic bleeders; peak 3d+4-14d), raises stay on today+prev-2d; v27.9: low tier daily on today+prev-2d (working cadence throttle REMOVED; multipliers still tier-split) + APPLIED_HOLD overlay (48h change-log, one step/day, sync-lag suppression). Suggestion = the launch controller's dark-gated ladder applied uniformly: dark≤10% WATCH · prev-2d≥1.5× RAISE_STRONG (÷%active cap 3×) · last-day≥1.2× RAISE_WEAK (cap 2×) · prev-2d<0.9× CUT (×0.9 — −10%/day slow slide, floor $10; Ori 2026-07-30) · else HOLD. SP net ROAS corrected via T_PRICE_COST_TIER; SB estimated via mapped-ASIN cost ratio. Cube: OobBudget. Spec: architecture/OOB_BUDGET_PHASE.md. v9 (2026-08-02): is_seasonal flag exposed (same name regex as V_KEYWORD_LIFT) — routes dark seasonal campaigns to the 'Seasonal — out of budget' section. v24: is_auto_campaign (enabled auto clause exists in DIM_KEYWORD config) — OOB sections exclude autos; the Auto section owns them. v27.46 (2026-08-09) A5 BUDGET NO-OP GUARD (v27.29 pattern): CUT/RAISE whose suggested_budget equals the current budget after floors/rounding -> HOLD with an honest reason ('cut resolves to the $10/$15 floor the budget already sits at' / 'no change after rounding'), no suggested value; APPLIED_HOLD outranks. Plus the SB prod cost_ratio determinism fix (dominant mapped ASIN — see V_OOB_KEYWORD v27.46). Spec: OOB_BUDGET_PHASE.md §v27.46 guard batch."
