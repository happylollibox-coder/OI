  - name: "SP_SNAPSHOT_PARK_REVERDICT"
    description: "Park-reverdict snapshot (v27.48): CREATE OR REPLACE TABLE FACT_PARK_REVERDICT AS SELECT * FROM V_PARK_REVERDICT. Called by SP_ORCHESTRATE_DAILY_REFRESH Task 20.5e, AFTER SP_SNAPSHOT_SEASON_VERDICT (20.5d) — the reverdict reads season verdicts (the 0.8x season-WIN relaxation) and the context gate. Idempotent. Spec: architecture/SEASON_CONTEXT_LEDGER.md §7."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_PARK_REVERDICT.sql"]

  - name: "SP_SNAPSHOT_FAMILY_BAR"
    description: "v27.84 (two-book P&L, 2026-08-19, Task 5) — materializes V_FAMILY_BAR into T_FAMILY_BAR, exploding the 6 family bars out to CAMPAIGN grain via V_CAMPAIGN_FAMILY_MAP (88 of 97 enabled campaigns @ 2026-08-19). Exists because the bid engines V_KEYWORD_LIFT and V_OOB_KEYWORD are each AT BigQuery's planning ceiling and must LEFT JOIN a table, never inline the view — the same repair pattern that fixed V_PANEL_OWNERSHIP on 2026-08-17 (fact_oi_cube_table_planner_blowup). Campaign grain rather than family grain because neither engine publishes a family column, only campaign_id, so resolving family inside them would mean joining the map inside a ceiling view. The map's literal 'Unknown' bucket (9 campaigns) gets no row and therefore no bar, by design: the engines' COALESCE(keyword_bar, 1.0) leaves those campaigns at exactly today's behaviour. Fully derived and idempotent (CREATE OR REPLACE TABLE; verified byte-identical counts across two consecutive runs). Orchestrator task 20.5g-1, before Task 20.5g SP_SNAPSHOT_PANEL_OWNERSHIP and before the Task 21 engine T_ builds. Spec: docs/superpowers/specs/2026-08-19-two-book-pnl-design.md §4."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_FAMILY_BAR.sql"]

  - name: "SP_SNAPSHOT_PANEL_OWNERSHIP"
    description: "Panel-ownership snapshot (v27.78, 2026-08-17; was v27.77 / v27.62). THREE BASES FOR A LOW-STOCK CLAIM as of v27.78 (arm A structural: family risk_state='CRITICAL'; arm B instructed: a campaign-row suggested budget, OR >=1 proposal target, OR — new — the family is in REDIRECT MODE, i.e. low stock is re-aiming ad doorways at an in-stock sibling instead of braking). NO LOGIC CHANGE IN THIS PROCEDURE for it — the claim still lives entirely in V_PANEL_OWNERSHIP; what makes it work here is the step order, because step 1 must rebuild the slice from the new V_LOW_STOCK_ADS (whose CAMPAIGN branch now publishes the real redirect_mode instead of NULL) before step 2 reads that column out of it. TWO STEPS, AND THE ORDER IS THE CONTRACT: (1) CREATE OR REPLACE TABLE T_LOW_STOCK_CAMPAIGN AS SELECT * FROM V_LOW_STOCK_ADS WHERE row_kind='CAMPAIGN' AND campaign_id IS NOT NULL — a pure pass-through slice, 14 rows @ 2026-08-17; then (2) CREATE OR REPLACE TABLE FACT_PANEL_OWNERSHIP AS SELECT * FROM V_PANEL_OWNERSHIP, whose ls_camp CTE reads that table. WHY STEP 1: V_PANEL_OWNERSHIP used to INLINE V_LOW_STOCK_ADS, which was enlarged twice on 2026-08-17 (v27.73 redirect mode; v27.74 complete-day windows) and pushed the combined plan past BigQuery's ceiling — the 16:24 run failed with 'Not enough resources for query planning - too many subqueries or query is too complex' and SELECT COUNT(*) on the view then failed deterministically, which would have failed the 07:50 UTC orchestrator pass and left ownership stale (consumers LEFT JOIN the table, so a stale row reads as 'no claim' and the single-home ladder, DEFER_* routing and panel membership quietly break). House pattern for planner blowups: never inline a ceiling view, read a T_ materialized earlier in the same SP. The T_ is a MATERIALIZATION, NEVER A TRANSFORMATION — zero logic moved out of the view. Step 1 must run first every time (the T_ is this procedure's scratch, not durable state; a stale step 1 would re-publish yesterday's stock verdicts). Must still run AFTER the FACT_INVENTORY_SNAPSHOT and ads FACT loads (V_LOW_STOCK_ADS reads both) and BEFORE the engine T_ builds in SP_REFRESH_CUBE_TABLES, so the engines compile against the ownership of the run they are part of. Idempotent, fully derived. Verified 2026-08-17: SP runs end-to-end; FACT_PANEL_OWNERSHIP 95 -> 93 rows (the 2 dropped are ME-SP/PT (Competitors, Mint, B1) and STORE-SPOTLIGHT (tween-girl-gift), both PAUSED during the day, i.e. out of the ENABLED population), ZERO owner flips, zero claim_rank / defer_* moves; only ls_suggested moved (6 rows, the expected v27.73/v27.74 + intraday-restatement drift). Spec: architecture/PANEL_OWNERSHIP.md."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_PANEL_OWNERSHIP.sql"]

  - name: "SP_SNAPSHOT_KEYWORD_GUARD"
    description: "Keyword-guard snapshot (v27.48 part 2): CREATE OR REPLACE TABLE FACT_KEYWORD_GUARD AS SELECT * FROM V_KEYWORD_GUARD. Called by SP_ORCHESTRATE_DAILY_REFRESH Task 20.5f, AFTER SP_SNAPSHOT_PARK_REVERDICT (20.5e) — both settle-doctrine snapshots share the daily frame. Idempotent. Spec: architecture/SEASON_CONTEXT_LEDGER.md §7.6-7.9."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_KEYWORD_GUARD.sql"]

  - name: "FACT_ENGINE_PROPOSALS"
    description: "The engine's memory of its own OPINIONS (2026-08-15, Ori: daily 'what was planned / what actually happened / action items'). One row per (snapshot_date, engine, instruction): every live bid/budget/revive instruction from V_KEYWORD_LIFT, V_OOB_KEYWORD, V_OOB_BUDGET_PHASE, V_LOW_STOCK_ADS, V_LAUNCH_BID_LADDER and V_PARK_REVERDICT, applied or not. HOLD/WATCH/DEFER rows excluded (a memory full of 'do nothing' buries the signal); NEGATE proposals are a known gap. The change log records what was APPLIED — without this table, 'did the engine call it right?' is only answerable for uploaded suggestions, and manual-divergence ('Ori did X where the engine said Y') not at all. Partitioned by snapshot_date. Written by SP_SNAPSHOT_ENGINE_PROPOSALS (delete-today-then-insert). Read by V_DAILY_BRIEF; later V_MANUAL_DIVERGENCE (engine-finalization plan Task 3.1). Spec: architecture/DAILY_BRIEF.md."
    source_files: ["scripts/bigquery/tables/FACT_ENGINE_PROPOSALS.sql"]

  - name: "SP_SNAPSHOT_ENGINE_PROPOSALS"
    description: "Daily engine-proposal snapshot (2026-08-15): deletes today's FACT_ENGINE_PROPOSALS partition and re-inserts every live instruction, one single-view scan per INSERT (planner-ceiling doctrine — never two engine views in one statement). Called by SP_ORCHESTRATE_DAILY_REFRESH Task 20.6, AFTER SP_SNAPSHOT_PANEL_OWNERSHIP (deferrals read it) and the coach refresh (launch ladder reads the coach), BEFORE SP_REFRESH_CUBE_TABLES — so the snapshot records the same opinions the day's panels show. First snapshot 2026-08-15: 212 proposals (165 bids, 22 budgets, 25 revivals). Spec: architecture/DAILY_BRIEF.md."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_ENGINE_PROPOSALS.sql"]
    dependencies:
      - FACT_ENGINE_PROPOSALS

