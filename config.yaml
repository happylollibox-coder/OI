  - name: "DE_NEGATIVE_TARGETS"
    description: "Warehouse-owned negative PRODUCT-targeting registry (replaces frozen Fivetran negative_targeting_clause sync). Seeded from a bulksheet download via tools/load_negatives_seed.py; maintained by SP_SYNC_NEGATIVES."
