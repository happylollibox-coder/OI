  - name: "DE_COMPETITOR_BID_TIER"
    description: "Tunable bid bands over target_cpc for the COMPETITOR campaign plan (FN_COMPETITOR_CAMPAIGN_PLAN). An Amazon campaign shares ONE bid, so candidates are grouped into bands whose members all want roughly the same bid. Columns: tier_code ('A'..'E', also the campaign-name token), tier_label, min_target_cpc (INCLUSIVE), max_target_cpc (EXCLUSIVE), sort_order, description. NULL min = open bottom, NULL max = open top. Bands seeded 2026-07-23 from the REAL candidate distribution across all families: A >=2.00 / B 1.40-1.99 / C 1.00-1.39 / D 0.80-0.99 / E <0.80 (n=14/19/31/27/36 at 12mo). The originally-proposed 2.50/1.75/1.25 split was degenerate — 69% of candidates fell in one band spanning a 3.7x bid range, which is exactly what tiering exists to prevent. Ori-editable without a deploy."
