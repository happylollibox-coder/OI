  - name: "FACT_CUSTOMER_ORDER_ITEM"
    description: "Amazon customer-order LINE ITEMS — one row per (selling_partner_id, amazon_order_id, order_item_id). THE basket-composition fact: grouping by amazon_order_id is the only way in the warehouse to see which products were bought together. Loaded by SP_LOAD_FACT_CUSTOMER_ORDER_ITEM via full MERGE (restatement-safe: orders cancel after the fact, and a windowed load would strand stale is_canceled flags). purchase_date is America/Los_Angeles and ties to SRC_ACC_SALES_TRAFFIC_DAILY.date on UNITS only — item_price_amount is the pre-tax extended product price while the order total adds tax and shipping, so money never ties. Consumers MUST filter NOT is_canceled AND quantity_ordered > 0: canceled LINES exist on orders whose header still reads Shipped. is_mapped_product = FALSE marks ASINs absent from DIM_PRODUCT (~4% of units, genuine retired products) — kept, with item_title standing in for the missing product_short_name. Partitioned by purchase_date, clustered by (asin, amazon_order_id). SCHEMA DIVERGENCE (2026-08-23): the live table carries the declared PRIMARY KEY (selling_partner_id, amazon_order_id, order_item_id) NOT ENFORCED, applied ad hoc via migrations/2026-08-23_fact_customer_order_item_pk.sql, but NOT the NOT NULL constraints this file's DDL declares on those same three columns — BigQuery has no ALTER that promotes an existing NULLABLE column to REQUIRED, and the table already held rows when the constraint was added. CREATE TABLE IF NOT EXISTS is a silent no-op against a table that already exists, so re-running the DDL file will never reconcile the gap; acceptance check A3 (no NULL keys or dates) is what actually polices it, not the schema. Acceptance: scripts/bigquery/tests/FACT_CUSTOMER_ORDER_ITEM_acceptance.sql, checks A1-A9 (A1 is asymmetric — behind the source PASSes as ordinary sync lag, ahead of it FAILs as an uncleaned row). Spec: architecture/CUSTOMER_ORDER_BASKETS.md"
