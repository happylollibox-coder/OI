  - name: "V_PRICE_COST_TIER"
    description: "Empirical per-unit sale-price → true-COGS lookup. Learns from V_SRC_AmazonAds_purchased_product (last 180d): for each observed unit price, the units-weighted TRUE landed cost of what was actually purchased at that price. Solves the advertised-vs-purchased COGS bug (a box ad drives a cheaper ball sale, but FACT charges the box cost) WITHOUT the purchased report's ~31% coverage gap or units/attribution mismatch — every FACT row has a price. Validated: cuts per-unit COGS error from $2.74 (advertised) to $0.49, 98% within $2. tier_cost is a drop-in COGS for any FACT row at that price; cost_spread flags ambiguous tiers (e.g. $13.99 Bunny/LolliBall — cost-harmless). Prices <3 units dropped → caller falls back to advertised cost."
    source_files: ["scripts/bigquery/views/V_PRICE_COST_TIER.sql"]
    dependencies:
      - V_SRC_AmazonAds_purchased_product
      - DIM_COSTS_HISTORY
      - DIM_PRODUCT

  - name: "V_ADS_COST_CORRECTED"
    description: "Correct per-unit ad COGS from the PURCHASED product (not the advertised one), at (date, campaign_id, ad_group_id, keyword_id) grain, from V_SRC_AmazonAds_purchased_product. correct_cost_per_unit = units-weighted mean cost of what was actually purchased; drop-in replacement for FACT_AMAZON_ADS.TOTAL_COST_PER_UNIT. NOTE: the purchased report under-covers (~31% of FACT units absent) and is 14-day attribution vs FACT's higher count — prefer V_PRICE_COST_TIER (price-based, 100% coverage) for the production correction; this view is the report-based reference / diff source. Not yet wired into FACT."
    source_files: ["scripts/bigquery/views/V_ADS_COST_CORRECTED.sql"]
    dependencies:
