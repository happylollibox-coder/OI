  - name: "V_COACH_CAMPAIGN_BUDGET"
    description: "Campaign-grain budget recommendations per family (Coacher F, budget apply set) — V_ADS_COACH deduped to ONE row per campaign so the Weekly Run inline Budget phase and the bulksheet budget rows read a single decision. is_change flags an actual move. v27.56: passes through the launch-exemption columns launch_exempt / launch_exempt_until / budget_action_suppressed / budget_suppressed_to for DISPLAY. A launch-exempt hold arrives with budget_action = 'LAUNCH_EXEMPT_HOLD' and recommended_budget = NULL (nulled in V_ADS_COACH), so is_change is FALSE by construction and a suppressed cut can never enter the apply set. Registered 2026-08-13 (was previously unregistered)."
    source_files: ["scripts/bigquery/views/V_COACH_CAMPAIGN_BUDGET.sql"]
    dependencies:
      - V_ADS_COACH

  - name: "V_LAUNCH_EXEMPTION"
    description: "v27.56 (Ori 2026-08-13: 'the launch exemption — but make it as a new criteria in the weekly run page') — the launch families' licence to lose money, written down as data. One row per ENABLED campaign whose FAMILY is in launch phase (15 rows 2026-08-13: 7 Bunny + 8 LolliBall). WHY: standing doctrine is 'launch = FIND THE RIGHT BID, never loss-cut; bleed via search-term negate', and the coach's launch track implements that at TARGET grain ONLY — its BUDGET rows carry launch_phase = NULL, so nothing stopped the campaign-budget engine from loss-cutting a launch family. The hole was live and expensive: 9 of the 12 coach budget decisions standing on Bunny (2.7mo) + LolliBall (1.6mo) were cuts (5 CAMPAIGN_STOP, 4 GUARDIAN_BUDGET_DECREASE). MEMBERSHIP IS DATA, NOT A LIST: family_first_sale = MIN(date) over T_UNIFIED_DAILY where units > 0 (the same first-sale definition V_PRODUCT_LAUNCH_MODEL / V_LAUNCH_RAMP use), so families enter and leave launch phase on their own record with no code change. BOUNDARY = 183 DAYS (6 months) and it is a DOCTRINE choice, not a fit: the age distribution has a ten-month hole between 2.7 and 13.4 months, so every cut in (3mo, 13mo) selects the same two families; 183d is the tightest boundary the warehouse already agrees with (V_PRODUCT_LAUNCH_MODEL requires >= 180d before a product's own history counts as a pattern); 12 months (the forecast first-year guard) was rejected as too generous. It is a BACKSTOP — where a sanction is on record its dated stop gate binds first, and today it does for both families (Bunny 2026-10-31 vs age boundary 2026-11-23; LolliBall 2026-11-30 vs 2026-12-26). THREE BOUNDS, all published as data: (1) exempt_until = LEAST(first sale + 183d, DE_LAUNCH_INVESTMENT.stop_date) — past it the row disappears and normal coaching resumes; (2) envelope_state — family trailing-7d daily spend vs the sanctioned $/day (TODAY BOTH FAMILIES ARE OVER: Bunny $43.56/day vs $30, LolliBall $150.38/day vs $55) with escalate_to_ori, protected_winner and envelope_trim_rank (worst settled GP-ROAS first, winners last) so taking money out is a deliberate BUDGET decision, never a coach ROAS cut; (3) the exemption blocks ONE class of decision — campaign-level ROAS-driven money cuts. blocks_enforced (wired in V_ADS_COACH.scored_exempt): CAMPAIGN_STOP, GUARDIAN_BUDGET_DECREASE, BLITZ_BUDGET_DECREASE, COOLDOWN_BUDGET_REDUCE, RESTORE_BUDGET_PRE_PEAK, and GUARDIAN_BUDGET_CONTAIN POST-GRACE ONLY (inside the 14-day grace window CONTAIN is the BROKEN-LAUNCH guard — >$25 spent, ZERO orders → $10/day — a zero-order waste trim, not a profit verdict, and both arms emit the same string, which is why the distinction is made here on campaign age). blocks_pending (named in the doctrine, NOT wired): the coach's target-grain STOP_TARGET (4 rows / $78 spend_4w on these families) and the engine parks in V_OOB_KEYWORD / V_KEYWORD_LIFT — left alone deliberately because the OOB seat model's PARK_WAIT is CAPACITY-driven and is the sanctioned launch mechanism. STOP_SEASONAL is never blocked (calendar, not profit). EVIDENCE IS SETTLED: every GP-ROAS is a 28-day window ending settle_days before today (7 SP / 14 SB), GP = FACT_AMAZON_ADS.GROSS_PROFIT (tier COGS charged) over Ads_cost — the SAME currency the budget engine's own cw.* windows use. Deterministic (2x byte-identical, md5 1d471b6eb33b1d7e0bb61f096a30825c on 15 rows @ 2026-08-13). Advisory: the only thing it CHANGES is that a suppressed cut never reaches the bulksheet (V_ADS_COACH nulls recommended_budget on held rows, so V_COACH_CAMPAIGN_BUDGET.is_change is FALSE by construction). Weekly Run 'Launch exemption' panel reads the VIEW live via cube/schema/LaunchExemption.js (15-min TTL). Spec: architecture/LAUNCH_EXEMPTION.md"
    source_files: ["scripts/bigquery/views/V_LAUNCH_EXEMPTION.sql"]
    cube_schema: "cube/schema/LaunchExemption.js"
    dependencies:
      - T_UNIFIED_DAILY
      - DE_LAUNCH_INVESTMENT
      - V_CAMPAIGN_FAMILY_MAP
      - V_DIM_CAMPAIGN_CURRENT
      - FACT_AMAZON_ADS

  - name: "V_LAUNCH_BID_LADDER"
    description: "v27.59 (Ori 2026-08-13, verbatim: \"launch_bid ok between 0.5 and 0.7 trim keyword bid 5% and use launch_bid / improving between 0.7 and 0.9 do not do / profitable launch_bid ok <0.5 trim keyword bid 10%\", plus his correction that the ladder judges on the SHORT window) - the launch exemption's ONE downward lever, at TARGET grain. 73 rows / 73 distinct (campaign_id, keyword_id) over 12 campaigns and 2 families @ 2026-08-13. THE LADDER, on GP-ROAS (gross profit / ad spend, tier COGS charged, so 1.00 = breakeven AFTER product cost) over the SHORT window: < 0.50 -> LAUNCH_BID_TRIM_10 (-10%); 0.50-0.70 -> LAUNCH_BID_TRIM_5 (-5%); 0.70-0.90 -> LAUNCH_BID_HOLD_IMPROVING (no action, 'improving'); >= 0.90 -> LAUNCH_BID_HOLD_PROFITABLE (no action, 'launch_bid ok'); no window spend -> LAUNCH_BID_HOLD_NO_EVIDENCE; trim band with no room under the floor -> LAUNCH_BID_HOLD_AT_FLOOR. Bands are half-open [lo, hi). THE STEEPEST THING THIS VIEW CAN SAY IS -10%: it emits NO budget column and NO stop/park verb, so every block V_LAUNCH_EXEMPTION enforces stands untouched (verified on the 6,446 exempt coach rows: 0 CAMPAIGN_STOP, 0 budget decreases of any kind, 0 downward budget numbers, 9 LAUNCH_EXEMPT_HOLD). WINDOW: w_days from V_PEAK_WINDOW_RULE (7 off peak, 3 in peak unless 7 is PROVEN) ending at the ADS WATERMARK (MAX(date) in FACT_AMAZON_ADS), not today-1, so a late load slides the ladder rather than judging a half-loaded day. Today: in_peak BTS, w_days 3, 2026-08-10..2026-08-12. DELIBERATELY UNSETTLED - SP accrues to D+7, SB to D+14, so the band is biased TOWARD trimming; accepted because the cost of being wrong is 5-10% of one bid for one day, re-judged tomorrow (contrast V_LAUNCH_EXEMPTION, whose SETTLED 28d evidence gates a campaign STOP). campaign_settled_gp_roas rides on every row so the two windows can be compared, not argued about. Last day (d1_*) is PUBLISHED, not judged - the 'must fail BOTH windows' conjunction belongs to the low-stock -50% rule (V_LOW_STOCK_ADS), not here. Evidence gate is w_spend > 0 and nothing more; no click threshold was invented, instead evidence_grade = THIN under 3 window clicks makes a one-click verdict legible and changes no action. launch_bid IS READ, NEVER RECOMPUTED (FACT_ADS_COACH_ACTIONS.launch_bid / launch_bid_source, computed in V_ADS_COACH from LAUNCH_BID_MULT + LAUNCH_BID_CEILING). It is the DESTINATION, not a one-step ceiling: proposed_bid = GREATEST(CEIL(anchor x factor x 100)/100, bid_floor) capped at the anchor, and a bid ABOVE launch_bid is walked down at the band's step per run (above_launch_bid / runs_to_launch_bid / ceiling_step_bid publish the alternative). WHY: reading launch_bid as the TARGET would RAISE the bid on 92 of 105 exempt target rows (bids $0.24-$0.25 vs launch_bids to $1.40); as a FLOOR it would block the trim on those same rows AND on both rows in the 0.5-0.7 band; as a ONE-STEP CEILING it cuts 'best friends personalized gifts girls' from $1.36 to $0.59 (-56.6%) on ONE click of unsettled evidence, which is a loss-cut wearing a trim's name. The walking form honours both of Ori's constraints - the band sets how far, launch_bid sets where to - and reaches $0.65 in 8 runs instead of 1. COALESCE(current_bid, launch_bid) is the base where no bid exists (V_ADS_COACH's own idiom in launch_recommended_bid); dormant today. CEIL to the cent, never ROUND: rounding $0.36 down to $0.32 is an 11.1% cut on a 10% band. Measured: TRIM_10 realised -10.0%..-6.9%, TRIM_5 -4.8%..-4.7%, no trim deeper than its band. FLOORS (the same ones V_OOB_KEYWORD / V_KEYWORD_LIFT use): SP $0.20 house floor, SB video $0.25 (Amazon minBid), SB PRODUCT_COLLECTION/STORE_SPOTLIGHT $0.10, from DIM_AD_GROUP.creative_type. 0 proposals below their floor; smallest proposed bid $0.22. 0 raises (proposed_bid is capped at the anchor). POPULATION: action_type='TARGET' rows whose campaign is in V_LAUNCH_EXEMPTION, campaign_state='ENABLED', keyword_id + current_bid NOT NULL; brand DEFENSE campaigns excluded by rule (V_CAMPAIGN_ROLE LIKE '%DEFENSE%' - none today, so it excludes nothing, but the rule is right the day a launch family gets one); TARGET_PAUSED excluded. GRAIN: V_ADS_COACH is search-term/ASIN grain, so one keyword arrives as several TARGET rows with DIFFERENT launch_bid (105 rows over 74 keywords; 'gift for girls' carries 1.40/1.38/1.00). Deduped to (campaign_id, keyword_id) with ONE ARRAY_AGG(STRUCT(...) ORDER BY priority_score DESC, launch_bid DESC, asin, action_id LIMIT 1) so the bid fields cannot be cross-paired - never two ANY_VALUE()s from one GROUP BY. The coach's own REDUCE_BID/INCREASE_BID is NOT overridden: coach_target_action / coach_recommended_bid / conflicts_with_coach are published beside the ladder's proposal so Ori reconciles them. V_LAUNCH_EXEMPTION was NOT changed in grain or dependencies (only its header and its published `allows` string name the ladder): it is read BY V_ADS_COACH while the ladder reads FACT_ADS_COACH_ACTIONS which V_ADS_COACH materialises, so pulling ladder columns into it would close a stale-data loop around an engine already near BigQuery's planner limit. The ladder reads the exemption, never the reverse. Today: 33 TRIM_10, 2 TRIM_5, 0 HOLD_IMPROVING, 6 HOLD_PROFITABLE, 32 HOLD_NO_EVIDENCE, 0 HOLD_AT_FLOOR = 35 proposals, $1.83 of bid removed; 41 of 73 rows are THIN (the honest cost of a 3-day window at keyword grain). FLOAT BUG FOUND AND FIXED IN VERIFICATION: CEIL(0.40 x 0.90 x 100)/100 in FLOAT64 is 0.37, not 0.36 (the product evaluates to 36.000000000000007), so a '-10%' trim silently became -7.5%; verified live FLOAT64 0.37/0.73 vs NUMERIC 0.36/0.72 on $0.40/$0.80 bids. The rounding step now runs in NUMERIC and is cast back to FLOAT64 (schema unchanged) - the same lesson V_KEYWORD_GUARD recorded. It moved 5 of the 35 live proposals onto their exact band; 0 proposals now cut deeper than their band. Deterministic (2x byte-identical, md5 b7fc40b5cfbfed1e2351d5bd8de472e8 on 73 rows @ 2026-08-13). ADVISORY - nothing is queued, nothing reaches a bulksheet. Weekly Run 'Launch exemption' panel reads it live via cube/schema/LaunchBidLadder.js (15-min TTL). Spec: architecture/LAUNCH_EXEMPTION.md §8"
    source_files: ["scripts/bigquery/views/V_LAUNCH_BID_LADDER.sql"]
    cube_schema: "cube/schema/LaunchBidLadder.js"
    dependencies:
      - V_LAUNCH_EXEMPTION
      - V_PEAK_WINDOW_RULE
      - V_CAMPAIGN_ROLE
      - FACT_ADS_COACH_ACTIONS
      - FACT_AMAZON_ADS
      - DIM_AD_GROUP

  - name: "V_KEYWORD_GUARD"
    description: "v27.48 part 2 (2026-08-09) per-instance guard signals for BOTH engines — one row per (campaign_id, keyword_id), every current ENABLED target incl. autos/PTs, SP+SB (~625 rows). Cause 1: settle_ok/settle_due (no clicks in last D+7 SP / D+14 SB => condemning clicks settled) + channel-aware settled-90d record (settled_winner / corroborated_loser >= 10c < 1.0x / catastrophic < 0.6x) + season_win_prior. Cause 2: SCOPE-grain lifetime record (keyword text account-wide; auto clause pooled per dominant family — keyword_ids do not survive campaign recreations): life_clk / life_roas / life_conv_cpc (order-day CPC) + record_loser (>= 30c < 0.6x), and LY same-28d conv CPC for the ENTRY_BLOCK x0.8 cap. Cause 3: last bid change source (COACH/REUPLOAD = engine, MANUAL = Ori) -> manual_recent7 / manual_hold (7d, catastrophic escape); unlogged Amazon-console writes are a documented coverage hole. Cause 4: LY-pacing raise per the approved 2026-08-09 calibration — pace_flag (settled 90d >= 1.2x on >= 10c [calibration frame wm-96..wm-7], life >= 100c, LY window >= 20c, pace < 0.25, bid < LY conv CPC, bid stable >= 7d, not OOB-owned/capped), pace_watch (0.25-0.40, display only), pace_target_bid = min(band ALL/ALL cpc_max season cell, settled GP-per-click / 1.2, 1.5 x LY conv CPC) floored at bid, $2 cap. v27.52 FIX 1 (Ori approved 2026-08-12) — THE SEASON AMNESTY IS BOUNDED. season_win_prior was COUNTIF(verdict='WIN') over the WHOLE verdict table: any WIN ever recorded for the lowercase keyword TEXT, any season, any year, back to 2024-09 (452 WIN texts; 332 of 606 enabled targets carried one). Because it is the settle veto's escape hatch, it made a keyword permanently un-condemnable on unsettled clicks no matter how much settled money it was losing (measured: 123 structurally un-condemnable settled losers, 68 of them catastrophic — $5,178.60 settled spend -> $1,852.69 GP = 0.358x). Two bounds: (a) NEW COLUMN settle_amnesty = season_win_prior AND NOT catastrophic — a < 0.6x record on >= 10 SETTLED clicks overrides the amnesty entirely (the same escape manual_hold already carries); BOTH ENGINES NOW READ settle_amnesty, never season_win_prior, in the settle veto. (b) season_win_prior itself is OCCURRENCE-SCOPED — the WIN must come from a CLOSED PRIOR occurrence of the SAME context family as today's occurrence and must be mature_at_start, mirroring V_KEYWORD_CONTEXT_GATE's `prior` CTE verbatim (same family match, same closed-prior test, same §4 maturity guard, same OFF exclusion) so the WIN amnesty and the LOSS entry block finally read the SAME memory. §7.6 always specified 'any MATURE-FRAME WIN verdict'; the code never enforced it. Impact 2026-08-12: WIN priors 332 -> 126, un-condemnable 123 -> 22, 101 rows released (68 by the catastrophic override, 33 by occurrence-scoping); 0 rows newly protected. Verified by keyed parity of the old and new view texts at one instant: excluding season_win_prior, 0 rows differ in either direction — no other guard signal moved. NEW DEPENDENCY V_SEASON_CONTEXT. ENGINES READ FACT_KEYWORD_GUARD ONLY (planner-ceiling doctrine). Spec: architecture/SEASON_CONTEXT_LEDGER.md §7.6-7.9. v27.53 (2026-08-12, Ori approved \"do all engine work\") — ITEM 2 CHANNEL-SPLIT SETTLE + DEFERRAL BOUND, ITEM 7 WAKE STEP-DOWN, ITEM 8a/8b/8d. (2) settle_days SP 7 -> 3 (measured fresh-data understatement on the judged window: SP -3% to -6%, SB -17.5%; SB keeps 14) AND the SP veto frame moved from [wm-96, wm-7] to [wm-92, wm-3] so a loss that STARTS inside the last week can corroborate at all (hole 2b: recent-onset losers had settled_clk90 = 0 and were vetoed indefinitely). NEW settle_deferral_expired (hole 2a): settle_ok = \"no clicks in the last settle_days\" can NEVER be satisfied by a keyword that clicks daily (193 of 344 unsettled rows clicked on the anchor date itself), so the veto was permanent, not a deferral; it now expires once the keyword has been clicking for 2 x settle_days (hard bound 6d SP / 28d SB) and the reason string publishes that real date. Effect on the 606-row standing population: unsettled SP 191 -> 146; structurally un-judgeable rows (unsettled, uncorroborated, un-expired) 195 -> 28. (7) wake_open / wake_due / wake_step_bid + wake_date/clk/sp/ord/gp: the $1.00 ACTIVATE on-ramp is deliberate (\"wake it, then price it\") but only the wake half was built — 24 keywords woken since 2026-06-01, 11 repriced (avg 2.7d), 13 never. wake_due fires at 10 clicks since the wake or 7 days, whichever first; wake_step_bid = own GP/click if it earned, else lifetime conv CPC capped $0.60, else $0.25 if the wake bought no clicks; never a raise, floor $0.20. (8a) pace_kw numerator was the INSTANCE clk28_kw over the SCOPE ly_clk28 — keyword_ids do not survive campaign recreations, so pace was understated and all 3 live PACE_RAISE rows were already at 66-226% of LY pace; both sides now scope grain (pace_kw_instance keeps the old form for audit only). PACE_RAISE 3 -> 0. (8b) band-ceiling join spoke the wrong vocabulary (DIM_KEYWORD AUTOMATIC/ASIN/ASIN EXPANDED vs profile AUTO/PRODUCT), so 234 of 606 rows (38.6%) carried no ceiling; translated via kws.band_match with the profile OTHER cell as fallback — no ceiling 234 -> 30. (8d) NEW manual_budget_hold (campaign grain, from BUDGET_CHANGE / GUARDIAN_* / DEFENSE_BUDGET_FLOOR rows, source MANUAL, 7d): the hold only ever read INCREASE_BID/REDUCE_BID, so Ori's manual budget changes got no hold at all (9 MANUAL BUDGET_CHANGE rows, most recent 2026-08-11). Deterministic (4x byte-identical, md5 f3989b44d03500373c4eab8de9b6fab3, 606 rows @ 2026-08-12) — AFTER a v27.53 determinism fix the check itself caught: the LIFETIME and LY conv-CPC / ROAS ratios are now summed in NUMERIC and cast back to FLOAT64 (schema unchanged). FLOAT64 addition is not associative and BigQuery reshuffles between runs, so a SUM over the FULL FACT history moved in its last bits: 'gift for tween girls 11-14' returned life_conv_cpc 0.383 on one pull and 0.382 on the next (one row, one column, a rounding boundary). Pre-existing, not introduced by v27.53, but this column prices bids (the OOB record-priced entry cap and the item-7 wake step-down both read it). Short instance windows stay FLOAT64 — at most 104 days per keyword, never observed to flip."
    source_files: ["scripts/bigquery/views/V_KEYWORD_GUARD.sql"]
    dependencies:
      - DIM_KEYWORD
      - DIM_AD_GROUP
      - V_DIM_CAMPAIGN_CURRENT
