    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_ADS_RESTATEMENT.sql"]

  - name: "SP_SNAPSHOT_SEASON_VERDICT"
    description: "Season-context verdict snapshot (v27.44). MERGEs V_KEYWORD_CONTEXT_LEDGER rows of CLOSED occurrences (occurrence_end <= anchor-7, fully settled) into FACT_KEYWORD_SEASON_VERDICT with verdict INSUFFICIENT (clicks<15) / WIN (net>=0) / LOSS (net<=-5.00 AND GP-ROAS<0.95) / NEUTRAL (>=15c, neither — the v27.44 breakeven dead-band, carries no cross-occurrence memory). Idempotent — re-runs refresh closed rows in place (absorbs late restatement tail); open occurrences never written. Called by SP_ORCHESTRATE_DAILY_REFRESH (Task 20.5d, after SP_SNAPSHOT_ADS_RESTATEMENT). Spec: architecture/SEASON_CONTEXT_LEDGER.md."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_SEASON_VERDICT.sql"]

  - name: "V_ADS_SETTLE_CURVE"
    description: "Per channel and report-date age: what % of the eventual spend/sales was visible at that age. The age where pct_of_final stops moving is the refresh sweet spot. Spend settles before sales (SP 7d / SB 14d attribution). Needs a few days of snapshots to be meaningful."
    source_files: ["scripts/bigquery/views/V_ADS_SETTLE_CURVE.sql"]

  - name: "V_LASTDAY_VETO_PREMISE"
    description: "v27.99 (2026-08-21) - the LAST-DAY VETO's premise under test: does a poor FILLING day predict a poor SETTLED day? One row per (campaign_id, targeting, date) at the engine's own last-day grain (the tsig CTE of V_OOB_KEYWORD, GP-ROAS on the stored FACT_AMAZON_ADS.GROSS_PROFIT over Ads_cost), settled days only. WHY A VIEW AND NOT AN EXPERIMENT: a control group for a ONE-DAY DELAY on a few dozen keyword-days is invisible next to the whole-engine holdout's own MDE and would forgo real value to buy noise; the premise, unlike the effect, is falsifiable on data already held. THE OBSTACLE IS RULED ON, NOT WORKED AROUND: FACT_AMAZON_ADS is restated in place and NOTHING snapshots ads data at keyword grain by load date - FACT_ADS_RESTATEMENT is (report_date, snapshot_at, channel), FACT_KEYWORD_STATE / FACT_KEYWORD_GUARD snapshot only settled 90d aggregates, _fivetran_synced says when a row was restated and never what it said before, and FACT_ENGINE_PROPOSALS quotes the filling reading verbatim but the veto ERASED those rows until v27.98 - so a direct reconstruction of what a keyword-day read at age 1 IS NOT POSSIBLE and this view does not pretend otherwise. THE INSTRUMENT is as-seen reconstruction from the settled row plus the MEASURED accrual in V_ADS_SETTLE_CURVE (read live, no pinned number), the same technique as the 3-vs-7 peak-window study: spend_1d = spend_settled x spend_fill, orders_1d ~ Binomial(orders_settled, sales_fill), roas_1d = settled GP-ROAS x (orders_1d/orders_settled) / spend_fill. Orders exchangeable within the day makes every quantity CLOSED FORM: P(reads exactly 0.00x) = (1-sales_fill)^orders, P(under the raise bar) = BinomCDF(j*-1), P(at/above the cut bar) = 1-BinomCDF(j*cut-1), both CDFs computed inline from log-factorials (no UDF, no simulation, checkable by hand on any row). Each keyword-day contributes its PROBABILITY of tripping an arm, not a 0/1. Publishes both raise arms - p_veto_raise_v75 (as first shipped) and p_veto_raise_v76 (with the expected-orders gate) - plus p_veto_cut and cut_arm_settled_floor / cut_arm_settled_floor_worst_fill, the arithmetic bound cut_bar x spend_fill that is the cut arm's whole safety argument. LIMITS AND THE SIGN OF EACH ARE IN THE VIEW HEADER: account-median fills applied per keyword-day; exchangeable orders and flat GP-per-order both bias IN THE VETO'S FAVOUR; population is every at-volume SP/SB keyword-day, so read every probability as conditional on the engine having proposed a move. Read V_LASTDAY_VETO_PREMISE_READOUT for the answer and V_LASTDAY_VETO_LAG_OBSERVED for the observed check on the exchangeability assumption. Spec: architecture/LASTDAY_VETO_PREMISE.md."
    source_files: ["scripts/bigquery/views/V_LASTDAY_VETO_PREMISE.sql"]

  - name: "V_LASTDAY_VETO_PREMISE_READOUT"
    description: "v27.99 (2026-08-21) - the answer to both arms of the last-day veto, as a DISTRIBUTION rather than a mean. row_kind='SUMMARY' gives one row per (arm, channel): the expected keyword-days the arm touches and the share of that mass that turned out FINE at the veto's own bars once settled; row_kind='BAND' gives the settled GP-ROAS distribution behind each summary. THREE arms are reported, not two, because the raise arm changed shape: RAISE_v2775 (every reading under the raise bar holds), RAISE_v2776 (a 0.00x reading only holds when the keyword's own 90d rate expected at least min_expected_orders on the filling day's clicks) and CUT. RULINGS: the CUT arm is sound and the reason is ARITHMETIC not statistical - a filling reading can only overstate a day through spend that has not landed, so a day reaching the cut bar cannot settle below cut_bar x spend_fill (cut_arm_settled_floor), which sits above breakeven on the measured accrual; the honest caveat is cut_arm_settled_floor_worst_fill, published beside it. The RAISE arm concentrates on genuinely poor days but places a material minority of its holds on days that settled at or above the very bar used to call them poor, AND both of its dials move that error rate the WRONG WAY - a higher click bar and a stricter expected-orders gate each RAISE the share of holds placed on days that turned out fine, because both select for keywords whose sales were most likely still in flight. Every number is a query, never a pinned prose figure; the sensitivity queries live in the spec. Spec: architecture/LASTDAY_VETO_PREMISE.md."
    source_files: ["scripts/bigquery/views/V_LASTDAY_VETO_PREMISE_READOUT.sql"]

  - name: "V_LASTDAY_VETO_LAG_OBSERVED"
    description: "v27.99 (2026-08-21) - the one OBSERVED (not modelled) reading of attribution lag at keyword grain, and the check on the single assumption V_LASTDAY_VETO_PREMISE cannot check itself. SRC_ACC_AmazonAds_purchased_product is the only table in the warehouse carrying a keyword-day's conversions SPLIT BY ATTRIBUTION WINDOW (1/7/14/30 days), so it answers 'is lag a property of the KEYWORD?' - if some search terms bought same-session and others slept on it, the raise arm would be wrong on an identifiable subset and the repair would be an EXEMPTION rather than a retirement. Measured answer: per-keyword one-day shares are dispersed only modestly more than binomial sampling alone, so there is no slow subset to exempt. FOUR LIMITS, ALL LOAD-BEARING AND ALL IN THE VIEW HEADER: (1) the 1-day bucket is ATTRIBUTION lag, not age-1 VISIBILITY - it omits reporting lag, which no keyword-grain table sees, and it is the more OPTIMISTIC of the two, so findings drawn from it stay conservative in the veto's favour; (2) the feed does NOT reconcile to FACT_AMAZON_ADS - matched keyword-days carry fewer orders and dollars here and some settled sales-days have no row at all, so fact_orders/fact_sales and orders_final/rev_final are BOTH published per row and capture_ratio lets a reader restrict to well-captured rows rather than trust an assertion; (3) SP ONLY, because brand keyword ids in this feed do not join the ads keyword-days - the channel with the LONGER attribution window is not observed here; (4) survivorship - a row exists only where a purchase eventually happened. reads_zero_at_1d on a row with orders_final > 0 is the exact shape the raise arm cannot tell apart from a keyword that simply did not sell. Grain: one row per (campaign_id, keyword_id, date), settled days only. Spec: architecture/LASTDAY_VETO_PREMISE.md."
    source_files: ["scripts/bigquery/views/V_LASTDAY_VETO_LAG_OBSERVED.sql"]

  - name: "SP_SNAPSHOT_PARK_REVERDICT"
    description: "Park-reverdict snapshot (v27.48): CREATE OR REPLACE TABLE FACT_PARK_REVERDICT AS SELECT * FROM V_PARK_REVERDICT. Called by SP_ORCHESTRATE_DAILY_REFRESH Task 20.5e, AFTER SP_SNAPSHOT_SEASON_VERDICT (20.5d) — the reverdict reads season verdicts (the 0.8x season-WIN relaxation) and the context gate. Idempotent. Spec: architecture/SEASON_CONTEXT_LEDGER.md §7."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_PARK_REVERDICT.sql"]

  - name: "SP_SNAPSHOT_FAMILY_BAR"
    description: "v27.84 (two-book P&L, 2026-08-19, Task 5) - materializes V_FAMILY_BAR into T_FAMILY_BAR, exploding the family bars out to CAMPAIGN grain via V_CAMPAIGN_FAMILY_MAP. Exists because the bid engines V_KEYWORD_LIFT and V_OOB_KEYWORD are each AT BigQuery's planning ceiling and must LEFT JOIN a table, never inline the view - the same repair pattern that fixed V_PANEL_OWNERSHIP on 2026-08-17 (fact_oi_cube_table_planner_blowup). STILL NOT WIRED TO A BID: the table is built so the engines CAN join it, Task 8 of the two-book plan is that join, Task 8 is unbuilt and on hold, and NO BID ENGINE READS T_FAMILY_BAR today. It does now have a consumer, and the distinction matters - V_CAMPAIGN_MONEY_PLACEMENT (2026-08-21) joins the bars to REPORT where the advertising money sits, which changes no bid. Re-verify both halves with the INFORMATION_SCHEMA query published in the procedure's own file header rather than trusting this sentence, which is the kind that goes stale silently; it should return this procedure, SP_ORCHESTRATE_DAILY_REFRESH and that one view, and nothing else. The engine half of this clause flips to the present tense as part of the Task 8 commit. Campaign grain rather than family grain because neither engine publishes a family column, only campaign_id, so resolving family inside them would mean joining the map inside a ceiling view. The map's literal 'Unknown' bucket gets no row and therefore no bar, by design: the engines' COALESCE(keyword_bar, 1.0) leaves those campaigns at exactly today's behaviour. Fully derived and idempotent (CREATE OR REPLACE TABLE). Orchestrator task 20.5g-1, before Task 20.5g SP_SNAPSHOT_PANEL_OWNERSHIP and before the Task 21 engine T_ builds. Spec: docs/superpowers/specs/2026-08-19-two-book-pnl-design.md 4."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_FAMILY_BAR.sql"]

  - name: "SP_SNAPSHOT_PANEL_OWNERSHIP"
    description: "Panel-ownership snapshot (v27.78, 2026-08-17; was v27.77 / v27.62). THREE BASES FOR A LOW-STOCK CLAIM as of v27.78 (arm A structural: family risk_state='CRITICAL'; arm B instructed: a campaign-row suggested budget, OR >=1 proposal target, OR — new — the family is in REDIRECT MODE, i.e. low stock is re-aiming ad doorways at an in-stock sibling instead of braking). NO LOGIC CHANGE IN THIS PROCEDURE for it — the claim still lives entirely in V_PANEL_OWNERSHIP; what makes it work here is the step order, because step 1 must rebuild the slice from the new V_LOW_STOCK_ADS (whose CAMPAIGN branch now publishes the real redirect_mode instead of NULL) before step 2 reads that column out of it. TWO STEPS, AND THE ORDER IS THE CONTRACT: (1) CREATE OR REPLACE TABLE T_LOW_STOCK_CAMPAIGN AS SELECT * FROM V_LOW_STOCK_ADS WHERE row_kind='CAMPAIGN' AND campaign_id IS NOT NULL — a pure pass-through slice, 14 rows @ 2026-08-17; then (2) CREATE OR REPLACE TABLE FACT_PANEL_OWNERSHIP AS SELECT * FROM V_PANEL_OWNERSHIP, whose ls_camp CTE reads that table. WHY STEP 1: V_PANEL_OWNERSHIP used to INLINE V_LOW_STOCK_ADS, which was enlarged twice on 2026-08-17 (v27.73 redirect mode; v27.74 complete-day windows) and pushed the combined plan past BigQuery's ceiling — the 16:24 run failed with 'Not enough resources for query planning - too many subqueries or query is too complex' and SELECT COUNT(*) on the view then failed deterministically, which would have failed the 07:50 UTC orchestrator pass and left ownership stale (consumers LEFT JOIN the table, so a stale row reads as 'no claim' and the single-home ladder, DEFER_* routing and panel membership quietly break). House pattern for planner blowups: never inline a ceiling view, read a T_ materialized earlier in the same SP. The T_ is a MATERIALIZATION, NEVER A TRANSFORMATION — zero logic moved out of the view. Step 1 must run first every time (the T_ is this procedure's scratch, not durable state; a stale step 1 would re-publish yesterday's stock verdicts). Must still run AFTER the FACT_INVENTORY_SNAPSHOT and ads FACT loads (V_LOW_STOCK_ADS reads both) and BEFORE the engine T_ builds in SP_REFRESH_CUBE_TABLES, so the engines compile against the ownership of the run they are part of. Idempotent, fully derived. Verified 2026-08-17: SP runs end-to-end; FACT_PANEL_OWNERSHIP 95 -> 93 rows (the 2 dropped are ME-SP/PT (Competitors, Mint, B1) and STORE-SPOTLIGHT (tween-girl-gift), both PAUSED during the day, i.e. out of the ENABLED population), ZERO owner flips, zero claim_rank / defer_* moves; only ls_suggested moved (6 rows, the expected v27.73/v27.74 + intraday-restatement drift). Spec: architecture/PANEL_OWNERSHIP.md."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_PANEL_OWNERSHIP.sql"]

  - name: "SP_SNAPSHOT_KEYWORD_GUARD"
    description: "Keyword-guard snapshot (v27.48 part 2): CREATE OR REPLACE TABLE FACT_KEYWORD_GUARD AS SELECT * FROM V_KEYWORD_GUARD. Called by SP_ORCHESTRATE_DAILY_REFRESH Task 20.5f, AFTER SP_SNAPSHOT_PARK_REVERDICT (20.5e) — both settle-doctrine snapshots share the daily frame. Idempotent. Spec: architecture/SEASON_CONTEXT_LEDGER.md §7.6-7.9."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_KEYWORD_GUARD.sql"]

  - name: "FACT_ENGINE_PROPOSALS"
    description: "The engine's memory of its own OPINIONS (2026-08-15, Ori: daily 'what was planned / what actually happened / action items'). One row per (snapshot_date, engine, instruction): every live bid/budget/revive instruction from V_KEYWORD_LIFT, V_OOB_KEYWORD, V_OOB_BUDGET_PHASE, V_LOW_STOCK_ADS, V_LAUNCH_BID_LADDER and V_PARK_REVERDICT, applied or not. HOLD/WATCH/DEFER rows excluded (a memory full of 'do nothing' buries the signal); NEGATE proposals are a known gap. The change log records what was APPLIED — without this table, 'did the engine call it right?' is only answerable for uploaded suggestions, and manual-divergence ('Ori did X where the engine said Y') not at all. Partitioned by snapshot_date. Written by SP_SNAPSHOT_ENGINE_PROPOSALS (delete-today-then-insert). Read by V_DAILY_BRIEF; later V_MANUAL_DIVERGENCE (engine-finalization plan Task 3.1). Spec: architecture/DAILY_BRIEF.md. ### v27.98 (Ori 2026-08-21) THE LAST-DAY VETO IS RECORDED, NOT ERASED. Three additive columns: held_action (the action the engine intended before the veto), held_bid (the bid it intended) and hold_source (LAST_DAY_VETO_RAISE | LAST_DAY_VETO_CUT), all NULL on every other row. THE DEFECT THEY CLOSE: the veto rewrites action to HOLD and NULLs suggested_bid, and the snapshot admits a bid row on action NOT IN (HOLD, ...) AND suggested_bid IS NOT NULL, so a vetoed row failed BOTH conjuncts and vanished with its reason - the ONE suppression in the engine that ERASED rather than LABELLED, against the doctrine SP_ENGINE_PREFLIGHT states for the holdout arm (the proposal is still recorded, only the verdict says EXCLUDE; block the export, never the judgement). A held row now carries verdict=EXCLUDE and the veto's own sentence as verdict_reason, written by the snapshot itself. held_bid is deliberately NOT suggested_bid: a value in suggested_bid is an instruction to Amazon, and a held row must be unable to become one by any path - action stays HOLD and suggested_bid stays NULL, so no existing reader of those columns moves. hold_source is the is_holdout idea one column over: it tells a veto hold apart from a collision / claim / holdout exclusion, AND names the ARM, which matters because the two arms are not equally strong (a filling day at/above the cut bar can only rise as attribution accrues; a 0.00x filling day is ambiguous). CONSUMER CONTRACT: SP_ENGINE_PREFLIGHT skips hold_source rows outright, so they never reach T_ENGINE_PREFLIGHT, the EnginePreflight cube, the decisions feed or DoPage.exportBulksheet; V_DAILY_BRIEF skips them in PLANNED and in the planned/unplanned join; V_HOLDOUT_READOUT deliberately DOES read them via COALESCE(held_bid, suggested_bid) - without that a held RAISE would be counted as a BID_DOWN and the trial would split on the opposite of what the engine wanted. The standing-block question (same keyword held on consecutive snapshots, and the longest run) is answered by scripts/bigquery/queries/REPEAT_VETO_RUNS.sql, which labelling turns from an experiment into a query. Spec: architecture/DAILY_BRIEF.md."
    source_files: ["scripts/bigquery/tables/FACT_ENGINE_PROPOSALS.sql"]

  - name: "SP_SNAPSHOT_ENGINE_PROPOSALS"
    description: "Daily engine-proposal snapshot (2026-08-15): deletes today's FACT_ENGINE_PROPOSALS partition and re-inserts every live instruction, one single-view scan per INSERT (planner-ceiling doctrine — never two engine views in one statement). Called by SP_ORCHESTRATE_DAILY_REFRESH Task 20.6, AFTER SP_SNAPSHOT_PANEL_OWNERSHIP (deferrals read it) and the coach refresh (launch ladder reads the coach), BEFORE SP_REFRESH_CUBE_TABLES — so the snapshot records the same opinions the day's panels show. First snapshot 2026-08-15: 212 proposals (165 bids, 22 budgets, 25 revivals). v27.98 (2026-08-21): INSERTs 1 (LIFT) and 3 (OOB) also admit rows carrying hold_source - the last-day veto's held proposals, which used to vanish because the veto breaks both conjuncts of the bid filter - IN THE SAME SCAN (a separate INSERT would re-read a planning-ceiling view for nothing). They are written with action=HOLD and suggested_bid=NULL untouched, held_action/held_bid additively, and verdict=EXCLUDE with the veto's own sentence as verdict_reason. The verdict is stamped HERE rather than by the gate because a held row is not an instruction to judge: it carries no value, and admitting it to the single-owner contention would let a held row outrank and silence an engine that was ready to act. Spec: architecture/DAILY_BRIEF.md."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_ENGINE_PROPOSALS.sql"]
    dependencies:
      - FACT_ENGINE_PROPOSALS

  - name: "V_RUN_SUMMARY"
    description: "The Weekly Run front page as one small-table query (Phase 6 Task 2, 2026-08-16). Three sections, one row per cell: CHANGES (today's GO instructions by direction; $/day on BUDGET moves ONLY — bid-level $/day would be invented precision), HELD (the gate's exclusions/flags by class — REVIEW labels stripped of per-row numbers so they group), UNCHANGED (the rest of the account from FACT_KEYWORD_STATE — the state machine IS the unchanged taxonomy, superseding the plan's interim guard CASE; v27.103 labels the bar/SE states AT_BAR / REPRICE / LOSER / LAUNCH_CONTAINED so nothing falls through to a blank). Reads only snapshot tables; measured ~4s. Read by the RunSummary cube → RunSummaryStrip. Spec: architecture/WEEKLY_RUN_UX.md. v27.104 (2026-08-22): UNCHANGED label CASE gains FLOOR_PROBATION ('on probation at their floor — re-judged once clicks settle there'); LOSER relabelled 'failed at their floor after probation — kill candidates (reprice book)'. v27.123 (2026-08-23, family seat register Task 4): a fourth section SEATS — one row per WORKING family, its 80/20 doctrine status in plain words as the label, the number of numbered seats its 20% side holds as n, and the register's own open capacity as $/day (negative when the side is over its allowance), with a detail sentence naming the seats, leaks and untracked keywords and the keyword snapshot it was measured from. It reads T_FAMILY_SEAT_REGISTER — the same image the SEATS section of V_DAILY_BRIEF and the SeatRegister cube read, so the three surfaces cannot disagree — and judges nothing itself: the register publishes a launch family as a REFERENCE row rather than a FAMILY row, so filtering on row_type is what keeps the rule that a launch family is never judged on profit, with no name list to maintain. Both label CASEs in the view now end in a sentence rather than a value: the UNCHANGED arm's ELSE returned LOWER(state), which is NULL for a row written with no state and would publish an empty cell on the front page. Acceptance: scripts/bigquery/tests/SEAT_SURFACE_acceptance.sql (C05 re-derives the seat count and the capacity from the register's own rows; C06 asserts no label in any section is blank) and scripts/bigquery/tests/check_seat_surface_labels.py (the doctrine label CASE names every status the register's own CASE can emit). v27.124 (2026-08-23): the SEATS detail sets the WHOLE 20% side against the allowance — like with like, to the cent (C12) — before naming the seats, leaks and untracked as its parts; the earlier wording set the seats' cost alone against the whole allowance and read as a pass while the side was over. The label CASE also names the bare UNMAPPED literal."
    source_files: ["scripts/bigquery/views/V_RUN_SUMMARY.sql"]
    dependencies:
      - T_ENGINE_PREFLIGHT
      - FACT_KEYWORD_STATE

  - name: "V_RUN_UNCHANGED"
    description: "Row-grain drill behind V_RUN_SUMMARY's UNCHANGED strip (Phase 6 Task 7): one row per keyword with NO instruction today — state-machine class (labels shared with the summary, no-drift; v27.103 adds the bar/SE states), settled record, next appointment, and the state machine's own reason sentence as why_short. record_class recolors BAR-RELATIVE in v27.103: GOOD clears the keyword's own family_bar, MID keeps the 0.6 catastrophic RATIO relative to the bar. Read by the RunUnchanged cube → the strip's class drill. Spec: architecture/WEEKLY_RUN_UX.md. v27.104 (2026-08-22): class CASE gains FLOOR_PROBATION; LOSER relabelled (probation at the floor elapsed). No ELSE fallthrough for any live state (verified at ship)."
    source_files: ["scripts/bigquery/views/V_RUN_UNCHANGED.sql"]
    dependencies:
      - T_ENGINE_PREFLIGHT
      - FACT_KEYWORD_STATE

  - name: "V_MANUAL_DIVERGENCE"
    description: "The hand-vs-model ledger (Task 3.1, 2026-08-16). Every source='MANUAL' change classified against FACT_ENGINE_PROPOSALS for its applied day (AGREED ±5% / OVERRODE / ENGINE_SILENT / LEVER_NOT_SNAPSHOTTED; era PRE_SNAPSHOT before 2026-08-15 → UNKNOWN) and graded by V_CHANGE_SCORECARD at the honest lag: MANUAL_BETTER (hand beat the model — a rule should change) / ENGINE_BETTER / TIE / PENDING, with the doctrine question authored per row. Closing rule: every MANUAL_BETTER ends as a threshold change or a documented disagreement (V_ENGINE_HEALTH counts the open ones). Task 1.8 (remove MANUAL_HOLD) unblocks after this runs ≥2 weeks. First census: 89 manual changes, 24 graded (5C/2N/9R/8I). Spec: architecture/MANUAL_DIVERGENCE.md."
    source_files: ["scripts/bigquery/views/V_MANUAL_DIVERGENCE.sql"]
    dependencies:
      - FACT_ENGINE_PROPOSALS
      - V_CHANGE_SCORECARD

  - name: "V_THRESHOLD_TUNER"
    description: "Scorecard verdicts → threshold proposals (Task 3.2, 2026-08-16). ADVISORY ONLY: cells of ≥20 graded changes per (action_group × step bucket) with confirm/reversed rates and a published era_split (the two-era promotion bar, checkable at a glance); reversed>40% → propose gentler step; raise confirm>70% → propose wider gate; plus the seeded park-calibration suggestion (+$2,020, measured 2026-08-12, re-run ~Sep 01). write_target maps to a DE_COACH_THRESHOLDS key where one exists — the live keys are coach-grain so ladder-grain rows read ADVISORY_ONLY, stated never silent. First run: 6 proposals; headline finding: BID_UP reverses 42–57% at EVERY step size — the step was never the variable. Signal-discovery half pending panel history (~Aug 29); first question queued: family context on raises. Spec: architecture/THRESHOLD_TUNER.md."
    source_files: ["scripts/bigquery/views/V_THRESHOLD_TUNER.sql"]
    dependencies:
      - V_CHANGE_SCORECARD

  - name: "SP_WRITE_THRESHOLD_SUGGESTIONS"
    description: "The tuner's write half (Task 3.2): copies V_THRESHOLD_TUNER rows whose write_target names a real threshold_key into DE_COACH_THRESHOLDS' suggestion channel (suggested_at DATETIME LA / suggestion_reason). Engines read threshold_value only — Ori promotes by hand. Run BY HAND at the weekly review, never scheduled. Currently a deliberate no-op (all proposals ADVISORY_ONLY). Spec: architecture/THRESHOLD_TUNER.md."
    source_files: ["scripts/bigquery/procedures/SP_WRITE_THRESHOLD_SUGGESTIONS.sql"]
    dependencies:
      - V_THRESHOLD_TUNER

  - name: "V_ENGINE_HEALTH"
    description: "The standing self-check (Task 3.3, 2026-08-16): one row per check — GREEN/AMBER/RED with measurement AND threshold printed together. Eleven checks: contradiction_rate, ownership_overlaps, the two V_KEYWORD_STATE invariants, overdue_appointments, scorecard_reversed_share (the one ceiling-view arm), manual_better_unresolved, snapshot_freshness, noop_leakage, view_body_headroom (v27.101), plan_price_ambiguity (v27.102). plan_price_ambiguity is deliberately NOT a restatement of ownership_overlaps: that one reads T_ENGINE_PREFLIGHT and counts non-EXCLUDE ROWS, asking whether the gate resolved the contention; this one reads FACT_ENGINE_PROPOSALS - the table every consumer downstream actually reads - and counts distinct exportable PRICES per (campaign, key, lever). The gate can resolve a contention perfectly and the verdict can still fail to reach a reader, which is exactly what happened: V_DAILY_BRIEF printed three prices for one keyword out of a table the gate had already resolved, and ownership_overlaps was GREEN the whole time. COUNT(DISTINCT) ignores NULL, so negates cannot trip it. Pre-deploy twin: scripts/bigquery/check_one_price_per_key.py, which additionally asks the same question of V_DAILY_BRIEF's PLANNED section (that surface cannot be read from here - it embeds a planning-ceiling view). First board: RED contradiction 31.8% (the gate works; the engines structurally overlap — future refinement is to stop GENERATING the overlap), AMBER overdue 78 + reversed-share 41.1, six GREEN. Surfaces on the Weekly Run summary strip (Phase 6). Spec: architecture/ENGINE_HEALTH.md. v27.104 (2026-08-22): + c12 loser_kill_clause (LOSERs not probation_elapsed AND at_floor AND below bar · red > 0) and c13 state_floor_resolution (priced states with a NULL bid_floor · red > 0; *_NO_ADGROUP fallbacks counted in detail) — KEYWORD_STATE.md invariants 3 and 4. v27.127 (2026-08-23, family seat register Task 5): nine seat_* checks — seat_reconciliation_gap (categories = the family's spend on every horizon, seats + leaks + gaps = the bad side today, within the acceptance suite's own $0.01), seat_ledger_idempotence (the ledger invariants a second admission or a re-insert on one snapshot would break; the proof proper is two runs with one fingerprint), seat_every_occupant_numbered (red for an unnumbered or twice-held number on the image, amber for image-vs-ledger disagreement — the transient between orchestrator step 20.8b and cube step 0c), seat_no_launch_seat, seat_holdout_row_on_sheet (a seat book row naming a HOLDOUT-arm campaign built on or after its eligible_from, at any upload status), seat_raise_at_or_below_live_bid (R-f), seat_past_due_in_future_tense (R-i), and two REPORTS (INFO): seat_overdue_vs_snapshot (appointments the ladder owes, measured on the snapshot date; cause = the park-era settle_due, diagnosed, a ruling for Ori) and seat_step_days_since_pass (New York clock; LOG_PIPELINE_RUNS.started_at is UTC and is converted). They read the register's pass IMAGE T_FAMILY_SEAT_REGISTER — what the morning surfaces read — never the live view and never a ceiling view. Spec: architecture/FAMILY_SEAT_REGISTER.md 'Health'."
    source_files: ["scripts/bigquery/views/V_ENGINE_HEALTH.sql"]
    dependencies:
      - T_ENGINE_PREFLIGHT
      - FACT_KEYWORD_STATE
      - V_MANUAL_DIVERGENCE
      - T_FAMILY_SEAT_REGISTER
      - DE_FAMILY_SEAT_LEDGER
      - DE_HOLDOUT_ASSIGNMENT
      - FACT_PPC_CHANGE_LOG
      - V_BOOK_ASSIGNMENT
      - LOG_PIPELINE_RUNS

  - name: "V_TERM_FAMILY_EVIDENCE"
    description: "Sibling evidence per search term (Task 2.4, v27.68, 2026-08-16 — Ori: 'check the general performance of the product keyword in other campaign'). One row per (family, LOWER(term), campaign) CONTRIBUTION from FACT_KEYWORD_GUARD + FACT_PANEL_OWNERSHIP (snapshot tables only, ≤1d stale, planner-safe) with the family rollup as window columns — deliberately NOT pre-aggregated so any consumer can exclude its own campaign and pick its best sibling. Feeds V_PARK_REVERDICT's v27.68 SIBLING_REVIVE / REDUNDANT arms (inlined there as sib_pool/sib_best with the same shape). PROMOTE_TO_EXACT's inference in the other direction. Spec: architecture/SEASON_CONTEXT_LEDGER.md §7.12."
    source_files: ["scripts/bigquery/views/V_TERM_FAMILY_EVIDENCE.sql"]
    dependencies:
      - FACT_KEYWORD_GUARD
      - FACT_PANEL_OWNERSHIP

  - name: "SP_SNAPSHOT_KEYWORD_STATE"
    description: "The keyword state machine, bar/SE ladder with per-channel floors (Task 2.1 2026-08-16; v27.103 + v27.104 + v27.105 2026-08-22): CREATE OR REPLACE TABLE FACT_KEYWORD_STATE — one row per (campaign, keyword) with state (DEAD | PENDING_SETTLE | REVIVED_SETTLING | PARKED | PACED_WINNER | WINNER | AT_BAR | REPRICE | FLOOR_PROBATION | LOSER | LAUNCH_CONTAINED | TRIAL, first-match ladder). v27.104 = Ori's floor ruling ('bid-up-to-floor if after a few days still loosing kill it' / 'i think it is not 0.25'): the flat $0.25 platform_floor is GONE — each keyword's floor is its channel's and creative's (DIM_KEYWORD -> V_BID_FLOOR -> FN_BID_FLOOR: SP $0.20, SB collection $0.10, SB video/unknown $0.25); affordability is tested in BID space (affordable CPC / V_BID_CPC_TRANSFER.m_effective); FLOOR_PROBATION = below bar beyond noise AND (bid at its floor OR no affordable bid at/above it) -> bid to the floor, re-judged when >= 10 settled clicks exist at the floor (probation_due_date = clock start + settle_days_eff + CEIL(10/own 90d click pace), derived never round; floor_since carried forward from this table's OWN prior row via a temp table, seeded on entry; v27.105: the probation CLOCK starts only when a floor bid has LANDED — the live bid must be observed at the floor (a logged row is a claim until the mirror confirms it; a never-uploaded book never starts a clock), and the start date is the earliest V_PPC_CHANGE_LOG_APPLIED row at/below the floor after the last applied row above it and on/after floor_since (mirror lag delays, never shifts), else the last bid change; otherwise NULL with state_reason WAITING FOR THE FLOOR BID TO LAND and the 7d re-read as the appointment; the v27.104 clock = later of floor_since and last bid change stamped running clocks on never-uploaded floor bids); LOSER ONLY after an elapsed probation at the floor (an above-bar keyword is never a kill; the v27.103 CPC-materiality and unexecutable-AT_BAR kill arms are REPEALED); the clean-then-judge guard now covers every verdict that can move a bid DOWN (guard_scope DETERIORATION relabels from the clean ladder; AT_BAR_PRICE keeps the label and defers the price the book may act on); A9 appointments: AT_BAR = earlier of its N_f collapse forecast and 7d, REPRICE = last applied + 14d when ahead else 7d, FLOOR_PROBATION = its due date, NULL only on DEAD. Gate: SIM_2026-08-22_ladder_floor_probation.sql (TMP_SIM_LADDER_FLOOR) reproduced 855/855 exact at ship. Earlier (v27.103): a keyword is judged against its FAMILY bar (T_FAMILY_BAR) inside an SE noise band se=roas90/SQRT(ord90) that COLLAPSES at per-family N_f=CEIL((bar/(1-bar))^2) orders computed at run time; winner demotion to AT_BAR (labels only — no engine acts on this table, the only executor is the manual reprice book); the A2 click-space sufficiency check; A7 DEAD re-derived every run; A8 bar_exempt launches read LAUNCH_CONTAINED never a profit label. v27.103 = Ori's four rulings + the clean-then-judge guard, gated on the A1 clean-rerun simulation (TMP_SIM_LADDER_CLEAN; 854/855 key-level agreement at ship): a keyword is judged against its FAMILY bar (T_FAMILY_BAR) inside an SE noise band se=roas90/SQRT(ord90) that COLLAPSES at per-family N_f=CEIL((bar/(1-bar))^2) orders computed at run time; winner demotion to AT_BAR (labels only — no engine acts on this table, the only executor is the manual reprice book); the A2 click-space sufficiency check (ord_bar shortfall beyond SQRT may not hide in the band); the ruling-4 at-floor kill (LOSER = below bar beyond noise AND failed AT its price — the old zero-below-floor-LOSERs assertion is REPEALED, the SOP asserts the kill clause instead); A7 DEAD re-derived every run; A8 bar_exempt launches read LAUNCH_CONTAINED never a profit label; and the CLEAN-THEN-JUDGE guard — REPRICE/LOSER verdicts on a mix drifted beyond the account's run-time-measured never-seen background are re-read excluding zero-order never-seen terms (the negate valve's population, ns_zero_ord_*) and only the cleaned reading may downgrade. Reads FACT_AMAZON_ADS at term grain for the guard (~14s measured at v27.104). Orchestrator Task 20.8, after the preflight and SP_SNAPSHOT_FAMILY_BAR. Spec: architecture/KEYWORD_STATE.md."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_KEYWORD_STATE.sql"]
    dependencies:
      - DIM_KEYWORD
      - V_BID_FLOOR
      - V_BID_CPC_TRANSFER
      - FACT_KEYWORD_GUARD
      - FACT_PARK_REVERDICT
      - FACT_PANEL_OWNERSHIP
      - T_ENGINE_PREFLIGHT
      - T_FAMILY_BAR
      - FACT_AMAZON_ADS

  - name: "FACT_KEYWORD_STATE"
    description: "The roadmap of each keyword — the state-machine snapshot written daily by SP_SNAPSHOT_KEYWORD_STATE (orchestrator 20.8). v27.103 adds the bar/SE machinery (family_bar, bar_exempt, nf_orders, se_eff, affordable_cpc, ord_bar_expected, click_collapse) and the clean-then-judge guard columns (guard_*, clean_*, ns_zero_ord_*); v27.104 adds the floor and bid-space price (ad_group_id, creative_type, bid_floor, bid_floor_source, m_effective, is_brand_defense, affordable_bid, clean_affordable_bid, at_floor), the guard's scope (guard_scope, raw_state, clean_state), the probation record (settle_days_eff, floor_since, probation_clock_start, probation_clk_settled, probation_elapsed, probation_due_date, probation_bid) and nf_collapse_forecast_date / prior_state; state_reason is one plain sentence per state. Read via V_KEYWORD_STATE; the Weekly Run UNCHANGED taxonomy, V_ENGINE_HEALTH invariants and tools/build_reprice_bulksheet.py (the manual book — the ONLY executor of the new states) read it. Spec: architecture/KEYWORD_STATE.md."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_KEYWORD_STATE.sql"]

  - name: "V_KEYWORD_STATE"
    description: "Thin read surface over FACT_KEYWORD_STATE — no logic, stable name for cubes/panels/audits. SELECT * freezes schema: redeployed v27.103 for the bar/SE ladder columns and v27.104 for the floor / probation / guard-scope columns (65 columns). Spec: architecture/KEYWORD_STATE.md."
    source_files: ["scripts/bigquery/views/V_KEYWORD_STATE.sql"]
    dependencies:
      - FACT_KEYWORD_STATE
  - name: "FACT_KEYWORD_STATE_HISTORY"
    description: "The Catalog's memory — the append-only history of FACT_KEYWORD_STATE (THREE_LAYERS.md §8 violation 6, closed 2026-08-24). The snapshot table is CREATE OR REPLACE'd on every orchestrator pass and holds exactly one day, so before this table existed no caller could ask the ladder what it said on any day but today, no 'how long has this been stuck' question was answerable anywhere (§10.4 names dwell time as the single highest-value thing to fix first, because its absence obstructs the measurement of every other violation), and §6's Catalog scorecard — 'was the valuation right?', its own predictions against outcomes — was impossible to compute (§6.2: a layer cannot be graded on predictions it does not keep). One row per (snapshot_date, campaign_id, keyword_id) holding the WHOLE snapshot row, not a narrow (date, subject, state) triple: a prediction is the verdict TOGETHER WITH the evidence that justified it — the settled record it was read off, the family bar, the noise band, the affordable price and the floor that made a move executable, the mix-drift guard's cleaned re-reading, and the appointment the ladder promised — and a verdict stripped of its evidence can be counted but never graded. Provenance on every row: captured_at (when the row was written here, not when the Catalog computed it), source ORCHESTRATOR | BACKFILL_TIME_TRAVEL, and source_detail naming exactly what was read. Partitioned by snapshot_date, clustered by keyword_id first because 'what did you say about THIS SUBJECT on that date' is the question §1.4 demands a caller be able to ask. Written by SP_APPEND_KEYWORD_STATE_HISTORY (orchestrator Task 20.8a), which appends the whole snapshot and then prunes any snapshot_date carrying more than one captured_at down to its newest stamp — so two passes on one snapshot_date leave exactly one copy, and a crash between the two statements can only leave a duplicate rather than a lost day, repairable by any later call on any date. A pass may not restamp a BUILD the history already holds: the writer compares the snapshot table's own last-modified clock against the stamp the history carries for that date, so a pass where Task 20.8 failed — leaving the previous build standing — cannot move that partition's provenance. That test is on the build and not on the calendar (v27.145), which is what makes it hold for repeat passes INSIDE one LA day; several passes share one LA date every night, so the first, date-only shape of the guard was blind in the normal case rather than an exotic one. THREE CLOCKS PER ROW: snapshot_date is the day being spoken about, captured_at is when the row was written here, and snapshot_built_at is the build it was copied from (NULL before v27.145 — those rows did not record it, and a backfilled value would be a fabrication). NOTE FOR ANYONE CHANGING THIS TABLE: its DDL is CREATE TABLE IF NOT EXISTS, so editing the file updates neither the live columns nor the live description; both must ship as an explicit ALTER in scripts/bigquery/migrations/ and be mirrored in the file. SCHEMA-EVOLVING BY CONSTRUCTION: the writer reads the live column list from INFORMATION_SCHEMA and ADD COLUMN IF NOT EXISTS-es whatever the history lacks, so the columns §2.7 (confidence), §2.8 (market volume) and §4 (seasonality) will add are carried the night they appear, with earlier partitions honestly NULL rather than backfilled, and a column dropped upstream is never dropped here. Seeded 2026-08-24 by scripts/bigquery/migrations/2026-08-24_keyword_state_history_backfill.sql, which recovered real earlier snapshots — each with its true snapshot_date and two different column eras — from BigQuery's own seven-day table history; nothing was invented and no earlier copy of the snapshot exists anywhere else in the warehouse. NO ENGINE, GENERATOR, BOOK OR BULKSHEET READS THIS TABLE: it records what was already recorded and can move no bid, budget or pause. Read by V_CATALOG_DWELL. Acceptance: scripts/bigquery/tests/KEYWORD_STATE_HISTORY_acceptance.sql. Spec: architecture/THREE_LAYERS.md §1.4/§6/§6.2/§8/§10.4. SOP: architecture/KEYWORD_STATE.md."
    source_files: ["scripts/bigquery/tables/FACT/FACT_KEYWORD_STATE_HISTORY.sql", "scripts/bigquery/migrations/2026-08-24_keyword_state_history_backfill.sql", "scripts/bigquery/migrations/2026-08-25_keyword_state_history_build_clock.sql"]
    dependencies:
      - FACT_KEYWORD_STATE
  - name: "V_SEAT_REQUEST_OUTCOME"
    description: "§6.0's CLOSING HALF — the Brain grades the other two layers against its own record (plan step 6, violation 29). Ori 2026-08-25: 'report if the catalog and pacing performed like expected... by doing so we can examine what need to get better.' ONE ROW PER PROMISE — (plan, campaign, keyword, clicks_due_date) — and NOT per nightly ask: the plan re-asks every night until the verdict date, and the promise is the thing that gets kept or broken. The LAST ask stands, because an earlier different number was amended rather than broken; times_asked and ask_changed are published because an ask that keeps moving is itself a finding a collapsing view would hide. THREE GRADES, EACH REFUSING TO ANSWER EARLY. pacing_grade asks DID THE CLICKS ARRIVE, not did the bid move — a bid that moved perfectly and bought 3 of 40 requested clicks has failed. catalog_grade asks whether the return it CLAIMED held, and stays PENDING_SETTLE until the settle window has passed (SP 7 days, SB 14) because judging an unsettled window marks the Catalog down for sales that have not landed. campaign_grade asks whether the answer was buyable at all: days at or over budget during the promise, target ZERO — and a non-zero reading is a BRAIN fault under §3.0 step 3, not a Pacing one. The out-of-budget signal is SPEND >= BUDGET rather than a dark-hours clock, because the clock misses SB overdelivery where a campaign spends past its ceiling instead of stopping. The campaign budget is FORWARD-FILLED with a window function over a spine of spending days unioned with change days — campaign_history records changes and not days, so reading it raw would score a campaign as budgetless on every quiet day it spent money. Joins delivery on campaign_id AND targeting, never campaign_name, because 53 ids in this account carry more than one name (violation 23). Every row carries a plain sentence (§9). NOTHING READS IT and it can move no bid, budget or pause. NOTE: the grading arms are UNEXERCISED by live data until 2026-09-01, when the first promises fall due — acceptance O07 and O08 therefore prove the delivery join and the budget fill on spans that have already happened, so the machinery underneath the grades is demonstrated rather than assumed. Acceptance: scripts/bigquery/tests/SEAT_REQUEST_OUTCOME_acceptance.sql. Spec: architecture/THREE_LAYERS.md §6.0, §3.0."
    source_files: ["scripts/bigquery/views/V_SEAT_REQUEST_OUTCOME.sql"]
    dependencies:
      - FACT_SEAT_REQUEST
      - FACT_AMAZON_ADS
      - V_SRC_AmazonAds_campaign_history


  - name: "V_CPC_ELASTICITY"
    description: "HOW CLICKS RESPOND TO PRICE, per channel - forecast chain step 1 (THREE_LAYERS.md 2.0, spec docs/superpowers/specs/2026-08-25-catalog-forecast-chain-design.md). Publishes an elasticity e such that clicks scale as (cpc ratio)^e, over a 365-day lookback per Ori 2026-08-25 ('the response curve should use 1 year data'). TWO ESTIMATORS WERE BUILT AND DISCARDED BEFORE THIS ONE, and the reasons are the value of this entry. (1) Correlating daily CPC against daily clicks is confounded: busy days carry both a higher price and more clicks, so that curve measures demand, not price. (2) Treating FACT_PPC_CHANGE_LOG as an event study is confounded by MEAN REVERSION, because the Brain changes a bid BECAUSE of recent performance. A placebo test settled it: keywords that received large cuts were RISING steeply in the fortnight BEFORE the cut, and keywords that received large raises were falling, so the post-change move is mostly the spike unwinding. Matching controls on that pre-trend left cells of a dozen keywords and elasticities spread over an order of magnitude - this account does not make enough discrete bid changes to identify a curve from events. WHAT IT DOES INSTEAD: two-way fixed effects over every keyword-week, demeaning log(clicks) and log(cpc) within keyword (removing 'expensive keywords are popular keywords') and within week (removing 'December is busy for everything'). Reported PER CHANNEL because SB and SP differ materially, and split fit/holdout so a reader can see stability out of sample instead of taking the number on trust. CHANNEL IS NORMALISED ACROSS TWO VOCABULARIES - DIM_CAMPAIGN writes SB/SP, the change log writes SPONSORED_BRANDS - because a test for one spelling alone silently folds the larger channel into the smaller and destroys the asymmetry this view exists to publish. CAVEATS THE CALLER CARRIES: cpc is cost/clicks, so clicks appear on both sides and measurement error biases the estimate DOWN, while any keyword-specific demand shock the week effect misses biases it UP; neither is removed. Read by V_CPC_RESPONSE. Acceptance: scripts/bigquery/tests/CPC_RESPONSE_acceptance.sql."
    source_files: ["scripts/bigquery/views/V_CPC_ELASTICITY.sql"]
    dependencies:
      - FACT_AMAZON_ADS
      - DIM_CAMPAIGN

  - name: "V_CPC_RESPONSE"
    description: "THE PRICE-TO-CLICKS LINK of the Catalog's forecast chain (step 1). Answers the first half of the Brain's question - 'if the CPC is X over this window, how many clicks?' - as a CURVE rather than a point, so the Catalog can SEARCH for the best price instead of being handed one; that is the standing ruling that the Catalog, not the Brain, chooses the CPC. CONTRACT: clicks_per_day(cpc) = baseline_clicks_per_day * POW(cpc / baseline_cpc, elasticity); the 0.75x/1.00x/1.25x/1.50x columns are that formula already applied so the shape can be checked without re-deriving it. ELASTICITY IS PER CHANNEL AND NEVER PER KEYWORD, which is a finding and not a shortcut: per-keyword slopes were fitted and then shrunk toward the channel by two estimators (precision-weighted, then empirical Bayes on the slope standard error) before being abandoned, because the median keyword slope carries a standard error near 1.2 - wide enough to be unable to distinguish an elasticity of 0.3 from 2.5 - and only 7 of 397 keywords are measured tightly enough to speak for themselves. Fitted raw, roughly half pinned against the safety clamp, meaning the CLAMP rather than the data was setting the price response. The keywords that ARE well measured average almost exactly the pooled value, so the per-keyword layer bought precision that did not exist. Do not rebuild it without first showing the standard errors have come down. BASELINE is the recent SETTLED window only, settle lag declared per channel (SP 7, SB 14) because an unsettled baseline undercounts clicks and makes every candidate price look worse than it is. THE UNIVERSE IS EVERY KEYWORD THAT RAN THIS YEAR, not only those with recent clicks: built as an inner join this view would silently omit a keyword that has gone quiet, and 'no row' reads as 'nothing to say' when the truth is 'I cannot answer this one'. Those rows carry basis NO_BASELINE and NULL predictions rather than a fabricated zero - the honest signal that a customer purchase flow must answer for them, which is the chain's job and not this view's. WHAT IT DOES NOT DO: holds conversion, price and margin fixed, so it says what a CPC buys in CLICKS, never whether those clicks are worth buying. Read by the forecast chain. Acceptance: scripts/bigquery/tests/CPC_RESPONSE_acceptance.sql."
    source_files: ["scripts/bigquery/views/V_CPC_RESPONSE.sql"]
    dependencies:
      - V_CPC_ELASTICITY
      - FACT_AMAZON_ADS
      - DIM_CAMPAIGN


  - name: "V_CATALOG_FORECAST"
    description: "THE CATALOG'S ANSWER: the whole chain at a price, and the price that maximises it. Forecast chain step 2 (spec docs/superpowers/specs/2026-08-25-catalog-forecast-chain-design.md, THREE_LAYERS.md 2.0.1). For one subject in one SEASON it publishes clicks -> orders -> cost -> ads net ROAS -> net ROAS -> contribution to family net profit, per DAY, at the CPC that maximises contribution; the caller multiplies by the length of the window it asked about. THE OPTIMUM HAS A CLOSED FORM AND THE GRID IS PINNED TO IT: gross profit per click does not depend on price, so contribution is clicks0*(cpc/cpc0)^e*(A-cpc) with A the affordable CPC, maximised at A*e/(1+e) -- about 0.60*A on SB and 0.52*A on SP. Acceptance F02 checks the grid against that identity, which caught a real defect: contribution was rounded to 4 places INSIDE the array, so points around a flat peak compared equal and the cpc-ascending tie-break handed the answer to the cheapest tied price on 60 subjects -- a silent, systematically low recommendation. THE CEILING IS THE HOUSE'S OWN affordable_cpc, not a rival number: contribution per click is gp_per_click/keyword_bar - cpc, zero exactly at gp_per_click/keyword_bar, which is how FACT_KEYWORD_STATE already defines it. Acceptance F01 proves the chain reproduces house pricing EXACTLY on rows using purely a subject's own settled rates. HALO IS CREDITED AT HALF, DELIBERATELY. gp_per_click is raw; the halo enters through keyword_bar = 1/(1+0.5*(halo-1)), which credits half the lift. The spec's literal chain credits it all, and the gap is material -- on Bottle, full credit values a keyword 27% above what the bar permits, so optimising on it would sanction bids the house's own rule rejects. The optimum is computed at half credit; the full-halo figure is published beside it pending a ruling. THE CLICKS LEG IS SEASON-SPECIFIC, which is why a December answer is not an August answer. Measured, 157 live subjects carry real November-December history worth 197,521 clicks, so their holiday question is answered with holiday evidence; subjects with no history in the asked season are disclosed as CARRIED rather than silently translated. Acceptance F08 checks the clicks leg and the money leg name the same season, and F12 checks the seasons still differ at all. THE GRID STOPS AT THE EVIDENCE. The response curve is a power law -- at 3x baseline it claims 5.3x the clicks -- and the median keyword has never been priced above 1.36x its baseline, so the grid ends at the highest price that keyword actually paid and best_cpc_at_grid_edge flags every answer whose true optimum lies beyond what was ever observed. optimum_below_floor is the mirror and is a finding, not a nuisance: the profit-maximising price is under the platform minimum, so the subject is not worth even its floor. HALO IS NEVER DEFAULTED TO 1.0: without keyword_bar every contribution is NULL and the winner would be chosen by ordering a column that is NULL throughout, so those subjects are refused instead. DISCLOSED ASSUMPTIONS THE CALLER MUST CARRY: marginal clicks are assumed to convert as well as average clicks, which biases the optimum UP because bidding higher buys weaker placements; the elasticity is a CHANNEL constant, so the optimum is a fixed multiple of the ceiling within a channel and the grid adds no keyword-specific shape; there is no impression-supply ceiling and no budget constraint, the latter deliberately because allocation is the Brain's job. KNOWN GAP: no flow carries a track record yet, so a FLOW answer cannot state its own accuracy as the spec requires. Decides nothing, moves no bid, and is read by nothing. Acceptance: scripts/bigquery/tests/CATALOG_FORECAST_acceptance.sql."
    source_files: ["scripts/bigquery/views/V_CATALOG_FORECAST.sql"]
    dependencies:
      - V_CPC_RESPONSE
      - FACT_KEYWORD_STATE
      - T_SUBJECT_FLOW_NODE
      - T_CUSTOMER_PURCHASE_FLOW
      - T_FAMILY_BAR
      - FACT_AMAZON_ADS

  - name: "T_SUBJECT_FLOW"
    description: "Every forecastable subject and the TEN NESTED customer purchase flows it belongs to (THREE_LAYERS.md §2.0.2/§2.0.3, forecast chain step 0). Level 1 is universal and matches any keyword so no subject is ever without a flow; each level adds one dimension. THE LADDER IS ORDERED BY COVERAGE rather than by interest, measured on the 849 live subjects: channel/subject_kind/intent_type/family/term_kind are on 100%, is_gift 44.5%, age_group 35%, gender 34%, product_type 14% — budget_tier (7 subjects) and holiday (6) are excluded entirely, because a level above its coverage strands most subjects at a depth they cannot reach. A subject STOPS where its facets stop, which is the honest depth of what is known about it. Which level is USED is decided downstream by evidence, never here. LEGACY NOTE: Membership is DECLARED from fields with full coverage — channel x subject_kind — refined by the supervised intent where it exists; V_INTENT_RESOLVED covers ~44% of subjects, so intent REFINES a flow and can never DEFINE one, or over half of all subjects would belong to nothing. MATERIALISED FOR A MEASURED REASON: V_INTENT_RESOLVED classifies ~350k search terms and is CPU-heavy rather than byte-heavy, and joining it on LOWER(TRIM(...)) inside the flow view AND again inside the flow acceptance suite exceeded the on-demand CPU limit outright (42,184 CPU seconds against a 37,300 ceiling, on 146 MB of data). Only ~850 subjects need the answer, so it is resolved once here. REBUILT, NEVER ACCUMULATED: this is a derived lookup and not a record of what was said, so every row can be recomputed from source and CREATE OR REPLACE carries none of the memory hazard that made violation 6. 849 subjects across 17 flows as of 2026-08-25. Read by V_CUSTOMER_PURCHASE_FLOW. Spec: docs/superpowers/specs/2026-08-25-catalog-forecast-chain-design.md."
    source_files: ["scripts/bigquery/tables/T_SUBJECT_FLOW.sql"]
    dependencies:
      - FACT_KEYWORD_STATE
      - V_INTENT_RESOLVED

  - name: "SP_BUILD_CUSTOMER_PURCHASE_FLOWS"
    description: "Grows the customer purchase flow TREE (THREE_LAYERS.md §2.0.3). GREEDY, NOT A FIXED LADDER: at every node each unused dimension is scored by the CLICK-WEIGHTED dispersion of the children it would produce, and the node splits on whichever helps most — so different branches split on different dimensions and depth is decided by evidence rather than declared. Replaces a coverage-ordered ladder that measurement showed was almost exactly wrong: at the root the best splits are age_group (0.581) and subject_kind (0.581) while channel, which the ladder used at level 2, ranks 7th of 9 (0.885), and intent_type (0.917) and family (0.914), at ladder levels 4 and 5, are the two WORST dimensions available. Coverage says which fields are safe, never which are informative. A node splits ONLY when the improvement clears min_improvement AND both children keep enough members and clicks; DEPTH IS NOT A GOAL — a node that refuses to split has answered the question rather than failed it (Ori: 'if with only 1 level have the best accuracy of estimation it means it enough'). Depth is not capped at ten; growth stops when nothing helps. TEACHING AND MEMBERSHIP ARE SEPARATE: the tree is GROWN from subjects with >=30 clicks (327 of 849) and ANSWERS for all of them — the first build placed only teaching members and left 62% of the account with no flow at all. Every node's profile ROLLS UP its descendants so a shallower node is a real fallback rather than an empty row. Writes T_CUSTOMER_PURCHASE_FLOW and T_SUBJECT_FLOW_NODE. Decides nothing and can move no bid, budget or pause."
    source_files: ["scripts/bigquery/procedures/SP_BUILD_CUSTOMER_PURCHASE_FLOWS.sql"]
    dependencies:
      - T_SUBJECT_FLOW
      - FACT_AMAZON_ADS

  - name: "T_CUSTOMER_PURCHASE_FLOW"
    description: "The grown customer purchase flow tree (§2.0.3). One row per node with its profile split BY LINK — CPC, CVR, gross profit per order, clicks per active day — because the purpose is to see WHICH link is wrong; a node publishing only a blended contribution could never name the broken link. Every node carries a profile rolled up from all its descendants, so a shallower node is a real fallback. 27 nodes over 849 subjects as of 2026-08-25, max depth 3, with 168 subjects resting at depth 1 because splitting them further did not help. Rebuilt by SP_BUILD_CUSTOMER_PURCHASE_FLOWS. Nothing reads it yet."
    source_files: ["scripts/bigquery/procedures/SP_BUILD_CUSTOMER_PURCHASE_FLOWS.sql"]
    dependencies:
      - T_SUBJECT_FLOW

  - name: "T_SUBJECT_FLOW_NODE"
    description: "Which grown flow node each subject sits in (§2.0.3). EVERY subject is placed, not only those that taught the tree: the tree is grown from subjects with enough clicks and must answer for all of them, and conflating teaching with membership silently abandoned 62% of the account on the first build. taught_the_tree distinguishes the two. Rebuilt by SP_BUILD_CUSTOMER_PURCHASE_FLOWS."
    source_files: ["scripts/bigquery/procedures/SP_BUILD_CUSTOMER_PURCHASE_FLOWS.sql"]
    dependencies:
      - T_SUBJECT_FLOW

  - name: "FACT_SEAT_REQUEST"
    description: "The Brain's ledger of what it ASKED FOR — THREE_LAYERS.md §6.0, ruled by Ori 2026-08-25 (\"Brain should also save his request and results and report if the catalog and pacing performed like expected\"). Append-only, partitioned by requested_on, clustered by keyword_id/campaign_id/plan/family; one row per (requested_on, plan, campaign, keyword). EXISTS BECAUSE FACT_PLAN_NEXT_WEEK IS REPLACED NIGHTLY: plan step 4 put the click target on the plan partition, and Task 20.8c deletes and rewrites that partition every pass, so a promise made tonight is gone tomorrow and a window closing three weeks out has had every promise behind it overwritten a dozen times. Same shape as violation 6 and the same fix. EACH NIGHT'S ASK IS KEPT rather than collapsed, because an ask that keeps changing is itself a finding a collapsing ledger could not show. BOTH PLAN ARMS are recorded — grading only the live one makes the shadow plan's counterfactual unmeasurable, which is the whole reason it runs (P-9). CARRIES THE CATALOG CLAIM THE SEAT WAS BOUGHT ON (ladder_state, verdict, family_bar, ret_corrected, and the judged window's clicks/orders/spend), because §6.0 grades the Catalog on whether its recommendation performed as claimed and a promise stripped of its evidence can be counted but never graded — the same argument that made FACT_KEYWORD_STATE_HISTORY carry the whole ladder row. Also carries the campaign budget the request must fit inside, so §3.0 step 3 can be asked afterwards. Written by SP_APPEND_SEAT_REQUEST at orchestrator Task 20.8d. NOTHING READS IT YET and the day something does is a decision, not an accident — acceptance check R12 asserts that against INFORMATION_SCHEMA. It records what the plan already decided and can move no bid, budget or pause. Acceptance: scripts/bigquery/tests/SEAT_REQUEST_acceptance.sql. Spec: architecture/THREE_LAYERS.md §6.0, §3.0."
    source_files: ["scripts/bigquery/tables/FACT/FACT_SEAT_REQUEST.sql"]
    dependencies:
      - FACT_PLAN_NEXT_WEEK

  - name: "SP_APPEND_SEAT_REQUEST"
    description: "Appends today's funded seat requests from FACT_PLAN_NEXT_WEEK into FACT_SEAT_REQUEST (orchestrator Task 20.8d, immediately after Task 20.8c builds the plan and before anything below reads it). Plan step 5, THREE_LAYERS §6.0. APPEND-THEN-PRUNE and idempotent: it INSERTs the day's funded seats stamped with this run's captured_at, then prunes any requested_on carrying more than one captured_at down to its newest stamp — and the prune runs BEFORE the append as well as after, keyed on the LEDGER'S OWN duplicate stamps rather than on the dates the plan happens to carry, so a strand left by a crash on ANY date is repaired by ANY later call including a manual one (the lesson of v27.144). The failure mode points the safe way: a crash between the two statements leaves a duplicate, never a lost promise. GUARD 0 makes a missing ledger a no-op rather than an error. GUARD 1 refuses to touch a partition when the plan is absent or holds no funded seat. GUARD 2 refuses to record a plan build OLDER than one the ledger already holds, compared on the plan's own built_at rather than on the calendar — several passes share one date, so a date-only test is blind inside the day it runs in (the lesson of v27.145). ONLY ROWS THAT TOOK A SEAT are recorded: a row with no seat asked no question, and writing one would invent an intention the Brain never had. Wrapped by the orchestrator's exception handler, so a failure logs FAIL to LOG_PIPELINE_RUNS and the pass carries on — it is not possible for this step to break a pass. It decides nothing, is read by nothing, and can move no bid, budget or pause. Acceptance: scripts/bigquery/tests/SEAT_REQUEST_acceptance.sql."
    source_files: ["scripts/bigquery/procedures/SP_APPEND_SEAT_REQUEST.sql"]
    dependencies:
      - FACT_SEAT_REQUEST
      - FACT_PLAN_NEXT_WEEK

  - name: "FACT_KEYWORD_STATE_HISTORY_SEED_20260824"
    description: "The SECOND COPY of the Catalog's recovered memory, and the only one that is not on a rolling seven-day clock. An immutable BigQuery SNAPSHOT of FACT_KEYWORD_STATE_HISTORY taken 2026-08-24 23:15 UTC. WHY IT EXISTS: seven of that table's eight partitions (2026-08-17..2026-08-23) were not written by a nightly pass — they were RECOVERED from BigQuery's own seven-day table history by scripts/bigquery/migrations/2026-08-24_keyword_state_history_backfill.sql, because FACT_KEYWORD_STATE is CREATE OR REPLACE'd every pass and no other copy of an earlier snapshot exists anywhere in the warehouse. That recovery cannot be run twice. THE FUSE IS SEVEN DATES, NOT ONE: the backfill's own header says the timestamps expire 'around 2026-08-31', which is the LAST expiry — the window is 168 hours and each source timestamp leaves it on its own day, so 2026-08-17 became unrecoverable at 2026-08-25 06:00 UTC and one further day joins it every 24h until 2026-08-31 06:00 UTC. After each of those moments the history table was the only copy of that day; this snapshot is the second. The history's own time travel is NOT a second copy — it expires on the same rolling window and protects only against a loss noticed within a week. WHY A SNAPSHOT: immutable by construction (a DELETE against it fails with 'snapshots are immutable' — verified as a negative control, not assumed), delta-stored so it costs almost nothing while the base table is unchanged, and it SURVIVES deletion of the base table, which a view or a scheduled copy would not. Verified at creation: 8 snapshot_dates / 6,814 rows, each date's row count AND captured_at identical to the live history, 69 columns both sides with zero type mismatches, table_type = 'SNAPSHOT'. NOTHING READS IT and nothing should — it is not a source, not a fallback path, and no procedure, view, engine, generator, book or bulksheet references it. It can move no bid, budget or pause. Drop it only when the recovered partitions stop being of interest. Spec: architecture/THREE_LAYERS.md §8 violation 6. SOP: architecture/KEYWORD_STATE.md."
    source_files: ["scripts/bigquery/tables/FACT/FACT_KEYWORD_STATE_HISTORY_SEED_20260824.sql"]
    dependencies:
      - FACT_KEYWORD_STATE_HISTORY


  - name: "SP_APPEND_KEYWORD_STATE_HISTORY"
    description: "Appends the live FACT_KEYWORD_STATE snapshot into FACT_KEYWORD_STATE_HISTORY (orchestrator Task 20.8a, immediately after Task 20.8 builds it and before anything below reads it). Closes THREE_LAYERS.md §8 violation 6 — without this step every pass destroys a day of the Catalog's verdicts permanently. APPEND-FIRST AND IDEMPOTENT: it INSERTs the whole snapshot stamped with this run's captured_at, then PRUNEs any snapshot_date carrying more than one captured_at down to its newest stamp. Two passes on one snapshot_date therefore leave exactly one copy (the house assumes any procedure may be called twice a night — SP_REFRESH_CUBE_TABLES already calls SP_MAINTAIN_FAMILY_SEATS a second time each pass), and the failure mode points the safe way: a crash between the two statements leaves a duplicate, never a lost day, which is the opposite of the delete-then-insert shape. The prune is keyed on the history's OWN duplicate stamps rather than on the dates the live snapshot happens to carry, and runs before the append as well as after, so a strand left on ANY date is repaired by ANY later call including a manual one (v27.144 — the date-scoped first shape could never reach a strand left on the last pass of an LA day). GUARD 3 refuses a BUILD the history has already recorded: Task 20.8 has its own exception handler, so a failed build leaves the previous build's table standing, and re-copying it would move that partition's captured_at and give it a source_detail naming a read time at which the Catalog said nothing new. The test is on the BUILD and not on the calendar (v27.145) — it compares the snapshot table's own last-modified clock against the stamp the history holds for that date, and abstains rather than refusing if that clock cannot be read, because a wrong refusal costs a day of memory no later run can recover. The first shape asked only whether the snapshot's date was older than the current LA date, which left it blind for the whole of the day it was running in: snapshot_date IS that LA date and several passes run each night, so a pass whose build failed carried the same date as the pass that had already appended and restamped it silently, with no acceptance check able to see it. A snapshot carrying a date the history does NOT hold is still appended whatever its clocks say, because that is memory gained rather than provenance rewritten. Every appended row records snapshot_built_at, which is what lets acceptance check C14 assert that no partition claims a build it could not have read and that the guard itself is still deployed. Nothing here is a hard-coded column list — the live column set is read from INFORMATION_SCHEMA every run, missing columns are ADD COLUMN IF NOT EXISTS-ed onto the history, and the insert is by column name, so a column added to the Catalog is carried the same night with no edit to this procedure. Guarded so a missing or empty snapshot is a no-op rather than an emptied partition, and wrapped by the orchestrator's exception handler so a failure logs FAIL to LOG_PIPELINE_RUNS and the pass carries on — it is not possible for this step to break a pass. It decides nothing, writes nothing any other task consults, and can move no bid, budget or pause. Acceptance: scripts/bigquery/tests/KEYWORD_STATE_HISTORY_acceptance.sql. Spec: architecture/THREE_LAYERS.md §8 violation 6, §10.4. SOP: architecture/KEYWORD_STATE.md."
    source_files: ["scripts/bigquery/procedures/SP_APPEND_KEYWORD_STATE_HISTORY.sql"]
    dependencies:
      - FACT_KEYWORD_STATE
      - FACT_KEYWORD_STATE_HISTORY

  - name: "V_CATALOG_DWELL"
    description: "How long has this been stuck — the question THREE_LAYERS.md §10.4 recorded as unanswerable and named as the single highest-value thing to fix, because its absence obstructs the measurement of every other violation. One row per subject (campaign_id, keyword_id) over FACT_KEYWORD_STATE_HISTORY: the current verdict, the date the run of that verdict was first OBSERVED, what it changed from, the window the change fell inside, how often it has flipped over 28 and 90 observed days, how overdue its own next_check_date is, and how long it has stood. THE DWELL IS PUBLISHED AS A BOUND, NEVER AS A BARE NUMBER: days_in_state is ALWAYS the floor — what is certainly true — and dwell_basis says how it was arrived at. EXACT means the change was observed and the previous snapshot is the day before; BETWEEN means it fell inside an observation gap, so both bounds are published and they differ; AT_LEAST means the run reaches back to the subject's first row in the history, the true start is UNKNOWN, and days_in_state_max is deliberately NULL so an arithmetic consumer cannot average a censored value into a fake mean. A view that printed a single number on a short history would be manufacturing the very memory the violation is about. Dwell is measured from OBSERVATION and never from FACT_KEYWORD_STATE.state_since, which despite its name is the park date / floor_since / last bid change, is NULL for a large share of the account, and can move while the state stands still or stand still while the state moves; that column is published beside the observed one as state_since_declared with declared_agrees so the disagreement is visible rather than silently resolved. A subject that VANISHED from the snapshot keeps its row with is_current FALSE, absent_since and absent_days — the case doctrine Appendix B describes, and one a single-snapshot table cannot even report. Reads the history only, so it answers whether or not tonight's pass has run (§1.4: no ordering dependency, and asking changes nothing). Every row carries the history's own bounds and a plain sentence. No engine, generator or book reads it and it can move no bid, budget or pause. Acceptance: scripts/bigquery/tests/KEYWORD_STATE_HISTORY_acceptance.sql (C06..C09). Spec: architecture/THREE_LAYERS.md §1.4/§6/§8/§10.4. SOP: architecture/KEYWORD_STATE.md."
    source_files: ["scripts/bigquery/views/V_CATALOG_DWELL.sql"]
    dependencies:
      - FACT_KEYWORD_STATE_HISTORY

  - name: "SP_ENGINE_PREFLIGHT"
    description: "Standing contradiction gate (engine-finalization Task 1.1, 2026-08-15; negates v27.72; panel claim v27.81, 2026-08-18). Judges the latest FACT_ENGINE_PROPOSALS partition against FACT_KEYWORD_GUARD and FACT_PANEL_OWNERSHIP. TWO INDEPENDENT SOURCES OF EXCLUSION. (1) COLLISION-BASED, the original: single owner per (campaign, key, lever) — key = keyword for bid/budget, the term text for NEGATE — with precedence LOW_STOCK > LAUNCH > OOB > REVERDICT > LIFT > COACH; it can only fire when two engines instruct the SAME key. (2) CLAIM-BASED, new in v27.81: FACT_PANEL_OWNERSHIP is the single-home authority and a FULL claim evicts every lower panel on BOTH levers whether or not the owner said anything today — LAUNCH defers on defer_launch_panel, REVERDICT on defer_revival_panel, OOB and LIFT on defer_engine_panel, LOW_STOCK never (it is the owner, and an owner cannot defer to itself) and COACH never. WHY (2) EXISTS: v27.73's redirect mode made LOW_STOCK deliberately STOP proposing bid/budget cuts on the campaigns it owns — it re-aims ad doorways at an in-stock sibling instead of braking — so the collisions vanished and the collision-only gate waved the lower-ranked engines through the empty doorway. Measured live 2026-08-18: 41 GO rows from non-owner engines inside LOW_STOCK-owned, CRITICAL, redirect-mode campaigns (LAUNCH 28 all bid cuts, OOB 5, LIFT 5 including a bid RAISE into a family with 20 days of cover and nothing booked, COACH 3 negates). Silence from the owner is still the owner's answer; the gate now reads the claim and not just the collisions. SCOPE, every boundary deliberate: the claim arm covers lever IN (BID, BUDGET) only — a claim is about money, so NEGATE is untouched and a wasteful search term stays blockable inside a low-stock family; it FAILS OPEN via COALESCE(defer_*, FALSE) so a missing or stale ownership row never silences legitimate work; and it is ordered AFTER the collision arm so a genuine collision keeps its more specific reason. No-ops EXCLUDE; bid cuts on settled >=1.2x/>=10clk winners, bids >$2.00 and peak-converting negates REVIEW. Writes T_ENGINE_PREFLIGHT and stamps verdict/verdict_reason back onto the partition (proposal history doubles as the contradiction-rate time series). Reads ONLY snapshot tables — never the ceiling views — so it runs in seconds. Called by SP_ORCHESTRATE_DAILY_REFRESH Task 20.7, right after the proposal snapshot (20.6); FACT_PANEL_OWNERSHIP is built earlier in the same pass by SP_SNAPSHOT_PANEL_OWNERSHIP, which is what makes the claim readable here. First run: 149 instructions -> 97 GO / 44 EXCLUDE / 8 REVIEW (29.5% contradiction — the iteration-6 magnitude, now gated daily). DoPage.exportBulksheet refuses EXCLUDE rows and confirms REVIEW rows at export time; the gate fails OPEN with a visible flag if unreachable. v27.98 (2026-08-21): rows carrying hold_source (the last-day veto's held proposals, now recorded in FACT_ENGINE_PROPOSALS instead of erased) are SKIPPED and never enter T_ENGINE_PREFLIGHT - they carry no value, so every value test here would read them as no-ops and overwrite the veto's own sentence, and they would otherwise join the single-owner contention as live instructions, where a held OOB row could outrank a real LIFT one and leave the keyword untouched by an engine that was ready to act. Skipping them is also what keeps a held row out of the cube, the decisions feed and the bulksheet export. The stamp-back UPDATE excludes them explicitly. Spec: architecture/ENGINE_PREFLIGHT.md."
    source_files: ["scripts/bigquery/procedures/SP_ENGINE_PREFLIGHT.sql"]
    dependencies:
      - FACT_ENGINE_PROPOSALS
      - FACT_KEYWORD_GUARD
      - FACT_PANEL_OWNERSHIP

  - name: "T_ENGINE_PREFLIGHT"
    description: "The judged day of engine instructions — one row per live instruction with own_rank / n_instr / owner_engine / verdict / verdict_reason, plus (v27.81) claim_deferred / claim_owner, the panel-ownership basis for the second exclusion source: claim_deferred is TRUE when FACT_PANEL_OWNERSHIP hands a higher panel a full claim on this campaign, and claim_owner names that owner. Both are published so an audit can tell a CLAIM-based EXCLUDE from a COLLISION-based one without re-deriving either. Rebuilt by SP_ENGINE_PREFLIGHT (orchestrator Task 20.7). Read via V_ENGINE_PREFLIGHT by the EnginePreflight cube and DoPage's export-time refusal check. Spec: architecture/ENGINE_PREFLIGHT.md."
    source_files: ["scripts/bigquery/procedures/SP_ENGINE_PREFLIGHT.sql"]

  - name: "V_ENGINE_PREFLIGHT"
    description: "Thin read surface over T_ENGINE_PREFLIGHT — no logic, stable name for the cube/panels and ad-hoc checks. Spec: architecture/ENGINE_PREFLIGHT.md."
    source_files: ["scripts/bigquery/views/V_ENGINE_PREFLIGHT.sql"]
    dependencies:
      - T_ENGINE_PREFLIGHT

  - name: "V_HOLDOUT_ELIGIBLE"
    description: "Who is allowed into the randomized holdout trial, and the frozen facts the randomization blocks on (v27.83, 2026-08-19, Ori: 'start the holdout'). GRAIN: one row per ENABLED campaign clearing every eligibility rule — 69 rows / $26,377 of 28-day ad spend on the assignment date, the exact population the design was powered on. WHY A TRIAL AT ALL: matched difference-in-differences was tried on 2026-08-18 and PROVED untrustworthy here. A SELECTION PLACEBO — emulate the engine's ranking by trailing-14d dollars, then change NOTHING — reads +$1,505..+$2,445 on the losers arm (+3.9..+7.1 sd) and -$1,094..-$1,829 on the winners arm across four independent no-upload dates, against an account 14-day net of about -$2,500..-$2,730: the artifact is ~90% of the entire quantity being measured. And no natural control exists — 73.5% of active keywords and 85.1% of ad dollars are touched, the clean untouched pool clearing 10 clicks in both windows is SEVEN keywords / $819 against 379 treated / $29,326, matching fails for 98.1% of treated keywords, and the untouched arm is untouched BECAUSE it is dying (-83% clicks). So a control is CREATED by randomization. WHY THE CAMPAIGN AND NOT THE KEYWORD — the decisive constraint, and Ori's own low-stock doctrine already states it: 'in a CAPPED campaign the budget is spent regardless, so removing a target does not return money — it RE-ROUTES it to the neighbours.' Holding out keyword A hands its forgone impressions and budget to its TREATED neighbours in the same campaign; the arms interfere, the treated arm is flattered, and the trial measures reallocation as skill (a SUTVA violation). A whole-campaign arm has zero within-campaign spillover by construction and CAPTURES that reallocation inside the unit. Family clustering would remove even the cross-campaign leak but leaves 5 clusters / 3 df and an MDE of 32% of the spend under test. EXCLUSIONS, all applied: not enabled/serving; zero 28-day spend (3, dormant — a budget line and no outcome); brand defense (7, $764/28d — doctrine already forbids the engine moving their bids, so they are untreated in BOTH arms and add only noise); CRITICAL-stock families Bunny and LolliBall (14, $5,496/28d — holding these out costs INVENTORY, not dollars). CONSIDERED AND REJECTED: excluding forecast-THROTTLE families (Fresh/LolliME/Lollibox) removes $25,192 of the $32,637 base and leaves 6 campaigns — no trial left, so a symmetric mid-trial CENSORING rule is pre-committed in HOLDOUT.md instead; excluding launch-phase campaigns removes 52 of 69 and kills cluster randomization, so launch status is a STRATUM frozen at assignment (intention-to-treat) instead. THE CRITICAL-FAMILY LIST IS A FROZEN LITERAL ON PURPOSE: reading a live risk_state would drag V_LOW_STOCK_ADS (at BigQuery's planning ceiling) into this plan AND let the trial's population drift with performance, which is a selection artifact of exactly the kind this design exists to kill. ONE MONEY SOURCE: cost and GROSS_PROFIT off the same FACT_AMAZON_ADS rows for both channels (V_CAMPAIGN_CAP_STATE reads sb_campaign_report instead because cap arithmetic must compare spend to the budget Amazon enforced; a trial has the opposite requirement — subtracting two differently-complete feeds would put a source artifact inside the measured quantity). Verified: the SB source choice moves neither the population (69) nor the chosen seed (14). STRATUM = channel|CAP-UNC|LNC-GRD; size is blocked inside each stratum by the assignment SP's spend ordering. PLANNER DOCTRINE: reads V_CAMPAIGN_CAP_STATE and V_LAUNCH_POPULATION, so it has EXACTLY ONE consumer, SP_ASSIGN_HOLDOUT, once a day — engines, the preflight gate and the readout all read the TABLE DE_HOLDOUT_ASSIGNMENT. Spec: architecture/HOLDOUT.md."
    source_files: ["scripts/bigquery/views/V_HOLDOUT_ELIGIBLE.sql"]
    dependencies:
      - V_DIM_CAMPAIGN_CURRENT
      - FACT_AMAZON_ADS
      - V_CAMPAIGN_FAMILY_MAP
      - V_CAMPAIGN_CAP_STATE
      - V_LAUNCH_POPULATION

  - name: "DE_HOLDOUT_ASSIGNMENT"
    description: "The randomized arms of trial HOLDOUT-2026Q4-CAMPAIGN (v27.83, 2026-08-19) — the one table in the ads stack whose entire value comes from NEVER CHANGING. One row per randomization unit (unit_type=CAMPAIGN), written ONCE by SP_ASSIGN_HOLDOUT on the first day the unit is seen eligible, never updated and never deleted. WHY A TABLE AND NOT A VIEW: a view would recompute the arms from today's data on every read, so a campaign that changed cap state, graduated out of the launch population or moved family would silently change arm — and the readout would then compare 'campaigns that ended up looking like X' against 'campaigns that ended up looking like Y', which IS the selection artifact that made matched DiD unusable here (a rank-based selection placebo manufactured +$1,505..+$2,445, ~90% of the account's entire 14-day net, out of selection alone). The whole point of randomization is that the arms were fixed BEFORE the outcome existed, and that property lives in this table's immutability and nowhere else. ASSIGNMENT RULE, fully reproducible from the stored columns: stratum = channel|CAP-UNC|LNC-GRD frozen at assignment; seq_in_stratum = 0-based rank within stratum by spend_28d DESC then campaign_id, CONTINUED (never recomputed) as later units are appended; offset = MOD(ABS(FARM_FINGERPRINT(seed || '|' || stratum)), 5); arm = HOLDOUT iff MOD(seq+offset,5)=0. Systematic 1-in-5 inside a size-ordered block: ~20% per stratum by construction, with size blocked implicitly because every consecutive run of five is a run of neighbours in spend. SEED 'OI-HOLDOUT-v1|14' was chosen by PRE-DECLARED RERANDOMIZATION (Morgan-Rubin), the rule declared before the draws were inspected: search seed_index 0,1,2,... and take the FIRST satisfying (A1) exactly 14 holdout campaigns, the design's 20% of 69; (A2) holdout share of eligible 28-day ad dollars inside [0.18,0.22]; (A3) all five eligible families present in the holdout arm, since family is a stratum precisely to control organic halo. seed_index 14 is the first pass — 6 and 8 give 15 holdouts, 10 covers only 4 families, the rest miss the dollar band. THE ACCEPTANCE REGION IS PART OF THE DESIGN: the readout's permutation inference must permute only over assignments that would also have been accepted. FOUNDING COHORT 2026-08-19: 14 HOLDOUT / 55 TREATED; $5,135 vs $21,242 of 28-day ad spend (holdout 19.5%); SB 4/14 vs 20/55; capped 4/14 vs 17/55; launch 11/14 vs 41/55; all five families both arms; pre-trial net -$270 vs -$2,306 (a real chance imbalance of about $146 per 14 days, ~6% of the MDE — V_HOLDOUT_READOUT publishes it and reports a change-score estimate alongside the raw one). eligible_from 2026-09-01, trial_end 2026-12-22: the arm does not BITE before eligible_from, so the engine runs normally on both arms until then. COLUMNS: trial_id / unit_type / unit_id / unit_name / arm / stratum / seq_in_stratum / seed / assigned_at / eligible_from / trial_end, plus the blocking facts FROZEN at assignment (channel, family, is_capped, is_launch, spend_28d_at_assign, gp_28d_at_assign, net_28d_at_assign) and assignment_rule. The frozen facts are intention-to-treat: a campaign that graduates, starts capping or changes family mid-trial KEEPS them and KEEPS its arm. WHAT INVALIDATES THE TRIAL: UPDATE or DELETE here (re-randomizing after seeing outcomes is not a fix for an unlucky draw, it is the manufacture of the result you wanted); hand-uploading any bid, budget or negative to a HOLDOUT campaign; deliberately moving budget between the arms; pulling a holdout unit mid-trial for a reason correlated with its performance or stock (use the symmetric censoring rule instead). Read by SP_ENGINE_PREFLIGHT (the export gate, all levers) and V_HOLDOUT_READOUT. Spec: architecture/HOLDOUT.md."
    source_files: ["scripts/bigquery/tables/DE_HOLDOUT_ASSIGNMENT.sql"]

  - name: "SP_ASSIGN_HOLDOUT"
    description: "Flips the coin ONCE per unit and never again (v27.83, 2026-08-19). IDEMPOTENT BY CONSTRUCTION, and the construction is the whole safety argument: the only statement touching DE_HOLDOUT_ASSIGNMENT is a single INSERT whose source is V_HOLDOUT_ELIGIBLE anti-joined BY EQUALITY on (trial_id, unit_id) against the rows already present. There is no UPDATE, no DELETE, no MERGE WHEN MATCHED and no CREATE OR REPLACE TABLE anywhere in the procedure, so running it a hundred times in one day writes nothing after the first (verified live: first call 69 rows, second call 0). That is not a convenience — an arm that can be rewritten is not an arm, and a procedure that CAN rewrite it will eventually be run by someone who does not know that. NEW UNITS ARE ASSIGNED ON FIRST SIGHT by the same rule from the same seed, and their seq_in_stratum CONTINUES the stratum's existing sequence rather than recomputing it — the single most important line in the procedure, because a daily recompute would re-rank every unit the moment one campaign's spend moved and swap arms wholesale. Cost of continuation: a late arrival's position depends on when it arrived rather than on its size, so size-blocking is exact for the founding cohort and approximate afterwards; exact size balance is worth less than an arm that cannot move. TRIAL CONSTANTS live here and are mirrored (same values, same warning) only in V_HOLDOUT_READOUT — trial_id HOLDOUT-2026Q4-CAMPAIGN, seed 'OI-HOLDOUT-v1|14', eligible_from 2026-09-01, trial_end 2026-12-22, 1-in-5 (the design's 20% share, the cheapest power cell clearing the account's own 14-day net magnitude: MDE $2,261 per 14 days against 25%'s $2,088 for $1,413/month more and more operational risk through peak). THE ARM DOES NOT BITE UNTIL eligible_from: rows are written 2026-08-19 but SP_ENGINE_PREFLIGHT only starts excluding on 2026-09-01, so the arms are frozen BEFORE anyone can see how the trial is going while nothing is withheld in the meantime. IF THE BASE/GROWTH REORG (doctrine Sep 15-30, +$70.64/day) HAS NOT LANDED BY SEP 1, MOVE eligible_from, trial_end AND the V_HOLDOUT_READOUT constants TOGETHER and exclude any campaign the reorg relocates from BOTH arms — a structural migration landing mid-trial is a differential shock if it touches one arm more than the other. Called by SP_ORCHESTRATE_DAILY_REFRESH Task 20.55, immediately BEFORE the proposal snapshot (20.6) and the preflight gate (20.7), so the arms exist before the day's opinions are recorded against them. Spec: architecture/HOLDOUT.md."
    source_files: ["scripts/bigquery/procedures/SP_ASSIGN_HOLDOUT.sql"]
    dependencies:
      - V_HOLDOUT_ELIGIBLE
      - DE_HOLDOUT_ASSIGNMENT

  - name: "SP_MAINTAIN_FAMILY_SEATS"
    description: "Maintains DE_FAMILY_SEAT_LEDGER once per keyword-state snapshot (family seat register Task 1, 2026-08-22; rulings R-a / R-b and the ledger memory added the same day). Reads FACT_KEYWORD_STATE (the table holds ONE snapshot — it is replaced on every run) for the WORKING families only (V_BOOK_ASSIGNMENT book = HARVEST), never a brand-defense keyword (defense is never judged on profit — the ladder flag, the campaign-name rule, or a house brand phrase in the keyword text), and builds today's occupant set — REPRICE / FLOOR_PROBATION / LOSER / REVIVED_SETTLING / PENDING_SETTLE on their verdict alone, plus a TRIAL keyword in one of three probe positions: probe at an entry bid (on the engine probe list T_LIFT_PROBES — the previous pass's, since Task 21 rebuilds it after 20.8b — spend or no spend: ruling R-a), probe at the park bid (the ladder's at_floor, i.e. the live bid at the published channel floor, WITH spend in the basis window: k_basis_days = 7 complete days ending at the ads watermark - 1, the ladder's own anchor LEAST(MAX(date), FN_ADS_ANCHOR_CAP()): ruling R-a), and stalled probe (ruling R-b: not engine-listed, not at the floor, whose latest applied bid change in V_PPC_CHANGE_LOG_APPLIED is an INCREASE_BID that still stands — live bid at or above the logged new_bid and above the old_bid, never lowered since; at-or-above because the $1.00 activation floor can lift a bid past the logged raise after the row is written — that raise older than k_probe_window_days = 14 with fewer than k_verdict_clicks = 20 clicks since — the engine's own probing test in V_KEYWORD_LIFT, expired; a seat with a standing proposal, never 'waiting for results'; the change log is the authority for the raise date, a raise with no applied log row reads waiting). A TRIAL keyword in none of the three positions is waiting (80% side), never seated. Ruling R-h (2026-08-22): a PARKED keyword with spend in the basis window whose re-verdict appointment (next_check_date) is on or after the snapshot date is a seat of kind 'parked — awaiting re-verdict'; past its appointment or without spend it is not a seat (closure code PARK_LAPSED). Brand phrases are matched as whole phrases on word boundaries (D9). Then, in order: CLOSE every open row whose key left the occupant set, dated on the snapshot, with a reason code and the same reason as one plain sentence (closed_reason_text), first-match KILLED (gone from the snapshot after a LOSER/DEAD last_observed_state in the ledger — a row with no memory yet falls back to a seat opened as failed — or DEAD now) > PAUSED (gone otherwise) > PARK_LAPSED (reads PARKED but is no longer a parked seat) > LEFT_FAMILY (another family, or family left the HARVEST book) > DEFENSE_EXEMPT (now brand defense) > TO_GOOD_SIDE (WINNER / PACED_WINNER / AT_BAR) > TO_WAITING (still TRIAL, in no probe position); REOPEN a row closed on the same snapshot date whose key is an occupant again (same-day flip keeps its number and keeps the occupancy key unique); ADMIT occupants without an open row at the LOWEST seat number not held by an open row of the family, several admissions in one run ordered totally (kind repair > probation > failed > settling > parked > probe > stalled probe, spend DESC, campaign_id, keyword_id) and taking the free numbers in ascending order; OBSERVE: stamp every open row with last_observed_kind / last_observed_state — the ledger's only memory for a keyword that VANISHES from the snapshot (a keyword still on it carries prior_state; a vanished one has no row), which decides KILLED vs PAUSED. IDEMPOTENT: every write is keyed on the snapshot date and on set differences, so a second run on the same snapshot closes, reopens and admits nothing and re-stamps identical memory (verified at ship: two runs, identical table fingerprint); a continuing occupant keeps its number for as long as it stays seated whatever its kind becomes. Orchestrator Task 20.8b, immediately after SP_SNAPSHOT_KEYWORD_STATE (20.8). Costs, sides, the 80/20 read and the moves are V_FAMILY_SEAT_REGISTER's job; no engine reads the ledger. Acceptance: scripts/bigquery/tests/DE_FAMILY_SEAT_LEDGER_acceptance.sql (every check passes). Task 2 polish (2026-08-22): the stalled-probe window is aged against the snapshot date (run_day), never the wall clock; clicks since the raise are counted on complete days from the raise date itself, never a fixed window; the CLOSE step names WINNER / PACED_WINNER / AT_BAR explicitly and gives any other state the code STATE_CHANGED with the sentence 'left the seat set — it now reads <state in plain words>'; brand defense is tested three ways (the ladder flag, BRAND DEFENSE in the campaign name, a house brand phrase from DIM_BRAND_PHRASES in the keyword text). Spec: architecture/FAMILY_SEAT_REGISTER.md. v27.124 (2026-08-23): called TWICE per orchestrator pass — at 20.8b against the previous pass's T_LIFT_PROBES, and again as SP_REFRESH_CUBE_TABLES step 0a right after that list is rebuilt — because the first call alone left a dropped probe stamped 'probe' for a whole pass (A13 failed live on two seats on the first production night). Idempotent on one snapshot, so the second call re-stamps, closes or admits only what the fresher list changes."
    source_files: ["scripts/bigquery/procedures/SP_MAINTAIN_FAMILY_SEATS.sql"]
    dependencies:
      - FACT_KEYWORD_STATE
      - V_BOOK_ASSIGNMENT
      - T_LIFT_PROBES
      - V_PPC_CHANGE_LOG_APPLIED
      - FACT_AMAZON_ADS
      - DE_FAMILY_SEAT_LEDGER

  - name: "SP_BUILD_NEXT_WEEK_PLAN"
    description: "v27.138 (2026-08-24, next week's money Task 2, repair pass 2) - builds the next-week money plan for the WORKING families (HARVEST book) and writes today's partition of FACT_PLAN_NEXT_WEEK, BOTH plans (spec P-9: 'B' is live, the window decides the side and the amount; 'A' is the shadow, the ladder decides the side and the window decides the amount). Reads V_PLAN_WINDOW_JUDGMENT ONCE and turns judgement into money: POT = the GOOD side's window spend per day, per family, never the family total (P-2); ALLOWANCE = allowance_share x pot, read from DE_PLAN_CONFIG for today's calendar state, RAMPED by closing one third of the gap between today's not-good spend and the allowance each window (P-8) and recomputed from actual spend every night so it converges with or without an upload; SEATS = not-good CANDIDATES ranked by dollars at stake x closeness to the bar (P-7), each costing its spend AT THE REPAIRED PRICE (P-6) and walked in rank order, taking the lowest free seat WHENEVER ITS OWN COST FITS THE ALLOWANCE STILL UNSPENT - spec section 4.4 is a FIT TEST and v27.136 implemented a prefix stop, which halted each family's seating at the first candidate that did not fit and parked every cheaper candidate behind it; a continuing occupant keeps its number from DE_FAMILY_SEAT_LEDGER and a new one takes the family's lowest number THE REGISTER IS NOT STILL HOLDING OPEN (v27.136 read only the seats it had itself filled, so open ledger numbers were reissued to other keywords and the register became two disagreeing authorities); A KEYWORD THE LADDER HAS CLOSED IS NOT SEATABLE AT ANY PRICE (v27.138: DEAD was tested only AFTER both seat branches, so ten closed keywords held seats and executable bids while one that did not fit was told a closed keyword is stopped, not re-priced - two opposite instructions from one ladder state in one partition); a continuing occupant that the REGISTER cannot number keeps its number from LAST NIGHT'S PLAN (v27.138: SP_MAINTAIN_FAMILY_SEATS admits only ladder occupant states, so the plan's AT_BAR and DEAD seats can never hold an open ledger row and were re-numbered nightly from an index into that night's rank order - half the first partition's seats); QUEUE = every candidate that did not fit, parked at the engine park price, HELD at a price already at or below it, or PAUSED whenever the ladder has already closed the keyword (spec section 4.5's 'paused if already closed'), planned spend zero by the spec's arithmetic with the row saying in WORDS that parking lowers a price and does not stop a spend; MOVES = exactly one executable instruction per candidate, none on the good side (P-4, which also keeps planned_bid and seat_cost_per_day NULL there) and none on a not-good keyword with nothing to repair (spec section 9); VERDICT DATE ON EVERY SEAT, held or repriced (P-12 is about seats, and a seat held at its current price is precisely the parking lot the ruling exists to prevent); planned_spend_delta_per_day on every row, so a repair that RAISES a keyword's spend says so in a column and not only in prose; BUDGETS = ramped one step and floored at THE MONEY THE PLAN CAN SEE INSIDE THAT CAMPAIGN - its good side, its seats at the repaired price AND the queue that keeps buying clicks at the park price (v27.138: the v27.137 floor was the plan's own arithmetic, which counts a queued keyword at zero, so it was satisfied by construction and a campaign whose spend is all queued was ramped towards a figure the plan's own PARK sentence disowns); NO MOVE AT ALL on a campaign the plan measured nothing in, or on a brand-defense campaign (v27.138: 19 campaigns with no spend and no clicks on any keyword the plan can see were ramped a third of the way towards ZERO, compounding nightly because the ramp re-reads the cap it wrote, one of them a BRAND DEFENSE campaign - breaking 'unmeasured never reads as bad' and 'defense is never judged on profit' at once); then snapped out of the forbidden 20.01-31.99 band and floored at 1.00. EVERY ROW PUBLISHES THE CAP'S OWN DISCLOSURE - campaign_planned_budget_delta_per_day, campaign_budget_basis (RAMPED / FLOORED_AT_NEED / NO_MOVE_UNMEASURED / NO_MOVE_BRAND_DEFENSE) and campaign_visible_spend_per_day - and says all three in words, because the cap is the largest number here and used to be the silent one. EVERY GUARANTEE IS ASSERTED BEFORE THE PARTITION IS TOUCHED: the rows are built into a temp table with the fact table's schema, the ASSERTs read that, and only a clean build reaches the partition - v27.136 deleted, inserted and then asserted inside an orchestrator EXCEPTION wrapper, so a broken guarantee left the violating partition committed. WRITING THIS TABLE ARMS TWO RULINGS the judgement view could not enforce before: the live rows' side becomes the P-14b guard's memory of 'was good' and verdict = GRACE spends P-5's one quiet window, so GRACE is written as GRACE and never collapsed into GOOD (acceptance C13 asserts the live plan reproduces the view row for row on side, verdict and candidacy). FOUR READINGS RECORDED FOR ORI IN THE SOP: a holdout campaign's money is excluded from the pot, the not-good side and the ramp (it still gets a counterfactual row and no move); a not-good keyword with no spend, no clicks and no probe nomination gets no seat, no queue position and no move; plan A holds a keyword the live plan protects at its current price rather than compute a second repaired price; and the implied budget sees only the plan's own keywords, which is why it is ramped rather than set. Idempotent (rewrites only today's partition) and deterministic (every ordering reaches the keyword key; the seat walk is a recursive rank walk over a total order). Called by SP_ORCHESTRATE_DAILY_REFRESH Task 20.8c, after the seat ledger at 20.8b. Acceptance: scripts/bigquery/tests/FACT_PLAN_NEXT_WEEK_acceptance.sql, 25 checks. Spec: docs/superpowers/specs/2026-08-23-next-week-money-plan-design.md sections 4, 5, 9. SOP: architecture/NEXT_WEEK_MONEY.md section 3."
    source_files: ["scripts/bigquery/procedures/SP_BUILD_NEXT_WEEK_PLAN.sql"]
    dependencies:
      - V_PLAN_WINDOW_JUDGMENT
      - DE_PLAN_CONFIG
      - DE_FAMILY_SEAT_LEDGER
      - FACT_PLAN_NEXT_WEEK

  - name: "V_HOLDOUT_READOUT"
    description: "The answer — the only object in the stack that tries to measure Ori's question ('the main goal of ads is to make more total dollars that we would do without the changes') against a control group that actually exists (v27.83, 2026-08-19). READ THE LIMITS BEFORE ANY NUMBER: THIS IS A HARM DETECTOR, NOT A VALUE CERTIFIER. The MDE at the chosen cell (20% share, 16 weeks, 14 holdout clusters) is $2,261 per 14 days, while the eligible population's ENTIRE 14-day net profit is about -$1,288 — the MDE is 1.76x the whole quantity being measured. An engine adding 7% of ad spend (~$900 per 14 days) is COMPLETELY INVISIBLE (detecting it would take 106 weeks); $1,300 needs 50 weeks; $1,800 needs 26. The ceiling is scale-invariant, so a bigger or smaller slice does not rescue it (drop the top-1 campaign: 18% of covered spend; top-3 18%; top-5 19%; whole population 17%) — the skew is not the binding constraint, the noise-to-signal ratio of 14-day net profit at this account size is. So 'no detectable difference' is NOT a verdict that the engine is worthless, it is a verdict that THE INSTRUMENT CANNOT SEE IT, and the emitted sentence says exactly that. The hypothesis this trial CAN settle in a quarter is 'the engine is doing large harm', which is live: the account's 14-day net moved from +$3,439 to -$2,470 over four months while the engine ran, and Ori's own scorecard measured account raises at -$752 against cuts at +$3,051. GATE: before 2027-01-05 the view returns exactly ONE row, state NOT_YET, every numeric column NULL, verdict 'not enough data yet — first readout 2027-01-05'. Deliberate on two counts — ads spend settles ~D+3 and sales accrue to D+7/D+14, and the TREATED arm has more recent changes by construction, so reading early systematically understates it (the readout date already contains the 14-day settle; do not pull it forward); and a daily-readable estimate on an underpowered trial WILL be read early and become the answer. The interim SAFETY look (2026-11-10, 8 weeks observed, can only detect harm above $3,133 per 14 days) is a deliberate one-time hand query in HOLDOUT.md, a circuit breaker and not a verdict, not something this standing view leaks every morning. WHAT IS COMPARED: unit = campaign; outcome = SUM(GROSS_PROFIT) - SUM(Ads_cost) from FACT_AMAZON_ADS, one paired source for both channels, normalised to a 14-day rate (GROSS_PROFIT is READ, never recomputed — THE GP RULE); baseline = net_28d_at_assign frozen in DE_HOLDOUT_ASSIGNMENT, a pre-period that existed BEFORE the coin flip. SPLIT BY THE ENGINE'S INTENDED ACTION CLASS from FACT_ENGINE_PROPOSALS — this is the point of the whole architecture: SP_ENGINE_PREFLIGHT blocks the EXPORT for a holdout campaign but the proposal is still RECORDED with its intended action, so the readout can compare 'the engine wanted to cut AND we cut' against 'the engine wanted to cut AND the coin said do not'. Without that record the holdout arm would be a black box. TWO ESTIMATES, both unbiased under randomization: diff_raw (difference of arm means, assumes nothing) and diff_adjusted (the same on CHANGE SCORES against the frozen pre-period, which strips the realized level gap — on the assignment date the holdout arm ran at -$0.053 of net per ad dollar and the treated arm at -$0.110, chance worth about $146 per 14 days, ~6% of the MDE). Both scaled to the account by the number of eligible units, because the question is about TOTAL dollars. BAND = t_mult x SE of the difference of means, t_mult 3.27 (the design's small-sample cluster multiplier at 14 clusters; a naive t(0.975,13) would be 2.16, so the published band is the conservative one); the design's ex-ante MDE is published beside it. Smoke-tested on a simulated Jun-Jul window: realized band $2,976 on 4.36 fourteen-day periods, which rescales to about $2,198 over the trial's 8 periods and independently reproduces the design's $2,261. PRE-REGISTERED INFERENCE CAVEATS: with 14 clusters the right p-value is a PERMUTATION p-value against the exact assignment distribution permuted INSIDE the rerandomization acceptance region, not a t-test (the band here is an orientation device); and a leave-one-out sensitivity check is required because the largest eligible campaign is 11.2% of the money on its own. SUBGROUP CAVEAT: the ALL row is the trial; the per-action-class rows are EXPLORATORY — the trial is powered for the total and nothing else, every split multiplies the MDE, and the emitted sentence for those rows says so. v27.98 (2026-08-21): the action-class split now reads COALESCE(held_bid, suggested_bid) so it also sees the proposals the LAST-DAY VETO held. Those rows used to be erased from FACT_ENGINE_PROPOSALS rather than labelled, and reading held_bid is not optional: a held row has suggested_bid NULL, so without it every held RAISE would fall to the ELSE branch and be counted as a BID_DOWN - the trial would split on the opposite of what the engine wanted. This is also what makes the veto measurable inside a trial that is already running. Spec: architecture/HOLDOUT.md."
    source_files: ["scripts/bigquery/views/V_HOLDOUT_READOUT.sql"]
    dependencies:
      - DE_HOLDOUT_ASSIGNMENT
      - FACT_AMAZON_ADS
      - FACT_ENGINE_PROPOSALS

  - name: "V_DAILY_BRIEF"
    description: "One query answers Ori's three daily questions (2026-08-15): PLANNED (latest FACT_ENGINE_PROPOSALS snapshot), HAPPENED (changes applied last 48h, status planned/unplanned by matching the proposal snapshot of the applied day — unplanned rows are the manual-divergence raw material), VERDICT_NEW (scorecard verdicts whose read_gate_date crossed in the last 3 days — THE LAG IS THE INSTRUMENT, a change is judged at T+14/SB T+21, never earlier), ACTION_ITEM (REVERSED verdicts, remedy = restore remedy_value NEVER lower, not yet superseded by a later change, from the last 14 days of newly-readable grades — Ori's 'if after a change it became worse this is not good', mechanized). Uniform row shape: section/source/campaign_name/item/action/from_value/to_value/status/detail. v27.98 (2026-08-21): veto-held rows (hold_source IS NOT NULL) are skipped in PLANNED - that section is what the engine wants DONE today, and a held row is the engine saying wait; it is recorded in FACT_ENGINE_PROPOSALS for the audit trail, not for the morning list - and skipped in the planned/unplanned join, so a hand change on a held keyword is not mislabelled planned with an empty proposed value. v27.102 (2026-08-21) ONE KEYWORD, ONE PRICE. This view read the very table SP_ENGINE_PREFLIGHT stamps its verdict onto and never read the verdict column, so every collision loser the gate had already refused was printed in PLANNED beside the instruction that beat it, at its own price, with nothing on the row saying it had lost - and the bulksheet is built BY HAND off this list, so the bid that reached Amazon was decided by which line the eye landed on first. The gate was never broken: it resolves every contention to one surviving instruction and it resolved them onto the table, where no reader downstream ever asked. Three places quoted a price and all three now quote the survivor: PLANNED lists exportable instructions only (verdict GO or REVIEW, or none - an unstamped row fails OPEN into the plan) with REVIEW rows leading with the gate's caution; HAPPENED's 'the engine proposed N' and ACTION_ITEM's CONFLICT clause both read a new `survivor` CTE, one instruction per (day, campaign, keyword, lever), so a contended keyword no longer duplicates the row once per proposing engine each quoting a different number. Those two joins also gained a LEVER test they never had: a campaign-grain change keys on keyword_id '' and so does every NEGATE in the campaign, so a search-term block was marking hand PAUSES 'planned' and demoting a campaign-budget restore to REVIEW, printing a blank sentence both times (a negate carries no value, so the CONCAT quoting the price returned NULL and took the whole sentence with it). NOTHING IS DELETED: refused instructions move to a new SKIPPED section carrying the gate's plain sentence and the value they wanted - block the export, never the judgement. section_rank renumbered, order unchanged: PLANNED 1, SKIPPED 2, HAPPENED 3, VERDICT_NEW 4, ACTION_ITEM 5. Standing assertion: V_ENGINE_HEALTH.plan_price_ambiguity on the proposal table, plus scripts/bigquery/check_one_price_per_key.py (wired into scripts/run_tests.sh) which asks the same question of PLANNED itself - the arm that would have caught this, since on the day it was found the table was clean and the list was not. Daily ritual: SELECT * ORDER BY section_rank. Planner note: the scorecard subtree appears in two lean UNION arms; if the planner ever objects, snapshot the scorecard like the guard. v27.123 (2026-08-23, family seat register Task 4): a sixth section SEATS, appended at section_rank 6 so the five existing sections keep their numbers and their order — one plain line per WORKING family carrying the 80/20 doctrine read: how much of the family's judged spend is winning, at its bar or waiting for a verdict; what the 20% side costs (from_value) against what it is allowed to cost (to_value); the doctrine status as status; and what that side is made of, counted from the register's own per-row rows — numbered seats on the 20% side, leaks still spending, untracked keywords. It is a POSITION, not a proposal: it names no book, restates no projection and promises no recovery, and its closing clause sends the reader to the register's own rows, where the gap-closure arithmetic of ruling R-l is stated once and asserted once. It names no campaign and no keyword, which is why the holdout rule has nothing to mark on it. It reads T_FAMILY_SEAT_REGISTER — the same image V_RUN_SUMMARY's SEATS section and the SeatRegister cube read, so the three surfaces cannot quote different numbers at the same reader — and prints on every line the ads window it was measured on and the keyword snapshot it came from, so a reader who built a book since the last pass can see that this line has not seen it yet. The label CASE names every status the register can emit and every FORMAT argument is COALESCEd, because CONCAT with one NULL argument returns NULL and an empty line is worse than a wrong one. Acceptance: scripts/bigquery/tests/SEAT_SURFACE_acceptance.sql (C01–C04, C09, C10 — the line's figures are re-derived from the register's own per-row costs, never read back off the sentence as confirmation, and every check counts an empty section as a violation of itself) and scripts/bigquery/tests/check_seat_surface_labels.py. Spec: architecture/DAILY_BRIEF.md, architecture/FAMILY_SEAT_REGISTER.md. v27.124 (2026-08-23, family seat register cleanup): the SEATS action is derived from what is EXECUTABLE — counted from the register image's own sheet_row per family, in one fixed priority: rebuild a stale leak book > upload the pending book (named) > build the next book > by hand (stalled probes) > nothing executable — and only when nothing is executable does the doctrine status speak, an OUT family then reading 'nothing executable today — the gap depends on rulings and re-judging'. Before: a CASE on the status alone said 'close the gap' to a family whose register row listed nothing to pause and 'passes — no action' to families with leaks already written on a pending book. The detail sentence names every executable count. Both doctrine_status CASEs also name the bare UNMAPPED literal the register emits outside its CASE (the file checker now reads bare literals). Asserted by SEAT_SURFACE_acceptance C11 and check_seat_surface_labels.py. v27.125 (2026-08-23, tenth pass): the 'rebuild the leak book' action names the stale batch after --replaces — the generator requires it and refuses a build without it, so the earlier template was not executable as written — reading the batch ids register-wide off the REBUILD_LEAK_BOOK leak rows; and a repair the register marks ENGINE_PRICES / TOO_THIN_TO_PRICE (B38) is named in a 'Not on any sheet' clause of the detail and never counted toward an action. Asserted by SEAT_SURFACE_acceptance C13."
    source_files: ["scripts/bigquery/views/V_DAILY_BRIEF.sql"]
    dependencies:
      - FACT_ENGINE_PROPOSALS
      - V_CHANGE_SCORECARD
      - V_PPC_CHANGE_LOG_APPLIED

