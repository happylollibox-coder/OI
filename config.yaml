# ═══════════════════════════════════════════════════════════════
# FUNCTIONS
# ═══════════════════════════════════════════════════════════════

functions:
  - name: "FN_ADS_ANCHOR_CAP"
    description: "Calendar cutoff for the launch controller's 'last complete day' anchor (LA-time ads data). Returns YESTERDAY (LA) normally, but the CURRENT LA day once it's within its last 2 hours (hour>=22) — sales are effectively done by then (Ori 2026-07-18), so the day counts as complete enough and can be the anchor, instead of waiting for LA midnight. Used by V_LAUNCH_PHASE1, V_RUN_TARGET, V_RUN_SEARCH_TERM, V_LAUNCH_CARD_DAILY as LEAST(MAX(date), FN_ADS_ANCHOR_CAP())."
    source_files: ["scripts/bigquery/functions/FN_ADS_ANCHOR_CAP.sql"]
    type: "sql_udf"

  - name: "FN_PLAN_CALENDAR_STATE"
    description: "v27.131 (2026-08-23): FN_PLAN_CALENDAR_STATE(d DATE) -> 'PEAK' | 'BOOST' | 'OFF_PEAK' from the LIVE DIM_US_HOLIDAYS (categories gift_season/prime_event/back_to_school/seasonal, rows with a boost_start): PEAK = peak_start .. COALESCE(cooldown_end, holiday_date + 3) and WINS; BOOST = boost_start .. the day before COALESCE(peak_start, holiday_date); else OFF_PEAK. PEAK wins because the live seasons overlap — one date sits inside one season's peak and another season's run-up at the same time — and the plan needs one window and one share per date; the tighter window is the safer read while money is moving. Never returns NULL. The next-week money plan pairs it with DE_PLAN_CONFIG (window, share, ramp and order floor per state); the backtest calls it on historical dates. Read the live shape of the year with the function itself rather than from a document, because editing the calendar moves it — and note that under this precedence PEAK, not OFF_PEAK, is the majority state of the live calendar year, which is a ruling for Ori and not a build detail (see the SOP). Acceptance: scripts/bigquery/tests/PLAN_CONFIG_acceptance.sql. Spec P-13, §3."
    source_files: ["scripts/bigquery/functions/FN_PLAN_CALENDAR_STATE.sql"]
    type: "sql_udf"

  - name: "FN_BID_FLOOR"
    description: "v27.104 (2026-08-22): THE ONE DEFINITION of a target's platform/house bid floor. FN_BID_FLOOR(channel, creative_type) -> STRUCT<bid_floor, bid_floor_source>: channel <> 'SB' -> $0.20 SP_HOUSE_0.20 (Amazon's SP minimum is $0.02, but a bid that low buys no placement worth having); SB + PRODUCT_COLLECTION/STORE_SPOTLIGHT -> $0.10 SB_COLLECTION_0.10 (Amazon minBid); SB video (BRAND_VIDEO/VIDEO) or NULL creative_type, or NULL channel -> $0.25 SB_VIDEO_0.25 (Amazon minBid; $0.15 and $0.20 rejected in r32/r33; NULL resolves conservatively, exactly as V_LAUNCH_BID_LADDER's CASE always did). Declared constants — platform minimums and one house choice, Standing Rule 0 exempt. Lifted out of V_LAUNCH_BID_LADDER's k CTE so no engine holds a private copy (the v27.103 state ladder's flat $0.25 was V_OOB_KEYWORD's bid_park, a parking price, and it manufactured three phantom kills). Readers: V_LAUNCH_BID_LADDER (direct), V_BID_FLOOR -> SP_SNAPSHOT_KEYWORD_STATE / tools/build_reprice_bulksheet.py. Spec: architecture/KEYWORD_STATE.md 'The floors'."
    source_files: ["scripts/bigquery/functions/FN_BID_FLOOR.sql"]
    type: "sql_udf"

  - name: "FN_EXTRACT_SEGMENTS"
    description: "Single source of truth for search-term segment extraction (gender, age_group, occasion, holiday). Consumed by V_SQP_QUERY_WEEKLY, V_RESEARCH_RANKED, SP_DERIVE_PRODUCT_SEGMENTS, segment-reasoning endpoint."
    source_files: ["scripts/bigquery/functions/FN_EXTRACT_SEGMENTS.sql"]
    type: "sql_udf"

  - name: "FN_EXTRACT_BUDGET"
    description: "The SIXTH query facet: what the SHOPPER said about their budget. Companion to FN_EXTRACT_SEGMENTS. Returns STRUCT<budget_tier STRING, price_ceiling FLOAT64>. NOT the same as FACT_RESEARCH_RANKED.price_bucket, which is OUR price vs the market (A. Cheaper … E. Way above) — this is the customer's own stated constraint read from their words. Tiers: UNDER_N (explicit ceiling, wins over vague words so \"cheap gifts under $20\" is UNDER_N), DEAL_SEEKER (deals/cheap/bargain, no number), PREMIUM (luxury/high-end/splurge), NULL. price_ceiling is populated only for UNDER_N and is anchored on the price phrasing so \"gifts under 10 dollars for 12 year old girls\" reads 10, not 12. Measured 2026-07-24 — a monotonic ladder: PREMIUM 4.47% CVR / $0.885 GP-per-click / 1.77 GP-ROAS, no budget language 3.70% / $0.653 / 1.30, DEAL_SEEKER 1.74% / $0.335 / 1.04, UNDER_N 1.17% / $0.269 / 0.77 (loses money). Edit ONLY here. Consumed by V_ADS_SEARCH_TERM_FACETS."
    source_files: ["scripts/bigquery/functions/FN_EXTRACT_BUDGET.sql"]
    type: "sql_udf"

  - name: "FN_FETCH_EXCHANGE_RATES"
    description: "Remote function to fetch exchange rates via Cloud Function"
    source_files: ["scripts/bigquery/functions/FN_FETCH_EXCHANGE_RATES.sql"]
    type: "remote_function"

  - name: "FN_COVERAGE_CAMPAIGN"
    description: "Window-parameterized table function behind the coverage cockpit tree. FN_COVERAGE_CAMPAIGN(win_start DATE, win_end DATE, peak_only BOOL) — table-function version of V_COVERAGE_CAMPAIGN with identical cell/status/reason logic, but the (asin×campaign) metric window is the caller-supplied [win_start, win_end] and peak_only=TRUE restricts to gift-season days (DIM_US_HOLIDAYS category='gift_season'). The whole result reflects the window: coverage counts, status AND measures. Gate = 'served impressions in the window' (a pair with 0 window impressions isn't coverage FOR that window). Called by /api/daily-workflow, which maps its 7 toggle windows (today/yesterday/7d/30d/90d/12mo/peak) to (start,end,peak_only). DARK (2026-07-23): also emits n_dark + dark_campaigns — campaigns state=ENABLED that served NO impressions in the last 30d. Because the window gate drops them, such a campaign would otherwise vanish and its cell read 'missing' as if nothing were configured (inviting a duplicate build); status becomes 'dark' when n_enabled=0 AND n_dark>0. Delivery check uses FACT_AMAZON_ADS (covers SP **and** SB — advertised_product omits Sponsored Brands, so checking it alone flags the whole SB portfolio as dark); cell link uses the EXPLICIT mapping (DIM_EXPERIMENT_CAMPAIGN→DIM_EXPERIMENT + DE_CAMPAIGN_FAMILY) because V_CAMPAIGN_ROLE is 90d-activity-gated and blind to these. 'Dark' is judged on the last 30d regardless of the selected window: window governs money, current state governs work."
    source_files: ["scripts/bigquery/functions/FN_COVERAGE_CAMPAIGN.sql"]
    type: "table_function"

  - name: "FN_COVERAGE_CAMPAIGN_DETAIL"
    description: "Window-parameterized table function for the coverage cockpit's S2 VERIFY evidence (one row per cell_key × campaign). FN_COVERAGE_CAMPAIGN_DETAIL(win_start DATE, win_end DATE, peak_only BOOL) — table-function version of V_COVERAGE_CAMPAIGN_DETAIL; same evidence + profit verdict, metrics over [win_start, win_end] (peak_only restricts to gift-season days). Gate = served impressions in the window, so evidence matches FN_COVERAGE_CAMPAIGN cell-for-cell under the same window. Called by /api/daily-workflow."
    source_files: ["scripts/bigquery/functions/FN_COVERAGE_CAMPAIGN_DETAIL.sql"]
    type: "table_function"

  - name: "FN_COVERAGE_UNMAPPED"
    description: "Window-parameterized table function for the coverage cockpit UNMAPPED guard tile. FN_COVERAGE_UNMAPPED(win_start DATE, win_end DATE, peak_only BOOL) — table-function version of V_COVERAGE_UNMAPPED; campaigns not classified into any of the 6 strategies, advertised activity aggregated over [win_start, win_end] (peak_only restricts to gift-season days). Dormant 'OTHER' campaigns (no activity in the window) still surfaced. Called by /api/daily-workflow. is_archived (2026-07-23): flags state='ARCHIVED'. An archived campaign can never need mapping — in wide windows they dominated the list (42 of 44 at 12mo). The endpoint keeps their spend in the P&L rollups (wide-window money stays truthful) but excludes them from the to-do list + badge; the UI shows a count of what was held back rather than silently hiding it."
    source_files: ["scripts/bigquery/functions/FN_COVERAGE_UNMAPPED.sql"]
    type: "table_function"

  - name: "FN_COVERAGE_CAMPAIGN_PROFIT"
    description: "Window-parameterized table function for the coverage cockpit's per-campaign P&L (strategy/family profit split). FN_COVERAGE_CAMPAIGN_PROFIT(win_start DATE, win_end DATE, peak_only BOOL) — windowed replacement for V_COVERAGE_CAMPAIGN_PROFIT7D; one row per campaign with spend>0 in [win_start, win_end] (peak_only restricts to gift-season days), same 6-strategy lens. At win=7d it matches V_COVERAGE_CAMPAIGN_PROFIT7D exactly. Columns: campaign_id, parent_name, strategy, clicks, spend, units, margin, net_profit, profitable. Called by /api/daily-workflow."
    source_files: ["scripts/bigquery/functions/FN_COVERAGE_CAMPAIGN_PROFIT.sql"]
    type: "table_function"

  - name: "FN_TARGET_BID_SHADOW"
    description: "The target-bid model itself, parameterized so the SAME arithmetic can be evaluated at any historical anchor. FN_TARGET_BID_SHADOW(anchor DATE, apply_season_gate BOOL) — V_TARGET_BID_SHADOW calls it at today's settled anchor with TRUE; the backtest calls it at 2026-03-13 / 04-12 / 05-12 / 06-11 with FALSE (V_KEYWORD_CONTEXT_GATE is current state and would leak the future). There is deliberately no second implementation to drift. Emits target_cpc AND target_bid as separate columns plus every input (cvr_hat and its family/campaign/own components, gp_per_order, breakeven_cpc, the evidence weights w_own/w_campaign/w_family/w_account, k_transfer, bid_floor, bid_cap_safe, binding_clamp, expected_cpc_at_target_bid) so any row can be audited by hand. anchor MUST be a settled date: SP Ads_orders = purchases_30_d, SB = attributed_conversions_14_d. Constants sourced from the 2026-08-11 cvr-structure / margin-structure / bid-to-cpc studies; see the file header and architecture/TARGET_BID_SHADOW.md. SHADOW: not referenced by V_ADS_COACH, V_OOB_KEYWORD, V_KEYWORD_LIFT, V_COACH_APPLY, the bulksheet generator, Cube or any endpoint."
    source_files: ["scripts/bigquery/functions/FN_TARGET_BID_SHADOW.sql"]
    type: "table_function"

  - name: "FN_COVERAGE_SB"
    description: "Sponsored Brands rows for the coverage cockpit. FN_COVERAGE_SB(win_start DATE, win_end DATE, peak_only BOOL) — emits rows shaped like FN_COVERAGE_CAMPAIGN's live_base source (parent_name, asin, gp_per_unit, campaign_id, impressions, clicks, cost, units, last_seen) so the SP and SB paths can be UNIONed. EXISTS BECAUSE every other coverage fn links asin<->campaign via V_SRC_AmazonAds_advertised_product = the Sponsored PRODUCTS report; SB campaigns never appear there, so the whole SB portfolio (16 enabled, ~$27.5k/90d) was invisible to every cell/count/P&L (Ori 2026-07-23). units/sales come from fivetran-hl.amazon_ads.sb_purchased_product (the ONLY SB table Fivetran populates with units — units_sold_14_d is present-but-NULL on sb_campaign_report/ad_group/keyword/ad/placement and all-zero on target_report), giving REAL per-purchased-ASIN attribution; attribution_type='Promoted' only ('Brand Halo' would double-count other products). cost/clicks/impressions come from sb_campaign_report (campaign grain only) and are allocated across the window's purchased ASINs PRO-RATA BY UNITS so allocated cost sums back to campaign cost exactly (verified $0.00 diff). Campaigns that spent but converted nothing in the window emit one full-cost row with units=0 against their home family (dominant purchased family, else DE_CAMPAIGN_FAMILY) so short windows don't silently drop spend. NOTE purchased_asin is the ASIN actually bought, a different basis than the SP side's advertised ASIN. Consumed by FN_COVERAGE_CAMPAIGN, FN_COVERAGE_CAMPAIGN_DETAIL, FN_COVERAGE_CAMPAIGN_PROFIT."
    source_files: ["scripts/bigquery/functions/FN_COVERAGE_SB.sql"]
    type: "table_function"

  - name: "FN_COVERAGE_KEYWORD"
    description: "Window-parameterized table function for the coverage cockpit's KEYWORD panel. FN_COVERAGE_KEYWORD(win_start DATE, win_end DATE, peak_only BOOL) — windowed version of V_COVERAGE_KEYWORD (which is now a thin 90d wrapper over this; edit rules HERE, not there). Every RUNNING measure is aggregated over [win_start, win_end] (peak_only restricts to gift-season days): clicks, cost, cpc, units_7d, net_roas, target_cpc, profit_state — so the cockpit's Time-window toggle governs keyword metrics the same way FN_COVERAGE_CAMPAIGN governs cells. MISSING (recommendations), relevance and intent routing are NOT windowed (research state, not period performance). net_roas = SUM(units_7d) × family_gp / SUM(cost); target_cpc = cvr × family_gp / INTENT floor = units_7d × gp / (clicks × floor), NULL under 10 in-window clicks. Grain: parent_name × match_type × keyword_text. Called by /api/coverage-keywords?window=."
    source_files: ["scripts/bigquery/functions/FN_COVERAGE_KEYWORD.sql"]
    type: "table_function"

  - name: "FN_COVERAGE_COMPETITOR_TARGET"
    description: "Competitor ASIN targets you ALREADY run. FN_COVERAGE_COMPETITOR_TARGET(win_start DATE, win_end DATE, peak_only BOOL) — one row per (parent_name × target), where target is the ASIN / category string stripped out of FACT_AMAZON_ADS.targeting. The COMPETITOR strategy targets PRODUCTS not keywords, so its coverage cells get this instead of the keyword panel (Ori 2026-07-23). Only ASIN / ASIN EXPANDED / CATEGORY targeting rows, and only campaigns whose V_CAMPAIGN_ROLE.strategy_category = 'COMPETITOR', so keyword spend can never leak in. net_roas = SUM(units) × family_gp / SUM(cost); target_cpc = units × gp / (clicks × COMPETITOR PROFITABLE_ROAS floor), NULL under 10 in-window clicks; is_winner = net_roas >= 1. Family comes from V_SRC_AmazonAds_advertised_product (the authoritative asin<->campaign link) — FACT_AMAZON_ADS's own ASIN columns mis-attribute across families. Called by /api/competitor-targets."
    source_files: ["scripts/bigquery/functions/FN_COVERAGE_COMPETITOR_TARGET.sql"]
    type: "table_function"

  - name: "FN_COMPETITOR_CANDIDATE"
    description: "Competitor ASINs to PROMOTE. FN_COMPETITOR_CANDIDATE(win_start DATE, win_end DATE, peak_only BOOL) — one row per (parent_name × candidate ASIN) discovered as a raw-ASIN SEARCH TERM inside DISCOVERY campaigns (V_CAMPAIGN_ROLE.strategy_category IN AUTO/BROAD_SP/BROAD_VIDEO/BROAD_SPOTLIGHT). Auto ads land on other people's product pages, so their search terms include the ASINs of those pages; one that converts profitably deserves a deliberate Competitor target. EXCLUDES our own ASINs (that would be cross-sell/Product Defense, i.e. attacking ourselves) and ASINs already targeted by a COMPETITOR campaign. is_candidate = clicks >= 10 AND net_roas >= the COMPETITOR PROFITABLE_ROAS floor (COALESCEd to GLOBAL). winner_variation/winner_asin = which of OUR variations actually SOLD on that placement, used by FN_COMPETITOR_CAMPAIGN_PLAN to group campaigns. DETERMINISM FIX 2026-07-23: the winner was picked with ANY_VALUE, which is non-deterministic — 49 of 62 LolliME (family × ASIN × variation) rows had 2+ candidates and the same window returned Purple 16/Mint 13/Pink 5 on one run and Mint 34/0/0 on another. Now picked by a fully-ordered ROW_NUMBER (units DESC, clicks DESC, cost DESC, name); every candidate ASIN has units>0 under exactly ONE variation, so units alone decides it. Called by /api/competitor-targets and FN_COMPETITOR_CAMPAIGN_PLAN."
    source_files: ["scripts/bigquery/functions/FN_COMPETITOR_CANDIDATE.sql"]
    type: "table_function"

  - name: "FN_COMPETITOR_CAMPAIGN_PLAN"
    description: "Competitor candidates grouped into ready-to-create campaigns — the WRITE side of FN_COMPETITOR_CANDIDATE. FN_COMPETITOR_CAMPAIGN_PLAN(win_start DATE, win_end DATE, peak_only BOOL). Grain: one row per (parent_name × winner_variation × tier_code × chunk_index × candidate_asin), each carrying its group's campaign fields so a client can list ASINs or GROUP BY campaign_key without a second query. GROUPING = winner_variation × bid tier, max 10 ASINs: by VARIATION because a campaign advertises a product (SB video creative shows one variation, and the variation that already sold on that page is the one that wins it); by TIER (DE_COMPETITOR_BID_TIER) because a campaign shares ONE bid; chunk size from DE_COACH_THRESHOLDS.COMPETITOR_MAX_ASINS_PER_CAMPAIGN. Chunked by target_cpc DESC with a fully-ordered tiebreak, so membership is STABLE across refreshes. EXISTING WINNERS ARE EXCLUDED: opening a new campaign against an ASIN you already target makes your own campaigns bid against each other; rebalancing an existing target is a bid UPDATE and already ships via V_ADS_COACH -> Do queue. suggested_bid = group MIN(target_cpc), the only bid at which EVERY member still clears the profit floor (at MEDIAN 33/127 candidates and at AVG 52/127 would bid above their own break-even; at MIN, zero), then clamped into the COMPETITOR template's [bid_min, bid_max]; suggested_bid_raw + bid_capped expose when the $2 ceiling binds. proj_spend = suggested_bid × window clicks, proj_margin = SUM(net_roas × cost) (= SUM(units) × family_gp, same basis as net_roas), proj_net_roas = the ratio — directional, not a forecast. Campaign names follow the live convention derived from V_SRC_AmazonAds_campaign_history: {PREFIX}-SP/PT (Conquest, {Variation}, {Tier}{n}). Budgets/bid bounds come from DIM_STRATEGY_CAMPAIGN_TEMPLATE strategy_id='COMPETITOR'. Called by /api/competitor-campaign-plan; consumed by the DoPage bulksheet ADD_COMPETITOR_TARGET branch."
    source_files: ["scripts/bigquery/functions/FN_COMPETITOR_CAMPAIGN_PLAN.sql"]
    type: "table_function"

