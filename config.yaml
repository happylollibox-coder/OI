    description: "The standing self-check (Task 3.3, 2026-08-16): one row per check — GREEN/AMBER/RED with measurement AND threshold printed together. Nine checks: contradiction_rate, ownership_overlaps, the two V_KEYWORD_STATE invariants, overdue_appointments, scorecard_reversed_share (the one ceiling-view arm), manual_better_unresolved, snapshot_freshness, noop_leakage. First board: RED contradiction 31.8% (the gate works; the engines structurally overlap — future refinement is to stop GENERATING the overlap), AMBER overdue 78 + reversed-share 41.1, six GREEN. Surfaces on the Weekly Run summary strip (Phase 6). Spec: architecture/ENGINE_HEALTH.md."
