    source_files: ["scripts/bigquery/tables/DE/DE_COACH_THRESHOLDS.sql"]

  - name: "DE_PEAK_OVERRIDES"
    description: "Manual peak-relevance overrides — force a family into BLITZ for a holiday V_PEAK_RELEVANCE can't measure (launched into the only completed occurrence → no clean baseline). UNIONed into V_ADS_COACH.family_holiday_relevance on force_relevant=TRUE. Judgment override; remove once the family has a clean prior-year baseline (auto-qualifies)."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE/DE_PEAK_OVERRIDES.sql"]

  - name: "DE_PEAK_RELEVANCE_OVERRIDE"
    description: "Manual override of V_PEAK_RELEVANCE.is_relevant_peak per (family, holiday). Injects/overrides at the CANONICAL relevance layer so it flows to BOTH the OFF/PEAK season split (V_WEEKLY_CELL_NET → plan seasonal net columns) AND the coach (family_season + BLITZ). Fixes peaks the 90-day maturity gate drops (LolliME/Bottle Christmas). Preferred over DE_PEAK_OVERRIDES (which only reaches the coach)."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_PEAK_RELEVANCE_OVERRIDE.sql"]

  - name: "DE_BUDGET_CONFIG"
    description: "Knobs for the Weekly Run budget waterfall + daily optimizer (total_daily_budget=700, family_floor_daily=10, margin/boost/close ROAS thresholds, increase %s, out-of-budget util). Keyed like DE_COACH_THRESHOLDS; Ori-editable without a deploy. Spec: docs/superpowers/specs/2026-07-05-weekly-run-budget-waterfall.md"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE/DE_BUDGET_CONFIG.sql"]

  - name: "DE_CAMPAIGN_FAMILY"
    description: "campaign_id→family override for the coacher's ASIN-blind campaigns. Video/SB/Store campaigns report most_advertised_asin='Unknown' → no DIM_PRODUCT match → V_ADS_COACH_DATA's inner asin_economics JOIN drops them. Supplies parent_name directly as a fallback when the ASIN yields no family. 'Store' is a virtual family (whole-store brand campaigns, no product ASIN)."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE/DE_CAMPAIGN_FAMILY.sql"]

  - name: "DE_CAMPAIGN_STRATEGY"
    description: "Manual per-campaign strategy override (Admin Campaign Strategy panel). Highest precedence in V_CAMPAIGN_STRATEGY_RESOLVED."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE/DE_CAMPAIGN_STRATEGY.sql"]

  - name: "DE_NEGATIVE_KEYWORDS"
    description: "Warehouse-owned negative-keyword registry (replaces frozen Fivetran negative_keyword sync). Seeded from an Amazon bulksheet download via tools/load_negatives_seed.py; maintained by SP_SYNC_NEGATIVES from FACT_PPC_CHANGE_LOG."
    type: "data_entry"
