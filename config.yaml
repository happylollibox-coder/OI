    description: "Column-reordered passthrough view over FACT_ADS_COACH_ACTIONS for human-readable ad-hoc queries"
    source_files: ["scripts/bigquery/views/V_ADS_COACH_ACTIONS.sql"]

  - name: "V_AMAZON_ADS_TOP_SEARCH_QUERY_TERMS_WEEKLY"
    description: "Top search query terms from Amazon Ads weekly"
    source_files: ["scripts/bigquery/views/V_AMAZON_ADS_TOP_SEARCH_QUERY_TERMS_WEEKLY.sql"]

  - name: "V_ADS_FOCUS_TERMS"
    description: "Pre-ranked top 10 winners + top 10 losers by search term per week (net profit). Other terms aggregated. ~546 rows for Cube.js."
    source_files: ["scripts/bigquery/views/V_ADS_FOCUS_TERMS.sql"]
    dependencies:
      - FACT_AMAZON_ADS

  - name: "V_ADS_FOCUS_KEYWORDS"
    description: "Pre-ranked top 10 winners + top 10 losers by keyword target per week (net profit). Mirrors V_ADS_FOCUS_TERMS but groups by targeting (bid keyword) instead of search_term."
    source_files: ["scripts/bigquery/views/V_ADS_FOCUS_KEYWORDS.sql"]
    dependencies:
      - FACT_AMAZON_ADS
      - DIM_PRODUCT

  - name: "V_INTENT_KEYWORDS"
    description: "Terms matched to intent THEMES (DE_INTENT_THEMES) and ranked within (parent_name x intent_key) by FACT_RESEARCH_RANKED.rank; is_top10 flags the campaign keyword set (<=10). Grain parent_name x intent_key x query_text — family-grain, matching the campaign grain (only AUTO is per product). Carries the 90d ads money signal per (family x intent) over ALL matched terms (ads_spend/ads_clicks/ads_orders/ads_net_roas). is_relevant decides the campaign set, first rule wins: (1) DE_FAMILY_INTENT_OVERRIDE.force_relevant, (2) TIME_BASED always (rank is zeroed off-season; season_start/season_end from DIM_US_HOLIDAYS govern), (3) PROFIT gate — drop when ads_clicks>=100 AND ads_net_roas<1.0 (rank is FIT not profit: LolliME/school = rank 63 but 0.27x on 613 clicks), (4) FIT gate family_best_rank>=60. relevance_reason exposes the trace. Own-brand terms are excluded up front (anti-join on DIM_BRAND_PHRASES) — brand belongs to Brand Defense, not generic/competitive intents. Feeds the Research intents panel + Brand Spotlight and (later) intent campaign build. SOP: architecture/INTENT_CAMPAIGN_MODEL.md"
    source_files: ["scripts/bigquery/views/V_INTENT_KEYWORDS.sql"]
    dependencies:
      - FACT_RESEARCH_RANKED
      - DE_INTENT_THEMES
      - DE_FAMILY_INTENT_OVERRIDE
      - DIM_US_HOLIDAYS
      - FACT_AMAZON_ADS
      - DIM_PRODUCT
      - DIM_BRAND_PHRASES

  - name: "V_BRAND_KEYWORD_CLASSIFICATION"
    description: "Classifies keywords as brand, competitor, or generic"
    source_files: ["scripts/bigquery/views/V_BRAND_KEYWORD_CLASSIFICATION.sql"]

  - name: "V_BRAND_SEARCH_MONTHLY"
    description: "Monthly branded search purchases (brand-level). Uses DIM_BRAND_PHRASES for term detection. Powers PlanWizard Growth step."
    source_files: ["scripts/bigquery/views/V_BRAND_SEARCH_MONTHLY.sql"]

  - name: "V_BRAND_STRENGTH_WEEKLY"
    description: "Weekly brand strength tracking with phrase type, product, and tag metadata"
    source_files: ["scripts/bigquery/views/V_BRAND_STRENGTH_WEEKLY.sql"]

  - name: "V_DATA_FRESHNESS"
    description: "Data freshness monitoring — latest date and staleness status for every key table"
    source_files: ["scripts/bigquery/views/V_DATA_FRESHNESS.sql"]

  - name: "V_EXPERIMENT_EVALUATION"
    description: "Experiment evaluation metrics and scoring"
    source_files: ["scripts/bigquery/views/V_EXPERIMENT_EVALUATION.sql"]

  - name: "V_EXPERIMENT_VARIATION_COMPARISON"
    description: "Side-by-side experiment variation comparison"
    source_files: ["scripts/bigquery/views/V_EXPERIMENT_VARIATION_COMPARISON.sql"]

  - name: "V_KEYWORD_STRATEGY_PREDICTIONS"
    description: "Keyword strategy prediction model results"
    source_files: ["scripts/bigquery/views/V_KEYWORD_STRATEGY_PREDICTIONS.sql"]

  - name: "V_KEYWORD_INTENT_CLASS"
    description: "Classifies each ad keyword as BRAND/PRODUCT/GENERIC (brand dict + research fit + anchors + manual override)"
    source_files: ["scripts/bigquery/views/V_KEYWORD_INTENT_CLASS.sql"]

  - name: "V_SNAPSHOT_REMAINING_COSTS_SUMMARY"
    description: "Summarized remaining costs by product family"
    source_files: ["scripts/bigquery/views/V_SNAPSHOT_REMAINING_COSTS_SUMMARY.sql"]

  - name: "V_SUMMARY_7D"
    description: "Rolling 7-day summary metrics"
    source_files: ["scripts/bigquery/views/V_SUMMARY_7D.sql"]

  - name: "V_FORECAST_ROAS"
    description: "3-tier seasonal Net ROAS forecast — blends off-season, boost, and peak ROAS per family × month using DIM_US_HOLIDAYS + DIM_US_HOLIDAYS_PRODUCT_FAMILY mapping."
    source_files: ["scripts/bigquery/views/V_FORECAST_ROAS.sql"]
    dependencies:
      - T_UNIFIED_DAILY
      - DIM_US_HOLIDAYS
      - DIM_US_HOLIDAYS_PRODUCT_FAMILY

  - name: "V_FORECAST_DEMAND"
    description: "Holiday-driven per-product demand forecast with 3-phase model-based forecasting for new products. Phase 1 (cold start) uses model product's daily rate × seasonality. Phase 2 (hybrid) uses own trailing 14d rate × model seasonality. Phase 3 uses standard family-level forecast. First-year guard (2026-07-15): when the family YoY lift blows up (raw_lift >= 3, i.e. last-year 56d denominator was a launch-period near-zero), the capped 2.0x lift is replaced by run_rate/offseason_base so the curve is anchored to the recent 28d run-rate instead of over-projecting."
    source_files: ["scripts/bigquery/views/V_FORECAST_DEMAND.sql"]
    dependencies:
      - T_UNIFIED_DAILY
      - DIM_US_HOLIDAYS
      - V_PRODUCT_LAUNCH_MODEL
      - V_PRODUCT_SEASONALITY_INDEX
      - DE_NEW_PRODUCT_MODEL

  - name: "V_HOUSE_SEASONALITY"
    description: "Volume-weighted calendar-month seasonality blended across mature products (>=540 days history, num_days>=15 per month). The fallback 'real calendar' for new-product forecasting when the chosen donor is too young (<2yr) to define its own seasonality. Index 1.0 = average month; Dec ~4.3x. Consumed by V_LAUNCH_RAMP and V_FORECAST_DEMAND."
    source_files: ["scripts/bigquery/views/V_HOUSE_SEASONALITY.sql"]
    dependencies:
      - V_PRODUCT_SEASONALITY_INDEX
      - T_UNIFIED_DAILY

  - name: "V_LAUNCH_RAMP"
    description: "Donor launch-growth curve by product age, de-seasonalized against V_HOUSE_SEASONALITY so it is pure growth (Christmas stripped). Normalized to age 1 = 1.0, monotonic, held flat after plateau age 6. One row per (donor_product, launch_age_month). A new product inherits its DE_NEW_PRODUCT_MODEL donor's ramp shape by its own age in V_FORECAST_DEMAND (Phase 1 & 2). LolliME ramps ~2.24x by month 6; a flat donor (Bottle) stays ~1.0."
    source_files: ["scripts/bigquery/views/V_LAUNCH_RAMP.sql"]
    dependencies:
      - V_HOUSE_SEASONALITY
      - T_UNIFIED_DAILY

  - name: "V_PRODUCT_LAUNCH_MODEL"
    description: "Auto-computed first-year sales patterns per product (month 1-12 from launch date). Used as the menu of available launch models for new product forecasting."
    source_files: ["scripts/bigquery/views/V_PRODUCT_LAUNCH_MODEL.sql"]
    dependencies:
      - DIM_PRODUCT
      - V_PRODUCT_FAMILY_MAP
      - V_SRC_sales_and_traffic_business_sku_report_daily

  - name: "V_PRODUCT_SEASONALITY_INDEX"
    description: "Calendar-month seasonality index per product. Index=1.0 means average month, >1 means above average (e.g. Dec peak). Used for seasonal multiplication in Phase 1/2 forecasting."
    source_files: ["scripts/bigquery/views/V_PRODUCT_SEASONALITY_INDEX.sql"]
    dependencies:
      - DIM_PRODUCT
      - V_PRODUCT_FAMILY_MAP
      - V_SRC_sales_and_traffic_business_sku_report_daily

  - name: "V_PRODUCT_STRATEGY_OUTCOMES"
    description: "Net-profit verdict (GAIN/LOSS/INSUFFICIENT) per MANUAL strategy suggestion, pre vs post applied_at"
    source_files: ["scripts/bigquery/views/V_PRODUCT_STRATEGY_OUTCOMES.sql"]
    dependencies:
      - FACT_AMAZON_ADS
      - DIM_PRODUCT
      - DIM_US_HOLIDAYS
      - DE_PRODUCT_STRATEGY_PROFILE

  - name: "V_PEAK_RELEVANCE"
    description: "Automated peak relevance per family per holiday — compares peak vs 4-week baseline, flags non-peaks, provides Coach recommendations (AGGRESSIVE_BOOST, MODERATE_BOOST, CAUTIOUS_BOOST, HOLD, REDUCE)"
    source_files: ["scripts/bigquery/views/V_PEAK_RELEVANCE.sql"]
    dependencies:
      - T_UNIFIED_DAILY
      - DIM_US_HOLIDAYS

  - name: "V_PEAK_KEYWORD_RECS"
    description: "Peak keyword recommendations per upcoming occasion × family — LY_PEAK source (peak-relevant families, from LY peak demand) + RESEARCH source (non-LY families, from V_RESEARCH_RANKED forward fit+demand); match-type buckets (INCREASE/EXACT/PHRASE/BROAD/BRAND), is_trending, DEFENSE for own-brand. Peak page card; Phase 2: BLITZ coacher."
    source_files: ["scripts/bigquery/views/V_PEAK_KEYWORD_RECS.sql"]
    dependencies:
      - V_PEAK_RELEVANCE
      - DIM_US_HOLIDAYS
      - V_SQP_ADS_BY_TERM
      - V_RESEARCH_RANKED
      - DIM_PRODUCT

  - name: "V_PEAK_STUCK_CAMPAIGNS"
    description: "Campaigns to refresh before a peak, per family: PAUSED / BUDGET_CAPPED / DORMANT / SHARE_DROPPED (gated on lifetime success), from V_ADS_COACH + FACT_AMAZON_ADS. Peak page 'Stuck campaigns' card."
    source_files: ["scripts/bigquery/views/V_PEAK_STUCK_CAMPAIGNS.sql"]
    dependencies:
      - V_ADS_COACH
      - FACT_AMAZON_ADS

  - name: "T_PEAK_KEYWORD_RECS"
    description: "Materialized V_PEAK_KEYWORD_RECS, unique per (parent_name, search_term, holiday_name). Cheap 1:1 join target so V_ADS_COACH surfaces the active-occasion peak signal in its decision trace (📈 Peak-plan chip) without re-scanning V_RESEARCH_RANKED. Refreshed by SP_REFRESH_PEAK_KEYWORD_RECS (run before the coach refresh)."
    source_files: ["scripts/bigquery/procedures/SP_REFRESH_PEAK_KEYWORD_RECS.sql"]
    dependencies:
      - V_PEAK_KEYWORD_RECS

  - name: "SP_REFRESH_PEAK_KEYWORD_RECS"
    description: "Materializes V_PEAK_KEYWORD_RECS → T_PEAK_KEYWORD_RECS (1 row per family×term×occasion). Decoupled from the coach SP because V_PEAK_KEYWORD_RECS re-scans the heavy V_RESEARCH_RANKED."
    source_files: ["scripts/bigquery/procedures/SP_REFRESH_PEAK_KEYWORD_RECS.sql"]
    dependencies:
      - V_PEAK_KEYWORD_RECS

  - name: "V_UNIFIED_DAILY"
    description: "Unified daily performance view — single source of truth for ads + sales + organic"
    source_files: ["scripts/bigquery/views/V_UNIFIED_DAILY.sql"]

  - name: "V_EXPERIMENT_TEMPLATES"
    description: "Experiment definitions with aggregated ads performance summary"
    source_files: ["scripts/bigquery/views/V_EXPERIMENT_TEMPLATES.sql"]
    dependencies:
      - DIM_EXPERIMENT
      - DIM_EXPERIMENT_CAMPAIGN
      - FACT_AMAZON_ADS

  - name: "V_ADS_EFFICIENCY_PROFILE"
    description: "3-parameter unit-consistent forecast model (Spend/CPC × Unit_CVR / Ads_Share) — seasonal-aware per-family × forecast-month, uses DIM_US_HOLIDAYS for off/boost/peak tier classification"
    source_files: ["scripts/bigquery/views/V_ADS_EFFICIENCY_PROFILE.sql"]
    cube_schema: "cube/schema/AdsEfficiencyProfile.js"
    dependencies:
      - FACT_AMAZON_ADS
      - FACT_AMAZON_PERFORMANCE_DAILY
      - V_PRODUCT_FAMILY_MAP
      - DIM_US_HOLIDAYS
      - DIM_US_HOLIDAYS_PRODUCT_FAMILY

  - name: "V_ADS_CHANNEL_EFFICIENCY"
    description: "Per-family × month × search_type (BRAND/NON_BRAND) ads efficiency — CPC, CVR, Net ROAS split by brand vs non-brand keywords. Powers PlanWizard Ads Path channel cards."
    source_files: ["scripts/bigquery/views/V_ADS_CHANNEL_EFFICIENCY.sql"]
