  - name: "V_CAMPAIGN_ROLE_BY_NAME"
    description: "FALLBACK role classification derived from the CAMPAIGN NAME, for campaigns V_CAMPAIGN_ROLE cannot classify yet. V_CAMPAIGN_ROLE reads ad DATA and is 90d-activity-gated, so a campaign created today is absent from it whether or not it has begun delivering — which made brand-new campaigns vanish from the coverage cockpit for 1-2 days and made their cells read 'missing', inviting duplicate builds (Ori 2026-07-24). Safe to parse because the cockpit generates these names itself ({PREFIX}-{FORMAT}/{TARGETING} (qualifiers) — see FN_COMPETITOR_CAMPAIGN_PLAN). Emits campaign_id, campaign_name, state, parent_name (DE_CAMPAIGN_FAMILY override else the account's short prefix: BOX/ME/BALL/BOTTLE/FRESH/BUNNY) and strategy_category. CONTRACT: fallback only, NEVER an override — callers prefer V_CAMPAIGN_ROLE and consult this only when the role is missing. Unrecognised names yield NULL and are skipped, never guessed into a cell. AUTO is deliberately not derived (its cell_key is per-ASIN and a non-delivering campaign has no ASIN). Consumed by FN_COVERAGE_CAMPAIGN_DETAIL (places new campaigns in their cell as ENABLED with 0 impressions) and FN_COVERAGE_UNMAPPED (stops them double-listing as unmapped)."
    source_files: ["scripts/bigquery/views/V_CAMPAIGN_ROLE_BY_NAME.sql"]
    dependencies:
