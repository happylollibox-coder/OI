  - name: "V_SEASON_NEGATE_CANDIDATES"
    description: "v27.46 A6 (2026-08-09), ADVISORY-ONLY surface for the negatives workflow: texts whose season-context gate reads ENTRY_BLOCK/STOP with a mature same-family LOSS prior (failed the re-probe; the 90d hatch structurally precedes STOP so every row is hatch-ineligible — r90_* columns carry the proof). One row per (keyword_text, ENABLED campaign currently targeting the text) — SP from DIM_KEYWORD current+ENABLED, SB from the live sb_keyword mirror; match types collapsed into match_types. EXCLUDED: defense campaigns entirely (brand terms never negated in defense) and auto/PT texts (gate keyword-grain only, enforced by the equality join). Columns: prior-occurrence evidence (clicks/net/GP-ROAS + loss_evidence_tier), current-occurrence near-settled re-probe spend (ns_*), 90d record, suggested_scope='SEARCH_TERM_NEGATE', reason. DE_NEGATIVE_KEYWORDS is the negatives AUTHORITY — this view suggests, NOTHING auto-uploads (coacher no-auto-fill doctrine). Spec: architecture/SEASON_CONTEXT_LEDGER.md §5.7 A6."
