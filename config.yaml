  - name: "V_ADS_COACH"
    description: "Single source of truth for all action decisions. Thin logic layer referencing V_ADS_COACH_DATA. Lift-probe suppression (2026-08-01): keywords owned by V_KEYWORD_LIFT (probing OR PROBE_START, both channels) get bid actions masked to KEEP/KEEP_TARGET incl. STOP_TARGET (killing a mid-test probe defeats the 20-click experiment); term-grain NEGATE_TERM/STOP_TERM still pass; is_lift_probe column exposed. Spec: ADS_COACH_DECISION_MATRIX.md \u00a7Safety Guards. v27.56 LAUNCH-EXEMPTION GATE (Ori 2026-08-13): new CTEs scored_lx + scored_exempt sit between `scored` and the output (final SELECT reads FROM scored_exempt AS scored, so every existing reference is untouched). A campaign present in V_LAUNCH_EXEMPTION whose budget_action is a ROAS-driven money cut (CAMPAIGN_STOP, GUARDIAN_BUDGET_DECREASE, BLITZ_BUDGET_DECREASE, COOLDOWN_BUDGET_REDUCE, RESTORE_BUDGET_PRE_PEAK, and GUARDIAN_BUDGET_CONTAIN only where blocks_contain = TRUE, i.e. past the 14-day broken-launch grace) reads budget_action = 'LAUNCH_EXEMPT_HOLD' instead, and recommended_budget is forced to NULL so is_change / the bulksheet can never export the cut that was just blocked. Placed AFTER the cooldown/deadband REPLACE deliberately, so budget_action_suppressed records what WOULD have been emitted today rather than a decision the cooldown had already masked. SECOND LEAK CLOSED IN THE SAME CTE — launch_down_rec_blocked: the 3-day cooldown REPLACE masks the ACTION to BUDGET_OK but leaves recommended_budget populated, and is_change / the bulksheet queue key on the NUMBER, not the action; two LolliBall campaigns (Purple $12.29->$8, White $19.20->$9) were carrying an exportable downward budget behind a BUDGET_OK label, which would have bypassed the gate entirely. On an exempt campaign NO downward budget recommendation is published at all, whatever the action says (the underlying quirk is pre-existing and account-wide; only the launch-family half is closed here). NEW OUTPUT COLUMNS: launch_exempt, launch_exempt_family, launch_exempt_until, launch_exempt_reason, launch_cut_suppressed, launch_down_rec_blocked, budget_action_suppressed, budget_suppressed_to. Effect at deploy 2026-08-13: 9 campaigns (5 CAMPAIGN_STOP + 4 GUARDIAN_BUDGET_DECREASE) across Bunny + LolliBall became LAUNCH_EXEMPT_HOLD; verified account-wide that NO non-exempt campaign moved (26 GUARDIAN_BUDGET_DECREASE / 8 CAMPAIGN_STOP / 1 CONTAIN still stand elsewhere). Nothing on the bid side is touched. Spec: architecture/LAUNCH_EXEMPTION.md"
    source_files: ["scripts/bigquery/views/V_ADS_COACH.sql"]
    dependencies:
      - V_ADS_COACH_DATA
      - V_KEYWORD_LIFT
      - V_LAUNCH_EXEMPTION

