  - name: "FACT_PARK_REVERDICT"
    description: "v27.48 snapshot of V_PARK_REVERDICT — the small (campaign_id, keyword_id) table BOTH engines LEFT JOIN for the revival machinery (V_OOB_KEYWORD is at the planner ceiling and re-plans V_KEYWORD_LIFT, so the reverdict view's FACT+gate subtree must never enter an engine plan). Fully derived, rewritten daily by SP_SNAPSHOT_PARK_REVERDICT (orchestrator Task 20.5e). Stale-snapshot direction is SAFE: immunity persists, and stale REVIVE re-emissions are caught by APPLIED_HOLD. Spec: architecture/SEASON_CONTEXT_LEDGER.md §7."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_PARK_REVERDICT.sql"]
    dependencies:
      - V_PARK_REVERDICT

  - name: "FACT_PANEL_OWNERSHIP"
    description: "The snapshot of V_PANEL_OWNERSHIP — the small one-row-per-ENABLED-campaign table (93 rows / 35 columns @ 2026-08-18; 108 @ 2026-08-13 and 95 on 2026-08-17, and the drift is population not logic: the grain is ENABLED campaigns, so a campaign paused during the day simply leaves) that every Weekly Run engine, cube and panel LEFT JOINs to learn which criteria owns a campaign (ladder LOW STOCK > LAUNCH > REVIVALS > engines, Ori 2026-08-13). COLUMNS AS BUILT TODAY, 35: identity campaign_id / campaign_name / channel / serving_status / budget_now / family / is_defense / is_seasonal / is_auto_campaign; the rank-4 detail is_oob_owned / days_capped_7d / is_launch / launch_exempt_active / launch_exempt_until; the low-stock evidence low_stock_state / binding_cover_days / low_stock_state_row / binding_cover_days_row / binding_product / ls_action / ls_now / ls_suggested / ls_proposal_targets / ls_freed_per_day / ls_redirect_mode; and the verdict owner_rank / owner / claim_scope / claim_reason / claim_rank / defer_action / defer_reason / defer_launch_panel / defer_revival_panel / defer_engine_panel. ls_redirect_mode is the v27.78 column and the one worth knowing about: it is the THIRD signal of the claim predicate arm B, and it exists because v27.73 redirect mode makes the low-stock engine go deliberately quiet on the campaigns it is re-aiming (it prices bid- and budget-cut rows without proposing them), which the first two money signals read as no opinion. The predicate itself lives in V_PANEL_OWNERSHIP and never here: NOT is_defense AND (arm A structural, family risk_state=CRITICAL; OR arm B instructed, a campaign-row suggested budget OR >=1 proposal target OR redirect mode). BUILT BY SP_SNAPSHOT_PANEL_OWNERSHIP IN TWO STEPS AND THE ORDER IS THE CONTRACT (v27.77): (1) T_LOW_STOCK_CAMPAIGN, a pure pass-through slice of V_LOW_STOCK_ADS CAMPAIGN rows, then (2) CREATE OR REPLACE TABLE this table AS SELECT * FROM V_PANEL_OWNERSHIP, whose ls_camp CTE reads that slice. Fully derived, rewritten daily, idempotent. EVERYTHING READS THE TABLE, NOT THE VIEW: V_PANEL_OWNERSHIP sits on top of the low-stock engine, which is at BigQuery query-planning ceiling, and the engines are at that ceiling themselves — that subtree must never enter an engine plan (same doctrine as FACT_PARK_REVERDICT / FACT_KEYWORD_GUARD). Reading the table rather than the view is also what makes panels and engines agree with each other, which is the entire point of the object. CONSUMER ADDED v27.81 (2026-08-18): SP_ENGINE_PREFLIGHT now reads the three defer_* booleans off this table as a second, independent source of exclusion — a lower-ranked engine BID or BUDGET instruction is EXCLUDEd because a higher panel HOLDS THE CLAIM, whether or not that owner instructed anything the same day. Until then the gate only caught COLLISIONS (two engines on one key), and a silent owner produced no collision to catch. The claim arm covers money levers only, so NEGATE stays available; it fails open on a missing row. This is what makes the table an upload gate and not only a rendering hint, and it is the reason a stale row here is now worth stating twice. STALE-SNAPSHOT DIRECTION IS SAFE and worth stating because a claim is a SILENCER: a stale CLAIM (family recovered, snapshot still CRITICAL) costs one skipped raise for a day; a stale NON-claim cannot outrun its own evidence, because the claim inputs (FACT_INVENTORY_SNAPSHOT, the ads anchor) load once a day and this snapshot is rebuilt in the same pass. Cube: PanelOwnership. Spec: architecture/PANEL_OWNERSHIP.md."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_PANEL_OWNERSHIP.sql"]
    dependencies:
      - V_PANEL_OWNERSHIP


  - name: "FACT_KEYWORD_GUARD"
    description: "v27.48 part 2 snapshot of V_KEYWORD_GUARD — the small (campaign_id, keyword_id) table BOTH engines LEFT JOIN for the part-2 guards (general settle veto, probe record caps, MANUAL_HOLD, PACE_RAISE, settled-first orderings). V_OOB_KEYWORD joins it at the GATED layer only (planner ceiling — the inner seat CTEs stay untouched); V_KEYWORD_LIFT joins it in base (ordering keys) + the output wrapper. v27.52: carries the NEW settle_amnesty column (= season_win_prior AND NOT catastrophic) — this, not season_win_prior, is what both engines read in the settle veto; season_win_prior itself is now occurrence-scoped. Adding the column requires this snapshot to be refreshed BEFORE either engine view is deployed. Fully derived, rewritten daily by SP_SNAPSHOT_KEYWORD_GUARD (orchestrator Task 20.5f). Missing rows fail OPEN (engines keep pre-guard behavior); stale directions bounded by the engines' 1-day cooldown + APPLIED_HOLD. Spec: architecture/SEASON_CONTEXT_LEDGER.md §7.6-7.9. v27.53 (2026-08-12): re-run after the V_KEYWORD_GUARD change — the snapshot now carries settle_deferral_expired, first_click_60d, manual_budget_hold, pace_kw_instance, wake_date/source/days_since_wake/wake_clk/wake_sp/wake_ord/wake_gp, wake_open, wake_due and wake_step_bid, and settled_*90 read the new SP [wm-92, wm-3] frame. MUST be re-run before either engine can compile against the new columns (SP_SNAPSHOT_KEYWORD_GUARD, orchestrator Task 20.5f)."
    source_files: ["scripts/bigquery/procedures/SP_SNAPSHOT_KEYWORD_GUARD.sql"]
    dependencies:
      - V_KEYWORD_GUARD

