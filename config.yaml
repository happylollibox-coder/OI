  - name: "V_TARGET_BID_SHADOW"
    description: "SHADOW target-bid model — NOTHING READS THIS, and nothing may without an explicit decision. Thin wrapper over FN_TARGET_BID_SHADOW(anchor, apply_season_gate) pinned to anchor = MAX(FACT_AMAZON_ADS.date) - 30 (SP Ads_orders come from purchases_30_d, so the binding settle constraint is D-30, not D+7) and apply_season_gate = TRUE, filtered to is_live. Prices a click, never a budget. cvr_hat = hierarchical empirical-Bayes account->family->campaign->keyword with k = [300, 2500, 1000] clicks, stored as a RATIO to the account level and re-levelled on the freshest 28d level; gp_per_order = MEASURED family constant SUM(GROSS_PROFIT)/SUM(Ads_orders) over 90 settled days keyed on V_DIM_CAMPAIGN_FAMILY (NOT ASIN_BY_CAMPAIGN_NAME, whose CASE has no Bunny/LolliBall branch and files both as White Lollibox); breakeven_cpc = gp_per_order x cvr_hat; target_cpc = breakeven_cpc / 1.4021 where the 1.4021 is DERIVED not chosen, = (eta+gamma)/(theta.eta) from the measured click and CPC elasticities — pricing to breakeven is a zero-net-profit objective; target_bid = (target_cpc / k_transfer)^(1/0.686), the inverse of the measured transfer realized_CPC = k x bid^0.686, then clamped by per-format floor / $2 cap / 0.70x-breakeven safe ceiling / season gate. target_cpc and target_bid are DIFFERENT COLUMNS ON PURPOSE: assigning a CPC-scale quantity to a bid field is root cause (a) of the v27.40 revert. No campaign-type, target-type or match-type term — all three were measured not to predict a held-out keyword's CVR. Defense excluded (M7). BACKTEST VERDICT: repricing straight to target_bid LOSES money (-$6,463 over 90 held-out days, P(beat doing nothing) = 0.01) because spend scales as vpc^3.487; the damped form bid_now x (target_bid/bid_now)^0.25 gains +$1,403 (P = 0.93 vs doing nothing). Read architecture/TARGET_BID_SHADOW.md before wiring anything."
    source_files: ["scripts/bigquery/views/V_TARGET_BID_SHADOW.sql"]
    dependencies:
      - FN_TARGET_BID_SHADOW
      - FACT_AMAZON_ADS
  - name: "V_CAMPAIGN_PRODUCT_SCOPE"
    type: "view"
    source_files: ["scripts/bigquery/views/V_CAMPAIGN_PRODUCT_SCOPE.sql"]
    description: "v27.80 (2026-08-17, Task 4.10) — HOW MANY OF OUR OWN PRODUCTS DOES THIS CAMPAIGN SELL? One row per campaign that served an impression in the last 30 COMPLETE days of the advertised-product report (window ends adv_watermark-1, Task 4.7 convention; the watermark is the report's OWN MAX(date), not FACT_AMAZON_ADS's). Publishes campaign_id, n_own_asins, sole_asin (the single own ASIN when n_own_asins = 1, else NULL), plus own_asins / n_advertised_asins / own_impressions_30d / own_spend_30d and the window bounds. 74 rows @ 2026-08-17: 67 DEDICATED (n_own_asins = 1), 7 SHARED doorways. WHY IT EXISTS: Ori 2026-08-17, verbatim — 'BALL-SP/AUTO (Mint) is auto per product. auto we have for each product - so no need to change / only reduce ads by reducing the bid.' This account runs ONE AUTO CAMPAIGN PER VARIATION alongside a few shared broad/competitor doorways, and the two shapes need OPPOSITE low-stock treatment: a dry variation inside a SHARED doorway can be swapped for an in-stock sibling (re-aim, V_LOW_STOCK_REDIRECT), while a DEDICATED campaign has nowhere to re-aim — its per-variation sibling campaign already exists, so the swap would duplicate a live campaign and the only honest lever is the ordinary brake. Nothing in the warehouse could tell the two apart before this view (V_CAMPAIGN_FAMILY_MAP is campaign->family only). OWN vs COMPETITOR: own = DIM_PRODUCT.parent_name IS NOT NULL (fact_oi_dim_product_holds_competitor_asins) — a campaign advertising one of ours against forty competitor ASINs is still DEDICATED. SP ONLY, a real limit not an oversight: Amazon publishes no advertised-product report for Sponsored Brands, so SB/video campaigns get NO ROW; every consumer must read a missing row as UNKNOWN, never as dedicated and never as n_own_asins = 0. HOT PATHS READ THE TABLE, NOT THIS VIEW: V_LOW_STOCK_ADS sits at BigQuery's planning ceiling, so it joins T_CAMPAIGN_PRODUCT_SCOPE, rebuilt as orchestrator Task 20.5d3 before anything reads the low-stock engine. Spec: architecture/LOW_STOCK_CRITERIA.md (v27.80)."
    dependencies:
      - V_SRC_AmazonAds_advertised_product
      - DIM_PRODUCT

  - name: "V_LOW_STOCK_REDIRECT"
    type: "view"
    source_files: ["scripts/bigquery/views/V_LOW_STOCK_REDIRECT.sql"]
    description: "The re-aim rows (Task 4.6): per SP ad group advertising a redirect-mode family's binding variation (V_SRC_AmazonAds_advertised_product, 30d, ad_id included) — pause the dry doorway + create the hero's product ad. Mode+hero computed once in V_LOW_STOCK_ADS FAMILY rows (v27.73). Excludes SB and already-ACTIVE redirects. v27.80 (2026-08-17, Ori: 'BALL-SP/AUTO (Mint) is auto per product ... so no need to change / only reduce ads by reducing the bid') — DEDICATED CAMPAIGNS ARE NO LONGER OFFERED A REDIRECT. A campaign advertising exactly ONE of our own products has nowhere to re-aim: this account runs one auto campaign per variation, so BALL-SP/AUTO (Pink) ALREADY EXISTS and already does the job that swapping Mint to Pink inside BALL-SP/AUTO (Mint) would do — the offer proposed building a duplicate of a live campaign. Such a campaign now takes the ORDINARY BRAKE instead (V_LOW_STOCK_ADS v27.80 serves_only_binding). The scope is computed IN THIS VIEW off the report it already scans (no new dependency), over the same 30 complete days ending watermark-1 as V_CAMPAIGN_PRODUCT_SCOPE so the two objects can never disagree; n_own_asins is published on every row. An UNKNOWN scope (no row — SB) is NOT treated as dedicated: COALESCE(n_own_asins, 2) > 1 keeps the offer rather than losing it. MEASURED FLIP 2026-08-17: 5 rows -> 4. Dropped: BALL-SP/AUTO (Mint), 1 own ASIN, 60,212 impressions and $416.98 over 30d. Remaining, all shared doorways: BUNNY - COMPETITORS (11 own ASINs), BUNNY- BROAD (9), BUNNY-SP/BROAD Hunter (3), BALLS- BROAD (5). The doorway scan keeps its CURRENT_DATE-30 window unchanged, so no row moved for any reason other than the new exclusion."
    dependencies:
      - V_LOW_STOCK_ADS
      - V_SRC_AmazonAds_advertised_product
      - DE_AD_REDIRECTS
      - V_DIM_CAMPAIGN_CURRENT
      - DIM_PRODUCT
  - name: "V_AD_REDIRECT_RECHECK"
    type: "view"
    source_files: ["scripts/bigquery/views/V_AD_REDIRECT_RECHECK.sql"]
    description: "The return half (Ori: 'when it is back in inventory recheck if we want to change it back or leave it'): ACTIVE DE_AD_REDIRECTS rows whose out ASIN is back with >=45d cover and >=14d of hero-doorway data -> a re-opened decision with interim evidence (hero units/clicks since vs the out doorway's prior 30d). Advisory; Ori's click writes RESTORED or KEPT."
    dependencies:
      - DE_AD_REDIRECTS
      - FACT_INVENTORY_SNAPSHOT
      - FACT_AMAZON_PERFORMANCE_DAILY
      - V_SRC_AmazonAds_advertised_product

  - name: "V_ADS_INCREMENTAL_14D"
    description: "Answers Ori's 2026-08-18 question - 'did the last 14 days of PPC work make more total dollars than doing nothing would have?' - as honestly as this account's data allows, which is NOT as a causal estimate. THE ASKED-FOR MATCHED KEYWORD-GRAIN DiD IS NOT BUILT AND MUST NOT BE: it was tested first and failed. Parallel trends is FALSIFIED (pre-trend correlation of daily dollar deltas -0.137 and -0.673 - treated and control move in OPPOSITE directions before treatment); a placebo replicating the engine's own selection rule with ZERO intervention fabricates +$1,505..+$2,445 on the losers arm and -$1,094..-$1,829 on the winners arm, roughly 90% of the account's entire 14-day dollar magnitude; matching fails for 98.1% of treated keywords; 73.5% of active keywords and 85.1% of keyword spend are touched, leaving a clean control of SEVEN keywords / $819 against a treated arm of $29,326; and 56-63% of would-be controls share a campaign budget with a treated keyword (SUTVA). Synthetic control was rejected too - donor-pool membership is CAUSED by the outcome and donor clicks fell 83% over the fit window. WHAT IS BUILT INSTEAD (build-rule option c): season-adjusted before/after with an EMPIRICAL PLACEBO BAND. effect_k = (post_k - pre_k) - season_rate(t) * pre_spend_k over [t-14,t-1] vs [t+1,t+14] on dollars = GROSS_PROFIT - Ads_cost (the STORED FACT column, v27.62 GP RULE - dollars not ROAS, because a ratio cannot answer a dollars question). season_rate is the account's SAME-CALENDAR LAST-YEAR swing per pre-spend dollar (364-day offset so day-of-week aligns); without it a 14-day check reads a +/-$150 signal on a +$2,000 Back-to-School tide. THE BAND IS THE OUTPUT, NOT THE POINT ESTIMATE: se_keywords = STDDEV_SAMP(effect_k)*SQRT(n) (closed form, not a bootstrap - the estimator is a plain sum, so this IS the bootstrap's limit, and it is deterministic) COMBINED with placebo_sd, measured by re-running the identical estimator at 5 placebo anchors (same units, shifted back 28/35/42/49/56 days, where the true effect is exactly zero). band = 1.96*sqrt(se^2 + placebo_sd^2) + abs(placebo_bias). GUARDS ADDED AFTER THE FIRST RUN: (1) placebo_coverage_pct - if the placebo anchors predate the units' existence the placebo is VACUOUS ($14 sd where the real floor is $1,300), so below 50% coverage it is discarded, band_basis flips to SAMPLING ONLY and the verdict says NOT REPORTABLE; (2) pre_window_valid - a campaign younger than the 14-day pre-window has no pre-window, so post-minus-pre is its RAMP, not the bid change (the 'new product masquerading as skill' case, split out as its own stratum). TWO SCOPES, NEVER SUMMED: ROLLING_14D (the question as asked) and ALL_GRADEABLE_60D (widest defensible read, and the only scope where a placebo usually computes). THE LAG IS DELIBERATE: a 14-day post window plus settle (SP D+7 / SB D+14) means the freshest gradeable decision is T-21, so this reports on work done 3-4 weeks ago; everything newer lands on changes_too_early_to_judge and is NEVER counted as zero effect. NOT MEASURED, by design: NEGATE and ADD_TARGET (no dollar counterfactual exists - V_CHANGE_SCORECARD grades those), and BUDGET rows sit on their own is_additive = FALSE line at campaign grain because their keywords are already on the TARGET lines. Stratified: launch/established, SP/SB, bid-up/bid-down, single/multi-touch, family, pre-window validity. Coverage counts (judged / thin / unmatched / too-early) ship on every row - coverage is part of the answer. THIS IS A MONITOR, NOT A CAUSAL ESTIMATE; it cannot see budget reallocation, cannibalisation or organic halo, and it does not remove selection on the outcome, it only measures it. The only real fix is a randomised hold-out of 15-20% of eligible keywords per upload. Planner discipline: FACT_AMAZON_ADS scanned ONCE at keyword-day grain; launch age and family re-derived from that scan; no ceiling view inlined. Money aggregated in NUMERIC so two pulls are byte-identical (FLOAT64 addition is not associative)."
    source_files: ["scripts/bigquery/views/V_ADS_INCREMENTAL_14D.sql"]

  - name: "V_FAMILY_PNL"
    type: "view"
    source_files: ["scripts/bigquery/views/V_FAMILY_PNL.sql"]
    description: "Family economics INCLUDING the organic halo (2026-08-19). One row per (family, period): net_profit (total sales - all-in COGS - ad spend, a true net after Amazon fees), total_net_roas (breakeven exactly 1.0, a DECLARED threshold with no parameters), ads_net_roas (what the engine currently sees), and halo_factor = total_net_roas / ads_net_roas, MEASURED not assumed. NO HALO VALUE, NET PROFIT OR BASELINE FIGURE IS WRITTEN IN THIS ENTRY (Standing Rule 0, rewritten 2026-08-20: a measurement does not go in prose, the mechanism does). THE MECHANISM: every family gets its own halo because a single account-wide halo assumption is wrong for all of them - the spread across families is wide, and it is measured from dollars rather than inferred from unit ratios plus an equal-margin assumption, which would flatten exactly that spread. Read the numbers, never quote them: SELECT family, halo_factor, total_net_roas, ads_net_roas, net_profit FROM `onyga-482313.OI.V_FAMILY_PNL` WHERE period_label = 'M3' ORDER BY halo_factor. Cuts at the ORDERS watermark with the sessions gate, never the ads watermark. PERIODS: the rolling M3 (90d) / M1 (30d) / W2 (14d) windows; one row per COMPLETE calendar month; one still-filling row labelled MTD carrying is_complete_period = FALSE, which no trajectory test may read; and BASELINE_MAY_JUL, the DECLARED window 2026-05-01..2026-07-31 that the design was argued on and that the Task 1 acceptance assertion reproduces - the window is a declaration, the figures on it are a measurement, so read them with SELECT family, net_profit, total_net_roas, halo_factor, ads_net_roas FROM `onyga-482313.OI.V_FAMILY_PNL` WHERE period_label = 'BASELINE_MAY_JUL' ORDER BY net_profit DESC. Spec: docs/superpowers/specs/2026-08-19-two-book-pnl-design.md."
    dependencies:
      - V_UNIFIED_DAILY
      - FACT_AMAZON_PERFORMANCE_DAILY

  - name: "V_BOOK_ASSIGNMENT"
    type: "view"
    source_files: ["scripts/bigquery/views/V_BOOK_ASSIGNMENT.sql"]
    description: "v27.84 (two-book P&L, 2026-08-19) - which BOOK each family is judged in: HARVEST (established, judged on net profit) or INVEST (a declared launch, judged on improvement inside a bounded sanction). One row per family. HARVEST IS THE DEFAULT AND THAT IS THE POINT: a family becomes INVEST only through a live declaration in DE_LAUNCH_INVESTMENT (CURRENT_DATE America/Los_Angeles <= stop_date), so undeclared spend is Harvest spend and is judged on money like everything else - which makes an undeclared launch immediately visible instead of quietly exempt. Expiry needs no code change: past stop_date the family reverts to Harvest by itself. THE BINDING CONSTRAINT IS daily_investment, THE SPEND RATE (Ori 2026-08-19 'spend rate binds') - that is the number actually sanctioned; monthly_loss_ceiling rides along as a catastrophe backstop only. WHY IT NEVER FIRES, AS A MECHANISM AND NOT AS A READING: the ceiling is denominated in NET PROFIT but was backfilled from the sanctioned SPEND rate monthised, and a launch family with real sales loses far less than it spends - so the ceiling is a loose bound by construction and the rate is what binds. NO RATE, RATIO OR CEILING PERCENTAGE IS WRITTEN HERE (Standing Rule 0, rewritten 2026-08-20 after this entry shipped two over-rate RATIO FIGURES under an as-of date on a day the live view read otherwise - a wrong number under today's date looks verified, which is worse than an undated one, and quoting the wrong figures back as the example of the defect just leaves them on the page, so they are gone). Read it: SELECT family, daily_investment, spend_per_day, spend_rate_ratio, ceiling_used_pct, rate_window_basis FROM `onyga-482313.OI.V_INVEST_STATUS`. DECLARED CONSTANTS, safe to write down because a person decided them and they are on DE_LAUNCH_INVESTMENT, not derived from data: Bunny $30/day with a $913 monthly backstop through 2026-10-31, LolliBall $55/day with a $1,674 backstop through 2026-11-30, both sanctioned 2026-08-13. Even so, never RESTORE a sanctioned value from this file - read the live row. takeover_target_organic_units passes through NULL until Ori supplies it - NULL is 'no target on record', never 0. launch_age_months is measured from the family's FIRST SALE in V_UNIFIED_DAILY, not from sanctioned_on (both sanctions were signed months after either launch began), off the SAME first-sale anchor as V_LAUNCH_EXEMPTION but in DELIBERATELY DIFFERENT UNITS, so the two ages DO differ and that is not a defect: this view counts CALENDAR-MONTH boundaries crossed (a whole number), V_LAUNCH_EXEMPTION divides elapsed days by 30.44 (one decimal). Expect a gap of up to about a month, either way; compare them with SELECT family, first_sale_date, launch_age_months FROM `onyga-482313.OI.V_BOOK_ASSIGNMENT` against V_LAUNCH_EXEMPTION's own age column. The calendar count is the right one HERE and must not be harmonised to the other: it drives the RAMP vs PROOF selector in V_INVEST_STATUS, a test that reads complete calendar months, so counting boundaries lands the change on the 1st rather than mid-month (same pattern as the family_age_months expression in V_LOW_STOCK_ADS.sql - grep for it rather than trusting a line number, which drifts on every edit). The flip date for a family is therefore the 1st of the month in which DATE_DIFF(first_sale_date, MONTH) reaches 4; derive it from the query above rather than reading a date out of a document. FAMILY UNIVERSE = V_CAMPAIGN_FAMILY_MAP EXCLUDING the literal 'Unknown' fallback, which is not a family but the map's unresolved-campaign sentinel and has no row in V_FAMILY_PNL. THAT EXCLUSION DOES NOT MAKE THE TWO FAMILY UNIVERSES THE SAME: it removes the one sentinel they were guaranteed to differ on, it does not align the keys. This view is CAMPAIGN-keyed, ENABLED-only, override-first and not windowed; V_FAMILY_PNL is ASIN-keyed over a dated window. Two live divergence mechanisms, each of which can open at any time: DE_CAMPAIGN_FAMILY can override a campaign to a parent_name no ASIN carries (enabling such a campaign publishes a family here with a book and no P&L to judge it against), and an active ASIN can carry parent_name NULL, putting its sales in no family on either side. Whether either is open TODAY is a measurement, and the query must be RUNNABLE rather than an ellipsis (this entry carried 'SELECT ... FROM' until 2026-08-20, which is not a query): SELECT COALESCE(b.family, p.family) AS family, b.family IS NOT NULL AS in_book_assignment, p.family IS NOT NULL AS in_family_pnl FROM `onyga-482313.OI.V_BOOK_ASSIGNMENT` b FULL OUTER JOIN (SELECT DISTINCT family FROM `onyga-482313.OI.V_FAMILY_PNL`) p ON p.family = b.family ORDER BY 1 - any row with a FALSE on either side is a divergence. V_TWO_BOOK_BRIEF therefore joins the two universes with a FULL OUTER JOIN, and DO NOT SIMPLIFY THAT JOIN because the universes look identical on the day you check. Spec: docs/superpowers/specs/2026-08-19-two-book-pnl-design.md 2."
    dependencies:
      - V_CAMPAIGN_FAMILY_MAP
      - V_UNIFIED_DAILY
      - DE_LAUNCH_INVESTMENT

  - name: "V_FAMILY_BAR"
    type: "view"
    source_files: ["scripts/bigquery/views/V_FAMILY_BAR.sql"]
    description: "v27.84 (two-book P&L, 2026-08-19) - THE ENGINE BRIDGE: a family's MEASURED organic halo becomes the per-family bar that the keyword engine judges ads-attributed GP-ROAS against. ADJUST THE BAR, NEVER THE MEASUREMENT: organic sales are measurable at family grain and are NOT attributable to a keyword, so the engine keeps measuring ads-attributed ROAS at keyword grain (the only honest measure there) and what changes is the BAR, set once per family. keyword_bar = 1 / (1 + credit * (halo_factor - 1)). DECLARED CONSTANTS, all in the k CTE and all true because someone chose them: credit = 0.5 (crediting all organic to ads is wrong because brand search and repeat buyers would happen anyway; crediting none is the pre-2026-08-19 behaviour and is why the engine undervalued rank-building), bar_floor = 0.60, bar_ceiling = 1.0. SAFETY PROPERTIES, all asserted: the credit may only LOWER a bar and never raise one above 1.0 (so it can never justify a cut); where halo_factor <= 1.0 NO credit is given and the bar stays 1.0; INVEST families carry bar_exempt = TRUE and are governed by budget + trajectory instead. THE 0.60 FLOOR IS A GUARD, NOT A LIVE CLAMP, and that is provable from the constants rather than from a reading: the floor can only bite above halo 7/3, because 1/(1+0.5*(h-1)) < 0.60 exactly when h > 2.3333. Whether any row is near it today is a measurement - run the re-check, and note the tolerance is 5e-5, NOT 1e-9 (the view ROUNDs keyword_bar to 4 decimals, so a published bar can sit up to 5e-5 above its own unrounded value; at 1e-9 that rounding reads as a clamp, and a query published here at 1e-9 once contradicted the sentence it sat under): SELECT COUNTIF(keyword_bar > 1.0/(1.0+0.5*(halo_factor-1.0)) + 5e-5) AS rows_clamped, MIN(keyword_bar) AS lowest_bar, COUNT(*) AS n FROM `onyga-482313.OI.V_FAMILY_BAR`; it should return rows_clamped = 0 while every halo is under 7/3. CALIBRATION IS A STANDING TEST, RUN BY HAND WHEN YOU TOUCH THE BRIDGE - there is no monthly job anywhere in the warehouse - AND IT RUNS IN ONE DIRECTION ONLY. A family that CLEARS its keyword bar must also clear total net ROAS 1.0. THE REVERSE IS NOT REQUIRED: a family can fail its bar while clearing 1.0, and that is the bar being STRICTER than the truth test, which is the direction the design wants. It is not a defect and must never be alarmed on. ALARM ONLY ON PERMISSIVE BREAKS (clears the bar, fails 1.0). The algebra in the view header proves the bar test is the ARITHMETIC MEAN of the two ROAS measures against 1.0, so a permissive break is reachable only where halo_factor is below 1 - today, the COGS tier imputation on new products - and the fix for one of those is the COGS, NEVER the bar and never halo_credit. THE AGREE/CONSERVATIVE/PERMISSIVE SPLIT IS A READING, NOT A CONSTANT, AND NOTHING MAY GATE ON IT. It is not written down here and must not be written down here: V_FAMILY_PNL restates for about D+3, rows can sit close enough to the 1.000 truth test to cross it on a restatement (how close any row is TODAY is a measurement and is not written here - SELECT family, period_label, total_net_roas FROM `onyga-482313.OI.V_FAMILY_PNL` ORDER BY ABS(total_net_roas-1.0)), and the still-filling MTD rows move, so two runs of the same query on the same day with no code change between them can return different splits - which is exactly what happened when this entry pinned one. The query is published in the V_FAMILY_BAR.sql header; RUN IT BOTH WAYS (all rows, and again with WHERE is_complete_period) and say which scope you are quoting, because quoting a conservative count without naming its scope is how the first pinned figure went wrong. WHAT IS STABLE IS THE DIRECTION, NOT THE COUNT: a monitor that alarms on any disagreement fires on a majority of harmless rows and will be ignored inside a week. AND DO NOT REACH FOR THE KNOB - the only tunable that removes a conservative break is raising halo_credit above 0.5, which lowers every Harvest bar together and would let the engine bid up across families the truth test does not clear. Reads the SETTLED 90-day period (period_label = 'M3'). MATERIALISED DAILY by SP_SNAPSHOT_FAMILY_BAR into T_FAMILY_BAR, as orchestrator task 20.5g-1. Daily does not make bids chase noise IN THE ORDINARY CASE - the input is a settled 90-day window, so it moves by roughly one day in ninety per rebuild - but that bounds ordinary drift and is NOT an absolute: a restatement or a COGS change that rewrites 90 days at once moves the halo, and with it the bar, as far as it likes. The only guarantee is directional: the credit can never raise a bar above 1.0. WIRED TO A BID SINCE v27.100 (2026-08-21, Task 8), THROUGH THE TABLE AND INTO ONE ENGINE: V_KEYWORD_LIFT LEFT JOINs T_FAMILY_BAR on campaign_id and its CUT_TO_BREAKEVEN arm compares against COALESCE(keyword_bar, 1.0) instead of a flat 1.0, skipping bar_exempt families. V_OOB_KEYWORD was deliberately NOT wired - it has no flat breakeven arm, only the dark brake and the seat trim, which judge on budget darkness and capacity and which Task 8's non-goal protects on Invest families. V_CAMPAIGN_MONEY_PLACEMENT remains a reporting consumer that changes no bid. Do not take any of this from this sentence, which is the kind that goes stale silently; re-verify it with the two-line INFORMATION_SCHEMA query published in the SP_SNAPSHOT_FAMILY_BAR.sql header. AN ENGINE MUST JOIN THE TABLE AND NEVER THIS VIEW, which is at the planner ceiling. DO NOT PIN THE BARS HERE - they move with the halo every rebuild, and this entry pinned all six once. THE SHAPE, which is algebra and not a reading: the stronger a family's measured halo, the LOWER its bar. Pull the view for the numbers: SELECT family, book, halo_factor, ads_net_roas, total_net_roas, keyword_bar, bar_exempt FROM `onyga-482313.OI.V_FAMILY_BAR` ORDER BY keyword_bar. Spec: docs/superpowers/specs/2026-08-19-two-book-pnl-design.md 4."
    dependencies:
      - V_FAMILY_PNL
      - V_BOOK_ASSIGNMENT

  - name: "V_INVEST_STATUS"
    type: "view"
    source_files: ["scripts/bigquery/views/V_INVEST_STATUS.sql"]
    description: "v27.96 (two-book P&L, 2026-08-19, Task 6; K-round repairs 2026-08-20; delivery-by-date repair 2026-08-20; in-window silence and instrument reconciliation 2026-08-21) - THE INVEST BOOK'S CONTROL PANEL: for each family declared INVEST, is the launch investment still INSIDE ITS SANCTION, and is it WORKING? One row per INVEST family; a family that expires out of the declaration simply stops appearing. THE SPEND RATE BINDS (Ori 2026-08-19, verbatim: 'spend rate binds'). protection_qualified (called exemption_live until 2026-08-20; 'live' read as 'in force', which is the one thing it never meant) is TRUE only while ALL of these hold: today <= stop_date; every day of BOTH windows was delivered by the account's ads feed (rate_window_data_complete AND short_window_data_complete, both published on the row); the spend rate is not breached on either window; at least one window lies entirely inside the sanction; the month-to-date net-profit loss is under monthly_loss_ceiling; the window is certifiable as current (rate_window_is_stale FALSE); and V_BOOK_ASSIGNMENT held exactly one row for the family. WHAT THE SECOND CLAUSE DOES AND DOES NOT GUARANTEE, because a guarantee a verifier can break in one query is worse than none: it guarantees every window date arrived in BOTH the ACCOUNT's ads fact AND, account-wide, the family-mapped daily view the spend is summed from. It does NOT guarantee that this family's own rows for those dates arrived - on a delivered date nothing separates 'this family was not advertising' from 'this family's rows have not landed', and nothing in this view claims otherwise. That residual is covered at the NEWEST end of the window by refusing certification on ANY trailing silent day, and at the OLDEST end ONLY where the family had a delivered row before the window started; in the MIDDLE of the window, and at the oldest end where no pre-window row survives, it is NOT covered and the entry says so below rather than calling the class closed. THE MIDDLE CLAUSE IS THE ONE THAT STOPS THE ENGINE. An earlier draft enforced on the loss ceiling ALONE and that was enforcement in name only, for a reason that is structural rather than a reading: the ceiling was backfilled from the sanctioned SPEND rate monthised, and a launch family with real sales loses far less than it spends, so a ceiling denominated in NET PROFIT is a loose bound by construction. NO RATE, RATIO OR CEILING PERCENTAGE IS WRITTEN IN THIS ENTRY (Standing Rule 0). Read them: SELECT family, daily_investment, spend_per_day, spend_rate_ratio, spend_breached, ceiling_used_pct, rate_window_basis, protection_qualified FROM `onyga-482313.OI.V_INVEST_STATUS`. monthly_loss_ceiling is still published and still in the AND, but as a CATASTROPHE BACKSTOP behind the spend rate. MONTHS 0-3 ARE JUDGED ON IMPROVEMENT, NEVER ON PROFITABILITY (Ori: 'the question of launch products is are they improving - not are they profitable - in the first 3 months'). phase = RAMP while launch_age_months <= 3, else PROOF. The RAMP verdict compares this complete month against the last one on three trends (organic units rising, total net ROAS rising, loss shrinking) and its kill rule is 'no improvement two months running', NEVER 'still unprofitable' - a profitable-at-month-2 test would kill every launch that was working, and an assertion guards that the RAMP verdict can never contain the word. The PROOF verdict is the only place a LEVEL is judged, against takeover_target_organic_units. NULL IS NOT ZERO: that target is NULL until Ori supplies it, so the PROOF branch reports that no take-over target is on record rather than comparing a real organic-unit count against nothing. ABSOLUTE ORGANIC UNITS, NOT SHARE: share rises when ads units COLLAPSE, which looks like success and is not. COMPLETE CALENDAR MONTHS ONLY: the trend CTE takes V_FAMILY_PNL rows matching a YYYY-MM period_label with period_end before the current month's first day, so the partial MTD row can never enter the trajectory - a 17-day month posing as a full one would read as a false collapse on exactly the launches this view judges. Only the SPEND/CEILING side runs to the present, where partial is correct because it is a RATE. A RATE IS MEASURED ON A TRAILING WINDOW (Ori's decision, 2026-08-20): the sanction is denominated as a RATE ($/day), not as a monthly budget, so spend_per_day is the mean of the last 28 COMPLETE days ending one day behind the newest day whose spend can reach V_UNIFIED_DAILY. A trailing window is ALWAYS FULL, so the month-to-date apparatus is gone entirely: no minimum day count, no last-complete-month substitution, no is_fallback, no caveat sentence. The round-2 rule substituted the LAST COMPLETE MONTH's rate below an 11-day minimum, which meant that for the first twelve days of every month the gate reported last month's behaviour. THE 11-DAY DERIVATION IS KEPT IN THE VIEW HEADER as the reason the window may not be shortened (standard error sigma/sqrt(n) against a 0.6-of-sanction margin two standard errors wide); 28 clears it and matches the house 28-day window. WHAT IT COSTS, stated: a trailing window LAGS A STEP UP, which is why the gate now breaches on EITHER window - the 28-day arm, or a 7-day arm that must clear the sanction by 2 standard errors of a 7-day mean, with sigma estimated per family at query time from first differences over 90 zero-filled days (a plain standard deviation was rejected because a ramp inflates it and widens the margin exactly when the gate must see a step up). The 7-day columns also publish spend_rate_direction (rising/steady/falling), and it bands on THE SAME DERIVED MARGIN THE SHORT ARM BREACHES ON, never on a chosen percentage: the 7-day rate must sit more than breach_margin_per_day away from the 28-day rate before the word moves off steady. This entry stated a fixed percentage band from the day the arm was wired until 2026-08-20 and no such band ever existed in the deployed view. The false figure itself is NOT repeated here, because a stale number quoted as the exhibit is still a stale number on the page and a later reader cannot tell the exhibit from the claim. The lesson is the SHAPE: check a mechanism against the SQL before writing it down here. DELIVERY IS A PROPERTY OF THE DATE, NOT OF THE FAMILY (2026-08-20, sixth repair round). Until this round delivery was inferred from the FAMILY'S OWN SPAN - a window day counted as a real zero if the family had a row on it, or if the account delivered the day while the day lay outside that family's [first ads day, last ads day]. That instrument read the very rows it was asked to report on and failed at all three places a window can be damaged: TRAILING, because a lagging feed withholds a family's NEWEST rows first, so the family's last day moved back, the withheld days fell outside the span, and a DELIVERY LAG WAS SUMMED AS DELIVERED REAL ZEROS and read as a decision to stop advertising (permissive, rate reads LOW); LEADING, because any contiguous loss of OLDER rows - a remap that re-labels history, a partial backfill - moved the first day forward and zero-filled the front of the window with no flag at all; and MIDDLE, because a genuine advertising STOP lies INSIDE the span, so every quiet day of it was called a hole and the whole rate was FALSELY WITHHELD on the one shape where an honest number existed. The rule is now two questions asked separately. (1) HAS THIS DATE ARRIVED - an account-level property of the DATE, derived once from FACT_AMAZON_ADS over the window for every family alike, never consulting a family. (2) DID THIS FAMILY SPEND ON A DELIVERED DATE - if the date is delivered and the family has no row, it spent nothing and that zero belongs in the denominator. Anything else is a HOLE: a date the ACCOUNT never delivered. A window with a hole has its spend and rate WITHHELD - NULL, never a short sum - and the withheld reason names the missing days BY DATE and not merely by count, beside rate_window_days_delivered, rate_window_days_missing, rate_window_missing_days, rate_window_data_complete and rate_window_withheld_reason, and the same for the short window. WHY IT READS THE ADS FACT AND NOT V_UNIFIED_DAILY EVEN THOUGH V_UNIFIED_DAILY IS WHAT THE NUMERATOR SUMS: V_UNIFIED_DAILY inner-joins V_PRODUCT_FAMILY_MAP and DIM_TIME, both family-level filters, so a remapping that unmaps a family would delete dates from the account-level signal and the instrument would move with the thing it measures. Whether the two date sets agree today is a MEASUREMENT and the query that takes it is printed in the view header at acct_day. THE TWO WINDOWS ARE JUDGED ON THEIR OWN DAYS, so a hole in the far end of the 28-day window leaves the 7-day arm standing. A DECLARED FAMILY WITH NO ADS DATA AT ALL FALLS OUT OF THE SAME RULE rather than needing a second one: no advertising span means no day can be read as a real zero, so every window day is a hole and family_ads_data_present publishes FALSE - before this the LEFT JOIN summed an empty set to zero and the row read as perfect adherence. sigma is withheld too when the noise window has an undelivered day (a hole manufactures two large first differences and INFLATES sigma, widening the margin), and a withheld sigma leaves a ZERO margin, which makes the short arm stricter and not looser. ONE DEFINITION OF 'THE FEED DELIVERED THIS DATE', AND IT IS A CONJUNCTION OF TWO SOURCES (2026-08-21, U3): the ads FACT carries the date (SUM(Ads_cost) > 0 OR SUM(Ads_impressions) > 0 over FACT_AMAZON_ADS, in fact_day) AND the family-MAPPED daily view carries it ACCOUNT-WIDE (SUM(ad_cost) > 0 OR SUM(impressions) > 0 over V_UNIFIED_DAILY across every family, in mapped_day). WHY BOTH. Round 6 moved delivery to the fact so a remapping could not delete dates from the signal, and that reason still holds - but the numerator still SUMS V_UNIFIED_DAILY, so a loss confined to the numerator's own join path was invisible to a fact-only instrument: every date read delivered, the window read complete, and the rate collapsed in silence, in the permissive direction. A verifier demonstrated it by removing all six families' V_UNIFIED_DAILY rows for a 26-day stretch with the fact intact. The two sources must now AGREE before a date counts as delivered, and a disagreement is itself a reason to withhold - because it means the MAPPING lost something. The disagreement is PUBLISHED and not folded into the hole count: rate_window_days_in_fact_not_in_mapped, rate_window_fact_not_mapped_days, rate_window_days_in_mapped_not_in_fact and the short-window equivalents, and the withheld reason names a mapping loss in those words rather than calling it a feed hole. WHAT WAS REJECTED: moving the numerator to FACT_AMAZON_ADS - the instrument moves to the numerator's path, not the reverse, because V_UNIFIED_DAILY is the source the whole two-book design measures money with. THE COUPLING THIS BUYS BACK, STATED: delivery is again partly a function of the family map, account-wide over every family so no single family can delete a date, and fail-closed in direction - a date drops OUT of delivery and the window is withheld, never the reverse. Whether the two agree TODAY is a MEASUREMENT and the query is printed in the view header at fact_day. There is no second definition in the file and in particular no per-family one. The OR is the right predicate because the question is whether the date's data ARRIVED, not whether money moved on it; and calling a date delivered when it was not is the permissive error, so the test errs towards calling a date undelivered. ONE ROW PER FAMILY FROM V_BOOK_ASSIGNMENT IS GUARDED AND ASSERTED: b is deduplicated on a deterministic total order over the whole row (TO_JSON_STRING, never ANY_VALUE) so a duplicate can never multiply a window sum, and book_assignment_rows publishes the count that was there while protection_qualified requires it to be 1. TWO CURRENCY TESTS, EACH ANCHORED WHERE ITS OWN QUESTION LIVES, and the off-by-one between them closed by derivation rather than by adjusting a constant (2026-08-20). (A) THE ACCOUNT'S FEED AGE against ads_feed_stale_after_days = 3, the same threshold V_DATA_FRESHNESS uses, anchored to TODAY because the question is how old the newest thing anyone knows is. (B) THIS FAMILY'S TRAILING SILENCE, MEASURED INSIDE THE WINDOW (2026-08-21, seventh repair round): trailing_silent_days = win_end minus this family's newest ads row THAT LIES IN THE WINDOW, and the whole window length when it has no row in the window at all. THE PREVIOUS FORM WAS DEFEATED BY THE ORDINARY CASE and this entry asserted it worked. It read GREATEST(0, win_end - family_ads_last_day) off the family's GLOBAL newest row over the 201-day scan; win_end is feed_end - 1, so a surviving row at feed_end - which is where the ordinary newest row sits, one day AFTER the window ends - made the difference negative and the count 0. ANY later row switched the guard off, so the trailing-silence experiments the previous round reported as detecting silence return zero against that expression - the SHAPE is the lesson and the figures are not repeated here. Reading only rows between win_start and win_end removes it: nothing outside the window can answer for the window, and there is no constant to tune - ANY trailing silent day is enough. The before/after query is printed in the view header at trailing_silent_days; RUN IT rather than reading a result here - both sides of it are measurements and the old-rule side is a constant zero only for as long as the ordinary newest row keeps sitting where it does. rate_window_is_stale is now (A) OR (B) OR (C), also published under the name that describes it, rate_window_uncertifiable, from the same expression so the two cannot drift; rate_window_uncertifiable_reason names EVERY cause that applies, built by joining the causes rather than by enumerating their combinations, and protection_qualified FAILS CLOSED on it. HOW MANY CONDITIONS protection_qualified ANDs together is NOT written here or in the view header: it is a count of things in the code, which is a measurement under Standing Rule 0 and rots on the next edit. The header used to state a count, and it did not match the deployed expression - which is the whole point: a sentence about the code can be wrong without anyone touching it. Neither the old figure nor the true one is repeated here. The query that counts the conjuncts from INFORMATION_SCHEMA.VIEWS is printed in the header instead; run it. IT DOES NOT WITHHOLD THE RATE: a genuine advertising stop must publish an honest number, so the rate is reported and the window is simply not certified. (C) THIS FAMILY'S LEADING SILENCE, MEASURED THE SAME WAY, AND NOW GATING OVER PART OF ITS CLASS (2026-08-21). It had the mirror defect - DATE_DIFF(first_ads_day, win_start) off the family's GLOBAL oldest row, so any surviving older history drove it to 0 - and that defeated count was offered as the entire defence for the disclosed leading-edge hole. It is now counted inside the window, and one fact splits the class: did this family have a delivered ads row BEFORE win_start? If it DID, it was advertising up to the window's edge and front-of-window silence is a GAP in a history - the shape a re-labelling or partial backfill makes - so certification is REFUSED (family_leading_silence_is_a_gap). If it did NOT, the same silence is what every launch that began advertising inside the window looks like, this view cannot tell that from a truncated history, and gating would refuse protection to every real launch for being new - so there it is DISCLOSED and does not gate. WHAT THE CLOSED HALF COSTS: a family that paused before the window and resumed inside it is refused certification while the gap sits in the window. KNOWN AND STILL NOT CLOSED, NAMED RATHER THAN OMITTED: (i) leading silence where NO pre-window row survives, and (ii) silence in the MIDDLE of the window, which on delivered dates is a real zero and is divided as one. family_leading_silent_window_days, family_advertised_before_window, family_interior_silent_window_days, family_first_ads_day_in_window, family_last_ads_day_in_window and rate_window_basis publish all of it. SANCTIONED-ON IS READ AND THE TWO QUESTIONS ARE SPLIT: spend_breached is the COMPARISON on either window, sanction_adherence_judged is the credit, and protection requires both - because a window that mostly predates the day the rate was agreed can be compared against that rate but cannot be said to have broken it. FINDING ON THE SHORT WINDOW, COMPARISON ON THE LONG (Ori 2026-08-20), AND THE RULE IS PER WINDOW AND NOT PER FAMILY: a window may carry a FINDING only when ZERO of its days precede sanctioned_on; otherwise its excess is stated in full and convicts nobody. The two windows roll clean on different days - the 7-day window clears a sanction three weeks before the 28-day one - so withholding the verdict until the FAMILY has any judgeable window is stricter than the rule and goes quiet where a verdict was wanted, while letting one qualified window speak for the other over-convicts. sanction_covers_28d_window, sanction_covers_7d_window, sanction_finding_28d, sanction_finding_7d, sanction_breach_finding and sanction_breach_finding_arm publish the per-arm answer; all are three-valued and NULL means 'not measurable, or not wholly covered', never 'no breach'. The loss ceiling STAYS on calendar month-to-date because a monthly allowance is a monthly allowance, labelled by loss_ceiling_window_basis so the two windows can never be confused. mtd_spend and mtd_spend_per_day were renamed rate_window_spend and spend_per_day because 'month to date' was never what they measured. Trajectory is also robust to a level bias: a constant COGS misallocation cancels out of a month-over-month trend, which is why an implausible halo does not block the ramp test - though it must be fixed before that family reaches PROOF. DO NOT PIN FIGURES HERE - the spend rate, the ceiling percentage and the last-complete-month organic counts all move, and the organic counts also RESTATE. Pull the view. Spec: docs/superpowers/specs/2026-08-19-two-book-pnl-design.md 5."
    dependencies:
      - V_BOOK_ASSIGNMENT
      - V_FAMILY_PNL
      - V_UNIFIED_DAILY
      - FACT_AMAZON_ADS

  - name: "V_TWO_BOOK_BRIEF"
    type: "view"
    source_files: ["scripts/bigquery/views/V_TWO_BOOK_BRIEF.sql"]
    description: "v27.98 (two-book P&L, born 2026-08-19, Task 7; verdict-mechanics repair 2026-08-20; the two questions separated 2026-08-21) - THE MORNING READ: the two books reported side by side and NEVER blended. THIS IS THE OBJECT THE WHOLE DESIGN EXISTS FOR. The lens, not the business, was the problem: an ads-attributed view of a month can read as an account-wide loss while HARVEST families are earning and a deliberate launch investment spends some of it, because that lens cannot see the units a keyword builds organically. How large that blind spot is IS A MEASUREMENT and moves per family - it is the halo, read from V_FAMILY_PNL.halo_factor, never quoted as a range from this entry. The founding case was July 2026, a CLOSED month; the two lenses on it have OPPOSITE SIGNS, and that is the whole claim - reproduce it rather than quoting it: SELECT ROUND(SUM(net_profit), 0) AS net_profit_including_halo, ROUND(SUM(ad_spend * (ads_net_roas - 1)), 0) AS ads_attributed_only FROM `onyga-482313.OI.V_FAMILY_PNL` WHERE period_label = '2026-07'. (The single-column version of that query, which this entry published until 2026-08-20, returned only the halo-inclusive figure and so could not show the sign flip its own sentence claimed. This view has no ads-only profit column; the ads-only side must be derived from ad_spend and ads_net_roas as above.) READ THE OBJECT, NOT THIS ENTRY. Six review rounds have each left stale prose here, this entry included - the sixth found it still describing four verdict rules, a per-family Rule 2 and a word cap that had moved. Everything measured lives behind these two queries: SELECT * FROM `onyga-482313.OI.V_TWO_BOOK_BRIEF` ORDER BY sort_order; and SELECT ordinal_position, column_name, data_type FROM `onyga-482313.OI.INFORMATION_SCHEMA.COLUMNS` WHERE table_name = 'V_TWO_BOOK_BRIEF' ORDER BY ordinal_position. THE COLUMN COUNT IS DELIBERATELY NOT WRITTEN DOWN: this entry has pinned one twice and the object has been recolumned four times. Count it. AND VERIFY A COLUMN NAME BEFORE YOU QUOTE IT - this entry has twice named columns the object no longer carried, and every query published against them failed to compile rather than failing quietly. GRAIN: one FAMILY row per family plus exactly ONE TOTAL ROW PER BOOK - and NO GRAND TOTAL, by construction. The totals are built off a two-row book spine (HARVEST, INVEST) and nothing in the view ever aggregates across book; the acceptance assertion pins total_rows = 2 (a DECLARED structural invariant, not a measurement) and the reconciliation gaps at 0 so a combined number can never reappear. A family with no book row falls to HARVEST, the documented default, which keeps its dollars inside the Harvest total instead of opening a NULL third book. Both books are published even when one is empty, so the shape never changes under the reader. The spine is a FULL OUTER JOIN of the two family universes: V_FAMILY_PNL is ASIN-keyed through DIM_PRODUCT, V_BOOK_ASSIGNMENT is campaign-keyed through V_CAMPAIGN_FAMILY_MAP and is not windowed, so a declared launch whose ASINs carry no parent_name would otherwise be joined away while the book total printed a complete-sounding sentence. MEASURED MEANS THE MONEY IS THERE, NOT THAT A ROW IS THERE: where either money column is missing, every money column on that row is NULL, both book sums are taken over exactly the subset that has money, and the verdict names WHICH half is missing. (Until 2026-08-20 that state was also published as a money_measured column and the Harvest loss order as loss_rank; BOTH WERE CUT as recomputable from the published columns - a consumer tests net_profit IS NULL and orders by net_profit itself. Do not write either name into a query against this view.) NET PROFIT LEADS, THE RATIO EXPLAINS IT (Ori's framing is total dollars). Two Harvest families can sit a rounding error apart by ratio and orders of magnitude apart in dollars; ranked by ratio you fix the cheap one, ranked by dollars you fix the expensive one, and dollars is the right answer. So Harvest losers are RANKED BY DOLLARS, deterministically and tie-broken on family rather than by a coin-flip, and the worst is named both in its own verdict and in the book total. A loss smaller than breakeven_band = 5% of the family's own ad spend is called noise IN WORDS, so a trivial loss can never read as a job - a declared tunable in the k CTE, because it is the thing that stops a ratio just under 1.0 from manufacturing work. The Harvest TOTAL states all three sides of the split - earning, losing real money, and losing too little to act on - so it can never speak past a family it does not name. total_net_roas is SUM(sales - cogs) / SUM(ad_cost) over the WHOLE family, and every verdict that quotes it SAYS WHAT IT DIVIDES: the numerator is gross profit taken BEFORE advertising, while the net_profit column beside it subtracts advertising, so an unqualified phrase would let a ratio above 1.0 read as a profit. ### THE SEVEN MECHANICAL RULES THE VERDICTS OBEY, EACH ASSERTED AGAINST THE DEPLOYED VIEW (rewritten 2026-08-20, sixth round; this entry described a smaller set of rules, a per-FAMILY Rule 2 and a superseded word cap, none of which is what is deployed; the stale figures are not repeated here). Five earlier rounds each fixed a real defect and each shipped a NEW self-contradiction in the prose. Ori kept the prose format, so the constraints on it were made MECHANICAL AND ASSERTED rather than stylistic: the next agent to touch a verdict trips a check, not a reviewer. THE ACCEPTANCE QUERY AT THE FOOT OF V_TWO_BOOK_BRIEF.sql RUNS ALL SIX IN ONE PASS OVER THE VIEW - run that, do not trust this paragraph, which has now been wrong twice. WHAT A RULE HERE CAN AND CANNOT BE, stated because the distinction is the whole lesson of round six: a rule keyed on a FIXED LIST OF WORDS is a TRIPWIRE and catches only the evasion found last time (round 5 banned the concessives and round 6 found the same self-contradiction rebuilt out of 'so'); a rule keyed on a PUBLISHED COLUMN is a CONSTRAINT, because the column and the prose come from one expression and no rewrite of the sentence can move the column. Rules 5 and 6 are constraints and read no prose at all; Rules 2 is a constraint; Rules 1 and 4 are tripwires with a constraint bolted to each. RULE 1, NO CONCESSIVE CONNECTIVE INSIDE A VERDICT (tripwire): every self-contradiction found up to round 4 lived in a clause that took back what the sentence had just said, so two sentences that each stand alone replace one that concedes. The fifth used 'so' and no word list can reach that, which is why Rule 5 exists. RULE 2, A VERDICT MAY NOT CONVICT WHERE NO WINDOW CARRIES A FINDING (constraint, RE-KEYED PER WINDOW). It used to key on sanction_adherence_judged, a PER-FAMILY flag, and under Ori's per-window ruling that is the wrong grain: it withheld the verdict on a short window that WAS wholly inside the sanction because the long one was not, going quiet exactly where Ori wanted a finding. It now keys on the per-window answer, and the assertion keys on a COUNT (families_with_a_sanction_finding, 1 or 0 on a family row and the count of convicted families on a total) rather than on a boolean, because a book total may truthfully say that SOME of its families forfeit protection while the book itself carries no finding. A WITHHELD FLAG NEVER RENDERS DOWNSTREAM AS A PASS: on Harvest rows, where the concept does not apply, it is NULL rather than TRUE. RULE 3, A WORD CAP PER VERDICT, ASSERTED OVER THE LONGEST REACHABLE VERDICT AND NOT OVER TODAY. THE CAP IS A DECLARED CONSTANT AND IT IS WRITTEN DOWN IN EXACTLY ONE PLACE - Rule 3 in the V_TWO_BOOK_BRIEF.sql header, beside the slot-by-slot enumeration that sets it. It is deliberately NOT repeated here: this entry carried the previous figure for a round after the real one had moved, and a constant duplicated into prose drifts the moment the real one is re-derived. The old cap did not fail because it was tight, it failed because it was UNPROVABLE - it was asserted over the rows that happened to fire, and two of the prose lists grew one term per family, so no constant could ever have bounded the verdict. That is fixed at the source: k.list_terms_max (a DECLARED CONSTANT, 3) is the most terms any verdict spells out, past which the sentence gives a count and the complete list is read off the column beside it (sanction_end_dates, families_inside_break_even_band, families_with_nothing_measured, families_with_no_approved_rate, families_with_a_withheld_rate_window). The cap is set at the enumerated worst case with ZERO SLACK on purpose, so the next clause added to any verdict fails the assertion immediately and its author has to redo the arithmetic deliberately. verdict_words is published per row so the rule is checkable without re-deriving the tokeniser. RULE 4, NO VERDICT MAY WITHHOLD AND THEN ASSERT ON THE SAME SUBJECT (tripwire plus constraint): organic_units_trend is published (climbing / falling / flat / mixed, decided on the SIGNS OF THE STEPS between whole months so the word is mirror-symmetric in time, or NULL when no direction is being published); a row whose trend is NULL may contain no word implying one and may not use the series construction ', then '; and where a direction IS published the verdict must contain that exact word, so the sentence and the grid cannot disagree. RULE 5, NO VERDICT MAY RETRACT A FINDING AND THEN GIVE AN ORDER ABOUT IT (constraint, NEW). The fifth self-contradiction was a SHAPE, not a word: all three Invest verdicts said the family was over its approved rate, then said the excess is a comparison and not a finding, then ordered the budgets pulled. The MOOD of the closing sentence is now a function of the data - an ORDER may appear only on a row where at least one window lies wholly inside the sanction and is over its rate; everywhere else the held decisions are still named and the dollars still priced, in the OPTION mood. Both the sentence and the column naming its mood (verdict_action_mood) come from one expression, and the row publishes the sentence its mood FORBIDS (verdict_forbidden_sentence) so the check needs no string literal of its own. What it does not catch, said plainly: a rewrite that invents a NEW imperative escapes the string half, but not verdict_action_mood, which is data. RULE 6, A FINDING MAY NOT EXIST ON A WINDOW THE SANCTION DOES NOT WHOLLY COVER (constraint, NEW). Ori's per-window ruling in structural form, testable without reading a word of prose: a per-arm finding implies its arm is covered, the row's finding implies at least one arm's finding, and a book's finding implies every priced family's finding. The per-arm columns are sanction_covers_rate_window, sanction_covers_short_window, sanction_finding_in_rate_window, sanction_finding_in_short_window, sanction_breach_finding, sanction_breach_finding_window and sanction_finding_published; all are three-valued and NULL means 'not measurable, or not wholly covered', never 'no breach'. TWO STATES OF PROTECTION, NOT ONE, AND BOTH AS COLUMNS (Ori 2026-08-20: 'Tell the truth now, release nothing'). protection_qualified is what the sanction rules say (read from V_INVEST_STATUS, where it is a long AND that fails closed on every clause of it: the clock and a stop date on file, exactly one book-assignment row, a measurable sanctioned rate and a measurable spend rate, BOTH windows delivered in full with no withheld reason, a measurable loss ceiling and month-to-date profit, a window certifiable as current, a MEASURED non-breach on both arms, a window the sanction actually covers, and the loss under the ceiling. THE NUMBER OF CLAUSES IS NOT WRITTEN HERE AND MUST NOT BE - this entry said 'eight' and the plan said 'eight' after the count had changed, which is the column-count defect wearing different clothes. Count them in the view). protection_enforced is what the machine is actually doing, and it is THREE-STATE: TRUE where either source sees a protected campaign, FALSE only where a source has campaigns for the family and none is protected, NULL where neither source has heard of it - a missing measurement printed as FALSE would put the original lie straight back on the page. The gap between them is published in counts and in dollars: stops_the_coach_is_holding, trims_the_coach_is_holding, daily_budget_the_held_stops_would_free and daily_budget_the_held_trims_would_free, on the family row AND on the book total. A KNOWN TRAP, WRITTEN DOWN SO ROUND SIX DOES NOT REBUILD IT: the brief COALESCEs a NULL protection state to FALSE, so a literal withhold-on-unjudged rule upstream once made the Invest total say that all families were inside their agreed rate and still qualified for protection while they were well over it. Split the comparison from the credit upstream instead - which is what sanction_adherence_judged now does. THREE WINDOWS, EACH LABELLED, NEVER ALIGNED. (1) The P&L columns are the SETTLED 90-DAY window, published as money_window in words rather than as the upstream code, with ad_spend_in_money_window carrying its window in its own name. (2) The sanctioned spend rate is a TRAILING SPAN OF COMPLETE DAYS ending one day behind the ads feed - always full by construction, which is why the whole month-to-date fallback apparatus was DELETED rather than repaired. It is judged on TWO ARMS, a long window and a short one, published as spend_per_day_in_rate_window and spend_per_day_last_7_days with spend_breach_window naming which arm breached; rate_window, rate_window_start, rate_window_end and rate_window_is_stale are READ from V_INVEST_STATUS and never re-derived here. rate_window_is_stale closes the frozen-feed hole: when the ads feed has stopped moving under the window, the family row and the book total both say in words that nothing can be certified until it catches up, protection fails closed, and the caveat is three-state so it fails closed the same way the upstream gate does. Upstream also distinguishes a HOLE from a ZERO - a window with undelivered days has its spend and rate WITHHELD as NULL with the reason published, rather than reading as $0.00 a day - and this view prints the withheld state rather than substituting. (3) The loss allowance stays on CALENDAR MONTH TO DATE and is labelled so it cannot be confused with the rate window: loss_allowance_dollars_for_the_month, loss_so_far_dollars_against_that_allowance, loss_allowance_window. Every verdict names which window it is quoting. Do not align them - a 90-day average spend rate would bind on nothing. NO ENGINE READS THE KEYWORD BAR YET: it is COMPUTED for every family and APPLIED to nobody, because no engine reads T_FAMILY_BAR - that is Task 8, unbuilt and on hold. V_FAMILY_BAR.bar_exempt records that INVEST families would be exempt if it were wired. Note that neither halo_factor nor keyword_bar is a column of THIS view; read them off V_FAMILY_BAR or V_FAMILY_PNL. COLUMN NAMES ARE THE LEGEND, AND THEY SAY WHAT THEY MEASURE: share_of_return_with_no_ad_attribution_pct (not 'organic share of return' - it is the share carrying no ad attribution, which is a measurement, not a cause); organic_share_of_units_pct; money_window. account_ad_spend_in_neither_book is ACCOUNT-LEVEL, belongs to neither book, and is published ON THE HARVEST TOTAL ROW ONLY - one row carries the sentence, so one row carries the column; family rows and the INVEST total are NULL. That money is advertising whose advertised key carries no family name; the verdict branches on the MEASURED number of such keys, so it says 'these rows carry X where the product should be' when there is one and speaks in the plural only when there is more than one. Do not confuse that population with the unresolved-campaign rows in V_CAMPAIGN_FAMILY_MAP - they are counted differently and are not the same number: SELECT COUNTIF(parent_name = 'Unknown') AS unresolved_map_rows, COUNT(*) AS map_rows FROM `onyga-482313.OI.V_CAMPAIGN_FAMILY_MAP`. VERDICTS ARE PLAIN SENTENCES, ENFORCED BY READING THEM ALOUD BEFORE DEPLOY: no rule names, no engine internals, no bare metric codes, and no claim that outruns its number. ROAS is written as so many dollars back for every ad dollar. Ori has repeatedly filed unreadable output as a defect against the page and is right to. PLANNER BUDGET - READ THIS BEFORE CONSUMING THE VIEW. Reading it once is healthy; WRAPPING it is not. BigQuery inlines the view at every reference and it fans out over V_UNIFIED_DAILY through three views, so three scalar subqueries over it cost tens of seconds and nine do not complete. Consequences: (i) write every check as a SINGLE PASS over the view (COUNTIF / SUM(IF(...)), no self-joins); (ii) ANY page, Cube model or SOP query MUST read a materialised copy - CREATE OR REPLACE TABLE `onyga-482313.OI.T_TWO_BOOK_BRIEF` AS SELECT * FROM `onyga-482313.OI.V_TWO_BOOK_BRIEF` plans fine at one reference. THAT TABLE DOES NOT EXIST YET and nothing in the repo builds it; it has to land before the first consumer, not after the first timeout. Measure the cost with a --dry_run before quoting it; the byte count is a measurement and is deliberately not written here. Internally the base CTE is expanded TWICE, not four times, which also removed a self-join that would have SQUARED any future duplicate upstream row into four identical family rows and two wrong money columns while total_rows sat at 2 looking healthy. NOTHING IN THE ENGINE IS TOUCHED BY ANY OF THIS. V_LAUNCH_EXEMPTION, V_ADS_COACH and V_COACH_CAMPAIGN_BUDGET are unchanged, no held decision has been released, and Task 8b (wiring the sanction to the coach) is unbuilt and on hold - until it lands the only enforcer is a person reading this row, and the row says so. WHAT THIS VIEW GUARANTEES, AND WHAT IT ONLY DISCLOSES (restated 2026-08-20, sixth round, against the deployed body - three guarantees written here and in the headers a round earlier were not provided by the code, and an omitted corner is how each of them became false). GUARANTEED: two book totals and no third and no grand total, by construction. GUARANTEED: a family with either money column missing contributes to NEITHER book sum and is named in words. GUARANTEED: every sanction figure on a TOTAL row is taken over the PRICED families and every count the prose compares is taken over that same set. GUARANTEED: a book publishes a rate window, a rate and a window phrase only when every priced family is on one identical window, else all three are NULL and the verdict says so. GUARANTEED: sanction_end_dates on the INVEST TOTAL holds EVERY distinct end date the priced families hold, in date order, with no bound and no elision - the VERDICT spells them out only while there are at most k.list_terms_max of them and otherwise gives a count and names the column, so a partial list is never printed as a whole one. (The header used to promise that the verdict itself named every end date while the code printed the first and the last joined by 'and' - true at exactly two dates and false at three.) GUARANTEED: a conviction appears only where at least one window lies WHOLLY inside its sanction and is over its rate, and an ORDER appears only on a row carrying such a finding. DISCLOSED, NOT CLOSED - THE LEADING EDGE OF THE RATE WINDOW: upstream cannot tell a family that began advertising inside the window from one whose older rows were lost, so a contiguous loss of older rows still zero-fills the front of the window and biases the rate DOWN. It rides on the row as family_leading_silent_window_days and is stated in rate_window_basis; nothing here claims it is closed. NOT ASSERTABLE: that no future rewrite invents a new imperative or a new way to assert a direction in words no list holds - Rules 1 and 4 are tripwires, Rules 2, 5 and 6 are the part that cannot be talked around. ### v27.98 (Ori 2026-08-21, seventh round) - QUALIFICATION AND FINDING ARE DIFFERENT QUESTIONS AND BOTH ANSWERS STAND TOGETHER. ORI'S RULING: protection_qualified is FORWARD-looking (are you inside the terms that grant protection right now); sanction_breach_finding is BACKWARD-looking (can I say you broke the agreement). On the day this shipped the first was FALSE - both launches were spending above their approved rates - while the second was NULL, because most of the rate window predates the agreement. THAT IS NOT A CONTRADICTION AND NEITHER ANSWER MAY BE MADE TO FOLLOW THE OTHER. THE DEFECT: the verdict spoke only the BACKWARD answer. On a family row the excess-with-no-finding branch consumed the whole clause and the qualification ladder sat below it, unreachable whenever there was an excess; on the book total the qualification arm sat INSIDE the finding CASE and any excess made it unreachable there too. So the paragraph read as one retracted claim while protection_qualified said FALSE one column away. RULE 7 (constraint, new): the forward answer is built ONCE, published as verdict_qualification_sentence, and CONCATENATED into the verdict, so prose and column cannot drift; the assertion is that a non-NULL sentence appears in its own verdict and that no INVEST row publishing a rate withholds it. The grid carries the same split as the prose - protection_qualified and families_qualified_for_protection answer FORWARD (protection_qualified is now populated on the INVEST TOTAL too, three-valued and fail-closed like the finding: TRUE only if every priced family is inside its terms, FALSE only if none is, NULL for a mixture), sanction_breach_finding and families_with_a_sanction_finding answer BACKWARD. SIX MORE REPAIRS IN THE SAME PASS. (1) THE VERDICT NOW QUOTES THE NUMBER IT CONVICTS ON: the conviction can land on the SHORT arm alone and the only rate the sentence quoted was the long-window one, so wherever the short window carries the finding the short rate is quoted beside it. (2) A COMMENT NAMED TWO COLUMNS THE VIEW HAS NEVER PUBLISHED (spend_breached_28d / spend_breached_7d); the comparison is readable off spend_per_day_in_rate_window, spend_per_day_last_7_days and spend_breach_window, and the comment says so - verify a column name against INFORMATION_SCHEMA before writing it anywhere. (3) THE WITHHELD-WINDOW BRANCH NAMED A CAUSE THAT IS NOT THE CAUSE: it said 'check that its campaigns carry the family name' on every withheld window, including an ACCOUNT-WIDE feed hole where the mapping is fine. It now READS the reason upstream owns (family_ads_data_present, rate_window_days_in_fact_not_in_mapped, rate_window_days_missing) and separates never-advertised from a mapping loss from a feed hole; the reason string itself names dates and so is unbounded, and rides on the row as rate_window_withheld_reason rather than inside a verdict. (4) A DEAD ARM REMOVED from the book-level finding clause: a 28-day window wholly inside a sanction implies the 7-day window is too (same end day, later start), so 'each is over a window its own agreement wholly covers' was unreachable; the short-window form is the ELSE now, which also makes the CASE total by construction - an unmatched CASE would CONCAT to NULL and print a blank verdict. (5) A WITHHELD WINDOW IS NO LONGER PUBLISHED AS 'NO APPROVED RATE': one list held both causes under the first name, so a family with a sanction on record was named on the total as having none while its own row quoted the rate. Two lists, two counts, two sentences, two different jobs - families_with_no_approved_rate and families_with_a_withheld_rate_window. (6) n_enforced and n_enforcement_known are scoped to the priced set like every other count the prose compares. THE CORNER THAT SCOPING DOES NOT COVER, DISCLOSED: the held-decision DOLLAR sums beside that count are still taken over the whole book, because a held cut on an unpriced family is real money and hiding it would be the worse error. AND AN HONEST STATEMENT OF WHAT THE RULES ARE WORTH, because a verifier wrote four hostile verdict strings that pass every assertion and still retract a finding: Rules 2, 3, 5-mood, 6 and 7 are CONSTRAINTS keyed on published columns and cannot be talked around; Rules 1, 4-word and 5-string are TRIPWIRES over fixed word lists and catch only the phrasings already found. The constraints bound the LOGIC, not the ENGLISH. There is no closed set of rules over an open language, and the list is what a reviewer does not have to check by hand - everything else in a verdict still has to be READ ALOUD by a person before it ships. NOTHING IN THE ENGINE MOVED IN THIS ROUND EITHER: V_LAUNCH_EXEMPTION, V_ADS_COACH and V_COACH_CAMPAIGN_BUDGET are untouched and no held decision was released. SOURCING: V_COACH_CAMPAIGN_BUDGET is far too heavy to inline, so its daily materialisation T_COACH_CAMPAIGN_BUDGET is read instead; V_LAUNCH_EXEMPTION is light and is the authority the coach reads, so it is joined directly. Both are read because either alone can be silent about a family the other can see. Spec: docs/superpowers/specs/2026-08-19-two-book-pnl-design.md 6."
    dependencies:
      - V_FAMILY_PNL
      - V_BOOK_ASSIGNMENT
      - V_FAMILY_BAR
      - V_INVEST_STATUS
      - V_PRODUCT_FAMILY_MAP
      - FACT_AMAZON_ADS
      - V_LAUNCH_EXEMPTION
      - T_COACH_CAMPAIGN_BUDGET

  - name: "V_ORDER_ITEM_COVERAGE"
    type: "view"
    description: "THE BACKFILL GATE for customer-order baskets. One row per purchase month: header orders, how many have their line items loaded (orders_with_items), coverage_pct, header_units vs item_units and units_missing, and is_month_complete (coverage_pct >= 99.99, not exact equality — a handful of very old orders may never return items, and a month that asymptotes just under 100% must not stay flagged incomplete forever; this is the same bar the downstream verification uses). The Daton item feed backfills OLDEST-FIRST and lags the header feed badly, so a recent month can show plenty of orders while most of their line items have not arrived — every basket statistic for that month is quietly wrong. Read this before trusting V_ORDER_CROSS_SELL or V_ORDER_BASKET for a period; rule of thumb is do not draw a conclusion about a month whose coverage_pct is below 99. Canceled header orders are excluded from the denominator (zero units, no items needed). coverage_pct and units_missing must be read together: orders_with_items only asks whether at least one item row exists for an order, not whether every line has arrived — a partially-synced order still counts as covered, and units_missing is what catches that at month level. Spec: architecture/CUSTOMER_ORDER_BASKETS.md"
    source_files: ["scripts/bigquery/views/V_ORDER_ITEM_COVERAGE.sql"]
    dependencies:
      - V_SRC_ListOrder
      - V_SRC_ListOrderItems

  - name: "V_ORDER_BASKET"
    type: "view"
    description: "One row per customer order (selling_partner_id, amazon_order_id) describing basket SHAPE: line_count, distinct_asins, distinct_families, units, item_revenue (gross extended list price — pre-tax, pre-discount; does not tie to the order total or to Amazon-reported sales), all_asins_in_dim (TRUE only when every ASIN in the basket has a DIM_PRODUCT row — does NOT mean every product has a usable family, since a mapped ASIN can still carry parent_name IS NULL), basket_kind (SINGLE / MULTI_UNIT_SAME / MULTI_PRODUCT) and a readable basket_label. Excludes canceled orders AND canceled lines (quantity_ordered > 0) — filtering only the order leaves phantom units behind. Unmapped ASINs get family_label = 'UNMAPPED:<asin>' so two different unmapped products never look like one product bought twice; this fallback covers BOTH an ASIN genuinely absent from DIM_PRODUCT and an ASIN present there with parent_name NULL (e.g. B0CHJY7XLQ / B0CHJZDD3F — both present, oi_is_active = FALSE, no sales since July 2025; Amazon's own is_active stays TRUE because the catalog record was never deleted, which is why every production view treats active as is_active AND oi_is_active). parent_name/product_short_name are the copy FROZEN onto FACT_CUSTOMER_ORDER_ITEM at load time, so this view can disagree briefly with V_ORDER_CROSS_SELL (which reads DIM_PRODUCT live) until the next fact load. Spec: architecture/CUSTOMER_ORDER_BASKETS.md"
    source_files: ["scripts/bigquery/views/V_ORDER_BASKET.sql"]
    dependencies:
      - FACT_CUSTOMER_ORDER_ITEM

  - name: "V_ORDER_CROSS_SELL"
    type: "view"
    description: "MEASURED same-basket co-purchase: one row per (window_days, asin_a, asin_b) with asin_a < asin_b, carrying co_orders, support_pct, pct_of_a_orders, pct_of_b_orders, both_mapped, same_family and lift = P(A and B)/(P(A)*P(B)). Windows are 90, 365 and 9999 (lifetime), rolling from CURRENT_DATE('America/Los_Angeles') — never sum across windows, they overlap. A window's effective data range is the overlap between [cutoff, today] and [order history start, items_through_date] — never the full window_days unless items_through_date has caught up to today. If items_through_date falls before the cutoff, the window is empty (safe). If it falls between the cutoff and today, the window returns a thin, unrepresentative sliver of rows rather than the full lookback period its name implies — more dangerous than empty, since a few rows read as a real answer. Check items_through_date against a window's cutoff (CURRENT_DATE - window_days) before trusting it, and prefer window_days = 9999 for real analysis until the backfill has caught up to the present. 9999 is a sentinel, not a real day count — DATE_SUB(..., INTERVAL 9999 DAY) computes a real cutoff of 1999-04-08, and it only behaves as 'lifetime' because that predates all order history (earliest 2024-08-03); the two diverge around 2051. DISTINCT from V_ADS_COACH_CROSSSELL and does not replace it: that view reads ad-attributed purchased-product data ('clicked A's ad, later bought B', possibly separate orders); this one reads actual baskets ('A and B in the SAME order'). Read lift WITH co_orders — a pair seen twice can post a huge lift and mean nothing. same_family uses the same 'UNMAPPED:<asin>' COALESCE fallback as V_ORDER_BASKET so it is never NULL, but it is guaranteed FALSE whenever both_mapped is FALSE (structurally so when both sides are unmapped, since asin_a < asin_b forces distinct labels; true today but not enforced when only one side is unmapped, because no real parent_name happens to look like 'UNMAPPED:...') — for any unmapped pair, same_family adds nothing beyond both_mapped, so gate on both_mapped. name_a/name_b/family_a/family_b are looked up LIVE from DIM_PRODUCT at query time, unlike V_ORDER_BASKET's frozen copy — the two can disagree briefly after a DIM_PRODUCT change until the next fact load. items_through_date is on every row because the item feed backfills oldest-first; check V_ORDER_ITEM_COVERAGE for the per-month picture. The DISTINCT in the scoped CTE exists to bound self-join cardinality (one ASIN cannot count twice on one order) — it does not itself prevent pair double-counting, which the downstream COUNT(DISTINCT ...) over the composite (selling_partner_id, amazon_order_id) order key already guarantees. Spec: architecture/CUSTOMER_ORDER_BASKETS.md"
    source_files: ["scripts/bigquery/views/V_ORDER_CROSS_SELL.sql"]
    dependencies:
      - FACT_CUSTOMER_ORDER_ITEM
      - DIM_PRODUCT

  # ── Unowned spend: the money the three layers cannot see (2026-08-25) ──
  - name: "V_UNOWNED_SPEND"
    type: "view"
    description: "THE MONEY THE THREE LAYERS CANNOT SEE (2026-08-25). One row per spending SUBJECT — (campaign_id, keyword_id, targeting) — with NO row in FACT_KEYWORD_STATE, over the complete days ending at the ads watermark minus one. A subject with no state row is invisible to all three layers at once: never valued by the Catalog, never funded by the Brain, never priced by Pacing, unreachable by any park, ceiling or stop. It spends anyway. REPORTING ONLY — reads everything, writes nothing, read by no engine, book or generator, and NOT in the orchestrator, so asking changes nothing (THREE_LAYERS.md §1.4). IT ISSUES NO VERDICT: where the campaign maps to a family it prints family_bar beside gp_roas_28d and one distance and stops; where it does not, the bar columns are NULL and judgeability says why; verdict_withheld_because is never blank. Unmeasured never reads as bad — reading is NO_EVIDENCE at zero clicks and THIN below the declared min_clicks_for_a_reading, and no bar distance is published for either. WHY EACH ROW IS INVISIBLE, exhaustively, by first-match precedence ordered by what BINDS: SENTINEL (keyword_id '-1', an SB product target under a sentinel that is not an id, so no (campaign, keyword) key can exist) | CAMPAIGN_OUTSIDE_UNIVERSE (campaign absent from the campaign dimension, or not ENABLED) | SUBJECT_OUTSIDE_UNIVERSE (no DIM_KEYWORD row at all, or no current ENABLED one) | DROPPED_DOWNSTREAM (passes every universe gate and still has no state row — a build defect, not a wiring gap). The gates mirror V_KEYWORD_GUARD's own kw CTE; if that CTE changes this view must change with it or it will give a confident wrong reason. READ THE TWO WINDOWS TOGETHER: spend_per_day_28d and spend_per_day_7d. A subject whose campaign was paused three weeks ago still carries 28-day spend and is a tail, not a leak. days_in_current_run counts days of SPENDING inside a 365-day lookback, NOT days unowned — the Catalog keeps one snapshot so nothing knows what it held last month. Descends from the OUTSIDE THE CATALOG ENTIRELY probe in docs/superpowers/specs/2026-08-24-three-layers-baseline.md and improves on it four ways: target grain (the sentinel bundled many targets into one pair), the 7-day window, the classified reason, and refusing the declared reference bar the baseline itself marked MEDIUM. CLOSING THE GAP IS ORI'S DECISION AND HAS NOT BEEN MADE — do not wire these subjects into FACT_KEYWORD_STATE, any book, or the orchestrator. Acceptance: scripts/bigquery/tests/V_UNOWNED_SPEND_acceptance.sql (eleven assertions). SOP: architecture/UNOWNED_SPEND.md."
    source_files: ["scripts/bigquery/views/V_UNOWNED_SPEND.sql"]
    dependencies:
      - FACT_AMAZON_ADS
      - FACT_KEYWORD_STATE
      - DIM_KEYWORD
      - V_DIM_CAMPAIGN_CURRENT
      - T_FAMILY_BAR

  - name: "V_UNOWNED_SPEND_SUMMARY"
    type: "view"
    description: "THE DAILY NUMBER FOR MONEY NO LAYER CAN SEE (2026-08-25). Companion to V_UNOWNED_SPEND: how much of the account spends with no row in FACT_KEYWORD_STATE, what it returns, and its share of the account — so the figure is watched daily rather than rediscovered by a research pass. One row per reason_class (SENTINEL | CAMPAIGN_OUTSIDE_UNIVERSE | SUBJECT_OUTSIDE_UNIVERSE | DROPPED_DOWNSTREAM) plus a grand total under reason_class = '__ALL__'. The classes partition the total exactly and sum to it, and the total reconciles against FACT_AMAZON_ADS — unowned + owned + unkeyed = the account over the same window — both asserted in the acceptance suite. NOTE THE ROUNDING: each class is rounded to cents independently, so the class sum can sit up to 0.005 x classes away from the rounded total with nothing wrong; the suite derives its tolerance from that grid rather than pinning one. READ THE TWO WINDOWS TOGETHER — spend_per_day_28d is the headline, spend_per_day_7d is the live half, and they diverge a great deal by class: spend on a paused campaign is a tail that decays on its own, spend under the sentinel is money leaving today. Both carry their share of the account, which is the figure that survives the account changing size. NO VERDICT IS ISSUED: gp_roas is printed and no bar is applied to a population that does not own one; three nested populations are published and each is counted from the fact its own name claims, never from a judgeability label: unjudgeable_* (judgeability <> 'HAS_BAR' — cannot be scored today, for any reason including too few clicks), no_bar_* (family_bar IS NULL — no bar to score against even with unlimited clicks: no family, or an INVEST family that is bar-exempt), and no_family_* (family IS NULL — cannot be attributed to a product family at all). They nest, so the counts only decrease across those three. Counting a family population through a judgeability label understates it, because judgeability applies reading precedence first and a no-family subject below the reading threshold reads TOO_THIN_TO_READ; the summary did that until 2026-08-25 and A11 now re-derives all six figures per class and for the total. All of it is a fact about the hole rather than about the subjects. Every row carries one plain-language sentence. REPORTING ONLY — writes nothing, read by no engine or book, not in the orchestrator. SOP: architecture/UNOWNED_SPEND.md."
    source_files: ["scripts/bigquery/views/V_UNOWNED_SPEND_SUMMARY.sql"]
    dependencies:
      - V_UNOWNED_SPEND
      - FACT_AMAZON_ADS


