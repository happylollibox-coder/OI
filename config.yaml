    source_files: ["scripts/bigquery/procedures/SP_SYNC_NEGATIVES.sql"]

  - name: "SP_ORCHESTRATE_DAILY_REFRESH"
    description: "Master daily orchestrator — runs all SPs in dependency order"
    source_files: ["scripts/bigquery/procedures/SP_ORCHESTRATE_DAILY_REFRESH.sql"]
    schedule: "daily"

  - name: "SP_MERGE_PRODUCT_DIM_SMART"
    description: "Smart merge for DIM_PRODUCT"
    source_files: ["scripts/bigquery/procedures/SP_MERGE_PRODUCT_DIM_SMART.sql"]

