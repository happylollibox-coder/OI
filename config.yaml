    description: "Per parent x season x match-type x campaign_type x ad_format bid strategy the coacher steers toward (derived + editable). Two layers: coarse rows (campaign_type=ad_format='ALL') are the pooled fallback; fine rows split by SP/SB and SB creative type (BRAND_VIDEO/PRODUCT_COLLECTION) and steer only where conclusive."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_PRODUCT_STRATEGY_PROFILE.sql"]

  - name: "DE_KEYWORD_INTENT_OVERRIDE"
    description: "Manual override of keyword intent class (BRAND/PRODUCT/GENERIC) for the coacher strategy"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_KEYWORD_INTENT_OVERRIDE.sql"]

  - name: "DE_COVERAGE_EXPECTATION"
    description: "Opt-out rows to suppress false 'missing' coverage cells in the daily-workflow cockpit. Written by POST /api/coverage-expectation (idempotent upsert per natural key strategy+parent_name+asin). scope_grain = ASIN_STRATEGY (asin set, AUTO cells), FAMILY_STRATEGY (parent_name set, asin NULL) or STORE_STRATEGY (both NULL); is_active FALSE / absent row = not suppressed."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_COVERAGE_EXPECTATION.sql"]

  - name: "DE_FAMILY_INTENT_OVERRIDE"
    description: "Per-(family x intent theme) manual relevance override — beats the automatic fit+profit gates in V_INTENT_KEYWORDS. force_relevant FALSE = never suggest this intent for this family, TRUE = always suggest (even with no data). Exists because DE_INTENT_THEMES.is_active is GLOBAL and can't say 'school is wrong for LolliME but fine for Lollibox'. Absent row = let the gates decide. SOP: architecture/INTENT_CAMPAIGN_MODEL.md"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_FAMILY_INTENT_OVERRIDE.sql"]

  - name: "DE_INTENT_THEMES"
    description: "Registry of intent THEMES (birthday, easter, beauty, journal…) — the grouping unit for intent-grouped campaigns (family x match-type x intent). GENERIC vs TIME_BASED; match rule = AND over match_occasion/match_holiday/match_product_type/match_age_group/match_keyword_regex against FACT_RESEARCH_RANKED; TIME_BASED links holiday_name -> DIM_US_HOLIDAYS for start/pause dates. NOT the same as the BRAND/PRODUCT/GENERIC keyword intent class (V_KEYWORD_INTENT_CLASS). SOP: architecture/INTENT_CAMPAIGN_MODEL.md"
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_INTENT_THEMES.sql"]

  - name: "DE_PROBE_LOG"
    description: "Tracks each keyword probe's decision budget (15 clicks / 14 days): ACTIVE/GRADUATED/EXHAUSTED. Coacher C close-the-loop, refreshed by SP_REFRESH_PROBE_LOG."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_PROBE_LOG.sql"]

  - name: "DE_PRODUCT_BUDGET"
    description: "Per-product weekly spend ceiling (risk envelope, editable; MANUAL/BUSINESS_PLAN/BOOTSTRAP). Coacher D budget anchor."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_PRODUCT_BUDGET.sql"]

  - name: "DE_PRODUCT_BOM"
    description: "Per-product Bill of Materials for the Price Calculator (one row per ASIN). bom_json holds volume tiers + component per-unit prices. Written by Flask /api/products/bom."
    type: "data_entry"
    source_files: ["scripts/bigquery/tables/DE_PRODUCT_BOM.sql"]

  - name: "DE_WEEKLY_PLAN"
    description: "Per-cell weekly plan (history-retained) at parent x season x match x intent x campaign_type x ad_format grain: purpose + success_metric + expected_value + spend_mode + status + target_cpc. Coacher D, written by tools/weekly_plan."
