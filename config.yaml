  - name: "V_ADS_SEARCH_TERM_INTENT"
    description: "Intent theme for every search term that has ACTUALLY RUN IN ADS. Grain: one row per distinct FACT_AMAZON_ADS.search_term. Companion to V_INTENT_KEYWORDS, which resolves themes over FACT_RESEARCH_RANKED.query_text (the research/SQP universe) — only 6.8% of the 201,054 distinct ads search terms exist there and only 11.1% of ads clicks carried a real occasion, and the missed tail is the BETTER traffic (LolliME back-to-school Aug 1 - Sep 28 2025: tagged terms 2.22% CVR / $0.20 GP-per-click vs untagged school terms 4.53% / $0.72). Matches on DE_INTENT_THEMES.match_ads_regex (added 2026-07-24) against LOWER(search_term), AND match_keyword_regex when non-null and different — so christmas-gift needs both the christmas pattern and \\bgifts?\\b. Themes with a NULL match_ads_regex never match here (attribute-only themes can't be read from raw text). SPECIFICITY ROUTING, one term gets exactly ONE theme: ads_specificity DESC (1, +1 when match_keyword_regex adds a second condition), then priority ASC, then intent_key. back-to-school sits at priority 25, NOT 10, because its bare \\bschool\\b arm is greedy — at 10 it stole 'high school grad party gifts' from graduation and 'middle school girl halloween gift basket' from halloween. Phase 0 of the intent-CVR work. SOP: docs/superpowers/specs/2026-07-24-intent-coverage-phase0-design.md"
    source_files: ["scripts/bigquery/views/V_ADS_SEARCH_TERM_INTENT.sql"]
    dependencies:
      - FACT_AMAZON_ADS
      - DE_INTENT_THEMES

  - name: "V_INTENT_COVERAGE"
    description: "The Phase 0 gate: how much of real ads traffic carries an intent theme, per (parent_name x intent_key) over the trailing 365 days, with FAMILY_TOTAL and ACCOUNT_TOTAL rollups. ALWAYS FILTER ON row_type ('THEME' | 'UNCLASSIFIED' | 'FAMILY_TOTAL' | 'ACCOUNT_TOTAL') — GROUPING SETS puts three kinds of row in one result and the genuinely-unclassified bucket also carries a NULL intent_key. pct_classified went 11.1% -> 70.32% when V_ADS_SEARCH_TERM_INTENT shipped 2026-07-24 (Lollibox 73.0, LolliME 63.0, Fresh 83.1, Bottle 53.7); Phase 1 (the product x intent CVR curve that sets base bids) is gated on >= 60%. Also the regression surface for DE_INTENT_THEMES rule edits. Carries cvr_pct / cpc / gp_per_click per theme so an intent's economics are readable directly. SOP: docs/superpowers/specs/2026-07-24-intent-coverage-phase0-design.md"
    source_files: ["scripts/bigquery/views/V_INTENT_COVERAGE.sql"]
    dependencies:
      - FACT_AMAZON_ADS
      - V_ADS_SEARCH_TERM_INTENT
      - DIM_PRODUCT

  - name: "V_INTENT_CVR_CURVE"
    description: "12-month CVR curve per (product_short_name x intent_key x month_of_year 1-12), learned from the ads signal. Phase 1 of the intent-CVR work. MULTIPLICATIVE, not a lookup: cvr_hat = base_cvr(product,intent) x season_index(intent,month). Direct cells are far too sparse — at product x intent x month only 25% clear 100 clicks — so each factor is estimated where its data is densest. base_cvr is Beta-binomial shrunk (orders + k*parent)/(clicks + k) up product x intent -> family x intent -> intent -> global. season_index shrinks intent x month toward that intent's own all-month rate and DIVIDES by it, so no seasonal signal lands on exactly 1.00 (the honest default) and every product x intent gets all 12 months whether or not it ran. Season is pooled ACROSS products on purpose: back-to-school is a property of the intent, not of the journal, and pooling gives the shape ~10x the data. k values are DE_COACH_THRESHOLDS strategy_id='INTENT' INTENT_CVR_BASE_PRIOR_CLICKS (200) / INTENT_CVR_SEASON_PRIOR_CLICKS (500) — how much thin cells are trusted is a data decision. READ confidence AND base_self_weight (= clicks/(clicks+k), the share of base_cvr that is the cell's own evidence rather than its family's) BEFORE ACTING. Learned back-to-school shape: Jul 0.68, Aug 1.45, Sep 1.11, Dec 1.46. SOP: docs/superpowers/specs/2026-07-24-intent-coverage-phase0-design.md"
    source_files: ["scripts/bigquery/views/V_INTENT_CVR_CURVE.sql"]
    dependencies:
      - FACT_AMAZON_ADS
      - V_ADS_SEARCH_TERM_INTENT
      - DIM_PRODUCT
      - DE_COACH_THRESHOLDS

  - name: "V_INTENT_BID_BASE"
    description: "ADVISORY base bid per (product_short_name x intent_key x month_of_year). Nothing here writes to a campaign — coach wiring is Phase 2. value_per_click = cvr_hat x gp_per_order = a click's expected gross margin. TWO DIFFERENT NUMBERS, do not collapse them: max_bid = value_per_click is the BREAKEVEN CEILING (pay more and the click loses money); target_bid = value_per_click x INTENT_BID_PROFIT_SHARE (0.70) is the bid that also hits the margin goal. The first cut of this view conflated them and mislabelled money-losing months as 'tighten'. action: OFF when value_per_click < INTENT_BID_FLOOR or actual_cpc >= value_per_click (market clears above breakeven); RUN_THIN when actual_cpc is between target and breakeven (profitable but under goal — a judgement call, not a cut); RUN otherwise, including no_market_read=TRUE cells that have never run. gp_per_order comes from FACT_AMAZON_ADS.GROSS_PROFIT/Ads_orders per product over 365d with a family fallback (gp_is_family_fallback flags it) — the SAME table as the CVR numerator, because mixing in V_UNIFIED_DAILY margin would compare two attribution grains. Worked example, Purple LolliME x back-to-school: OFF eleven months, RUN_THIN in August alone (max 0.41 / target 0.29 / market 0.38). SOP: docs/superpowers/specs/2026-07-24-intent-coverage-phase0-design.md"
    source_files: ["scripts/bigquery/views/V_INTENT_BID_BASE.sql"]
    dependencies:
      - V_INTENT_CVR_CURVE
      - V_ADS_SEARCH_TERM_INTENT
      - FACT_AMAZON_ADS
      - DIM_PRODUCT
      - DE_COACH_THRESHOLDS

  - name: "V_INTENT_RESOLVED"
    description: "THE read model for search-term -> intent. Everything downstream reads this — never DE_SEARCH_TERM_INTENT and never V_ADS_SEARCH_TERM_INTENT directly. One row per search_term. PRECEDENCE, human always beats machine: REJECTED -> NULL (a decision that the term has no intent, distinct from PENDING-with-no-match); VERIFIED/CORRECTED -> verified_intent_key; RECHECK -> verified_intent_key STILL wins (the suggestion changed under a settled decision, so the human's last word stands until re-reviewed) with is_stale=TRUE; PENDING -> suggested_intent_key. Terms absent from DE_SEARCH_TERM_INTENT (new since the last SP run) fall through to the live suggestion, so nothing is invisible while the refresh catches up. intent_type/holiday_name/intent_label are looked up from the RESOLVED intent, not the suggestion — a correction onto a TIME_BASED theme must carry that theme's season window downstream. Consumed by V_INTENT_CVR_CURVE, V_INTENT_BID_BASE, V_INTENT_COVERAGE. SOP: docs/superpowers/specs/2026-07-24-intent-coverage-phase0-design.md"
    source_files: ["scripts/bigquery/views/V_INTENT_RESOLVED.sql"]
    dependencies:
      - V_ADS_SEARCH_TERM_INTENT
      - DE_SEARCH_TERM_INTENT
      - DE_INTENT_THEMES

  - name: "V_INTENT_REVIEW_QUEUE"
    description: "What to review next in DE_SEARCH_TERM_INTENT, hardest-money-first. One row per search_term needing attention (PENDING or RECHECK, >=5 clicks). 201,139 distinct ads terms exist and 42,445 are needed to cover 80% of clicks, so reviewing everything is NOT the goal — covering the money is (1,662 terms cover 50%). review_reason in priority order: RECHECK (a rule edit changed the machine's mind about something already settled — always first), UNMATCHED (real spend, no theme — each one is a rule gap), AMBIGUOUS (>1 theme matched, worth confirming the specificity/priority tie-break), HIGH_SPEND (>=$20, unambiguous but material), ROUTINE. EXCLUDES asin-target and auto-target: those are matched deterministically from string shape, there is no judgement to add, and at $61k of spend they would otherwise sit permanently at the top. SOP: docs/superpowers/specs/2026-07-24-intent-coverage-phase0-design.md"
    source_files: ["scripts/bigquery/views/V_INTENT_REVIEW_QUEUE.sql"]
    dependencies:
      - DE_SEARCH_TERM_INTENT
      - DE_INTENT_THEMES

  - name: "V_ADS_SEARCH_TERM_FACETS"
    description: "Intent as a COMPOSITION of orthogonal facets, one row per distinct FACT_AMAZON_ADS.search_term. Ori 2026-07-24: intent should be built from the Research page's dimensions plus customer budget. Replaces the winner-takes-all model in V_ADS_SEARCH_TERM_INTENT, which picked ONE theme by specificity then priority and so had to discard facts that were all true at once — \"gifts for girls 8-12 deals\" is tween AND gift AND deal-seeker, and \"cheap birthday gifts for a 10 year old\" lost its price signal entirely to tween-birthday-gift. FACETS: gender/age_group/occasion/holiday from FN_EXTRACT_SEGMENTS (the canonical extractor shared with Research — DE_INTENT_THEMES.match_ads_age_regex duplicates it and should converge onto this); product_type from DE_PRODUCT_TYPE_KEYWORDS (priority ASC then longest keyword, same join as V_RESEARCH_RANKED); budget_tier + price_ceiling from FN_EXTRACT_BUDGET; is_gift boolean. term_kind (KEYWORD | BRAND | COMPETITOR | ASIN_TARGET | AUTO_TARGET) separates queries from placements — only the two TARGET kinds get NULL facets, because BRAND and COMPETITOR are still real queries typed by real people. intent_key is a DERIVED slug (budget-age-holiday-occasion-product_type-gift, fixed order) for legibility and joins; THE FACETS ARE THE TRUTH and downstream should prefer them. facet_count replaces the old specificity tie-break as an honest confidence signal. Coverage 2026-07-24: 99.0% of keyword clicks carry >=1 facet, avg 2.76 facets/term. SOP: docs/superpowers/specs/2026-07-24-intent-coverage-phase0-design.md"
    source_files: ["scripts/bigquery/views/V_ADS_SEARCH_TERM_FACETS.sql"]
    dependencies:
      - FACT_AMAZON_ADS
      - FN_EXTRACT_SEGMENTS
      - FN_EXTRACT_BUDGET
      - DE_PRODUCT_TYPE_KEYWORDS
      - DE_INTENT_THEMES

  - name: "T_INTENT_CVR_CURVE"
    description: "Materialized V_INTENT_CVR_CURVE (product x intent_key x month_of_year). Rebuilt by SP_REFRESH_SEARCH_TERM_INTENT after the DE merge — the view chain costs ~27k CPU-seconds per scan (regex over 337k terms), which broke a 3-way UNION at the on-demand CPU cap on 2026-07-25; consumers read this table for pennies. Includes the 90-day launch-ramp season quarantine (obs.in_launch_ramp excluded from season_index pooling only — LolliME's Jul-Sep 2025 launch shifted the Aug index 1.058->0.921 when it landed). Grid plan Phase 0.3."
    source_files: ["scripts/bigquery/procedures/SP_REFRESH_SEARCH_TERM_INTENT.sql"]
    dependencies:
      - V_INTENT_CVR_CURVE

  - name: "T_INTENT_BID_BASE"
    description: "Materialized V_INTENT_BID_BASE with the ratified FOUR-band assignment (RUN >= PROFITABLE_ROAS 1.1 / VELOCITY >= VELOCITY_ROAS 0.7 / MARGINAL >= INTENT_HOPELESS_ROAS 0.5, OFF-unless-PROBE / OFF below — every boundary a DE_COACH_THRESHOLDS row, none hard-coded). New columns vs the pre-band view: max_cpc_run, max_cpc_velocity (willingness to pay per band), expected_net_roas_at_market. action = raw band; hysteresis and the velocity-pace condition are STATEFUL and live in the month-plan generator/checkpoint, NOT here. Verified: White Lollibox x tween-girl-gift Jun/Jul/Aug = VELOCITY (0.83-1.08), Dec RUN 1.58; Mint RUN with Dec $1.11 target. Consumed by /api/admin/intent-monthly (repointed 2026-07-25) and grid Phases 2+. Rebuilt by SP_REFRESH_SEARCH_TERM_INTENT. Grid plan Phase 0.2/0.3."
    source_files: ["scripts/bigquery/views/V_INTENT_BID_BASE.sql", "scripts/bigquery/procedures/SP_REFRESH_SEARCH_TERM_INTENT.sql", "scripts/bigquery/migrations/2026-07-25_intent_band_thresholds.sql"]
    dependencies:
