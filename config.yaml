  - name: "V_BID_CPC_TRANSFER"
    source_files: ["scripts/bigquery/views/V_BID_CPC_TRANSFER.sql"]
    description: "SHADOW - NOTHING READS THIS. Corrected bid->CPC transfer for FN_TARGET_BID_SHADOW. realised_CPC = k_pure(channel x target_kind) * bid^gamma * M(campaign), replacing the 2026-08-10 pooled CPC = k * bid^0.686 whose k silently blended the auction with each campaign''s placement settings. M = SUM_p click_share_p * I_p * (1+adj_p/100)^beta is a LOOKUP, exposed per campaign with every input (per-placement click shares, adjustments, intrinsic premia) so any row can be audited by hand. gamma = 0.778 [0.638,0.872] from a within-TARGET fixed-effects fit on 2,799 target-days / 24,828 clicks whose bids are the exact old_bid/new_bid pairs OI posted (V_PPC_CHANGE_LOG_APPLIED) - never V_TARGET_DAILY.keyword_bid, never the Fivetran SCD2 mirrors. beta = 0.725 [0.550,0.908] on CONTESTED auctions, 0 on BRAND DEFENSE (you own the term so a second-price multiplier never binds; four campaigns at +500% realise 0.85-1.48x where 0.725 predicts 4.2x). Intrinsic premia measured on un-adjusted campaigns: TOS 1.162, detail page 0.939, other 1.000, off-Amazon 0.418 - detail page is intrinsically CHEAPER than rest-of-search. VALIDATION: cross-campaign log(cpc/bid^gamma) on log(M) has slope +0.951 [+0.462,+1.380] (1.0 = correctly specified, excludes 0); leave-one-CAMPAIGN-out held-out RMSE of log(cpc) 0.3066 -> 0.2805 (-8.5%), monotone in dose (-5.4% / -7.5% / -17.1% at M<1.05 / 1.05-1.15 / >=1.15). The brand-defense beta split is load-bearing: a single beta makes the model WORSE than no placement term at all (+8.2% RMSE). Placement explains +0.007 of the exponent and 3.9pp of within-R2 - essentially none of 0.686 was placement, because the adjustment is a campaign constant and mix does not move with the bid (slope +0.0005, R2 0.00000). KNOWN DEFECTS: no adjustment history exists anywhere (current snapshot applied to a historical window; re-read before every run); the arithmetic bound CPC <= bid x M fails on 31-43% of down-only clicks even with authoritative bids, so k_pure is provisional; SB shopper-cohort multipliers (up to +150%) cannot enter M and make it an under-estimate where set. Spec: architecture/TARGET_BID_SHADOW.md sec.Placement. Deterministic (2x byte-identical, md5 64276258db22a40a553dde3a3eb36d72)."

