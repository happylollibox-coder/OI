  - name: "V_CAMPAIGN_ROLE"
    description: "THE canonical Coverage-role definition — one row per campaign: AUTO / EXACT / BROAD / PHRASE / COMPETITOR / SB_VIDEO / BRAND_DEFENSE / PRODUCT_DEFENSE / OTHER, first-match-wins by strategy_id then campaign_type then dominant targeting_type (90d, by clicks). Lifted out of the camp_role CTE inlined in /api/coverage so the Coverage page and the Weekly Run strategy split share one rule. Normalizes targeting_type case (FACT_AMAZON_ADS holds both 'broad' and 'BROAD'); the Flask original matched 'Automatic'/'ASIN'/'Category' case-sensitively. is_offense_role flags the six non-defense roles."
    source_files: ["scripts/bigquery/views/V_CAMPAIGN_ROLE.sql"]
    dependencies:
      - FACT_AMAZON_ADS
      - DIM_EXPERIMENT_CAMPAIGN
      - DIM_EXPERIMENT

  - name: "V_COVERAGE_CAMPAIGN"
    description: "Coverage-cockpit reconciler: per target cell, what SHOULD exist vs what DOES (live enabled campaigns), classified through V_CAMPAIGN_ROLE.strategy_category (the 6-strategy lens: AUTO / INTENT / EXACT_BOOST / COMPETITOR / BRAND_DEFENSE / PRODUCT_DEFENSE). Emits one row per target cell at its natural grain (column `grain`): AUTO = ASIN (one per own sellable ASIN), INTENT / BRAND_DEFENSE / COMPETITOR / EXACT_BOOST = FAMILY (one per own family), PRODUCT_DEFENSE = STORE (one row, parent_name NULL). LEFT JOINs from the target universe (DIM_PRODUCT where parent_name IS NOT NULL AND is_active) so zero-campaign cells still appear with n_enabled=0. Reuses ads_coverage_scan() assembly (gp_per_unit, camp state, advertised_product asin<->campaign link, 90d metric window). expected=TRUE for AUTO/INTENT/BRAND_DEFENSE/PRODUCT_DEFENSE, FALSE for COMPETITOR/EXACT_BOOST. status: suppressed -> 'suppressed'; not-expected -> none/redundant/ok; expected -> missing/redundant/ok. DE_COVERAGE_EXPECTATION (active, matched on parent_name+asin+strategy, all via IS NOT DISTINCT FROM) sets `suppressed` — AUTO suppression targets a single ASIN, family/store suppression has asin NULL. Grain-only: NO campaign->intent linkage in the live account."
    source_files: ["scripts/bigquery/views/V_COVERAGE_CAMPAIGN.sql"]
    dependencies:
      - V_CAMPAIGN_ROLE
      - DIM_PRODUCT
      - V_DIM_LISTING_CURRENT
      - DIM_COSTS_HISTORY
      - V_SRC_AmazonAds_campaign_history
      - V_SRC_AmazonAds_advertised_product
      - DE_COVERAGE_EXPECTATION

  - name: "V_COVERAGE_CAMPAIGN_DETAIL"
    description: "S2 VERIFY evidence for the coverage cockpit: one row per (cell_key × campaign) — the per-campaign backing behind each V_COVERAGE_CAMPAIGN cell. Reuses the SAME assembly + cell_key logic as V_COVERAGE_CAMPAIGN but does NOT aggregate to the cell; keeps per-campaign so the endpoint can list which campaigns exist for a cell, their latest state (ENABLED/PAUSED/ARCHIVED from V_SRC_AmazonAds_campaign_history), is_enabled, 90d impressions/clicks/units/ad_spend/net_roas, and last_seen (max date in the 90d window). Join back to the cell via cell_key. Only campaigns whose V_CAMPAIGN_ROLE.strategy_category maps to one of the 6 strategies are kept (OTHER/NULL dropped). No ordering guaranteed — the endpoint sorts."
    source_files: ["scripts/bigquery/views/V_COVERAGE_CAMPAIGN_DETAIL.sql"]
    dependencies:
      - V_CAMPAIGN_ROLE
      - DIM_PRODUCT
      - V_DIM_LISTING_CURRENT
      - DIM_COSTS_HISTORY
      - V_SRC_AmazonAds_campaign_history
      - V_SRC_AmazonAds_advertised_product

  - name: "V_COVERAGE_CAMPAIGN_PROFIT7D"
    description: "SUPERSEDED 2026-08-21 by V_CAMPAIGN_MONEY_PLACEMENT for the question 'is the advertising money in the right place'. It answers that question in a way the two-book design exists to end, on four counts at once: it tests margin minus cost >= 0, which is a FLAT 1.0 bar rather than the family's measured breakeven; it reads a 7-DAY window; it applies no volume floor, so a campaign with a handful of clicks gets a verdict; and it has no launch exemption, so an INVEST family's campaigns are scored on profit in the months when the account has deliberately decided not to judge them that way. IT IS NOT WIRED TO ANYTHING. The clause that stood here said it was 'still WIRED to /api/daily-workflow'; that was checked on 2026-08-21 and is false. /api/daily-workflow reads the TABLE FUNCTION FN_COVERAGE_CAMPAIGN_PROFIT(win_start, win_end, peak_only), not this view - see the endpoint, and see FN_COVERAGE_CAMPAIGN_PROFIT's own entry in this file, which has always said so. Nothing in the repo selects from this view: not the dashboard, not the Flask app, not the cube, not another view. It is kept and documented only because FN_COVERAGE_CAMPAIGN_PROFIT is described as matching it at a seven-day window, so it remains the reference definition for that function - do not build anything new on it, and do not restore a consumer claim without grepping for one first. Original description follows. Per-campaign 7-day P&L for the coverage cockpit. One row per campaign_id with spend>0 in the LAST 7 DAYS, classified through V_CAMPAIGN_ROLE.strategy_category (6-strategy lens; OTHER/NULL dropped). Reuses the same prod (own sellable ASINs + gp_per_unit) + adv (advertised_product asin<->campaign link, 7d window) building blocks as V_COVERAGE_CAMPAIGN. units_7d is click-attributed per day so SUM over the window is correct. Columns: campaign_id, parent_name (ANY_VALUE — one family per campaign in practice), strategy, clicks, spend (SUM cost), units (SUM units_7d), margin (SUM units_7d*gp_per_unit), net_profit (margin−spend), profitable (net_profit>=0). Backs /api/daily-workflow strategy_stats + family_stats profit rollups."
    source_files: ["scripts/bigquery/views/V_COVERAGE_CAMPAIGN_PROFIT7D.sql"]
    dependencies:
      - V_CAMPAIGN_ROLE
      - DIM_PRODUCT
      - V_DIM_LISTING_CURRENT
      - DIM_COSTS_HISTORY
      - V_SRC_AmazonAds_advertised_product

  - name: "V_COVERAGE_UNMAPPED"
    description: "Coverage-cockpit guard tile (7th 'strategy': UNMAPPED). One row per campaign that does NOT classify into any of the 6 strategies — surfaces unclassified ad spend the cockpit otherwise drops (it INNER-joins V_CAMPAIGN_ROLE and discards strategy_category='OTHER'/unmatched). UNMAPPED = a campaign with 90d advertised activity whose V_CAMPAIGN_ROLE.strategy_category (LEFT JOIN) is NULL or 'OTHER', UNION any 'OTHER' campaign with no 90d activity (dormant unclassified, metrics 0/NULL). Reuses the same prod (own sellable ASINs + gp_per_unit), camp_state (latest state+name from V_SRC_AmazonAds_campaign_history), and adv (advertised_product asin<->campaign link, 90d window) building blocks as V_COVERAGE_CAMPAIGN. Columns: campaign_id, campaign_name, parent_name (ANY_VALUE own family via advertised_asin→DIM_PRODUCT, may be NULL), state, is_enabled (state='ENABLED'), impressions, clicks, units (SUM units_7d), cost, net_roas (SUM(units_7d*gp_per_unit)/cost), cpc, last_seen, profit_state (clicks<10 or net_roas NULL → unknown; >= GLOBAL PROFITABLE_ROAS floor → profitable else unprofitable). Backs /api/daily-workflow UNMAPPED tile + cells."
    source_files: ["scripts/bigquery/views/V_COVERAGE_UNMAPPED.sql"]
    dependencies:
      - V_CAMPAIGN_ROLE
      - DIM_PRODUCT
      - V_DIM_LISTING_CURRENT
      - DIM_COSTS_HISTORY
      - V_SRC_AmazonAds_campaign_history
      - V_SRC_AmazonAds_advertised_product
      - DE_COACH_THRESHOLDS

  - name: "V_COVERAGE_CAMPAIGN_MONTHLY"
    description: "Per (campaign_id × month) 12-month P&L for the cockpit's per-campaign monthly drill. One row per (campaign_id, month) over the LAST 12 MONTHS from V_SRC_AmazonAds_advertised_product joined to prod (own sellable ASINs + gp_per_unit). units_7d is click-attributed per day so SUM over the window is correct. Columns: campaign_id, month (DATE, DATE_TRUNC to MONTH), impressions, clicks, spend (SUM cost), units (SUM units_7d), net_profit (SUM units_7d*gp_per_unit − SUM cost), net_roas (margin/spend, ROUND 2). Backs GET /api/campaign-months."
    source_files: ["scripts/bigquery/views/V_COVERAGE_CAMPAIGN_MONTHLY.sql"]
    dependencies:
      - DIM_PRODUCT
      - V_DIM_LISTING_CURRENT
      - DIM_COSTS_HISTORY
      - V_SRC_AmazonAds_advertised_product

  - name: "V_COVERAGE_CAMPAIGN_KEYWORD_MONTHLY"
    description: "Third cockpit evidence level (cell → campaign → month → KEYWORD): one row per (campaign_id × month × keyword_id) over the LAST 12 MONTHS from the targeting_keyword_report feed. Backs a MonthRow expanding to the keywords that drove that month. Metrics kept consistent with V_COVERAGE_CAMPAIGN_MONTHLY: spend/clicks/impressions/cpc are additive raw columns; units = units_sold_clicks_7_d (same 7d click-attribution as the campaign month drill). net_profit/net_roas use a gp_per_unit at CAMPAIGN grain — a units-weighted blend of the campaign's own advertised ASINs (from advertised_product), falling back to family-avg gp when the campaign sold nothing (keyword feed has no ASIN; families are gp-tight). NOTE: keyword units are a subset of the campaign total (auto/product targeting isn't keyword-attributed) so they do NOT reconcile to the month row. Columns: campaign_id, month, keyword_text, match_type, impressions, clicks, spend, cpc, units, net_profit, net_roas. Backs GET /api/campaign-keyword-months?campaign_id=<id>."
    source_files: ["scripts/bigquery/views/V_COVERAGE_CAMPAIGN_KEYWORD_MONTHLY.sql"]
    dependencies:
      - DIM_PRODUCT
      - V_DIM_LISTING_CURRENT
      - DIM_COSTS_HISTORY
      - V_SRC_AmazonAds_advertised_product

  - name: "V_COVERAGE_KEYWORD"
    description: "THIN 90-DAY WRAPPER over FN_COVERAGE_KEYWORD(CURRENT_DATE-90, CURRENT_DATE, FALSE) — kept only for ad-hoc queries at the historical default. All logic lives in the table function (edit FN_COVERAGE_KEYWORD.sql, not this view, or they drift); /api/coverage-keywords calls the FN directly with the cockpit's selected window. Original semantics: coverage-cockpit reconciler, Stage 3 (S3 rung): one row per (parent_name × match_type × keyword_text). Reconciles RUNNING keywords (V_KEYWORD_DAILY, last 90d, rolled to family×keyword×match: SUM clicks/cost, SUM net_proxy AS net_profit, latest ad_keyword_status, MAX date last_seen, campaign_ids) against RECOMMENDED-but-not-advertised keywords (FACT_RESEARCH_RECOMMENDATIONS latest week_start, status='NEW': best/MIN rank, rec_type), enriched with relevance (FACT_RESEARCH_RANKED MAX rank/overall_fit per family×term, match-agnostic) and the intent-theme flag (V_INTENT_KEYWORDS is_relevant + ads_net_roas, match-agnostic). Universe = DISTINCT keys from running UNION missing (families with recs but no live keywords still appear, e.g. Bunny/LolliBall). net_roas = REAL per-keyword ad net ROAS = SUM(units_7d) × family_gp / SUM(cost) (units_7d=units_sold_clicks_7_d; family_gp=AVG gp/unit of family's active ASINs) — replaces the display of ads_net_roas (an INTENT/family aggregate stamped identically on every keyword, Ori 2026-07-22); drives profit_state (vs INTENT floor, clicks<10→unknown). target_cpc = the CPC that lands the keyword on the INTENT net-ROAS floor given its own cvr + gross profit = units_7d × family_gp / (clicks × floor) = cvr × gp / floor (NULL when clicks<10; below current cpc → cut bid, above → room to raise). net_profit = SUM(V_KEYWORD_DAILY.net_proxy) = sales_14d − ad cost: directional earn-vs-waste only (14d-rolling, no COGS). status CASE (MODERATE orphan rule, Ori 2026-07-21): running+enabled AND (is_relevant=FALSE OR research_rank IS NULL) -> 'orphan'; running+enabled -> 'running'; running+not-enabled -> 'paused'; not-running+recommended -> 'missing'; else 'other'. cell_key = CONCAT('INTENT|', parent_name) so keyword coverage attaches to the Intent family cell."
    source_files: ["scripts/bigquery/views/V_COVERAGE_KEYWORD.sql"]
    dependencies:
      - V_KEYWORD_DAILY
      - FACT_RESEARCH_RECOMMENDATIONS
      - FACT_RESEARCH_RANKED
      - V_INTENT_KEYWORDS

  - name: "V_COVERAGE_INTENT"
    description: "Per (parent_name × intent_key) 'is this intent suggested?' flag for the coverage cockpit keyword panel — lets the frontend split suggested vs not-suggested intents. Built from V_INTENT_KEYWORDS (is_relevant only, parent+intent not null), rolled to the intent: n_kws (COUNT DISTINCT query_text), spend (ROUND SUM ads_spend), wtd_net_roas (spend-weighted SUM(ads_net_roas*ads_spend)/SUM(ads_spend)). suggested rule (Ori 2026-07-22, 'profit, else research fit'): a RUNNING intent (spend>0) is suggested only if profitable — wtd_net_roas >= the INTENT PROFITABLE_ROAS floor from DE_COACH_THRESHOLDS (=1.1, matching GUARDIAN); a NOT-YET-RUNNING intent (spend=0) is TRUE because research routed keywords there => research-recommended. NOTE: ads_spend/ads_net_roas in V_INTENT_KEYWORDS are intent-level aggregates replicated across query_text rows, so `spend` is inflated by the keyword count (directional magnitude only); the replication cancels in wtd_net_roas so the ROAS and suggested flag are correct."
    source_files: ["scripts/bigquery/views/V_COVERAGE_INTENT.sql"]
    dependencies:
      - V_INTENT_KEYWORDS
      - DE_COACH_THRESHOLDS

  - name: "V_COVERAGE_KEYWORD_MONTHLY"
    description: "Per (parent_name × match_type × keyword_text × month) 12-month trend for the coverage cockpit keyword-panel drill. From V_KEYWORD_DAILY over the last 12 months (date >= start of month 11 months ago). keyword_text LOWER'd; keyword_key = CONCAT(match_type,'|',LOWER(keyword_text)) is the stable join key the frontend uses to attach a keyword's monthly rows. Columns: clicks (SUM), spend (ROUND SUM cost), units (CAST SUM(units_14d) AS INT64 — 14d-ROLLING attribution so a monthly SUM is DIRECTIONAL only, overlapping windows), impressions (SUM). Backs GET /api/keyword-months."
    source_files: ["scripts/bigquery/views/V_COVERAGE_KEYWORD_MONTHLY.sql"]
    dependencies:
      - V_KEYWORD_DAILY

  - name: "V_BUDGET_STEP1_STRATEGY"
    description: "One row per Coverage role for the Weekly Run Step-1 'Budget by strategy' split — the sibling of V_BUDGET_STEP1_FAMILY, grouped by strategy_role instead of parent_name. Offense sub-roles only (brand/product defense have their own PPC modes and panels). Rolled up from V_BUDGET_STEP1_CAMPAIGN so the split and the step-2 campaign table read the same per-campaign new_budget and cannot disagree. Spend-weighted CPC. Cube: StrategyBudgetStep1."
    source_files: ["scripts/bigquery/views/V_BUDGET_STEP1_STRATEGY.sql"]
    dependencies:
      - V_BUDGET_STEP1_CAMPAIGN
      - FACT_AMAZON_ADS
      - DE_BUDGET_CONFIG

  - name: "V_BUDGET_STEP1_AGE"
    description: "One row per age bucket (NEW <=20d / 1-3MO / 4-9MO / 10MO+) for the Weekly Run Step-1 'Budget by age' split — sibling of V_BUDGET_STEP1_STRATEGY, grouped by age_bucket. Same columns (n_campaigns, losing/margin/winning spend by 7d net ROAS tier, spend-weighted CPC, ads net profit/day, current + new budget). Rolled up from V_BUDGET_STEP1_CAMPAIGN so it can't disagree with the step-2 table; drives the age filter over step 2 (budget) and step 4 (bids). Tiers: losing net ROAS < margin_roas_threshold (0.8), margin 0.8-2.0, winning >= boost_roas_threshold (2.0). Cube: AgeBudgetStep1."
    source_files: ["scripts/bigquery/views/V_BUDGET_STEP1_AGE.sql"]
    dependencies:
      - V_BUDGET_STEP1_CAMPAIGN
      - FACT_AMAZON_ADS
      - DE_BUDGET_CONFIG

  - name: "V_CAMPAIGN_LAUNCH_RAMP"
    description: "Launch protocol for a campaign's first launch_ramp_days (20) days, replacing the LAUNCH_* branch of V_ADS_COACH. Starts $10/day + $1.00 bid; on each day AMAZON REPORTED THE CAMPAIGN OUT OF BUDGET (campaign_history.serving_status = CAMPAIGN_OUT_OF_BUDGET, per America/Los_Angeles day — last_updated_date is Fivetran UTC and must be converted), every target over launch_click_trigger clicks cuts its bid by launch_bid_cut_pct and a trailing-ROAS-over-launch_raise_roas campaign raises budget by launch_budget_raise_pct. 2026-07-17: the gate was spend >= budget, which under-fired 57% of out-of-budget days — Amazon stops serving at ~91-99% of budget (no room for another click), targeting_report.campaign_budget_amount RESTATES history with the CURRENT budget, and Amazon borrows across days so spend reaches ~2x budget. Falls back to the old proxy only for the ~7% of campaign-days with no status row. target_bid is capped at LEAST(ladder, current_bid) — the ladder may only ever cut; uncapped it RAISED 52 of 55 targets (+33% avg) because $1.00 is a prescription for campaigns launched at $1.00, not an observation. Pure replay of observed history — no scheduled job. Self-arresting: cuts only fire on out-of-budget days, so starved delivery stops the ladder. Grain: (campaign, target); a campaign with no spend yet emits one row with keyword_id NULL. Spec: architecture/CAMPAIGN_LAUNCH_RAMP.md."
    source_files: ["scripts/bigquery/views/V_CAMPAIGN_LAUNCH_RAMP.sql"]
    dependencies:
      - V_TARGET_DAILY
      - FACT_AMAZON_ADS
      - V_SRC_AmazonAds_campaign_history
      - DE_BUDGET_CONFIG

  - name: "V_LAUNCH_OPTIMIZER"
    type: "view"
    source_files: ["scripts/bigquery/views/V_LAUNCH_OPTIMIZER.sql"]
    description: "Launch-phase tracker per new family x week (first sale within 180d) — the monthly-cockpit launch module. Phases SETUP wk0-1 / RANK wk2-7 (honeymoon, no loss cuts) / EXIT wk8-11 (taper to value bids, fix margin) / POST. Verdicts on complete LA weeks only: ON_TRACK / BEHIND / STALLED (units <=90% prior-3wk avg AND absolute organic units flat — share is denominator-gameable). Emits value_per_click + taper_bid (0.7x, floor 0.15) from trailing-28d family CVR x GP/order, margin_flag when GP/order < $6 (ads can never work — fix price/bundle), weekly_budget_rec (STALLED -> x0.3 badge floor, EXIT -> x0.7/wk). Coacher reacts via phase-gated LAUNCH_TAPER (the one sanctioned loss cut). Created 2026-07-26 for Bunny/LolliBall."
  - name: "V_LAUNCH_POPULATION"
    description: "THE single definition of which campaigns the launch controller governs (Ori 2026-07-24). The population is LOW BUDGET, not age: a campaign is in the launch regime while its daily budget is at/below the low-budget cap — PEAK (inside any gift_season/prime_event boost→cooldown window) $30/day, OFF-SEASON $20/day. Replaces the old 'first 20 days' age gate: age is an arbitrary clock, budget states how much you're willing to risk while a campaign is unproven, and it self-promotes (V_LAUNCH_PHASE1's budget ladder raises budget on good performance until it clears the cap, at which point the campaign graduates to the working-campaign methodology in V_ADS_COACH). EXISTS BECAUSE 'new' was previously defined in 3 independent places (V_LAUNCH_PHASE1.camp, V_ADS_COACH.is_new_campaign, V_WEEKLY_RUN_CAMPAIGN.age_bucket) that agreed only because all used the same age rule — under a budget rule they drift and the dashboard shows a campaign in BOTH the launch cards and the mature table. HYSTERESIS: membership needs budget at/below the cap for the last 3 complete days (budget_max_3d), so promotion is immediate but demotion needs 3 consecutive low days — prevents oscillation between two engines with different cadences (launch daily vs working weekly/3-day). BUDGET SOURCE (fix 2026-07-30): the DIM_CAMPAIGN SCD2 budget SETTING (budget_max_3d = max daily_budget across rows overlapping the last 3 complete days), NOT V_TARGET_DAILY — the delivery-gated source only had rows on days a campaign delivered and only for SP, silently dropping aged SB campaigns (incl. Brand Defense), dormant SP, and 100%-dark campaigns from the population (21→9 uncovered on the Weekly Run engines). The setting exists for every enabled campaign on both channels, so the old 'no budget rows must not read as low-budget' guard is retired; brand-new campaigns not yet in DIM_CAMPAIGN (SCD2 loads 3×/day) are included when age<20d so they are coached from day 1. SERVING_STATUS (2026-07-24): membership requires the latest serving_status IN (CAMPAIGN_STATUS_ENABLED, CAMPAIGN_OUT_OF_BUDGET, PENDING_START_DATE), not just state=ENABLED — this drops ENDED/PAUSED/ARCHIVED campaigns whose stale change-log STATE row still reads ENABLED (Ori confirmed the 4 BOX campaigns are archived yet show state=ENABLED / serving_status=ENDED). Also exposes medium_budget_cap ($50 off / $100 peak) so V_WEEKLY_RUN_CAMPAIGN splits MEDIUM vs HIGH tiers from one source. Columns: campaign_id, campaign_name, created, age_days, budget_today, budget_max_3d, low_budget_cap, medium_budget_cap, in_peak, serving_status, launch_reason. Consumers: V_LAUNCH_PHASE1.camp, V_ADS_COACH.is_new_campaign, V_WEEKLY_RUN_CAMPAIGN.age_bucket (LOW tier + dashboard launch-vs-mature split)."
    source_files: ["scripts/bigquery/views/V_LAUNCH_POPULATION.sql"]
    dependencies:
      - V_SRC_AmazonAds_campaign_history
      - DIM_CAMPAIGN
      - DIM_US_HOLIDAYS
      - FACT_AMAZON_ADS

  - name: "T_LAUNCH_PHASE1"
    description: "Snapshot of V_LAUNCH_PHASE1, rebuilt in SP_REFRESH_CUBE_TABLES after T_PRICE_COST_TIER (which V_LAUNCH_PHASE1 reads) and before T_RUN_TARGET. Exists ONLY so V_RUN_TARGET stops inlining the launch controller twice (new_camp CTE + the bid join) — that doubled subtree, on top of the V_ADS_COACH one, exceeded BigQuery planning resources (2026-08-13). The LaunchPhase1 cube and tools/build_launch_phase1_bulksheet.py still read the live V_LAUNCH_PHASE1 — do NOT repoint them at this snapshot; it is a daily-orchestration snapshot, not live."
    source_files: ["scripts/bigquery/procedures/SP_REFRESH_CUBE_TABLES.sql"]
    dependencies:
      - V_LAUNCH_PHASE1

  - name: "V_LAUNCH_PHASE1"
    description: "Phase-1 launch controller — population is now LOW BUDGET (see V_LAUNCH_POPULATION), no longer the first 20 days — supersedes the bid/budget ladder in V_CAMPAIGN_LAUNCH_RAMP. Purpose: get a new campaign STABLE (spends budget across the day, not by lunchtime) and PROFITABLE by day 20, then hand to the coacher. Grain (campaign, target). Signals: roas_1d (today), eq3 (equal-weight mean of last-3 daily net ROAS ignoring <3-click days, pooled fallback), pct_dark (Amazon CAMPAIGN_OUT_OF_BUDGET share, LA day). Anchors 'today' on the last FULLY-ELAPSED day (LEAST(MAX(date), yesterday)) so an incomplete current day never reads as false zeros. BID (clamp $0.20-$1.50): starving(dark<=10% & spend<=60%)→×1.10; CUT only if eq3<0.9 AND roas_1d<0.9 →×0.8 (both must be bad — a proven or recovering keyword is spared); strong eq3>1.5→×1.3; weak roas_1d>1.2→×1.15. BUDGET: dark<=10% → cut toward floor (eq3<0.6 ×0.6, eq3<0.9 ×0.9) or hold; dark>10% → raise to LEAST(budget/%active, cap) with cap 3× (strong eq3>1.5) / 2× (weak roas_1d>1.2). No negate inside 20 days. Pure replay, no scheduled job. Consumed by tools/build_launch_phase1_bulksheet.py. Phase-1 tuning constants inline (k CTE) pending migration to DE_BUDGET_CONFIG. Spec: architecture/CAMPAIGN_LAUNCH_RAMP.md."
    source_files: ["scripts/bigquery/views/V_LAUNCH_PHASE1.sql"]
    dependencies:
      - V_CAMPAIGN_LAUNCH_RAMP
      - V_TARGET_DAILY
      - FACT_AMAZON_ADS
      - V_SRC_AmazonAds_campaign_history
      - DE_BUDGET_CONFIG

  - name: "V_LAUNCH_CARD_DAILY"
    description: "Per (launch campaign, target, day) measures for the Weekly Run New-campaigns card: last 3 complete days of Spend, Clicks, CTR, units, net ROAS per target. Launch campaigns only (those in V_LAUNCH_PHASE1). Cube: LaunchCardDaily."
    source_files: ["scripts/bigquery/views/V_LAUNCH_CARD_DAILY.sql"]
    dependencies:
      - V_LAUNCH_PHASE1
      - FACT_AMAZON_ADS

  - name: "V_LAUNCH_TERM_NEGATIVES"
    description: "Search terms to negate inside a launch-window campaign (phase 1): >= launch_negate_clicks (15) cumulative clicks with 0 orders. Grain (campaign, matched_target, search_term). Phase 1 keeps the KEYWORD alive (idles, waits for a sale) but prunes the dead QUERY — negating the search term as a Campaign Negative Exact stops the bleed without killing the keyword. Emits NEGATE_TERM. Consumed by the Weekly Run 'Budget by age' NEW bucket Apply-all and tools/build_launch_phase1_bulksheet.py. Caveat: Amazon negative sync is frozen, so a term may already be negated. Spec: architecture/CAMPAIGN_LAUNCH_RAMP.md."
    source_files: ["scripts/bigquery/views/V_LAUNCH_TERM_NEGATIVES.sql"]
    dependencies:
      - V_LAUNCH_PHASE1
      - FACT_AMAZON_ADS
      - DE_BUDGET_CONFIG

  - name: "V_RUN_TARGET"
    description: "One row per (campaign, target) for the merged Weekly Run step-4 card — keywords AND auto groups (close/loose/substitutes), NEW campaigns AND mature, so the card reads one source. Each target carries two measure windows with CPC · clicks · TOS% · units · net ROAS: row2 (recent) = last day for NEW / last 7d for mature; row3 (trend) = mean of the 2 days before last for NEW / last 28d for mature (+ a peak window for mature). Windows match the engines' decision signals. Measures from FACT_AMAZON_ADS; TOS% impression-weighted from V_TARGET_DAILY. Unified bid suggestion/action/reason: V_LAUNCH_PHASE1 for NEW, T_WEEKLY_RUN_KEYWORD for mature keywords (the T_, not the V_ — inlining V_WEEKLY_RUN_KEYWORD re-expands V_ADS_COACH and blows query planning; SP_REFRESH_CUBE_TABLES builds T_WEEKLY_RUN_KEYWORD and T_PRICE_COST_TIER before T_RUN_TARGET) (mature auto groups have no coacher verdict yet → measures only). Materialized as T_RUN_TARGET (heavy coacher join); cube RunTarget reads the T_. Spec: architecture/CAMPAIGN_LAUNCH_RAMP.md."
    source_files: ["scripts/bigquery/views/V_RUN_TARGET.sql"]
    dependencies:
      - V_LAUNCH_PHASE1
      - V_WEEKLY_RUN_KEYWORD
      - V_TARGET_DAILY
      - FACT_AMAZON_ADS
      - DIM_US_HOLIDAYS

  - name: "V_CAMPAIGN_CAP_STATE"
    description: "v27.45 (2026-08-08): THE single membership function for the capped-campaign engines. One row per ENABLED campaign (campaign_state=ENABLED, serving in ENABLED/OUT_OF_BUDGET) at its channel anchor (LEAST(MAX(date), FN_ADS_ANCHOR_CAP()); SP from FACT_AMAZON_ADS, SB from sb_campaign_report). Per America/Los_Angeles day over the trailing 14 days: capped_day = per-day v27.15 dual signal — >=1 CAMPAIGN_OUT_OF_BUDGET event in V_SRC_AmazonAds_campaign_history that day OR day spend >= day budget (DIM_CAMPAIGN SCD2 latest effective_from <= day, fallback current budget). Emits days_capped_7d/14d, dark_days_7d, spend/budget/util 7d+14d, capped_today, and is_oob_owned = CALIBRATED HYSTERESIS: ENTER days_capped_7d >= 2, EXIT only at 0 (holds while >=1) — implemented statelessly (entry test evaluated over the last 7 anchor days; both formulations identical over 14 calibration anchors). Calibration 2026-08-08: 49 owned / $7,306.67 of $9,665.23 ENABLED 7d spend (76%), 15.1 ownership flips/wk (-45% vs fixed N>=2), captures all 12 silent-caps + Brand Defense + ME-VIDEO/BROAD Hunter; anchor-day parity with live v27.15 membership 28/28. CONSUMERS: V_OOB_BUDGET_PHASE membership, V_OOB_KEYWORD population (via PHASE), V_KEYWORD_LIFT DEFER_OOB routing. is_defense exposed for the defense doctrine (bids never touched by either engine). Spec: architecture/OOB_BUDGET_PHASE.md §v27.45."
    source_files: ["scripts/bigquery/views/V_CAMPAIGN_CAP_STATE.sql"]
    dependencies:
      - V_DIM_CAMPAIGN_CURRENT
      - V_SRC_AmazonAds_campaign_history
      - FACT_AMAZON_ADS
      - DIM_CAMPAIGN
      - DIM_KEYWORD
      - FN_ADS_ANCHOR_CAP

  - name: "V_PANEL_OWNERSHIP"
    description: "v27.62 (Ori 2026-08-13): THE single-home function for the Weekly Run panels — one criteria per campaign. Ori: 'same campaign with different measures shows in 2 criterias (this is not good).' MEASURED DEFECT: VIDEO- BALL (128961407602974, LolliBall — 23 days of cover, dry 2026-09-05, next boat 2026-09-09) was live in BOTH panels the same day: Low stock STOCK_BUDGET_CUT $55.06 -> $48.85 (-$6.21/day) and Portfolio 80/20 RAISE_WEAK $55.06 -> $68.83 (+$13.77/day) — $19.98/day apart, opposite directions, both correct inside their own engine, neither engine aware the other exists. GRAIN: one row per ENABLED campaign (campaign_state=ENABLED, serving in ENABLED / OUT_OF_BUDGET / PENDING_START_DATE — the cap-state population plus PENDING_START_DATE so a brand-new launch campaign is never unowned); 108 rows @ 2026-08-13. LADDER (Ori's order LOW STOCK > LAUNCH > REVIVALS > everything else): rank 1 LOW_STOCK = FULL claim, evicts every lower panel on BOTH levers (bid and budget); rank 2 LAUNCH = PARTIAL_NO_CUT, evicts nobody; rank 3 REVIVAL = keyword-grain, evicts nobody; rank 4 OOB/LIFT = the engines, and which of the two owns the bids is NOT decided here — V_CAMPAIGN_CAP_STATE.is_oob_owned remains the authority and is only REPORTED. LOW_STOCK PREDICATE, two arms, both needed: NOT is_defense AND (A STRUCTURAL: family risk_state='CRITICAL' OR B INSTRUCTED: low stock carries a live instruction for this campaign — campaign-row suggested budget or >=1 proposal target, or (v27.78) the family is in REDIRECT MODE). Arm A exists because of VIDEO- COMP/BALL: low stock says nothing (STOCK_NONE, 0 proposals) while Portfolio proposes RAISE_WEAK $12->$18, i.e. +$6.00/day of fresh demand into a family with 23 days of cover — silence from the owner is still the owner's answer, it means HOLD until the boat lands. Arm B exists because of BUNNY-SP/AUTO (Brave): Bunny grades WATCH not CRITICAL so arm A misses it, yet low stock IS cutting it ($10.00->$9.63) while Portfolio proposes RAISE_WEAK $10->$15 — a contradiction does not need a CRITICAL grade to be a contradiction. DEFENSE CARVE-OUT: brand defense is never profit-judged or throttled by low stock (STOCK_PROTECT, proposes nothing, any risk state), so a claim would silence the budget ladder — defense's only remedy — for nothing; defense falls straight through to rank 4. WHY LAUNCH EVICTS NOTHING (a finding, not an omission): the launch controller has had no panel of its own since 2026-08-01 ('Launch-controller cards DISSOLVED... NewCampaignCards is retired from this page', WeeklyRunPage.tsx) — the Portfolio 80/20 LOW tier IS the launch campaigns' home (is_low_tier = budget <= low_budget_cap, the same predicate as V_LAUNCH_POPULATION), so a rank-2 eviction would delete 28 of 108 campaigns from the page; what the launch claim enforces is already live as V_LAUNCH_EXEMPTION inside V_ADS_COACH and (v27.57) V_OOB_BUDGET_PHASE's CUT branches — one lever, one direction. WHY REVIVALS EVICTS NOTHING: a revival is a KEYWORD verdict; the keyword-grain single-home already exists as FACT_PARK_REVERDICT.engine_immune + CONFIRM_PARK and both engines honour it. What IS added: a revival must now defer to a stock claim (defer_revival_panel) — 0 of 25 REVIVE rows sit in the CRITICAL family today, so it is the guard for the next one, not a live correction. OPEN, NEEDS ORI: 12 of the 25 REVIVE rows sit in LAUNCH-population campaigns; a literal 'LAUNCH > REVIVALS' would defer them and halve the Revivals panel. NOT deferred here — a revival is a settled-90d record (>=10 clicks at >=1.0x) and the launch claim only blocks CUTS. COLUMNS: owner (LOW_STOCK|LAUNCH|OOB|LIFT), owner_rank, claim_rank (rank of the FULL claim; 99 = none), claim_scope (FULL|PARTIAL_NO_CUT), claim_reason + defer_action ('DEFER_LOW_STOCK') + defer_reason (all prose backend-owned, one short clause), defer_launch_panel / defer_revival_panel / defer_engine_panel (one boolean per consumer rank so the hook carries no arithmetic), plus the low-stock evidence (low_stock_state, binding_cover_days, ls_action/ls_now/ls_suggested/ls_proposal_targets/ls_freed_per_day) and the rank-4 detail (is_oob_owned, days_capped_7d, is_launch, launch_exempt_active). TODAY 2026-08-13: 11 claimed by LOW_STOCK (8 LolliBall CRITICAL via arm A+B, 3 Bunny WATCH via arm B), 69 LAUNCH, 7 OOB, 21 LIFT. The claim removes +$24.77/day of budget RAISES from Portfolio 80/20 (VIDEO- BALL +$13.77, VIDEO- COMP/BALL +$6.00, BUNNY-SP/AUTO Brave +$5.00 — every one of them into a family with a stock problem) plus 4 duplicate HOLD rows, 13 OOB-keyword bid instructions incl. an ACTIVATE switching ON a parked target inside the CRITICAL family, and 4 keyword-lift bid rows incl. NUDGE_UP / AUTO_DAY_RAISE. PLANNER DOCTRINE: this view reads V_LOW_STOCK_ADS (at BigQuery's planning ceiling) so NOTHING HOT READS IT — SP_SNAPSHOT_PANEL_OWNERSHIP materializes it into FACT_PANEL_OWNERSHIP and every engine, cube and panel reads the TABLE (same doctrine as FACT_PARK_REVERDICT / FACT_KEYWORD_GUARD). The first cut read the low-stock engine at TWO grains (FAMILY + CAMPAIGN) and failed outright with 'Not enough resources for query planning'; the CAMPAIGN branch already carries the family verdict on every row, so ONE read — do not add a second. Cost of that choice: stockout_date/next_arrival_date are NULL on the CAMPAIGN branch, so reason strings quote cover days, not the dry date. Deterministic (2x byte-identical, md5 ac80b48c050332fb51f61e028e0f9f4f on 108 rows @ 2026-08-13). v27.77 (2026-08-17) — THE SOURCE IS NOW MATERIALIZED. The 'one read, do not add a second' rule above was the last inch of headroom, and on 2026-08-17 the ceiling moved under it: v27.73 (redirect mode — rmode/hero CTEs + 5 published columns) and v27.74 (complete-day windows) each enlarged V_LOW_STOCK_ADS until even ONE inlined expansion stopped planning — the 16:24 snapshot run and then every SELECT COUNT(*) on this view failed with 'Not enough resources for query planning'. ls_camp now reads T_LOW_STOCK_CAMPAIGN, a pure pass-through slice that SP_SNAPSHOT_PANEL_OWNERSHIP builds IMMEDIATELY BEFORE this snapshot in the same call. Nothing semantic moved: the per-campaign roll-up, the two claim arms and the ladder are all still here, and ls_camp keeps its (now redundant, deliberately defensive) row_kind/campaign_id WHERE. The rule survives in its new form — one slice, one read; if a second grain is ever needed, widen the SLICE in the SP, never re-inline the view. Effect measured the same hour: 95 -> 93 rows (2 campaigns PAUSED out of the ENABLED population), ZERO owner flips, zero claim_rank / defer_* moves; only ls_suggested moved (6 rows — the expected v27.73/v27.74 + intraday-restatement drift). v27.78 (2026-08-17, Ori: 'fix arm b') — ARM B GAINED A THIRD SIGNAL, ls_redirect_mode, because v27.73 had switched the first two OFF on exactly the campaigns that need them most. REDIRECT MODE is the low-stock engine RE-AIMING ad doorways at an in-stock sibling instead of braking, and it deliberately prices bid- and budget-cut rows WITHOUT proposing them (is_proposal=FALSE; only waste-parks stay proposals) — so ls_proposal_targets collapsed to 0 on 10 of 14 low-stock campaigns and 5 of them (BALL-SP/AUTO (White), BUNNY - COMPETITORS, BUNNY-SP/AUTO (Birthday), BUNNY-VIDEO/BROAD (Hunter), VIDEO- COMP/BALL) carried NEITHER a suggested budget NOR a proposal target, keeping the claim ONLY because arm A happened to fire. The moment a redirect-mode family grades THROTTLE instead of CRITICAL, arm A goes silent and arm B was blind: no claim at all, and the bid engines free to raise into a stock problem — the exact contradiction this view exists to prevent. THROTTLE, NOT WATCH (corrected 2026-08-17; the first cut of this note said WATCH and that state is unreachable): redirect_mode requires the BINDING variation to grade THROTTLE or CRITICAL and the family inherits the binding grade whenever it is not OK, so a re-aiming family can never read WATCH. Arm A covers CRITICAL; the state this arm actually covers is THROTTLE + redirect + both money signals silent — the SHAPE of the BUNNY-SP/AUTO (Brave) case arm B was originally built for, one grade up, not that case literally. The reading of arm B is unchanged and only its evidence widened: silence caused by the engine CHOOSING not to brake is not silence. A family being RE-AIMED is low stock ACTING. Requires the matching V_LOW_STOCK_ADS v27.78, whose CAMPAIGN branch now publishes the real redirect_mode (it was CAST(NULL AS BOOL), which is why arm B could not see it) with NO new join or CTE — the branch already joined the rmode CTE as rmc for the v27.73 is_proposal gate. ls_camp rolls it up with LOGICAL_OR; ls_redirect_mode is also PUBLISHED as an output column (additive) so a panel can show which signal a claim rests on, and claim_reason names it in plain words (', low stock is re-aiming these ads'). NO-OP TODAY BY DESIGN and that is the CORRECT result: both redirect-mode families (Bunny, LolliBall) grade CRITICAL right now, so arm A already claims all 14 campaigns — measured after deploy, 93 rows, ZERO owner / owner_rank / claim_rank / defer_* changes vs FACT_PANEL_OWNERSHIP_bak_v2778, 14 rows now carrying ls_redirect_mode=TRUE. The counterfactual is what the fix buys: with arm A held silent, the OLD predicate keeps only 9 of the 14 claims, the NEW one keeps all 14. Planner re-verified after the change — the T_LOW_STOCK_CAMPAIGN slice still plans (dry run OK, 119 MB) and the SP runs end-to-end. ADVISORY — nothing auto-applies. Cube: PanelOwnership (reads the FACT table). Spec: architecture/PANEL_OWNERSHIP.md."
    source_files: ["scripts/bigquery/views/V_PANEL_OWNERSHIP.sql"]
    dependencies:
      - T_LOW_STOCK_CAMPAIGN
      - V_DIM_CAMPAIGN_CURRENT
      - V_CAMPAIGN_FAMILY_MAP
      - V_CAMPAIGN_CAP_STATE
      - V_LAUNCH_POPULATION
      - V_LAUNCH_EXEMPTION

  - name: "V_LOW_STOCK_ADS"
    description: "v27.59 (Ori 2026-08-13, TWO corrections to v27.58) - Weekly Run CRITERIA 1: LOW STOCK, the highest-priority criteria on the page (above Launch exemption and Revivals). Answers 'this family is heading for a stock-out - which ad spend do I pull, and what does pulling it actually buy?'. ### CORRECTION 1 - THE GRADE RUNS ON ACTUAL RECENT SALES, NOT THE FORECAST. Ori: 'CRITICAL means that by current sales qty (based on the last days) the family will be OOS and we need to spend less ads spend.' Through v27.58 velocity_used = GREATEST(velocity_forecast, velocity_30d) and THE FORECAST WON ON ALL 29 ASINs, so every cover number and every risk grade was forecast-driven on a forecast that is 3.4x reality on Fresh in Pink (15.71/day vs 4.57). Now velocity_actual = GREATEST(units_7d/7, units_14d/14, units_30d/30) - the FASTEST of three trailing actual windows - drives doc_flat_days, days_of_cover, days_of_cover_avail, stockout_date, po_deadline, bridge_gap_days and risk_state. WHY THE MAX OF THREE AND NOT ONE, measured on all 29 own ASINs: 7d alone is too noisy on low volume (Nope Bunny sold 0 units in 7 days and 2 in 30 - a 7d-only rate is 0.0/day, INFINITE cover, 'plenty of stock' on 95 units); 30d alone is too slow on an accelerating launch family (Purple LolliBall 3.40/d over 60d -> 5.53/d over 30d -> 7.36/d over 14d -> 8.00/d over 7d; the 30d rate claims 35 days of cover against a real 24). The max is the conservative choice among actual windows (max rate = shortest cover), can never return infinite cover unless the product truly sold nothing in 30 days, catches an acceleration in a week not a month, and is biased slightly high - the correct direction of error for a stock-out grade. velocity_actual_basis (7D|14D|30D|NONE) publishes which window bound each row. The SEASONAL WALK LEG (V_SUPPLY_CHAIN_SUMMARY.days_of_coverage, itself V_PLAN_FORECAST-shaped) is now on the FORECAST side ONLY - folding it into the grade would smuggle the forecast back into the number Ori asked to be actual-driven. NOTHING IS LOST: days_of_cover_forecast / days_of_cover_avail_forecast / doc_flat_forecast_days / cover_basis_forecast / risk_state_forecast / bridge_gap_days_forecast / binding_cover_forecast_days / at_risk_units_share_pct_forecast publish the OLD reading in full, and the panel shows both wherever they disagree. SEASONALITY TENSION, stated and surfaced not buried: trailing actual going INTO a season understates future demand, so the two questions are kept apart - risk_state answers 'am I about to go dark at the rate I am selling NOW' (Ori's definition, the right trigger for cutting ad spend today) on velocity_actual, while season_gap_units / season_demand_units answers 'will I have enough for Q4' and KEEPS its forecast basis (GREATEST(forecast rate, actual rate) x days to 31-Dec vs FACT_FORECAST_DEMAND), rendered on its own line labelled 'a PO decision, not an ads one'. Side effect: since the grade now uses only first-party trailing actuals, the known V_PLAN_FORECAST non-determinism can no longer flip a family between OK and THROTTLE run to run - it can only move the published forecast column and the season gap. RESULT 2026-08-13: Fresh THROTTLE->WATCH (cover 48.4 -> 143.9 days), Bunny THROTTLE->WATCH (110.6 -> 177.3), Lollibox THROTTLE->OK (118.9 -> 199.3); LolliBall stays CRITICAL and gets MORE urgent, not less - it is a launch family climbing hard whose 7d rate is ABOVE its forecast on every variation (binding switches to Pink LolliBall, 23.3 days at 9.00/day, where the 30d rate would have said 38). ### CORRECTION 2 - THE CRITICAL ACTION IS A SHORT-WINDOW 50% BID CUT, replacing the v27.58 breakeven-bid ladder outright (breakeven_bid, bid_cut_viable, keep_factor, the 10-click evidence gate and the proven-over-90d reprieve are all GONE, as are actions STOCK_PARK / STOCK_BID_CUT). Ori: 'table format of critical low stock use the last day, 7 days window format. If it wasnt profitable in last day AND 7 days (or 3 days in peak) reduce bid by 50%.' THE RULE: family risk_state = CRITICAL AND not brand defense AND spend > 0 on the w-window AND the w-window did NOT clear 1.0x GP-ROAS AND the last complete ads day did NOT clear 1.0x -> bid x 0.5, floored. EITHER window profitable -> STOCK_PROTECT and the reason names which window spared it. last_ads_day = LEAST(MAX(FACT_AMAZON_ADS.date), FN_ADS_ANCHOR_CAP()), the same anchor every other Weekly Run panel calls 'last day'; w_days from V_PEAK_WINDOW_RULE (7 off peak, 3 in peak unless last year proved 7 better) - today in_peak TRUE, w_days 3, BTS_2026 NOT_PROVEN. DELIBERATELY BLUNT: no click bar, no 90-day reprieve, no breakeven arithmetic - the objective is to SLOW SALES until the next batch lands, not to optimise ROAS. FLOORS per format, never crossed (DIM_AD_GROUP.creative_type, the same split V_OOB_KEYWORD and FN_TARGET_BID_SHADOW use): SP $0.20 house, SB video/brand $0.25 platform minBid, SB PRODUCT_COLLECTION/STORE_SPOTLIGHT $0.10. A straight 50% landing under the floor is CLAMPED UP to it ($0.38 -> $0.20, not $0.19) and the reason says so; a bid already at the floor reports STOCK_AT_FLOOR and proposes nothing; a target with no bid of its own reports STOCK_NO_BID; both are counted in not_executable_targets so escalated_targets reconciles. profit_1d / profit_w are published THREE-STATE (YES|NO|NO_SPEND): the w-window must have spend (no spend = no evidence and nothing to slow, -> STOCK_WATCH), but a LAST DAY with no spend does NOT veto the w-window verdict - the both-must-fail guard exists because unsettled data UNDERSTATES ROAS, and a day with no clicks cannot be understating anything. SETTLE CAVEAT, stated once and then implemented as specified: both short windows are unsettled (SP accrues D+7, SB D+14) and they OVERLAP (the w-window contains the last day), so 'both failed' is a real but PARTIAL, correlated guard; settled windows were NOT substituted because the rule must react at the speed stock disappears, and the settled 28d/90d columns stay published on every row. IN A CRITICAL FAMILY THE SHORT WINDOW OUTRANKS THE SETTLED CLASS IN BOTH DIRECTIONS: the STOCK_PROTECT branch sits ABOVE the waste park, because 'surprise balls for girls' (VIDEO- BALL, 2026-08-13) is classed NON_CONVERTING - zero orders on the settled 28d AND 90d - yet bought 5 orders at 5.52x GP-ROAS in the last 3 days; it is a fresh keyword whose orders have not settled, not waste, and parking it would kill a live winner on stale evidence. SIZING matches the decision window: dollars_freed_per_day and units_removed_per_day for a halve come off w_spend_per_day / w_units_per_day, not the settled 28d rate, because pricing today's move off a month-old spend level is materially wrong on a family running 3.40 units/day at 60 days and 8.00 at 7. CAPPED PAIRING KEPT AND SHARPENED: a halved bid on a capped campaign buys roughly TWICE the clicks for the same money, so unpaired it sells the last stock FASTER than doing nothing - STOCK_BID_HALVE_AND_BUDGET on the target, STOCK_BUDGET_CUT on the campaign, sized budget - SUM(dollars_freed) floored at Amazon's $1 (not a flat proportion: a campaign holds a mix of halved and protected targets and halving the whole budget would starve the winners). ### UNCHANGED: the waste cut and the paired budget cut for WATCH/THROTTLE families; DEFENSE never profit-judged or throttled in any risk state; the three dark tests A bridge / B nothing booked / C season with their thresholds; MATERIAL-variation family verdict (>=10% share, escalate at >=25% at-risk units); binding variation picked by RISK rank then cover; total_pipeline_qty over all six stages; overdue_pending_qty; the arrival-freshness conflict published not corrected (SHP_990487c02fee, FAST_SEA, PENDING, ETA 2026-09-09, 160 Purple + 320 Pink LolliBall, booked after the 07:40 UTC snapshot load - with that boat Pink is 23.3 days against an arrival in 27, gap -3.7 -> THROTTLE not CRITICAL, and the whole halve rule switches off; that is Ori's call, not the view's); GP = Ads_sales - COALESCE(T_PRICE_COST_TIER.tier_cost, TOTAL_COST_PER_UNIT) x Ads_units; timezones (inventory vs CURRENT_DATE(), ads vs America/Los_Angeles); V_LAUNCH_EXEMPTION LEFT JOINed for DISPLAY ONLY, never a gate - a stock brake is neither a loss-cut nor a park, it is a temporary throttle lifted when the boat lands. Grain: row_kind FAMILY | ASIN | CAMPAIGN | TARGET (CAMPAIGN/TARGET only for WATCH/THROTTLE/CRITICAL families); UNION ALL BY NAME so a mismatched column is a compile error. 160 columns / 216 rows @ 2026-08-13. TODAY: LolliBall CRITICAL -> 20 targets halved (-50%, $58.71/day of bid spend removed), 2 non-converting parked ($1.31/day), 7 protected, 6 watching = $60.02/day freed and 5.5 days of cover bought on the binding variation, plus 4 paired budget cuts totalling $38.89/day (VIDEO- BALL $55.06->$32.61, BALL-SP/AUTO Purple $12.29->$5.58, Mint $22.50->$16.36, Blue $10.00->$6.41); Fresh and Bunny WATCH with waste cuts only; Bottle, LolliME, Lollibox OK. Deterministic (2x byte-identical on 216 rows @ 2026-08-13). ADVISORY - nothing auto-applies to Amazon, nothing is queued. Thresholds live in the k CTE at the top of the view, never in the panel. Cube: LowStockAds. Panel: dashboard-react/src/pages/LowStockPhase.tsx. Spec: architecture/LOW_STOCK_CRITERIA.md ### v27.62 (Ori 2026-08-13: 'table format should be like portfolio 80/20; there should be actions and the why must be short and readable') - TEXT ONLY, no decision, no threshold, no number changed. TWO NEW COLUMNS: action_reason_short (TARGET + CAMPAIGN rows) and risk_reason_short (ASIN rows) carry the SAME verdict as their long twins in ONE CLAUSE of ~6-10 words, branch-for-branch identical CASE so the two can never disagree; the long action_reason / risk_reason are UNCHANGED and become the cell's title= tooltip. Grammar everywhere is <evidence> - <consequence>, Ori's own shape: '23d cover, dry 09-05 - 0.37x last day, 0.69x 3d' (47 chars) replaces a 729-char paragraph in the visible column; longest short string on the account is 53 chars / 11 words against a longest long string of 1019. Shortening is done IN THE VIEW and never in TypeScript - the panel renders action_reason_short and falls back to action_reason if a schema skew hides it. Coverage 2026-08-13: 0 rows with a long reason and no short one (FAMILY rows deliberately have no risk_reason_short - that header is a full-width prose line, not a table cell, and keeps the long form). Formatting detail worth keeping: the 'x' suffix sits INSIDE the FORMAT('%.2f', ...) call, never after a COALESCE, or a no-spend window prints 'no spendx'. The PANEL was reshaped to the OobBudgetPhase.tsx eleven-column row in the same revision: item | capped (its 'dark' slot) | now $ (setting + $/day) | last day | w-day window (its 'prev-2d' slot) | settled 28d (its 'CPC/target' slot) | class = target_class (its 'role' slot) | action | -> $ | days bought (its apply-button slot - this panel is advisory and queues nothing) | why. Every row now carries an action and a -> $, campaign rows included; they used to render blank. Deterministic (2x byte-identical on the four reason/action columns @ 2026-08-13, md5 afe6a9f9e50226c0cc89f4c1a5f2c142). ### v27.73 (Ori 2026-08-17, Task 4.6, verbatim: 'if one variation is out of stock we should change the target of the out of stock target to the best high demand variation we have in stock. we should cut budget if we have only low demand variation or the entire family is out of stock') — REDIRECT MODE, THE FAMILY'S ADS POSTURE, AND THE FIRST ARM THAT DOES NOT BRAKE. WHY (measured on Bunny the same day): family ads sell the LISTING, not the advertised ASIN — 77.6% of Bunny ad units land on a sibling of the advertised doorway, and Bestie (the binding variation, 20 days of cover) has ZERO own-ad sales while Proud ties its rate at 1.43/day on 252 days of cover. Braking the family there sacrifices in-stock sibling sales to save ~0.25 units/day of drain; re-aiming the doorway keeps the sales and removes the drain. THE POSTURE, computed once in fam_agg and read everywhere: redirect_mode = the binding variation grades THROTTLE or CRITICAL AND a different in-stock sibling (days_of_cover_avail >= 60, positive actual rate) sells at >= 50% of the binding rate. That sibling is the HERO, ranked by demand (the same max-of-7/14/30d actual rate the grade runs on), fully tie-broken, and legitimately NULL when there is nowhere to aim — in which case the ladder falls through to the ordinary brake (only low-demand siblings in stock) or the full brake (the whole family dry). WHAT IT CHANGES IN THIS VIEW: while a family is re-aiming, the bid-halve and paired budget-cut branches are still PRICED and published but are no longer PROPOSED (is_proposal = FALSE), so the panel can show what the brake would have cost without the engine asking for it; waste-parks (non-converting targets) stay proposals, because they free cash and cost no cover either way. FIVE NEW PUBLISHED COLUMNS, real on FAMILY rows: redirect_mode, hero_asin, hero_product, hero_rate, hero_cover. The actual re-aim instructions are NOT emitted here — V_LOW_STOCK_REDIRECT derives them from these same fields (per SP ad group advertising the dry ASIN, from V_SRC_AmazonAds_advertised_product: pause the dry product ad, create the hero's; bids and budgets untouched), and SB video creatives have no bulksheet swap path so they stay on the brake arms. THE DOWNSTREAM COST OF GOING QUIET, found by the Task 4.10 verifier and repaired twice since: a silent engine is indistinguishable from an engine with no opinion — V_PANEL_OWNERSHIP's arm B went blind on exactly these campaigns (fixed v27.78, below), and a dedicated per-product campaign of the dry variation was left neither braked nor re-aimable (fixed v27.80, below). ### v27.74 (Task 4.7, Ori 2026-08-17, after catching a dashboard/console disagreement on 'the same 3 days': 'last day = Aug 16 - 3d = Aug 13-15 - 7d = Aug 9-15 - 28d = Jul 19-Aug 15, this is the correct') — COMPLETE-DAY WINDOWS. The trailing w-day short window is now the w_days COMPLETE days ENDING THE DAY BEFORE the anchor: BETWEEN last_ads_day - w_days AND last_ads_day - 1, applied to all five w_* measures (w_clicks / w_spend / w_orders / w_units / w_gp). The LAST-DAY read (the d1_* filling day, 88-90% complete) and the settled s28 / s90 windows are UNTOUCHED — the filling day still stands alone, which is exactly the role Ori gave it. WHAT IT REPAIRS: every window in this view now matches an Amazon-console range of complete days by name, and the 50% halve rule stops reading a partial day as a bad day. IT ALSO DISSOLVES A CAVEAT WRITTEN ABOVE: the v27.59 block warns that the two short windows OVERLAP (the w-window contained the last day) and that 'both failed' is therefore correlated — they are now disjoint, and that sentence no longer holds. The settle caveat itself stands unchanged: both short windows are still unsettled, and that is deliberate, because the rule must react at the speed stock disappears. MEASURED ON DEPLOY: 5 sites in this view (62 across the five views in the batch, all flip-reported); VIDEO- BALL 3d GP-ROAS 0.72 -> 1.09 once the filling day left the window, i.e. halves the partial day would have triggered were spared. Convention doc: feedback_window_convention_complete_days. v27.78 (2026-08-17, Ori: 'fix arm b') — the CAMPAIGN branch now publishes the REAL redirect_mode instead of CAST(NULL AS BOOL). One column, no new join and no new CTE: the branch already LEFT JOINs the rmode CTE as rmc for the v27.73 is_proposal gate, so this reads a row that was already in the plan (deliberate — this view has no measured planner headroom left, and the T_LOW_STOCK_CAMPAIGN slice was re-dry-run after deploy to prove it still plans). WHY IT MATTERS DOWNSTREAM: redirect mode makes this branch go QUIET — v27.73 prices bid- and budget-cut rows but stops proposing them while the family re-aims doorways — and V_PANEL_OWNERSHIP's arm B was reading that silence as 'low stock has no opinion here', the exact opposite of the truth (10 of 14 low-stock campaigns lost their proposal targets to the gate; 5 lost both signals). Publishing the flag is what lets ownership claim a family that low stock is RE-AIMING rather than braking. See V_PANEL_OWNERSHIP v27.78. v27.80 (2026-08-17, Ori verbatim: 'BALL-SP/AUTO (Mint) is auto per product. auto we have for each product - so no need to change / only reduce ads by reducing the bid') — THE REDIRECT GATE NOW ASKS WHOSE DOORWAY IT IS BRAKING. v27.73 suppressed bid AND budget cuts on EVERY campaign of a redirect-mode family (only STOCK_CUT_WASTE% parks survived). That is right for a SHARED doorway and wrong for a DEDICATED one, and this account runs ONE AUTO CAMPAIGN PER VARIATION, so the wrong case is common. THREE CASES, ONE CHANGES: (1) shared doorway advertising the dry variation -> suppressed + redirect offered, CORRECT, unchanged; (2) dedicated campaign of an IN-STOCK sibling -> suppressed, no redirect, CORRECT and unchanged (braking BALL-SP/AUTO (Pink) would not save one unit of Mint and would lose Pink sales); (3) dedicated campaign of the DRY variation -> was suppressed with no usable redirect = THE HOLE. BALL-SP/AUTO (Mint), $417/30d, was neither braked nor sensibly re-aimed. THE FIX is one clause on each of the two is_proposal gates: suppress brakes <=> redirect_mode AND NOT waste-park AND NOT serves_only_binding. NEW COLUMNS serves_only_binding + n_own_asins, published on CAMPAIGN and TARGET rows (NULL on FAMILY/ASIN — they are campaign-grain). serves_only_binding = the campaign advertises exactly ONE own product and that product IS the family's binding (dry) variation, read from T_CAMPAIGN_PRODUCT_SCOPE — the MATERIALIZED V_CAMPAIGN_PRODUCT_SCOPE, joined as a PHYSICAL TABLE because this view has NO measured planning headroom (it stopped planning outright on 2026-08-17 and cost the whole v27.77 repair; a fourth inlined view was never an option — fact_oi_cube_table_planner_blowup). The rmode CTE gained ONE column (binding_asin) rather than a new CTE. PLANNER RE-VERIFIED AFTER DEPLOY: SELECT * FROM V_LOW_STOCK_ADS WHERE row_kind='CAMPAIGN' plans and runs (119 MB), and SELECT COUNT(*) FROM V_PANEL_OWNERSHIP plans and returns 93 — the same 93 as v27.78. MEASURED FLIP 2026-08-17: exactly ONE campaign flips. BALL-SP/AUTO (Mint) serves_only_binding = TRUE, proposal_targets 1 -> 3: two AUTOMATIC bid halves regain proposals ('substitutes' $0.41 -> $0.20 freeing $4.23/day; 'loose-match' $0.34 -> $0.20 freeing $1.79/day = $6.02/day of newly-proposed brake), on top of the 'close-match' waste park that already survived the gate. Its CAMPAIGN-row is_proposal stays FALSE and that is correct — the campaign is not capped (STOCK_BUDGET_HOLD, suggested_budget NULL), so the freed dollars genuinely leave without a paired budget cut. The other 13 low-stock campaigns are byte-identical: 4 shared doorways (n_own_asins 3/5/9/11) and 6 dedicated-to-an-in-stock-sibling campaigns stay suppressed with serves_only_binding = FALSE, and 3 SB/video campaigns (VIDEO- BALL, VIDEO- COMP/BALL, BUNNY-VIDEO/BROAD) have n_own_asins NULL. KNOWN LIMIT, conservative on purpose: Amazon publishes no advertised-product report for Sponsored Brands, so a DEDICATED SB campaign of a dry variation reads serves_only_binding = FALSE and stays suppressed — the v27.73 behaviour, unchanged. Requires T_CAMPAIGN_PRODUCT_SCOPE to exist: the join is not optional and a missing table breaks this view outright. ### AS DEPLOYED 2026-08-18: the view publishes 171 columns (INFORMATION_SCHEMA on the live view). The '160 columns / 216 rows @ 2026-08-13' figure in the v27.59 block above is the v27.62 measurement and predates every block after it; the row count has not been re-measured since."
    source_files: ["scripts/bigquery/views/V_LOW_STOCK_ADS.sql"]
