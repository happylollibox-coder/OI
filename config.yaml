    type: "view"
    source_files: ["scripts/bigquery/views/V_CAMPAIGN_BUDGET_BASE.sql"]
  - name: "V_CAMPAIGN_DAILY_MOVE"
    description: "Daily out-of-budget optimizer on the last full-data day: <0.8 net ROAS→BID_CUT, 0.8-2.5→+10%, ≥2.5→+30%; targets normalized to the family cap (reallocate within cap)."
