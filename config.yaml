# ═══════════════════════════════════════════════════════════════
# FUNCTIONS
# ═══════════════════════════════════════════════════════════════

functions:
  - name: "FN_ADS_ANCHOR_CAP"
    description: "Calendar cutoff for the launch controller's 'last complete day' anchor (LA-time ads data). Returns YESTERDAY (LA) normally, but the CURRENT LA day once it's within its last 2 hours (hour>=22) — sales are effectively done by then (Ori 2026-07-18), so the day counts as complete enough and can be the anchor, instead of waiting for LA midnight. Used by V_LAUNCH_PHASE1, V_RUN_TARGET, V_RUN_SEARCH_TERM, V_LAUNCH_CARD_DAILY as LEAST(MAX(date), FN_ADS_ANCHOR_CAP())."
    source_files: ["scripts/bigquery/functions/FN_ADS_ANCHOR_CAP.sql"]
    type: "sql_udf"

  - name: "FN_EXTRACT_SEGMENTS"
    description: "Single source of truth for search-term segment extraction (gender, age_group, occasion, holiday). Consumed by V_SQP_QUERY_WEEKLY, V_RESEARCH_RANKED, SP_DERIVE_PRODUCT_SEGMENTS, segment-reasoning endpoint."
    source_files: ["scripts/bigquery/functions/FN_EXTRACT_SEGMENTS.sql"]
    type: "sql_udf"

  - name: "FN_FETCH_EXCHANGE_RATES"
    description: "Remote function to fetch exchange rates via Cloud Function"
    source_files: ["scripts/bigquery/functions/FN_FETCH_EXCHANGE_RATES.sql"]
    type: "remote_function"

# ═══════════════════════════════════════════════════════════════
# CLOUD FUNCTIONS
# ═══════════════════════════════════════════════════════════════

cloud_functions:
  - name: "fetch-exchange-rates"
    description: "Fetches live currency rates from exchangerate-api.com"
    source_dir: "cloud-functions/fetch-exchange-rates"
    runtime: "nodejs20"
    trigger: "http"
    region: "us-central1"

