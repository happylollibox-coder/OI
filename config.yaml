      - FACT_PARK_REVERDICT
      - FACT_PANEL_OWNERSHIP
      - T_ENGINE_PREFLIGHT

  - name: "FACT_KEYWORD_STATE"
    description: "The roadmap of each keyword — the state-machine snapshot written daily by SP_SNAPSHOT_KEYWORD_STATE (orchestrator 20.8). Read via V_KEYWORD_STATE; the Weekly Run UNCHANGED taxonomy (Phase 6 UX plan) and V_ENGINE_HEALTH invariant checks upgrade to it. Spec: architecture/KEYWORD_STATE.md."
