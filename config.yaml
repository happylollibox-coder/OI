  - name: "V_FAMILY_SEAT_REGISTER"
    description: "The object Ori reads for the 80/20 doctrine (family seat register Task 2, 2026-08-22; repair passes through 2026-08-23 — rulings R-f…R-m). For every WORKING family (V_BOOK_ASSIGNMENT book = HARVEST) it groups the verdict ladder's keywords (FACT_KEYWORD_STATE, one snapshot) into plain-language categories, puts each on one side of the doctrine line — the 80% side (winning; marginal at its bar; waiting: too few clicks yet / no test clock / verdict settling) or the 20% side (losing: in repair / on probation / failed; probe: being bought / stalled; closed but still spending; untracked) — and prices every category in dollars per day on the basis window (7 complete days ending at the ads watermark − 1). Row types: FAMILY (one per working family per HORIZON — today measured, day one = the PENDING_UPLOAD book lands, re-judged = repairs hold at their bar — with allowance, open capacity, over_by and doctrine_status IN / AT_LINE / OUT, the AT_LINE band DERIVED per family from THAT family's own daily spend noise and published with its derivation — ruling R-g; projection sentences count by the horizon's own side; the 'what closes the gap' sentence is honest — R-l settled its arithmetic on 2026-08-22 and it is the ONLY rule in force (an earlier form of this entry described the closing promise as counting the leaks, the stalled probes AND the failed keywords; that reading is RETIRED — a stalled probe was never a recovery): only a PAUSE counts as recovered today — a leak paused, or a failed keyword killed with a pause row, and never a row in a holdout campaign, which gets no sheet row at all. Parking a stalled probe LOWERS its price and its spend continues, so it is its own line naming its dollars as spend at risk of continuing and is EXCLUDED from the total; re-pricing a repair recovers nothing today by construction and is its own line naming itself a change of price whose result arrives at the re-judged horizon. The closing sentence reads in one fixed order: the executable recovery, the gap, a plain closes / does-not-close verdict, what the remaining dollars depend on, and a pointer to that family's re-judged row — no projection inside the number and no closure the executable recovery does not deliver. Asserted by B29, which re-derives the recovered-today figure from the register's OWN per-row costs rather than from the sentence, within a stated tolerance whose reason is on the check; by B30, which keeps the stalled-probe and repair lines named and excluded; and by B31, which asserts the order. R-l binds the two PROJECTIONS and the promise as well (2026-08-23): the re-judged horizon no longer models a parked stalled probe as $0 — it is re-priced by the move on its own row (R-f) and keeps spending at that price on the same linear bid→spend guess, staying on the 20% side until a verdict arrives (B33); both projections respect the holdout arm, so a campaign that gets no sheet row from its eligible_from costs on day one and re-judged exactly what it costs today, a repair in one never moves to the good side and keeps its 'losing — in repair' category, and the family clause lists no move for it (B34, with the same guard added to B10, B11 and B30's re-derivation); and the FAMILY row names the BOOK its pauses ride on — the leak arm tools/build_seat_moves_bulksheet.py for a leak (SHIPPED 2026-08-23), the reprice generator's pause row for a failed keyword — instead of promising an upload 'today', exactly as the LEAK row's own move always did (B32; the arithmetic is unchanged, only the promise). The LEAK half bound the projections too (2026-08-23) and then its own overrule clause fired the same day when Task 3 SHIPPED (tools/build_seat_moves_bulksheet.py). A leak now reaches $0 on day one and on re-judged EXACTLY where a KEYWORD_PAUSE row for that campaign+keyword sits at upload_status PENDING_UPLOAD in FACT_PPC_CHANGE_LOG — the credit is per ROW, measured against the change log, never assumed for the category; a leak no book carries still equals its today cost on both projections, and a holdout-suppressed leak is never zeroed whatever the log says. Both horizon assumptions name the generator by its file, and the projection clause names BOTH counts (the leaks a pending book pauses, and the ones no book carries). The FAILED half is unchanged and still reaches $0 on re-judged because the reprice generator builds that pause row (B35). R-l ALSO binds WHICH leaks may be counted (2026-08-23, eighth pass): the recovered-today figure counts only the pauses the leak book will actually WRITE. The holdout guard was one of four measured refusals — the generator also refuses a leak already switched off in Amazon (its basis-window spend is trailing spend and a pause row would change nothing), one whose live state cannot be read at all, and one the season ledger BLOCK_CUTs. The register now reads the live switch from BOTH feeds with the generator's own rule (a disagreement never reads as ENABLED), publishes such a row as 'no sheet row' with the reason in words, keeps its dollars out of the recovery, and names them in the family clause instead of dropping them silently. The SEASON gate is deliberately NOT read here: joined into this register V_KEYWORD_CONTEXT_GATE re-plans on every branch and takes a full read from ~24s to 45-98s, so it is enforced OUTSIDE the hot path by acceptance check B36, which queries the gate once against the executable leak set and fails if any counted leak is one the generator would refuse; if it ever fires the answer is a T_ materialisation, not an inline join). Determinism (spec section 8) was repaired in the same pass: every dollar aggregate in the family CTE is now ROUNDed once at source, because a distributed FLOAT64 SUM landed either side of a half-cent boundary and made one family sentence render two different figures on two reads while its own published column read the same both times — the columns, the derived figures and the sentences now all read one double), CATEGORY (sum to the family spend to the cent), SEAT (one per occupant, numbered by DE_FAMILY_SEAT_LEDGER; a stalled probe publishes its raise old→new, date, clicks since, in a size-aware sentence — ruling R-c — whose proposal branches on the sign of seat price − live bid: raise to the seat price only if the live bid is below it, otherwise park at the engine's published park price bid_park read from T_OOB_SEAT_ECONOMICS — ruling R-f; the raise is aged on the snapshot date and the clicks counted on complete ads days, both stated; a settling seat past its due date is named overdue — ruling R-i; a PARKED keyword with spend and a re-verdict appointment ahead is a seat 'parked — awaiting re-verdict', not a leak — ruling R-h), OPEN_SEAT (lowest free number, capacity, next affordable probe from the engine's queue), LEAK (PARKED past its appointment or DEAD, still spending; its move is worded PER ROW against the change log, the same measurement the projections use (2026-08-23): a leak whose KEYWORD_PAUSE row already sits at PENDING_UPLOAD names that batch, says to upload it or label it SUPERSEDED_NEVER_UPLOADED and explicitly not to build another, and publishes the batch in book_batch_id / book_action = KEYWORD_PAUSE so a reader who meets the $0 on the projections can find the sheet that earned it; only a leak no book carries is sent to the next leak book. The book is tools/build_seat_moves_bulksheet.py, which emits one pause row per pausable leak or one stated no-action reason — already paused in Amazon, no readable live state, appointment still ahead, holdout, season BLOCK_CUT, or defense — plus ad-group-grain negatives for the terms bleeding under a closed keyword, judged on the V_ADS_COACH block grain re-derived from FACT_AMAZON_ADS and never ASIN-sliced), GAP (SPENT on the basis window with no verdict row — an off-ladder keyword at $0 is not in the universe; worded by the MEASURED cause — ruling R-k refined 2026-08-22: keyword_id −1, how SB video / PT product targets arrive, means the ladder cannot see it; a paused/archived current DIM_KEYWORD row is trailing spend that leaves the universe when it stops; an enabled row gets its verdict on the next state run; the ladder DOES track SP product targets and the register seats them), NO_CLOCK (a trial whose bid moved outside the change log — R-d), a 'waiting — not yet serving' category for a trial with $0 and 0 clicks (R-j), ABSORB (advisory: above-bar campaigns capped ≥ 4 of 7 days), REFERENCE (launch families, never judged), UNMAPPED (spend in the cracks: one row per campaign that spent on the basis window and that no family claims — no T_FAMILY_BAR row, no ladder row with a family — plus a total row; outside every family read, move = map it in Admin). Brand defense is tested three ways (ladder flag, 'BRAND DEFENSE' in the campaign name, house brand phrases from DIM_BRAND_PHRASES matched as WHOLE phrases on word boundaries, never bare substrings — D9) ON AND OFF the ladder and on the probe queue (D6), and is a category outside both sides, never a GAP. Holdout (DE_HOLDOUT_ASSIGNMENT, arm HOLDOUT) is marked on every row that names a campaign — SEAT / LEAK / GAP / NO_CLOCK / ABSORB / UNMAPPED / the OPEN_SEAT candidate — and from eligible_from the move reads 'no sheet row', the ABSORB advisory is suppressed and the probe queue skips the campaign. Every row carries a sentence in plain words and a sort_key that orders the register totally; every code is rendered as a sentence wherever a person reads it. Reads tables and light views only; V_OOB_KEYWORD (a planner-ceiling view measured in minutes) is never inlined — its seat economics come through T_OOB_SEAT_ECONOMICS. No engine reads it; no budget or bid is moved by it; sheets are built by generators and uploaded by Ori. Acceptance: scripts/bigquery/tests/V_FAMILY_SEAT_REGISTER_acceptance.sql (every check passes). Spec: architecture/FAMILY_SEAT_REGISTER.md. v27.124 (2026-08-23, first-production-night cleanup): every SEAT and LEAK row publishes sheet_row — what a sheet does with it today: PENDING_BOOK / NEXT_LEAK_BOOK / NEXT_REPRICE_BOOK / REBUILD_LEAK_BOOK / BY_HAND / NO_SHEET_ROW / NONE — so the morning surfaces derive their action from what is EXECUTABLE and never from the doctrine status alone (B37; SEAT_SURFACE C11). Ruling R-n, one leak book, one instruction: the pending leak book's state is read once, register-wide (leak_book_state) — STALE when an executable leak is on no pending book while another is on one, or when two pending books exist — and then every executable LEAK row and every family clause carry the single instruction to rebuild it with tools/build_seat_moves_bulksheet.py --replaces <batch> (one book carries every leak; the old batch is labelled as replaced by it, never deleted) while the word upload appears on no leak row; not stale, an on-book leak says upload that one book and an off-book leak says build the next; the negate is the same book's business, said in the sentence and never as a second move (B32 rewritten: the mixed 'N on the pending book and M ride the next' family form is forbidden outright). The rounding narrative in the view header no longer pins the family or the figure (Standing Rule 0). v27.125 (2026-08-23, tenth pass — B38, the SEAT side's engine parity): a repair or failed seat with no row on the pending book promises a book row ONLY where the reprice generator will write one. The view reads the generator's own sources for the refusals it can afford — a live GO instruction for the key in T_ENGINE_PREFLIGHT (one keyword, one price: the engine's upload carries it), a failed keyword whose probation has not elapsed at its floor, and a record at or under the generator's declared thin-orders rule (mirrored as k.thin_orders) — and publishes sheet_row ENGINE_PRICES / NO_SHEET_ROW / TOO_THIN_TO_PRICE with the reason in the move; a refused kill leaves the executable kill count and is no longer zeroed on the re-judged horizon; the family clause says who prices each repair. A season block or a price that does not move is not re-derived (the same measured reason as B36) and the row then points to the generator's audit CSV."
    source_files: ["scripts/bigquery/views/V_FAMILY_SEAT_REGISTER.sql"]
    dependencies:
      - FACT_KEYWORD_STATE
      - T_FAMILY_BAR
      - FACT_AMAZON_ADS
