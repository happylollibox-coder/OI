  - name: "V_KEYWORD_LIFT"
    description: "80/20 portfolio + probe rotation for WORKING campaigns (budget > low-budget cap), SP + SB v2 (Ori 2026-07-30; `channel` column routes the panel to the SP/SB bulksheet tab). Window W = 7d off / 3d peak. Classes: WINNER >=1.1 w/ order · MARGINAL 0.7-1.1 · LOSER <0.7 or 0-order clicks · IDLE. 80% of spend to winners: losers beyond the 20% allowance PARK $0.25 (best-first cum-sum keeps the tail; v11: allowance-PARK and CUT_TO_TARGET need >=4 clicks in W — under that KEEP_TAIL 'still in its trial', 1 click does not break); 1-2 PROBES at a time lifted to max($1, min(1.5x target CPC, $2)) (fallback winners avg CPC; $1 seat-entry floor v10 — anchorless keywords enter at $1 instead of never), stateless episodes via last INCREASE_BID in FACT_PPC_CHANGE_LOG, verdict at 20 episode clicks (>=1.0x -> WINNER_FOUND else PARK), daily -5% descent while probing per the click methodology; cand_rank tie-broken by target_text so the probe pick is deterministic across refreshes. SB arm mirrors SP on SB-native sources (like V_SB_LAUNCH_TARGET): targets+bids from sb_keyword/sb_product_target config mirrors; perf from sb_search_term_report ∪ sb_target_report (NOT sb_keyword_report — dead 2025-12-29); net ROAS estimated sales x (1 - mapped-ASIN cost_ratio) / spend; target CPC = LY same-28d -> FINE band (SB x ad_format via DIM_AD_GROUP.creative_type x match) -> coarse ALL/ALL band; capped guard BOTH arms (v3): no PROBE_START while the campaign caps; v19: is_seasonal campaigns with season_active (own holiday window running, name-token -> DIM_US_HOLIDAYS) probe up to SLOTS instead of the 2/4 pace (dark > 10% on the channel anchor day, budget artifact). Cube: KeywordLift (15-min TTL). Spec: architecture/OOB_BUDGET_PHASE.md §Lever 2B. v4 (2026-08-01): population = ALL enabled+serving campaigns ANY budget (the Portfolio absorbs the launch controller; OOB owns dark>10 for display). Seat mechanism: slots=max(1,round(budget/4)), seat_rank (proven->mid-tests->candidates, tested losers never seated), beyond-seat PARK_WAIT $0.25, PROBE_START needs a free seat + 1-2-probe pace + not capped. New cols: clicks_1d/roas_1d/clicks_prev2/roas_prev2/pct_dark/capped/slots/seat_rank. Campaign budget actions come from the launch views (still the budget engine). v5: is_defense (name '%Brand Defense%') — defense keywords action DEFENSE (moat never ROAS-parked; coacher defense mode owns bids); GRADUATION RULE campaign-grain suggested_budget/budget_reason: camp 7d net ROAS>1 AND budget<$30 -> $31. v8 (2026-08-02): seasonal_now (keyword text had >=1 LY ad order in this same 28d window, 364-day offset; ly CTE HAVING widened to clicks>=10 OR orders>=1, ly_cpc still needs >=10 clicks) — never permanent-parked as tested loser, jumps seat_rank/cand_rank right after proven; target-vs-bid rules: MARGINAL with bid>tcpc+0.05 -> EASE_TO_TARGET (max(bid*0.95, tcpc)/day), LOSER in-allowance with bid>tcpc+0.05 -> CUT_TO_TARGET (straight to tcpc); WINNER never pulled down. v27.14: probing + clk1<2 + bid<$0.95 -> PROBE_ADJUST to the $1 entry floor (starving probe never reaches its verdict); v27.13.1: low-tier window verdicts (PARK/CUT_TO_TARGET) need >=10 clicks/3d (4-click gate stays for 7d tiers; 90d parks + probe episodes decide at own grain); v27.13 NUDGE_UP: seated low-tier keyword under 10 clicks/3d, bid>$0.30 and under the entry anchor -> +5%/d (min 2c) toward anchor — invisibility is a bid problem (VOLUME_LIFT outranks; its bid/reason gates now carry the clk28<30 guard); v27.12 CUT_TO_BREAKEVEN: W-window (7d off/3d peak; low=3d), clk_w>=30 (13 for 3d), W net ROAS<1 w/ profit>0 -> glide -10%/d toward gp_w/clk_w, FLOOR $0.15; zero-profit W -> PARK $0.25 (supersedes v26 28d one-shot; excluded from VOLUME_LIFT); v25 DECISION FLOOR: window reductions (PARK/CUT/EASE) need camp_clicks_7d>=30 (8 clicks/wk is noise; 15clk/90d + probe verdicts still decide); VOLUME_LIFT lifts seated under-anchor keywords in under-floor campaigns to max($1,min(1.5xtarget,$2)); v27.11 GENERAL RAMP: any WINNER (not auto/defense/capped) with bid < target-$0.05 -> RAISE_TO_TARGET +10%/d capped at target (mirror of EASE_TO_TARGET); v13 SEASON RAMP: seasonal_now WINNER/MARGINAL with bid<60% of target -> RAISE_TO_TARGET min(max(bid*1.10, bid+0.05), tcpc)/day — the June-bid-in-December fix; losers excluded (probe path instead). v16: role column (FUNDER/WATCH/PROBE/CANDIDATE/TRIAL/PARKED/RETIRED/QUEUED/IDLE/DEFENSE/ANTENNA) — the keyword's job in the campaign economy. v22: is_research (name hunter|discovery|research) — allowance-losers RESEARCH_EASE (-15%/d floor $0.30, role ANTENNA) instead of PARK; v23 AUTO DOCTRINE: is_auto clauses (4 fixed groups) never PARK/PARK_WAIT/RETIRED/QUEUED/probe — LOSER >=4clk -> AUTO_TRIM (-15%/d floor $0.20, gate >$0.25 per v24.2; v27.3 AUTO_NUDGE: LOSER 4-29clk/W uncapped that CONVERTED last 3d (gp1>0 or gp3>0) -> +5%/d cap $2 — starving clicks: a trim would freeze it, feed the signal), WINNER >=4clk not-capped -> AUTO_RAISE (+15%/d cap $2, v24.4), targets advisory (no EASE/CUT/RAISE_TO_TARGET), negation is the lever; v27.7 LOW-BUDGET W-REBASE: ALL low-budget campaigns (budget<=cap, not defense) have W = 3 DAYS (last day + prev-2d) at the base layer — class/allowance/seat economics/trial gate inherit it; camp floor pro-rates to 13c/3d; big tiers keep weekly W; v27.6: low autos use NO weekly window at all — day rules decide, everything else HOLDS with day-based reasons; weekly AUTO_RAISE/NUDGE/TRIM/FIT/BRAKE gated to budget>cap; DAY_RAISE needs just 1 paying click; v27.5 LOW-AUTO DAY RULES: autos in low-budget campaigns (budget<=cap) react to 1d/prev-2d FIRST — >=3clk yesterday net-profitable AFTER spend -> AUTO_DAY_RAISE +5% cap $2; no profit in BOTH 1d and prev-2d on >=10 combined clicks -> AUTO_DAY_TRIM -5% floor $0.20 (a conversion in either window blocks it); outrank weekly auto rules AND capped mechanics; v27.4 APPLIED_HOLD: change-log rows <48h (applied today OR value not yet in config) suppress bid/budget suggestions — one ladder step/day, no double-apply across the Fivetran lag; v24: is_auto_campaign (enabled auto clause in config) + peak windows clicks_3d/roas_3d/clicks_4_14/roas_4_14 (+camp rollups) — the Auto section (first on Weekly Run) is the single home for ALL auto campaigns, dark or healthy; seasonal_now = CONCENTRATION (>=2 LY window orders AND >=25% of LY-year orders AND first activity >=30d pre-window — launch-artifact guard); ly CTE spans the full LY year. Spec: OOB_BUDGET_PHASE.md §v8. v9 (2026-08-02): is_seasonal campaign flag (name regex: christmas/xmas/valentine/easter/halloween/thanksgiving/black friday/bfcm/cyber monday/back to school/mother's-father's day/santa/advent/holiday — NOT prime/season) — seasonal campaigns homed in their own Weekly Run sections (Seasonal + Seasonal—OOB, any tier); 2x2 excludes them; paused seasonal shown via CampaignDim cube. Spec: §v9. v27.42 (2026-08-08) SEASON-CONTEXT GATES: output wrapper reads V_KEYWORD_CONTEXT_GATE (keyword rows only — join carries NOT is_auto AND NOT is_pt): BLOCK_CUT (current occurrence settled >=15c at >=1.0x GP-ROAS) vetoes cuts (PARK/PARK_WAIT/EASE_TO_TARGET/CUT_TO_TARGET/CUT_TO_BREAKEVEN/RESEARCH_EASE, and the v27.34 input set about to be parked) to HOLD — same-context settled evidence outranks the 4-click window; ENTRY_BLOCK STOP (prior same-family mature LOSS + half-allowance re-probe spent without payback) parks funding actions (PROBE_ADJUST/PROBE_WAIT/NUDGE_UP/VOLUME_LIFT/PROBE_START/RAISE_TO_TARGET) at $0.25 unless the window says winner (>=4c >=1.0x — flip release); PROBING never interferes; PARK_CONTEXT advisory-only via new context_gate/context_gate_reason columns. Guard ladder: v27.28 -> BLOCK_CUT -> APPLIED_HOLD -> v27.34 -> ENTRY_BLOCK stop -> v27.36 -> v27.37 -> floors. Precedence + calibration: SEASON_CONTEXT_LEDGER.md §5-6. v27.45 (2026-08-08) ONE BID OWNER + SINGLE BUDGET AUTHORITY: campaigns V_CAMPAIGN_CAP_STATE marks is_oob_owned emit action DEFER_OOB (no suggested_bid, reason 'capped Nd of 7 — out-of-budget engine owns the bids') at the TOP of the guard ladder — rows stay visible, V_OOB_KEYWORD owns their bids; DEFENSE rows exempt (defense bids belong to neither engine); DEFER_OOB + APPLIED_HOLD in the v27.29 no-empty-promises exempt set. suggested_budget/budget_reason for campaigns present in V_OOB_BUDGET_PHASE now read PHASE VERBATIM (PHASE carries its own applied-hold; bud_hold bypassed for them) — LIFT's healthy-campaign loss-cut survives only for campaigns not in PHASE; the budget column can no longer contradict the Weekly Run budget view. v27.46 (2026-08-09) guard batch: A3 seasonal_now precedence — ENTRY_BLOCK PROBING/STOP rows that are not in-window winners (clicks_w>=4 AND roas_w>=1.0, the v27.28 bar — A2 doctrine: current-window conversion outranks prior-season memory) publish seasonal_now=FALSE (funding was already STOP-blocked v27.42 / allowance-clamped v27.43; inner seat ordering still reads the raw flag — SOP §5.7 known limit); A4 AUTO_BRAKE magnitude scaled by the clause's 90d record (>=1.0x -> minimum ease 5% / 0.6-1.0x -> max(5%,15% x dark) / else max(5%,30% x dark));  trigger and floors unchanged. v27.50 (2026-08-12) EVIDENCE-GATED PEAK WINDOW (Ori's rule): the judged window W is no longer the hard-coded IF(in_peak, 3, 7). `season` now reads in_peak from V_SEASON_PEAK_GATE and `cap` reads w_days from V_PEAK_WINDOW_RULE, which resolves today's occurrence type and looks up DE_PEAK_WINDOW_OVERRIDE. Rule: off peak 7 (unchanged); in peak 3 by DEFAULT, and 7 ONLY where the same occurrence in a prior year was MEASURED to produce better decisions at 7 — burden of proof on the slower window, no/thin/ambiguous/CONFLICTING evidence = 3. Granted: XMAS_EARLY, XMAS_PEAK, EASTER -> 7; BTS/VDAY/MDAY/GRAD/FDAY/PRIME -> 3. in_peak, low_cap, the 20/40% allowance, probe slots, the budget floor, the click bars and the CPC band are all UNCHANGED — the file diff vs .bak.v27.50.1258 is exactly the two CTEs, and the live 644-row output is byte-identical before and after (BTS resolves to 3, the same value the hardcode gave). Measured direction where an override IS in force (7-day shadow of the live population): class asymmetry 28 rows harsher at 3d vs 6 at 7d, CUT-family actions 6->5, RAISE-family 36->41 — a granted 7 makes the engine cut LESS, not more. Spec: architecture/PEAK_WINDOW_RULE.md. v27.52 (2026-08-12, Ori approved): FIX 1 — the settle veto now reads the guard's BOUNDED amnesty `settle_amnesty` (season WIN prior AND NOT catastrophic, and the WIN itself is occurrence-scoped) instead of the unbounded `season_win_prior`, at all three ladders; season_win_prior + settle_amnesty + catastrophic are published for audit. FIX 3 — the v27.48 record entry cap (lifetime conv CPC x1.2; ENTRY_BLOCK rows also LY conv CPC x0.8) is now wired to PROBE_ADJUST and ACTIVATE_REVIVE, not only PROBE_START: 5 of 5 live PROBE_ADJUST rows were landing on the flat $1.00 (2 of them scope-lifetime losers at 0.00x). PROBE_ADJUST is capped/blocked only when it RAISES (a lowering adjust commits no new spend); ACTIVATE_REVIVE gets the PRICE cap but not the record-LOSER HOLD (the reverdict owns the decision to revive) and its real-move test now reads the capped bid. Measured deploy day: 10 of 644 rows changed — 5 released from the amnesty (SETTLE_HOLD 13 -> 8, PARK 1 -> 5), 5 re-priced/blocked by the cap (2 PROBE_ADJUST $1.00 -> HOLD, $1.00 -> $0.72, $1.00 -> $0.59, ACTIVATE_REVIVE $0.81 -> $0.68); PROBE_START behavior byte-identical. Two pulls byte-identical. v27.53 (2026-08-12, Ori approved) — ITEM 3 WINDOW-SCALED CUT GATE, ITEM 4 CORROBORATION LEG, ITEM 7 WAKE_STEP, ITEM 8c, ITEM 8f. (3) NEW base column cut_gate replaces the fixed IF(low-tier OR peak, 13, 30) at all 12 condemnation sites: the bar was chosen by tier/season while the window it judges is chosen independently (3d low-tier, else V_PEAK_WINDOW_RULE.w_days), so moving the window silently moved how OFTEN the engine condemns. cut_gate = max(4, ceil(13 x eff_days / 7)) with eff_days = 3 for low-budget non-defense rows else w_days -> 6 at 3 days, 13 at 7 days; ONE definition shared by the action/bid/reason ladders. (4) NEW LONG_LEG_HOLD: PARK and CUT_TO_BREAKEVEN condemned on the SHORT window alone while V_OOB_BUDGET_PHASE has always required BOTH a short and a long settled window to agree; the condemnation is now vetoed when the 8-28d window (>= 4 clicks, settled by construction — it ends at wm-7) reads >= 1.0x. A draft that ALSO let the guard's settled-90d record veto was measured and rejected: it over-braked, holding 3 cuts the recent settled window itself condemned. (7) WAKE_STEP action/bid/reason from the guard's wake_due + wake_step_bid. (8c) a CONFIRM_PARK row could resurface as WINNER_FOUND through BOTH doors — the outer 4-click winner shield and the inner probe_done verdict; measured live, \"teenager girl gift ideas\" (settled-verified retirement) emitting WINNER_FOUND off ONE click at 14.27x. Both doors now exclude it. (8f) MANUAL_HOLD no longer swallows AUTO_BRAKE — dark is never a hold; the manual hold protects Ori's PRICE decision, not the campaign's serving hours. LONG_LEG_HOLD joins the v27.29 no-empty-promise exempt set. COMBINED EFFECT on the 644-row standing population (2026-08-12, in_peak, w_days 3): eligible-to-condemn 23 -> 28 rows ($318.84 -> $345.81 window spend), EMITTED condemnations 5 -> 8 rows ($59.77 -> $145.10, 71 -> 162 clicks) — a real increase, driven by items 2+3, with item 4 holding 7 rows ($39.85) that items 2+3 would otherwise have cut. Every prior guard recounted non-zero: DEFER_OOB 278/278, winner shield 9/8 (the one CONFIRM_PARK removal), REVIVE_SETTLE_HOLD 2/2, MANUAL_HOLD 1/1, ACTIVATE_REVIVE 7/7, DEFENSE 28/28, BLOCK_CUT 11/12, PARK_WAIT 1/1; SETTLE_HOLD 8 -> 2 and PACE_RAISE 3 -> 0 are the intended item-2/8a corrections. Deterministic (2x byte-identical @ 2026-08-12)."
