  - name: "V_CHANGE_SCORECARD"
    description: "SETTLED outcome grading of every applied PPC change (2026-08-12) — the OUTCOME half of Ori's '1 day for opportunity, 7 days for outcome' doctrine; the opportunity half was tested and REJECTED, this half measured as the best instrument in the system. One row per graded change (deduped to one logical change per LA day) from V_PPC_CHANGE_LOG_APPLIED (never raw FACT_PPC_CHANGE_LOG — the applied view already drops the 40 FAILED_UPLOAD rows). GRADING WINDOW IS THE POINT: a change applied on day T is graded on [T+1,T+7] and READ NO EARLIER THAN T+14 (SB: [T+1,T+14] read at T+21); the load-bearing predicate is the freshness guard DATE_ADD(window_end, INTERVAL 7 DAY) <= CURRENT_DATE('America/Los_Angeles') — a change that is not old enough DOES NOT APPEAR AT ALL (deliberately no TOO_EARLY row). WHY: a trailing 7d window ending yesterday reads ~89.5% of final sales and the shortfall is WORST ON THE NEWEST DAY (V_ADS_SETTLE_CURVE sales pct_of_final median: age1 67.0%, age2 87.4%, age7 95.0%, age11 100%; spend closes at age2), so early grading systematically UNDER-reads your own change — you reverse winners, then reverse the reversal. Money metric = GP-ROAS on FACT_AMAZON_ADS.GROSS_PROFIT over Ads_cost (v27.62, 2026-08-13: the read-side recompute Ads_sales - COALESCE(T_PRICE_COST_TIER.tier_cost, TOTAL_COST_PER_UNIT)*Ads_units and its join were REMOVED here and in the other 7 engine views - it re-derived at read time, against a tier table that has drifted since the FACT load, a number FACT already charges at load time), identical to V_OOB_KEYWORD/V_PARK_REVERDICT so a revive bar and a scorecard verdict share one currency (V_PPC_ACTION_OUTCOMES deliberately uses the coach's listing-price margin — it grades the THRESHOLD, this grades the MONEY). Graded against the entity's OWN settled [T-28,T-1]. VERDICTS: CONFIRMED (>=1.0, hold + one more step allowed) / NEUTRAL (>= own prior but <1.0, hold no further step) / REVERSED (<1.0 AND below own prior -> restore the PRE-CHANGE value via remedy/remedy_value, NEVER lower; REVERSED lands near breakeven ~0.99, not disaster) / INSUFFICIENT (<10 settled clicks -> re-graded on [T+1,T+21] once T+28 lands, window_used='EXTENDED'). Bid changes = target grain (keyword_id, text fallback), budget changes = CAMPAIGN grain (+budget_utilization), negates = scored on the TERM DISAPPEARING not on ROAS (residual <=15% of the pre-negate daily rate, or <3 residual clicks). Contamination flagged not dropped: superseded_in_window / next_change_date. Self-validating: next14_gp_roas re-measures the settled-verdict spread from the view itself (use window_used='PRIMARY'). KNOWN BIAS documented in the SOP: the engines select on the two worst days, so grading against the entity's own prior FLATTERS every change — a matched control cohort is the honest instrument and is a separate build. Deterministic (2x byte-identical, md5 8b38cae65cc86bddc85176ed910e5206 on 411 rows @ 2026-08-12). SOP: architecture/PPC_CLOSE_THE_LOOP.md §V_CHANGE_SCORECARD."
    source_files: ["scripts/bigquery/views/V_CHANGE_SCORECARD.sql"]
    cube_schema: "cube/schema/ChangeScorecard.js"
    dependencies:
      - V_PPC_CHANGE_LOG_APPLIED
      - FACT_AMAZON_ADS
      - T_PRICE_COST_TIER
      - V_DIM_CAMPAIGN_CURRENT
      - V_CAMPAIGN_FAMILY_MAP

  - name: "V_SEASON_PEAK_GATE"
    description: "v27.50 (2026-08-12) — THE season gate, and the ONLY place its predicate is written. One row per DIM_US_HOLIDAYS occurrence active TODAY (category IN gift_season/prime_event/back_to_school/seasonal, window boost_start..COALESCE(cooldown_end, holiday_date+3)); zero rows = off peak. Extracted verbatim from V_KEYWORD_LIFT's inline v27.49 `season` CTE so the gate and the occurrence resolver cannot drift apart: V_KEYWORD_LIFT.season = COUNT(*)>0 over this view, V_PEAK_WINDOW_RULE.own = these rows ordered by precedence LIMIT 1. Predicate parity with the v27.49 expression verified over 1,827 days (2024-01-01..2028-12-31): 0 divergent days. KEEP IT TRIVIAL — no joins, aggregates or subqueries. V_KEYWORD_LIFT expands its season CTE ~30 times (low_cap, exploration allowance, probe slots, budget floor, click bars) and each reference re-plans the body; pointing those sites at the full V_PEAK_WINDOW_RULE exceeded BigQuery's planner ('Not enough resources for query planning - too many subqueries'). NOT yet a consumer but should be: V_KEYWORD_GUARD:66 and V_OOB_KEYWORD:257 still run the PRE-v27.49 predicate and read in_peak=FALSE today while the engine reads TRUE (SOP §6.3). Spec: architecture/PEAK_WINDOW_RULE.md"
    source_files: ["scripts/bigquery/views/V_SEASON_PEAK_GATE.sql"]
    dependencies:
      - DIM_US_HOLIDAYS

  - name: "V_PEAK_WINDOW_RULE"
    description: "v27.50 (Ori 2026-08-12) — ONE ROW: the engines' season gate and judged-window length resolved for today, with the evidence that justifies the window carried alongside it. Implements ORI'S RULE ('switch from 7 days to 3 in peak UNLESS last year's same peak proved 7 is better'): off peak -> 7 (unchanged, not overridable); in peak -> 3 by DEFAULT, and DE_PEAK_WINDOW_OVERRIDE.w_days only where the same occurrence type in a prior year was measured better at 7. Burden of proof is on the SLOWER window — no/thin/ambiguous/conflicting evidence = 3. Occurrence type resolved from DIM_US_HOLIDAYS over the ENGINE's in_peak categories (gift_season, prime_event, back_to_school, seasonal) and the v27.49 window end COALESCE(cooldown_end, holiday_date+3), with V_SEASON_CONTEXT's precedence (earliest boost_start owns the date -> BF/CM/Halloween absorbed into XMAS, FDAY into GRAD) and the same Nov 15 XMAS_EARLY/XMAS_PEAK split. Columns: in_peak, occurrence_type, holiday_name, occurrence_start/end, w_days, w_days_source (OFF_PEAK_DEFAULT / PEAK_DEFAULT_NO_ROW / PEAK_DEFAULT_NOT_PROVEN / PEAK_OVERRIDE_PROVEN), w_days_reason (plain language), the full evidence record, and remeasure_due. THE v27.49 SEASON GATE EXPRESSION MOVED HERE — this is now the single definition of in_peak for V_KEYWORD_LIFT (season CTE = in_peak, cap CTE = w_days; low_cap unchanged). Guarantees exactly one row (both source CTEs are aggregates without GROUP BY) because V_KEYWORD_LIFT CROSS JOINs it; w_days clamped to [1,28] so a data typo cannot set a zero-day or year-long window. NOT wired into V_OOB_BUDGET_PHASE (its own IF(in_peak,r3,r7) budget cut is deliberately untouched this pass — recommendation in the SOP), nor into V_KEYWORD_GUARD / V_OOB_KEYWORD (both still run the PRE-v27.49 gate and read in_peak=FALSE today — recommended fix, out of scope). Spec: architecture/PEAK_WINDOW_RULE.md"
    source_files: ["scripts/bigquery/views/V_PEAK_WINDOW_RULE.sql"]
    dependencies:
      - V_SEASON_PEAK_GATE
      - DE_PEAK_WINDOW_OVERRIDE

  - name: "V_PLAN_SETTLE_COMPLETION"
    description: "v27.135 (2026-08-23) — the settle-completion factor the next-week money plan divides a window day's gross profit by, one row per (channel SP|SB, age_days 0..120). Read from V_ADS_SETTLE_CURVE, forward-filled over unmeasured ages, made monotone in age by a running MAX, capped at 1.0 and floored at a declared 0.50 so no rebuilt curve can inflate a window more than twofold; 1.0 beyond the curve's last measured age. curve_available says whether the curve could answer — FALSE means the factor is 1.0 and the plan rests on the asymmetric guard alone. spend_completion is published for reading and for the acceptance only (spend is final by age 2, which is why only gross profit is corrected). Read by V_PLAN_WINDOW_JUDGMENT and, since v27.135, by tools/build_reprice_bulksheet.py --rule-b: the book used to divide by the RAW V_ADS_SETTLE_CURVE with none of this view's cap, floor, monotone smoothing or thin-curve gate, so one curve source now answers for both and they cannot correct the same keyword differently. Spec P-14a; SOP architecture/NEXT_WEEK_MONEY.md §2."
    source_files: ["scripts/bigquery/views/V_PLAN_SETTLE_COMPLETION.sql"]
    dependencies:
      - V_ADS_SETTLE_CURVE

  - name: "V_PLAN_WINDOW_JUDGMENT"
    description: "v27.138 (2026-08-24) — one row per working-family (HARVEST) keyword: the complete-days window from DE_PLAN_CONFIG for today's calendar state, fenced so no judged day is younger than age 2 (P-10 + P-14a), the keyword's record in it raw AND corrected for settle completion, the rule-B side (P-1/P-3), then the arms in the order P-5 grace THEN the P-14b guard (v27.135: with the guard first it answered for nearly every ladder winner with a quiet window (measured at the repair; the SOP publishes the query), so P-5's one-window limit could never bite, the reprice book named a different ruling on the same rows, and the published unguarded counterfactual was short by their spend, in the direction that made the guard look dearer than it is). Grace is spent until the keyword earns a GOOD window back, and grace_limit_armed declares whether the plan has a partition EARLIER THAN TODAY for the limit to read (v27.138 correction: SP_BUILD_NEXT_WEEK_PLAN ships and writes that table nightly, so the old wording 'no builder writes it yet' was live and false here and in the row's own sentence; the flag now reads FALSE only on the day the first partition is written). The guard requires SERVICE, AND IT HAS A CLOCK (v27.138): was_good reads last night's SIDE and a HELD row's side is GOOD, while `settled` reads a window that rolls forward nightly and can never settle — so the protected side was a one-way door a keyword could enter and never leave, the ladder gate the spec attributes the guard to stopped applying after night one, and P-5's one-window limit went inert in money. The hold is now anchored to the window that TRIGGERED it (hold_since / hold_settles_on, read from the plan's own history) and lifts when that window settles; promotion on fresh evidence is untouched every night, so the asymmetry is intact. Whether the delay should be an unlimited veto is Ori's ruling. WHAT IS NULL AND WHY: planned_bid and seat_cost_per_day are NULL on every GOOD-side row — P-4 forbids re-pricing the good side, and a consumer that joins planned_bid without re-deriving the side would re-price good keywords, some of them DOWN (v27.134, C14). Publishes held_despite_evidence and good_side_no_sale / held_with_no_sale (the two populations the protected side holds: losing with the evidence in hand, and money spent with no sale at all, which no correction can redeem), rank_dollars_at_stake and rank_closeness separately because P-7's product cancels the spend identically and orders the queue by corrected gross profit alone, rank_is_degenerate, bid_park with bid_park_source (SEAT_ECONOMICS / BID_FLOOR_FALLBACK / NONE) and bid_park_seat_econ, holdout_member, is_candidate, settle_arm (SETTLED / CORRECTED / PROMOTED_ON_FRESH / HELD_UNSETTLED / NOT_CORRECTABLE_NO_GP / UNCORRECTED_NO_CURVE), decided_by, and two plain sentences whose seat clause is built from the SAME expression as is_candidate, so no row is promised a seat its own column refuses it and a keyword with neither a seat nor a queue position says that in words. The correction is ONE reversible division by a published effective factor, so it can never shrink or flip a window's gross profit; a window with no gross profit cannot be corrected at all and says NOT_CORRECTABLE_NO_GP. Judges only — SP_BUILD_NEXT_WEEK_PLAN pots, seats and queues. Acceptance: scripts/bigquery/tests/V_PLAN_WINDOW_JUDGMENT_acceptance.sql, 22 checks. Spec P-1..P-14; SOP architecture/NEXT_WEEK_MONEY.md §2."
    source_files: ["scripts/bigquery/views/V_PLAN_WINDOW_JUDGMENT.sql"]
    dependencies:
      - DE_PLAN_CONFIG
      - FN_PLAN_CALENDAR_STATE
      - V_PLAN_SETTLE_COMPLETION
      - FACT_KEYWORD_STATE
      - FACT_PLAN_NEXT_WEEK
      - V_BOOK_ASSIGNMENT
      - T_OOB_SEAT_ECONOMICS
      - T_LIFT_PROBES

  - name: "V_SEASON_CONTEXT"
    description: "Context calendar of the season-context ledger (Ori doctrine 2026-08-07: a verdict belongs to (keyword x season-context occurrence), never to the keyword alone). One row per date, 2024-09-05..anchor+180d (future included — engines need today's context; anchor = LEAST(MAX(date), FN_ADS_ANCHOR_CAP())). Peak set = LIVE DIM_US_HOLIDAYS category IN (gift_season, prime_event, back_to_school), window boost_start..COALESCE(cooldown_end, holiday_date) — gift_season+prime_event over boost..cooldown is exactly the engines' in_peak rule; back_to_school is a documented extension (BTS boost Aug 1 / anchor Sep 14, NULL cooldown_end); category='seasonal' excluded like in_peak. PRECEDENCE: overlapping windows — earliest boost_start owns the date (BF+CM absorbed into XMAS; FDAY_2025 fully absorbed by GRAD_2025). XMAS SPLIT (2026-08-08): every XMAS context = TWO occurrences, XMAS_EARLY_<yr> (Oct 1..Nov 14) + XMAS_PEAK_<yr> (Nov 15..Dec 28) — the coarse single Q4 occurrence hid the ~Nov 15 flip boundary (PARK_CONTEXT calibration -$109k, October losses vetoed December funding); no combined XMAS_<yr> label exists anymore. OFF = contiguous gaps, each run its own occurrence. Keys: context_label (XMAS_EARLY_2025/XMAS_PEAK_2025/BTS_2026/OFF), occurrence_key = label_yyyymmdd(start). 2024 BACKFILL (2026-08-08): BTS/Halloween/BF/CM/XMAS 2024 rows inserted into the live DIM_US_HOLIDAYS (MIGRATE_DIM_US_HOLIDAYS_2024_BACKFILL.sql) -> BTS_2024 (truncated at 2024-09-05) + XMAS_EARLY/PEAK_2024 exist; calendar = 32 occurrences 2024-09-05..anchor+180d, no gaps/overlaps. Spec: architecture/SEASON_CONTEXT_LEDGER.md."
    source_files: ["scripts/bigquery/views/V_SEASON_CONTEXT.sql"]
    dependencies:
      - DIM_US_HOLIDAYS
      - FACT_AMAZON_ADS
      - FN_ADS_ANCHOR_CAP

  - name: "V_KEYWORD_CONTEXT_LEDGER"
    description: "Settled per-(keyword_text = LOWER(TRIM(targeting)), season-context occurrence) money ledger: clicks/spend/sales/gross_profit/net/orders over SETTLED days only (date <= anchor-7 — spend settles ~D+3 but sales accrue D+7 SP / D+14 SB; younger windows manufacture false loss verdicts). gross_profit = Ads_sales - IFNULL(TOTAL_COST_PER_UNIT,0)*Ads_units (doctrine formula, NOT tier-COGS). Rows exist only where clicks>0 OR spend>0 in the occurrence. Per keyword: first_click_date (full history); per row: mature_at_start (MATURITY GUARD: first click >= 30d before occurrence start), tested (clicks >= 15 = tested_clk bar), occurrence_closed. Read by SP_SNAPSHOT_SEASON_VERDICT. Spec: architecture/SEASON_CONTEXT_LEDGER.md."
    source_files: ["scripts/bigquery/views/V_KEYWORD_CONTEXT_LEDGER.sql"]
    dependencies:
      - V_SEASON_CONTEXT
      - FACT_AMAZON_ADS
      - FN_ADS_ANCHOR_CAP

  - name: "V_KEYWORD_CONTEXT_GATE"
    description: "Season-context contradiction gate (phase 3, v27.42, 2026-08-08) read by the OUTPUT layers of V_KEYWORD_LIFT + V_OOB_KEYWORD. One row per keyword_text, KEYWORD GRAIN ONLY (auto clauses, asin%/category%, '*' excluded — ledger pools text account-wide; engines additionally join NOT is_auto AND NOT is_pt). gate_action precedence BLOCK_CUT > ENTRY_BLOCK > PARK_CONTEXT > NONE. BLOCK_CUT (WIRED, calibration PASS +$2,080 strict / +$21,386 wide): current occurrence SETTLED clicks >= 15 AND GP-ROAS >= 1.0 -> engines veto cuts/parks/brakes to HOLD. ENTRY_BLOCK (WIRED, PASS only with re-probe: +$551 vs hard block -$6,578): most recent CLOSED same-family (label minus year; OFF excluded) MATURE verdict LOSS (v27.44: LOSS = net<=-5 AND GP-ROAS<0.95 at >=15c; NEUTRAL dead-band verdicts carry no memory) -> evidence-scaled re-probe (v27.46 TWO-TIER): probe_cap = m x GREATEST(15 x COALESCE(tcpc_pre90, band median), $5) where m keys on the DEEPEST same-family mature LOSS prior (MAX clicks across all such priors, exposed as loss_prior_max_clicks): m=0.5 when >=40c (tier DEEP, the original half) / m=1.0 when 15-39c (tier THIN, full allowance — a healthy ~6%-CVR keyword shows 0 orders in 20 clicks ~29% of the time; thin LOSS is weak evidence); loss_evidence_tier exposed; the tier flows into probe_cap/remaining_allowance so both engines picked it up with zero engine edits; entry_state PROBING (spend < cap, engines let it) / STOP (spend >= cap, GP < spend -> stop funding) / RELEASED (paid back -> NONE). PARK_CONTEXT (ADVISORY ONLY, calibration FAIL: best cell +$1,274 but -$1,420 inside XMAS_PEAK): clicks >= 15 AND net <= -$25 AND GP-ROAS < 0.6, suppressed inside XMAS_PEAK occurrences — surfaces in the engines' context_gate columns only, never moves an action/bid. All stats SETTLED (anchor-7): an occurrence's first ~7 days read zero, gates ARM as it settles. tcpc = realized settled CPC 90d pre-occurrence (>=4 clicks), NOT engine target_cpc (v27.40 unit hazard). PLAN-COST: current-occurrence stats are the ledger's slice computed DIRECTLY from FACT over [occurrence_start, LEAST(occurrence_end, anchor-7)] (doctrine GP formula verbatim, byte-identical to the ledger row by construction, parity-verified on BTS_2025) — reading the ledger VIEW dragged its full-history FACT x calendar join into both engine plans (V_OOB_KEYWORD ~25s -> ~176s). Spec: architecture/SEASON_CONTEXT_LEDGER.md §5-6."
    source_files: ["scripts/bigquery/views/V_KEYWORD_CONTEXT_GATE.sql"]
    dependencies:
      - V_SEASON_CONTEXT
      - FACT_KEYWORD_SEASON_VERDICT
      - FACT_AMAZON_ADS
      - FN_ADS_ANCHOR_CAP

  - name: "V_PARK_REVERDICT"
    description: "v27.53 (2026-08-12, was v27.52/v27.48) settled re-judgment of every parked/STOPped/recently-revived keyword — Ori's rule: no condemnation before settle, re-judgment at settle (SP sales accrue D+7, SB D+14; iteration-6: ~20% of the Aug 2-6 park wave flipped to settled GP-ROAS >= 1.0). Population = DIM_KEYWORD current ENABLED bid <= $0.26 (551 rows 2026-08-09; carries BOTH SP and SB keyword config — 26 of the 33 calibrated revives are SB) + LIVE rows carrying protection (revive-shaped raise <= 45d; MANUAL change <= 14d). reverdict: REVIVE (settled-90d >= 10 clicks at GP-ROAS >= 1.0, or >= 0.8 + season-WIN; calibrated 33 rows / $6,126 bench GP on $5,364) / CONFIRM_PARK (settled fail, gate-STOP precedence, one-revive-per-occurrence re-parks — never resurfaces) / PENDING_SETTLE (channel-aware settle_due) / INSUFFICIENT. revive_bid = clamp(min(pre-park bid, 1.1 x settled CPC), $0.31, $1.50) — NEVER the $1 probe entry. Anti-churn data: engine_immune (post-revival settle veto until 10 NEW settled clicks + 14d manual hold), manual_parked_recent, re_parked_this_occ. v27.52 FIX 2 — EVIDENCE IS KEYED ON (campaign_id, keyword_id), NOT ON TARGETING TEXT. The v27.48 join discarded keyword_id: (a) 22 of 618 population (campaign, text) pairs resolve to >1 keyword_id in FACT (44 ids — same text in two ad groups, plus retired siblings' history), so every colliding row read the whole group's SUM; campaign 341550011573799 priced a REVIVE at $0.75 from $0.24 (3.1x) on a target with ZERO clicks of its own, entirely off its $0.72 sibling's CPC; (b) CATEGORY targets were 100% invisible because DIM_KEYWORD stores the category ID (category=\"166073011\") while FACT_AMAZON_ADS stores the NAME (category=\"Kids' Scrapbooking Kits\") — a real 503-click / $370.78 / 0.868x record read as zero evidence. keyword_id is non-NULL on 100% of FACT rows in the window and is the same id space as DIM_KEYWORD, so it resolves ID <-> NAME by construction; tgt_name (max-clicks FACT-reported name per target, fully tie-broken) also feeds the season + context-gate lookups so a category target reaches its own season memory. Text fallback (fd_noid) is restricted to FACT rows with keyword_id IS NULL AND to (campaign, text) pairs resolving to exactly one target — CURRENT STOCK 0 ROWS. New columns: fact_targeting, evidence_join (KEYWORD_ID / TEXT_FALLBACK / KEYWORD_ID+TEXT_FALLBACK / NONE). Effect of FIX 2: REVIVE stayed 29 but was a different 29 (phantom out, category in); settled evidence +481 clicks / +$355.89, lifetime settled clicks -10,453. v27.53 (2026-08-12, Ori approved) FIX — DEFECT 5, THE SEASON RELAXATION IS OCCURRENCE-SCOPED AND AGE-BOUNDED. The '>= 0.8 with a season WIN' arm is the only way a keyword whose SETTLED record LOSES money can be revived, and its licence was COUNTIF(verdict='WIN') over the WHOLE verdict table matched on lowercase text — any WIN, any season, any year, mature or not: the exact defect v27.52 FIX 1 removed from V_KEYWORD_GUARD, which survived here because the two views carry their own copies of the lookup. Measured: 6 of the 29 REVIVEs were sub-1.0 rows riding it (7,415 settled clicks, $2,114.99 spend -> $1,793.83 GP, -$321.16) — one relaxed by a XMAS_PEAK_2024 WIN that ended 2024-12-28, TWENTY MONTHS before today's BTS peak; one ('girls journal kit', 1,474c at 0.835x) with 7 WINs and NONE of them BTS; one ('spa kit for girls ages 12-14') whose only BTS_2025 WIN fails the §4 maturity guard (first click 13 days before that occurrence began). The `seas` CTE now applies V_KEYWORD_CONTEXT_GATE's `prior` selection discipline verbatim (same family match against TODAY's occurrence, same closed-prior test occurrence_end < occurrence_start, same mature_at_start guard, same family != 'OFF' exclusion) PLUS this view's own age bound k.win_max_age_days = 400: the prior occurrence must have ENDED within one cycle of the current occurrence's start (BTS_2025 ended 321d before BTS_2026 started; BTS_2024 686d). FIX 1(a)'s catastrophic override needs no mirror: this bar's season floor is 0.80, already above the 0.60 catastrophic line. NEW COLUMNS: season_relax_applied (TRUE exactly when a row is REVIVE ONLY because of the relaxation — Ori's read-this-first flag), win_prior_end (dates the licence), occurrence_family, and n_win_any / win_labels_any (the OLD unscoped count, DISPLAY/AUDIT ONLY — nothing may branch on them). n_win / win_labels now carry the SCOPED memory. Impact 2026-08-12: REVIVE 29 -> 25; 4 rows to CONFIRM_PARK on 2,432 settled clicks, $1,178.49 spend -> $992.83 GP (-$185.66); 2 sub-1.0 rows KEEP their revival on a real mature BTS_2025 WIN ('gifts for tween girls' 1,017c +$62.57; 'gifts for teen girls' 51c +$3.21); 0 rows newly revived; NO revive_bid changed (the bid formula never read the season memory). The 400d bound removes 0 additional rows today (BTS_2024 ran 2024-09-05..09-14, inside the first 10 days of all ads history, so it carries ZERO mature verdicts) — installed as the structural guarantee for the next cycle, not as today's saving. Verified by keyed parity of the old and new view texts at one instant, 619 rows, 0 added / 0 dropped: exactly six columns move (n_win + win_labels 154 rows, passes_bar 6, reverdict 4, reverdict_reason 7, stop_released 2); the other 53 are byte-identical. Of the 6 passes_bar moves 2 are on LIVE rows where passes_bar is inert (reverdict IS NULL), and both stop_released moves are on rows with entry_state != 'STOP' where it is inert — so 4 verdicts moved and nothing else did. Deterministic (2x byte-identical, md5 3e20a72df412863d36d31c969a3daa81 on 619 rows @ 2026-08-12). ENGINES READ FACT_PARK_REVERDICT ONLY (planner-ceiling doctrine); the Weekly Run Revivals panel reads the VIEW live via cube/schema/ParkReverdict.js (15-min TTL). Spec: architecture/SEASON_CONTEXT_LEDGER.md §7 + §7.12 + §7.15."
    source_files: ["scripts/bigquery/views/V_PARK_REVERDICT.sql"]
    cube_schema: "cube/schema/ParkReverdict.js"
    dependencies:
      - DIM_KEYWORD
      - V_PPC_CHANGE_LOG_APPLIED
      - FACT_AMAZON_ADS
      - T_PRICE_COST_TIER
      - FACT_KEYWORD_SEASON_VERDICT
      - V_KEYWORD_CONTEXT_GATE
      - V_SEASON_CONTEXT
      - V_DIM_CAMPAIGN_CURRENT

  - name: "V_COACH_CAMPAIGN_BUDGET"
    description: "Campaign-grain budget recommendations per family (Coacher F, budget apply set) — V_ADS_COACH deduped to ONE row per campaign so the Weekly Run inline Budget phase and the bulksheet budget rows read a single decision. is_change flags an actual move. v27.56: passes through the launch-exemption columns launch_exempt / launch_exempt_until / budget_action_suppressed / budget_suppressed_to for DISPLAY. A launch-exempt hold arrives with budget_action = 'LAUNCH_EXEMPT_HOLD' and recommended_budget = NULL (nulled in V_ADS_COACH), so is_change is FALSE by construction and a suppressed cut can never enter the apply set. Registered 2026-08-13 (was previously unregistered)."
    source_files: ["scripts/bigquery/views/V_COACH_CAMPAIGN_BUDGET.sql"]
    dependencies:
      - V_ADS_COACH

  - name: "V_LAUNCH_EXEMPTION"
    description: "v27.56 (Ori 2026-08-13: 'the launch exemption — but make it as a new criteria in the weekly run page') — the launch families' licence to lose money, written down as data. One row per ENABLED campaign whose FAMILY is in launch phase. THE ROW COUNT AND ITS SPLIT BY FAMILY ARE NOT WRITTEN HERE (Standing Rule 0, applied 2026-08-21): campaigns are enabled and paused daily so the count moves on its own, and the figure that used to sit here no longer matched the live view. Count it: SELECT family, COUNT(*) AS campaigns, COUNTIF(exempt_active) AS exempt_active FROM `onyga-482313.OI.V_LAUNCH_EXEMPTION` GROUP BY 1 ORDER BY 1. WHY: standing doctrine is 'launch = FIND THE RIGHT BID, never loss-cut; bleed via search-term negate', and the coach's launch track implements that at TARGET grain ONLY — its BUDGET rows carry launch_phase = NULL, so nothing stopped the campaign-budget engine from loss-cutting a launch family. The hole was live and expensive: on the day this was built, most of the coach budget decisions standing on the two launch families were CUTS, split between CAMPAIGN_STOP and GUARDIAN_BUDGET_DECREASE. The tally and the two ages are measurements from 2026-08-13 and are deliberately not written here (Standing Rule 0) - the MECHANISM is that budget rows carry launch_phase = NULL, and that is what makes the hole reachable at all. MEMBERSHIP IS DATA, NOT A LIST: family_first_sale = MIN(date) over T_UNIFIED_DAILY where units > 0 (the same first-sale definition V_PRODUCT_LAUNCH_MODEL / V_LAUNCH_RAMP use), so families enter and leave launch phase on their own record with no code change. BOUNDARY = 183 DAYS (6 months) and it is a DOCTRINE choice, not a fit: the family age distribution has a wide gap between the launches and everything else, so any boundary drawn inside that gap selects the same set - which is why the boundary is a doctrine choice and not a fit to the data, and why no age reading is written here (Standing Rule 0; read them with SELECT family, launch_age_months FROM `onyga-482313.OI.V_BOOK_ASSIGNMENT` ORDER BY 2); 183d is the tightest boundary the warehouse already agrees with (V_PRODUCT_LAUNCH_MODEL requires >= 180d before a product's own history counts as a pattern); 12 months (the forecast first-year guard) was rejected as too generous. It is a BACKSTOP — where a sanction is on record its dated stop gate binds first, because exempt_until is the LEAST of the two. The sanctioned stop dates are DECLARED CONSTANTS on DE_LAUNCH_INVESTMENT (Bunny 2026-10-31, LolliBall 2026-11-30); the age boundary each is compared against is DERIVED from first sale + 183d and is therefore a measurement, so it is not written here - read both at once: SELECT family, exempt_until FROM `onyga-482313.OI.V_LAUNCH_EXEMPTION` against DE_LAUNCH_INVESTMENT.stop_date. THREE BOUNDS, all published as data: (1) exempt_until = LEAST(first sale + 183d, DE_LAUNCH_INVESTMENT.stop_date) — past it the row disappears and normal coaching resumes; (2) envelope_state — family trailing-7d daily spend vs the sanctioned $/day. The sanctioned rates are DECLARED CONSTANTS on DE_LAUNCH_INVESTMENT (Bunny $30/day, LolliBall $55/day); THE MEASURED RATES ARE NOT WRITTEN HERE and the pair that used to be had gone stale against the live view (Standing Rule 0, applied 2026-08-21) - read them with SELECT family, daily_investment, spend_per_day, spend_rate_ratio, rate_window_basis FROM `onyga-482313.OI.V_INVEST_STATUS`. With escalate_to_ori, protected_winner and envelope_trim_rank (worst settled GP-ROAS first, winners last) so taking money out is a deliberate BUDGET decision, never a coach ROAS cut; (3) the exemption blocks ONE class of decision — campaign-level ROAS-driven money cuts. blocks_enforced (wired in V_ADS_COACH.scored_exempt): CAMPAIGN_STOP, GUARDIAN_BUDGET_DECREASE, BLITZ_BUDGET_DECREASE, COOLDOWN_BUDGET_REDUCE, RESTORE_BUDGET_PRE_PEAK, and GUARDIAN_BUDGET_CONTAIN POST-GRACE ONLY (inside the 14-day grace window CONTAIN is the BROKEN-LAUNCH guard — >$25 spent, ZERO orders → $10/day — a zero-order waste trim, not a profit verdict, and both arms emit the same string, which is why the distinction is made here on campaign age). blocks_pending (named in the doctrine, NOT wired): the coach's target-grain STOP_TARGET (count it on the day you need it; the row count and its spend move with the coach and are not written here) and the engine parks in V_OOB_KEYWORD / V_KEYWORD_LIFT — left alone deliberately because the OOB seat model's PARK_WAIT is CAPACITY-driven and is the sanctioned launch mechanism. STOP_SEASONAL is never blocked (calendar, not profit). EVIDENCE IS SETTLED: every GP-ROAS is a 28-day window ending settle_days before today (7 SP / 14 SB), GP = FACT_AMAZON_ADS.GROSS_PROFIT (tier COGS charged) over Ads_cost — the SAME currency the budget engine's own cw.* windows use. Deterministic: two consecutive pulls are byte-identical. THE HASH AND THE ROW COUNT ARE NOT WRITTEN HERE (Standing Rule 0) - a hash pinned in prose goes stale on the next campaign that is enabled or paused, and a reader comparing against it would read ordinary population drift as non-determinism. Re-take it: SELECT TO_HEX(MD5(STRING_AGG(TO_JSON_STRING(t),'' ORDER BY TO_JSON_STRING(t)))) h, COUNT(*) n FROM `onyga-482313.OI.V_LAUNCH_EXEMPTION` t, run twice in the same session; the two hashes must match each other, never a hash written down. Advisory: the only thing it CHANGES is that a suppressed cut never reaches the bulksheet (V_ADS_COACH nulls recommended_budget on held rows, so V_COACH_CAMPAIGN_BUDGET.is_change is FALSE by construction). Weekly Run 'Launch exemption' panel reads the VIEW live via cube/schema/LaunchExemption.js (15-min TTL). Spec: architecture/LAUNCH_EXEMPTION.md"
    source_files: ["scripts/bigquery/views/V_LAUNCH_EXEMPTION.sql"]
    cube_schema: "cube/schema/LaunchExemption.js"
    dependencies:
      - T_UNIFIED_DAILY
      - DE_LAUNCH_INVESTMENT
      - V_CAMPAIGN_FAMILY_MAP
      - V_DIM_CAMPAIGN_CURRENT
      - FACT_AMAZON_ADS

  - name: "V_LAUNCH_BID_LADDER"
    description: "v27.59 (Ori 2026-08-13, verbatim: \"launch_bid ok between 0.5 and 0.7 trim keyword bid 5% and use launch_bid / improving between 0.7 and 0.9 do not do / profitable launch_bid ok <0.5 trim keyword bid 10%\", plus his correction that the ladder judges on the SHORT window) - the launch exemption's ONE downward lever, at TARGET grain. 73 rows / 73 distinct (campaign_id, keyword_id) over 12 campaigns and 2 families @ 2026-08-13. THE LADDER, on GP-ROAS (gross profit / ad spend, tier COGS charged, so 1.00 = breakeven AFTER product cost) over the SHORT window: < 0.50 -> LAUNCH_BID_TRIM_10 (-10%); 0.50-0.70 -> LAUNCH_BID_TRIM_5 (-5%); 0.70-0.90 -> LAUNCH_BID_HOLD_IMPROVING (no action, 'improving'); >= 0.90 -> LAUNCH_BID_HOLD_PROFITABLE (no action, 'launch_bid ok'); no window spend -> LAUNCH_BID_HOLD_NO_EVIDENCE; trim band with no room under the floor -> LAUNCH_BID_HOLD_AT_FLOOR. Bands are half-open [lo, hi). THE STEEPEST THING THIS VIEW CAN SAY IS -10%: it emits NO budget column and NO stop/park verb, so every block V_LAUNCH_EXEMPTION enforces stands untouched (verified on the 6,446 exempt coach rows: 0 CAMPAIGN_STOP, 0 budget decreases of any kind, 0 downward budget numbers, 9 LAUNCH_EXEMPT_HOLD). WINDOW: w_days from V_PEAK_WINDOW_RULE (7 off peak, 3 in peak unless 7 is PROVEN) ending at the ADS WATERMARK (MAX(date) in FACT_AMAZON_ADS), not today-1, so a late load slides the ladder rather than judging a half-loaded day. Today: in_peak BTS, w_days 3, 2026-08-10..2026-08-12. DELIBERATELY UNSETTLED - SP accrues to D+7, SB to D+14, so the band is biased TOWARD trimming; accepted because the cost of being wrong is 5-10% of one bid for one day, re-judged tomorrow (contrast V_LAUNCH_EXEMPTION, whose SETTLED 28d evidence gates a campaign STOP). campaign_settled_gp_roas rides on every row so the two windows can be compared, not argued about. Last day (d1_*) is PUBLISHED, not judged - the 'must fail BOTH windows' conjunction belongs to the low-stock -50% rule (V_LOW_STOCK_ADS), not here. Evidence gate is w_spend > 0 and nothing more; no click threshold was invented, instead evidence_grade = THIN under 3 window clicks makes a one-click verdict legible and changes no action. launch_bid IS READ, NEVER RECOMPUTED (FACT_ADS_COACH_ACTIONS.launch_bid / launch_bid_source, computed in V_ADS_COACH from LAUNCH_BID_MULT + LAUNCH_BID_CEILING). It is the DESTINATION, not a one-step ceiling: proposed_bid = GREATEST(CEIL(anchor x factor x 100)/100, bid_floor) capped at the anchor, and a bid ABOVE launch_bid is walked down at the band's step per run (above_launch_bid / runs_to_launch_bid / ceiling_step_bid publish the alternative). WHY: reading launch_bid as the TARGET would RAISE the bid on 92 of 105 exempt target rows (bids $0.24-$0.25 vs launch_bids to $1.40); as a FLOOR it would block the trim on those same rows AND on both rows in the 0.5-0.7 band; as a ONE-STEP CEILING it cuts 'best friends personalized gifts girls' from $1.36 to $0.59 (-56.6%) on ONE click of unsettled evidence, which is a loss-cut wearing a trim's name. The walking form honours both of Ori's constraints - the band sets how far, launch_bid sets where to - and reaches $0.65 in 8 runs instead of 1. COALESCE(current_bid, launch_bid) is the base where no bid exists (V_ADS_COACH's own idiom in launch_recommended_bid); dormant today. CEIL to the cent, never ROUND: rounding $0.36 down to $0.32 is an 11.1% cut on a 10% band. Measured: TRIM_10 realised -10.0%..-6.9%, TRIM_5 -4.8%..-4.7%, no trim deeper than its band. FLOORS (the same ones V_OOB_KEYWORD / V_KEYWORD_LIFT use): SP $0.20 house floor, SB video $0.25 (Amazon minBid), SB PRODUCT_COLLECTION/STORE_SPOTLIGHT $0.10, from DIM_AD_GROUP.creative_type. 0 proposals below their floor; smallest proposed bid $0.22. 0 raises (proposed_bid is capped at the anchor). POPULATION: action_type='TARGET' rows whose campaign is in V_LAUNCH_EXEMPTION, campaign_state='ENABLED', keyword_id + current_bid NOT NULL; brand DEFENSE campaigns excluded by rule (V_CAMPAIGN_ROLE LIKE '%DEFENSE%' - none today, so it excludes nothing, but the rule is right the day a launch family gets one); TARGET_PAUSED excluded. GRAIN: V_ADS_COACH is search-term/ASIN grain, so one keyword arrives as several TARGET rows with DIFFERENT launch_bid (105 rows over 74 keywords; 'gift for girls' carries 1.40/1.38/1.00). Deduped to (campaign_id, keyword_id) with ONE ARRAY_AGG(STRUCT(...) ORDER BY priority_score DESC, launch_bid DESC, asin, action_id LIMIT 1) so the bid fields cannot be cross-paired - never two ANY_VALUE()s from one GROUP BY. The coach's own REDUCE_BID/INCREASE_BID is NOT overridden: coach_target_action / coach_recommended_bid / conflicts_with_coach are published beside the ladder's proposal so Ori reconciles them. V_LAUNCH_EXEMPTION was NOT changed in grain or dependencies (only its header and its published `allows` string name the ladder): it is read BY V_ADS_COACH while the ladder reads FACT_ADS_COACH_ACTIONS which V_ADS_COACH materialises, so pulling ladder columns into it would close a stale-data loop around an engine already near BigQuery's planner limit. The ladder reads the exemption, never the reverse. Today: 33 TRIM_10, 2 TRIM_5, 0 HOLD_IMPROVING, 6 HOLD_PROFITABLE, 32 HOLD_NO_EVIDENCE, 0 HOLD_AT_FLOOR = 35 proposals, $1.83 of bid removed; 41 of 73 rows are THIN (the honest cost of a 3-day window at keyword grain). FLOAT BUG FOUND AND FIXED IN VERIFICATION: CEIL(0.40 x 0.90 x 100)/100 in FLOAT64 is 0.37, not 0.36 (the product evaluates to 36.000000000000007), so a '-10%' trim silently became -7.5%; verified live FLOAT64 0.37/0.73 vs NUMERIC 0.36/0.72 on $0.40/$0.80 bids. The rounding step now runs in NUMERIC and is cast back to FLOAT64 (schema unchanged) - the same lesson V_KEYWORD_GUARD recorded. It moved 5 of the 35 live proposals onto their exact band; 0 proposals now cut deeper than their band. Deterministic (2x byte-identical, md5 b7fc40b5cfbfed1e2351d5bd8de472e8 on 73 rows @ 2026-08-13). v27.104 (2026-08-22): the three floor constants are no longer declared here — bid_floor / bid_floor_source come from FN_BID_FLOOR(campaign_type, creative_type), the ONE shared definition the keyword state ladder also reads (via V_BID_FLOOR); output byte-identical before/after (keyed diff 72 rows, 0 differing, md5 593f6bab8f3f50467d98fb23fa144c95 @ 2026-08-22). ADVISORY - nothing is queued, nothing reaches a bulksheet. Weekly Run 'Launch exemption' panel reads it live via cube/schema/LaunchBidLadder.js (15-min TTL). Spec: architecture/LAUNCH_EXEMPTION.md §8"
    source_files: ["scripts/bigquery/views/V_LAUNCH_BID_LADDER.sql"]
    cube_schema: "cube/schema/LaunchBidLadder.js"
    dependencies:
      - V_LAUNCH_EXEMPTION
      - V_PEAK_WINDOW_RULE
      - V_CAMPAIGN_ROLE
      - FACT_ADS_COACH_ACTIONS
      - FACT_AMAZON_ADS
      - DIM_AD_GROUP
      - FN_BID_FLOOR

  - name: "V_BID_FLOOR"
    description: "v27.104 (2026-08-22): every current ad group's platform/house BID FLOOR, resolved once. The three constants and the rule live in FN_BID_FLOOR (the ONE definition: SP $0.20 house; SB PRODUCT_COLLECTION/STORE_SPOTLIGHT $0.10 Amazon minBid; SB video or NULL creative_type $0.25 Amazon minBid — 192 of 273 current SB ad groups carry a NULL creative_type and resolve conservatively to $0.25). This view does the creative-type resolution (DIM_AD_GROUP.creative_type on the is_current row, ANY_VALUE over duplicate current rows exactly as V_LAUNCH_BID_LADDER's ag CTE always did) so a caller that knows only (campaign_id, keyword_id) joins DIM_KEYWORD -> ad_group_id -> here and never carries a private floor. WHY: the keyword state ladder (v27.103) judged kills against a flat $0.25 'platform_floor' borrowed from V_OOB_KEYWORD's bid_park — a PARKING price, not a floor — and manufactured three phantom kills (two above-bar SP auto clauses at $0.21/$0.24; 'tween girl gifts', an SB collection keyword with a $0.10 floor and an executable $0.49 price). Grain: one row per current ad_group_id (1,263 @ 2026-08-22). Readers: SP_SNAPSHOT_KEYWORD_STATE (v27.104 Step 2), tools/build_reprice_bulksheet.py. Spec: architecture/KEYWORD_STATE.md 'The floors'."
    source_files: ["scripts/bigquery/views/V_BID_FLOOR.sql"]
    dependencies:
      - DIM_AD_GROUP
      - FN_BID_FLOOR

  - name: "V_KEYWORD_GUARD"
    description: "v27.48 part 2 (2026-08-09) per-instance guard signals for BOTH engines — one row per (campaign_id, keyword_id), every current ENABLED target incl. autos/PTs, SP+SB (~625 rows). Cause 1: settle_ok/settle_due (no clicks in last D+7 SP / D+14 SB => condemning clicks settled) + channel-aware settled-90d record (settled_winner / corroborated_loser >= 10c < 1.0x / catastrophic < 0.6x) + season_win_prior. Cause 2: SCOPE-grain lifetime record (keyword text account-wide; auto clause pooled per dominant family — keyword_ids do not survive campaign recreations): life_clk / life_roas / life_conv_cpc (order-day CPC) + record_loser (>= 30c < 0.6x), and LY same-28d conv CPC for the ENTRY_BLOCK x0.8 cap. Cause 3: last bid change source (COACH/REUPLOAD = engine, MANUAL = Ori) -> manual_recent7 / manual_hold (7d, catastrophic escape); unlogged Amazon-console writes are a documented coverage hole. Cause 4: LY-pacing raise per the approved 2026-08-09 calibration — pace_flag (settled 90d >= 1.2x on >= 10c [calibration frame wm-96..wm-7], life >= 100c, LY window >= 20c, pace < 0.25, bid < LY conv CPC, bid stable >= 7d, not OOB-owned/capped), pace_watch (0.25-0.40, display only), pace_target_bid = min(band ALL/ALL cpc_max season cell, settled GP-per-click / 1.2, 1.5 x LY conv CPC) floored at bid, $2 cap. v27.52 FIX 1 (Ori approved 2026-08-12) — THE SEASON AMNESTY IS BOUNDED. season_win_prior was COUNTIF(verdict='WIN') over the WHOLE verdict table: any WIN ever recorded for the lowercase keyword TEXT, any season, any year, back to 2024-09 (452 WIN texts; 332 of 606 enabled targets carried one). Because it is the settle veto's escape hatch, it made a keyword permanently un-condemnable on unsettled clicks no matter how much settled money it was losing (measured: 123 structurally un-condemnable settled losers, 68 of them catastrophic — $5,178.60 settled spend -> $1,852.69 GP = 0.358x). Two bounds: (a) NEW COLUMN settle_amnesty = season_win_prior AND NOT catastrophic — a < 0.6x record on >= 10 SETTLED clicks overrides the amnesty entirely (the same escape manual_hold already carries); BOTH ENGINES NOW READ settle_amnesty, never season_win_prior, in the settle veto. (b) season_win_prior itself is OCCURRENCE-SCOPED — the WIN must come from a CLOSED PRIOR occurrence of the SAME context family as today's occurrence and must be mature_at_start, mirroring V_KEYWORD_CONTEXT_GATE's `prior` CTE verbatim (same family match, same closed-prior test, same §4 maturity guard, same OFF exclusion) so the WIN amnesty and the LOSS entry block finally read the SAME memory. §7.6 always specified 'any MATURE-FRAME WIN verdict'; the code never enforced it. Impact 2026-08-12: WIN priors 332 -> 126, un-condemnable 123 -> 22, 101 rows released (68 by the catastrophic override, 33 by occurrence-scoping); 0 rows newly protected. Verified by keyed parity of the old and new view texts at one instant: excluding season_win_prior, 0 rows differ in either direction — no other guard signal moved. NEW DEPENDENCY V_SEASON_CONTEXT. ENGINES READ FACT_KEYWORD_GUARD ONLY (planner-ceiling doctrine). Spec: architecture/SEASON_CONTEXT_LEDGER.md §7.6-7.9. v27.53 (2026-08-12, Ori approved \"do all engine work\") — ITEM 2 CHANNEL-SPLIT SETTLE + DEFERRAL BOUND, ITEM 7 WAKE STEP-DOWN, ITEM 8a/8b/8d. (2) settle_days SP 7 -> 3 (measured fresh-data understatement on the judged window: SP -3% to -6%, SB -17.5%; SB keeps 14) AND the SP veto frame moved from [wm-96, wm-7] to [wm-92, wm-3] so a loss that STARTS inside the last week can corroborate at all (hole 2b: recent-onset losers had settled_clk90 = 0 and were vetoed indefinitely). NEW settle_deferral_expired (hole 2a): settle_ok = \"no clicks in the last settle_days\" can NEVER be satisfied by a keyword that clicks daily (193 of 344 unsettled rows clicked on the anchor date itself), so the veto was permanent, not a deferral; it now expires once the keyword has been clicking for 2 x settle_days (hard bound 6d SP / 28d SB) and the reason string publishes that real date. Effect on the 606-row standing population: unsettled SP 191 -> 146; structurally un-judgeable rows (unsettled, uncorroborated, un-expired) 195 -> 28. (7) wake_open / wake_due / wake_step_bid + wake_date/clk/sp/ord/gp: the $1.00 ACTIVATE on-ramp is deliberate (\"wake it, then price it\") but only the wake half was built — 24 keywords woken since 2026-06-01, 11 repriced (avg 2.7d), 13 never. wake_due fires at 10 clicks since the wake or 7 days, whichever first; wake_step_bid = own GP/click if it earned, else lifetime conv CPC capped $0.60, else $0.25 if the wake bought no clicks; never a raise, floor $0.20. (8a) pace_kw numerator was the INSTANCE clk28_kw over the SCOPE ly_clk28 — keyword_ids do not survive campaign recreations, so pace was understated and all 3 live PACE_RAISE rows were already at 66-226% of LY pace; both sides now scope grain (pace_kw_instance keeps the old form for audit only). PACE_RAISE 3 -> 0. (8b) band-ceiling join spoke the wrong vocabulary (DIM_KEYWORD AUTOMATIC/ASIN/ASIN EXPANDED vs profile AUTO/PRODUCT), so 234 of 606 rows (38.6%) carried no ceiling; translated via kws.band_match with the profile OTHER cell as fallback — no ceiling 234 -> 30. (8d) NEW manual_budget_hold (campaign grain, from BUDGET_CHANGE / GUARDIAN_* / DEFENSE_BUDGET_FLOOR rows, source MANUAL, 7d): the hold only ever read INCREASE_BID/REDUCE_BID, so Ori's manual budget changes got no hold at all (9 MANUAL BUDGET_CHANGE rows, most recent 2026-08-11). Deterministic (4x byte-identical, md5 f3989b44d03500373c4eab8de9b6fab3, 606 rows @ 2026-08-12) — AFTER a v27.53 determinism fix the check itself caught: the LIFETIME and LY conv-CPC / ROAS ratios are now summed in NUMERIC and cast back to FLOAT64 (schema unchanged). FLOAT64 addition is not associative and BigQuery reshuffles between runs, so a SUM over the FULL FACT history moved in its last bits: 'gift for tween girls 11-14' returned life_conv_cpc 0.383 on one pull and 0.382 on the next (one row, one column, a rounding boundary). Pre-existing, not introduced by v27.53, but this column prices bids (the OOB record-priced entry cap and the item-7 wake step-down both read it). Short instance windows stay FLOAT64 — at most 104 days per keyword, never observed to flip."
    source_files: ["scripts/bigquery/views/V_KEYWORD_GUARD.sql"]
    dependencies:
