# ═════════════════════════════════════════════════════════════
# STANDING RULE 0 — DESCRIBE THE MECHANISM. PUBLISH THE QUERY. NEVER PIN A MEASUREMENT.
# Ori's ruling, 2026-08-20, fourth repair round. It REPLACES the round-3 rule that said a measured
# number could stay if it was stamped with an as-of date. Stamping was tried for a whole round and
# it failed in this very file: the V_BOOK_ASSIGNMENT entry shipped two over-rate RATIO FIGURES under
# an "As of" date while the live view that same day read otherwise. A WRONG NUMBER UNDER TODAY'S DATE
# IS WORSE THAN AN UNDATED ONE, BECAUSE IT LOOKS VERIFIED.
# (The two figures used to be quoted here verbatim as the illustration. Quoting a stale measurement
# back as the example of the defect still leaves a stale measurement on the page, and a later reader
# has no way to tell the exhibit from the claim — so the SHAPE of the defect is described and the
# figures are deleted, which is what this rule tells everyone else to do. Fifth round, 2026-08-20.)
#
# TWO KINDS OF NUMBER. ONLY ONE OF THEM IS BANNED.
#
#   A DECLARED CONSTANT is true because a person decided it. A sanctioned $30/day, a $913 monthly
#   backstop, a stop date of 2026-10-31, a 0.5 halo credit, a 0.60 bar floor, a 1.0 bar ceiling, a
#   28-day rate window, a 183-day age boundary, a 3-day staleness threshold, a 5e-5 tolerance, a
#   5% breakeven band. It does not go stale when data moves; it changes only when someone changes
#   it. Declared constants MAY be written down, and they MAY gate an assertion — an assertion that a
#   sanctioned rate still reads $30.00/day after a test overwrote it is exactly what one is for.
#   Say WHERE it is declared (DE_LAUNCH_INVESTMENT, the k CTE) so a reader checks the source rather
#   than the sentence, and never RESTORE a sanctioned value from a number typed in a document.
#
#   A MEASUREMENT is true only because something was computed from data on some day. A spend rate,
#   a ratio, a ROAS, a halo, a net profit, a row count, a column count, a percentage of a ceiling, a
#   dry-run byte count, an assertion result, and every "today there are N of these" clause. A
#   MEASUREMENT DOES NOT GO IN PROSE. A description here, a view header, a plan step and a spec
#   paragraph state WHAT IS COMPUTED, FROM WHAT, AND WHY — the mechanism. If a number is needed,
#   PUBLISH THE QUERY that produces it and let the reader run it.
#
# RUN THE QUERY BEFORE YOU PUBLISH IT, and read its output against the sentence beside it. A
# published query whose result contradicts its own sentence is worse than no query at all. Check the
# COLUMN NAMES too: this file has published queries against columns that had been renamed away, and
# they did not fail quietly — they failed to compile.
#
# A MEASUREMENT MAY NEVER GATE ANYTHING — not an acceptance item, not a monitor, not a step's pass
# condition. Gate the PROPERTY, not the population. (A DECLARED CONSTANT may.)
#
# ONE MORE CASE, NAMED SO IT IS NOT ARGUED AGAIN: a GOLDEN EXPECTATION inside a regression
# test (a frozen expected result compared under stated tolerances) is legitimate, because
# inside a test the number IS the subject and its purpose is to detect drift. Label it as
# frozen, with its date and tolerances, and NEVER "refresh" it when it moves — drift past
# tolerance is the test working.
#
# WHEN YOU FIND A PINNED MEASUREMENT, DELETE IT. Do not update it and do not stamp it.
#
# ─────────────────────────────────────────────────────────────
# STANDING RULE 1 — A FINDING ON THE SHORT WINDOW, A COMPARISON ON THE LONG. PER WINDOW, NOT PER
# FAMILY. Ori's ruling, 2026-08-20. A window may carry a FINDING — a verdict that the agreed rate was
# BROKEN, which forfeits launch protection — only when ZERO of its days precede sanctioned_on.
# Otherwise its excess is stated in full as a COMPARISON and convicts nobody. Full text: the plan,
# docs/superpowers/plans/2026-08-19-two-book-pnl.md.
#
# STANDING RULE 2 — QUALIFICATION AND FINDING ARE DIFFERENT QUESTIONS, AND BOTH ANSWERS STAND
# TOGETHER. Ori's ruling, 2026-08-21, seventh repair round.
#   protection_qualified   is FORWARD-looking: is this launch inside the terms that grant protection
#                          RIGHT NOW (declared window, and spending at or under the sanctioned rate).
#   sanction_breach_finding is BACKWARD-looking: can we SAY it broke the agreement — which Standing
#                          Rule 1 confines to days the agreement actually covered.
# A ROW MAY ANSWER THE TWO DIFFERENTLY AND THAT IS NOT A CONTRADICTION. It is the ordinary case while
# a sanction is young: a family can be over its approved rate today (so it does not qualify) on a
# window that mostly predates the agreement (so there is no finding). WHICH WAY EITHER READS TODAY IS
# A MEASUREMENT AND IS NOT WRITTEN IN THIS FILE — SELECT family, protection_qualified,
# sanction_breach_finding, sanction_breach_finding_arm, spend_breached, sanction_verdict FROM
# `onyga-482313.OI.V_INVEST_STATUS` ORDER BY family.
# NEVER DERIVE ONE FROM THE OTHER. Derive the finding from qualification and you convict a family
# over days on which no rate had been agreed; derive qualification from the finding and you hand
# launch protection to a family demonstrably over its rate, purely because the accusation is not yet
# available. Nobody earns protection because the accusation is unavailable.
# THE DEFECT THIS RULE NAMES IS PROSE, NOT ARITHMETIC: the columns were already right and the
# sentences read as one question. Every priced INVEST verdict must speak BOTH — a forward clause and
# a backward clause, neither taking the other back. Silence on the forward question reads as an
# acquittal, and "no finding" gets taken for "still protected". V_TWO_BOOK_BRIEF builds the forward
# clause once and publishes it as verdict_qualification_sentence so prose and column cannot drift,
# and splits its grid the same way (protection_qualified + families_qualified_for_protection against
# sanction_breach_finding + families_with_a_sanction_finding).
# ─────────────────────────────────────────────────────────────
# ═════════════════════════════════════════════════════════════

