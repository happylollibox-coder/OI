    description: "One row per enabled campaign for the Weekly Run per-family Step-2 Budget table: the waterfall's per-campaign allocation (new_budget = V_CAMPAIGN_BUDGET_BASE.base_daily, dual-pool) + last-7-full-days perf (net ROAS, net profit, spend, CPC), tiered NEW/WINNING/MARGIN/LOSING, is_defense flag so the PPC toggle filters offense/defense. tier=NEW wins over the ROAS tiers for campaigns inside their launch-ramp grace (launch_ramp_days=20) — they have no verdict yet, and their new_budget comes from V_CAMPAIGN_LAUNCH_RAMP, not the waterfall (ramp_day/ramp_days carry 'day N of 20'). strategy_role carries the Coverage role for the step-1 strategy split. Cube: CampaignBudgetStep1."
