    description: "The hand-vs-model ledger (Task 3.1, 2026-08-16). Every source='MANUAL' change classified against FACT_ENGINE_PROPOSALS for its applied day (AGREED ±5% / OVERRODE / ENGINE_SILENT / LEVER_NOT_SNAPSHOTTED; era PRE_SNAPSHOT before 2026-08-15 → UNKNOWN) and graded by V_CHANGE_SCORECARD at the honest lag: MANUAL_BETTER (hand beat the model — a rule should change) / ENGINE_BETTER / TIE / PENDING, with the doctrine question authored per row. Closing rule: every MANUAL_BETTER ends as a threshold change or a documented disagreement (V_ENGINE_HEALTH counts the open ones). Task 1.8 (remove MANUAL_HOLD) unblocks after this runs ≥2 weeks. First census: 89 manual changes, 24 graded (5C/2N/9R/8I). Spec: architecture/MANUAL_DIVERGENCE.md."
